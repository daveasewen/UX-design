<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Tag — GOV.UK reference (second-system run)</title>
<style>
  [data-theme="light"]{
    --tag-text: #0F385C;
    --tag-bg: #D2E2F1;
    --tag-green-text: #083D29;
    --tag-green-bg: #CFE4DC;
    --page: #FFFFFF;
    --body-text: #0B0C0C;
  }
  body{font-family:arial,sans-serif;background:var(--page);color:var(--body-text);margin:2rem}
  ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;margin:0}
  li{display:flex;align-items:baseline;gap:16px}
  .gv-tag{
    display:inline-block;font-size:16px;line-height:1;font-weight:400;
    padding:5px 8px 4px;border-radius:0;
    color:var(--tag-text);background:var(--tag-bg);
    text-decoration:none;overflow-wrap:break-word;max-width:160px;
  }
  .gv-tag--green{color:var(--tag-green-text);background:var(--tag-green-bg)}
</style>
</head>
<body>
  <ul>
    <li><span>Register a trailer</span> <strong class="gv-tag">In progress</strong></li>
    <li><span>Personal details</span> <strong class="gv-tag gv-tag--green">Completed</strong></li>
  </ul>

<script type="application/json" id="token-manifest">
{
  "component": "Tag",
  "vars": {
    "--tag-text": "tag/blue/text",
    "--tag-bg": "tag/blue/background",
    "--tag-green-text": "tag/green/text",
    "--tag-green-bg": "tag/green/background",
    "--page": "background/default",
    "--body-text": "text/default"
  },
  "contrastPairs": [
    { "fg": "tag/blue/text", "bg": "tag/blue/background", "context": "text" },
    { "fg": "tag/green/text", "bg": "tag/green/background", "context": "text" },
    { "fg": "text/default", "bg": "background/default", "context": "text" }
  ],
  "requiredAria": []
}
</script>
</body>
</html>
