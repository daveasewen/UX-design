<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Details — GOV.UK reference (second-system run)</title>
<style>
  [data-theme="light"]{
    --summary: #1A65A6;
    --summary-hover: #0F385C;
    --text: #0B0C0C;
    --rule: #CECECE;
    --page: #FFFFFF;
    --focus-bg: #FFDD00;
    --focus-text: #0B0C0C;
  }
  body{font-family:arial,sans-serif;background:var(--page);color:var(--text);margin:2rem;max-width:560px}
  .gv-details summary{
    color:var(--summary);font-size:19px;cursor:pointer;
    text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;
    width:fit-content;
  }
  .gv-details summary:hover{color:var(--summary-hover);text-decoration-thickness:3px}
  .gv-details summary:focus-visible{
    background:var(--focus-bg);color:var(--focus-text);
    outline:3px solid var(--focus-bg);text-decoration:none;
    box-shadow:0 4px 0 var(--focus-text);
  }
  .gv-details__text{
    margin-top:15px;
    padding:15px 20px;
    /* DECORATIVE rule — 1.57:1 on white, intentionally not a gated pair (1.4.11
       exemption): disclosure state is carried by the native marker + open attr. */
    border-left:10px solid var(--rule);
    font-size:19px;line-height:1.32;
  }
</style>
</head>
<body>
  <details class="gv-details">
    <summary>Help with nationality</summary>
    <div class="gv-details__text">
      We need to know your nationality so we can work out which elections you're entitled to vote in. If you cannot provide your nationality, you'll have to send copies of identity documents through the post.
    </div>
  </details>

<script type="application/json" id="token-manifest">
{
  "component": "Details",
  "vars": {
    "--summary": "link/default",
    "--summary-hover": "link/hover",
    "--text": "text/default",
    "--rule": "border/default",
    "--page": "background/default",
    "--focus-bg": "focus/background",
    "--focus-text": "focus/text"
  },
  "contrastPairs": [
    { "fg": "link/default", "bg": "background/default", "context": "text" },
    { "fg": "link/hover", "bg": "background/default", "context": "text" },
    { "fg": "text/default", "bg": "background/default", "context": "text" },
    { "fg": "focus/text", "bg": "focus/background", "context": "text" }
  ],
  "requiredAria": []
}
</script>
</body>
</html>
