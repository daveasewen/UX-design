name: gates

# Verification = enforcement, applied to the repo itself (review 2026-07-02,
# decision 5). Three jobs' worth of checks in one:
#   0. the survey — every check/selftest step asked against the COMMITTED tree,
#      BEFORE any regeneration. This kills the write-then-check seam #60-D4
#      located (`_build_all.py:184-186` chain, `:160-161` index): a build that
#      regenerates and then checks its own output can never see a stale push.
#      Mutation-tested #63: a stale _CHAIN.md and a stale _memento-index.json
#      each turn this step red (steps [70] and [66]).
#   1. the knowledge build — every derived view + every blocking gate
#   2. the gate self-tests — every gate must BITE a deliberately-broken input
#
# Two pip installs: tiktoken + jsonschema. The "zero pip installs, stdlib-only"
# premise (07-02) pre-dates the real-token ruling (#56); `_gen_chain.py --check`
# REFUSES on the estimate fallback rather than silently under-reporting, so
# without tiktoken step [70] is honestly red, not quietly green.
#
# ⛔ #173 CORRECTED A CLAIM THAT WAS FALSE HERE FOR ELEVEN SESSIONS, and the
# correction is left visible rather than smoothed away. These lines used to stop
# at the sentence above and let a reader conclude that step [107] could be green
# in CI. It could not. `real` token measurement is reachable ONLY via
# `API-KEY.txt` or `knowledge/.token-cache.json`, BOTH GITIGNORED
# (`.gitignore:57,58`), so a checkout stamps `tape (cl100k ESTIMATE)` where the
# committed `_CHAIN.md` says `real` and the byte compare could never match.
# With tiktoken PRESENT and the key/cache ABSENT the old `--check` did not
# refuse — it rebuilt on the weaker tier and reported STALE, a verdict about the
# ARTEFACT dressed over a fact about the ENVIRONMENT. A gate that cannot pass is
# bad; a gate that cannot pass while THIS FILE says it can is worse, because
# this file is what a reader consults when the gate is red.
# ⇒ #183 built the queued remedy: `--check` now exits COULD-NOT-ASK — a refusal,
# never a staleness verdict — when the tier it can reach differs from the tier
# the committed file is stamped with. CI is still non-zero on [107]; it is now
# non-zero for a reason that names itself and does not accuse the artefact.
# ⚠ THIS COMMENT IS PROSE AND NOTHING PARSES IT. If the behaviour above changes,
# nothing here will go red — see `knowledge/_gen_chain.py` `stamped_tier()` and
# the COULD-NOT-ASK bites in its `--selftest`, which are the parts that bite.
#
# ---- CORRECTION, 2026-08-17 (#193) — the sentence above is now HALF TRUE, and the
# half that changed is the half a reader acts on. #183's remedy was correct and it
# was LOCAL: the refusal was spelled in prose, exited `1`, and NO CONSUMER COULD
# TELL IT FROM A FAILURE. So the survey printed "0 could-not-ask" in the same
# breath as "❌ [109] … exit 1", stayed red, and the "Knowledge build" step below
# never ran at all — a queue of unknown length behind one refusal that had already
# named itself.
# ⇒ #193 FORMALISED the convention in `knowledge/_could_not_ask.py`: EXIT 77 plus a
# first line beginning `COULD-NOT-ASK:`, carrying the gate's own reason. Four gates
# were wired to it, each keyed on an input it can PROVE is unreachable — never on
# "am I in CI", which is the #173 lie in a new shape:
#   [109] `_gen_chain.py --check`            — committed unit stamp vs reachable tier (#183, retrofitted to 77)
#   [112] `_gen_schematic.py --check`        — same disease: the committed page's unit words vs this tier
#   [113] `_gen_schematic.py --selftest`     — same key; its caption-geometry arm was going red because
#                                              `tape (cl100k ESTIMATE)` is 16 chars longer than `real`
#   [59]  `gen_dashboard.py --check`         — the page BAKES live gate results; `_governs` was naming
#                                              `outputs/…` evidence files that are UNTRACKED, so a
#                                              checkout and a working tree render different prose from
#                                              the SAME commit (isolated in a bare clone, one variable)
#   [71]  `_validate_state_contrast.py`      — playwright absent in THIS job; its proof of record is the
#                                              `render` job below, which installs chromium and runs the
#                                              same arms BLOCKING. The refusal says so, in the output.
# `_build_survey.py` now reports THREE verdicts — pass · FAIL · COULD-NOT-ASK — and
# the refusals are COUNTED AND PRINTED IN FULL but excluded from its exit code. They
# are NOT skips: a silent skip would be the defect, not the fix. A step that is
# MISSING or TIMED OUT is still a failure — it never said why.
# ⚠ STILL PROSE, STILL UNPARSED — but now the claims here are each pinned to a bite:
# the exit code and marker are asserted in `_could_not_ask.py --selftest` (wired as
# the last entry of `_build_all.STEPS`, so the survey asks it), and every gate above
# carries BOTH directions — the refusal fires when its input is gone, AND a real
# staleness on the reachable tier still exits 1, mutation-proven in its own selftest.
# ⚠ RESIDUAL, NOT FIXED HERE: [13] (capture/provenance) and [115] (package delta) are
# Dave-owned and were red on this commit before and after #193. The survey step can
# still be red for those two; nothing in #193 touched them.
#
# ---- CORRECTION TO THE CORRECTION, 2026-08-17 (#194) — the #193 wiring landed with
# two defects that run 32021654025 (on 711bfd1) exposed. BOTH FIXED; no job structure
# changed.
#   [71] HUNG, in BOTH jobs. The two arms #193 added drive the refusal by running THIS
#        FILE as a subprocess with a planted, un-importable `playwright` — the right
#        instinct, since the exit CODE is what a consumer reads. But the refusal fired
#        only on FIRST USE of the browser, below those arms, so the child re-entered
#        `--selftest`, spawned a grandchild that inherited the planted PYTHONPATH, and
#        recursed without bound. gates job: >60s, killed. render job (playwright
#        PRESENT, step BLOCKING, green before d44f023): `TimeoutExpired … 180 seconds`
#        — a parent waiting on a child waiting on a child. FIX: `main()` probes
#        reachability BEFORE any arm runs, so a playwright-less run refuses in
#        milliseconds. MEASURED here: 40s+ (unbounded) → 0.045s. Child timeouts cut
#        180s/60s → 30s, and a new arm MEASURES the child's wall clock (<10s), so the
#        recursion cannot return as a silent hang. Both #193 arms kept and still pass:
#        the refusal fires (77), and a bad flag on the same box still exits 2.
#   [13] RED IN CI, GREEN LOCALLY — the #173 shape again, in a new place, and NOT the
#        Dave-owned residual named just above. Its trigger-index arm walks every
#        evidence pointer in `_rulings.json`; three of them (ds-034, ds-035) name
#        gitignored `outputs/_FINDING-…` / `_PARTITION-…` artefacts. Present on the
#        machine that wrote them, absent from ANY checkout — so the gate's verdict was
#        a function of where it ran. Reproduced with `git clone --no-hardlinks . …`.
#        FIX: those pointers now REFUSE via the same convention (77, marked line, each
#        unreachable input named), keyed on `git check-ignore` — never on a CI env var,
#        and never on a path prefix. A TRACKED file that was deleted is not ignored, so
#        real rot still exits 1 everywhere. Mutation-proven in the bare clone BOTH
#        ways: untouched → 77 with 0 reds; one planted rotten pointer → 1, with the
#        refusals printed but not counted. A real red always outranks a refusal.
#
# ---- THIRD CORRECTION, 2026-08-19 (#208, wave 1 — "make CI legible"). The #194 note above says
# "[13] (capture/provenance) and [115] (package delta) are Dave-owned and were red on this commit
# before and after #193". THAT SENTENCE WAS HALF WRONG ABOUT [13] AND IT IS THE HALF A READER ACTS
# ON: [13] was red for a MECHANICAL reason with no Dave-judgment in it anywhere — `_governs.py`'s
# matcher, which `_capture_gate.py --selftest` runs as its trigger-index arm.
#   THE PREMISE, MEASURED FIRST (not inherited): on this tree, before the fix,
#   `python3 knowledge/_governs.py --selftest` → exit 1, one failure:
#   "an unrelated path matched a ruling — the matcher is too loose to carry information", and
#   `python3 knowledge/_capture_gate.py --selftest` → exit 1 with that as its ONLY red. So [13]
#   was red LOCALLY TOO — the "green locally" half of the brief was itself stale. Reproduced in a
#   bare clone (`git clone --no-hardlinks . /var/tmp/ciclone`, the #194 method): baseline clone
#   → `_governs` 1, `_capture_gate --selftest` 1. Same verdict both environments, so [13] was
#   never a #173-class environment gate at all; #194 had already fixed that half.
#   THE CAUSE: `matches()` also compared a bare `governs` entry against every PATH SEGMENT of the
#   target. `s202-D3` governs the bare token `knowledge`, so ONE ruling governed every file in
#   the repo's biggest directory — including `knowledge/_totally_unrelated_xyzzy.py`, the
#   selftest's own negative control. FIXED in `knowledge/_governs.py`: a bare entry is a FILE NAME
#   or a SYMBOL, never a path segment; an entry naming a real DIRECTORY governs nothing and is
#   DECLARED BY NAME on every run (⬛ re-scoping a ruling is Dave's, via `_inscribe_ruling.py`).
#   ⚠ No subtree scope was invented in its place, deliberately — `opacity-primitives-4pct` carries
#   `knowledge/`, today a no-op, and a subtree reading would WIDEN a live ruling.
#   AFTER, on this tree: `_governs --selftest` → 0 · `_capture_gate --selftest` → 0. In the bare
#   clone with the fix applied: BOTH → 77 (COULD-NOT-ASK — the three gitignored `outputs/…`
#   evidence pointers of #194, refusing in the legal form the survey excludes from its exit code).
#   ⇒ [13] is now pass locally and pass-with-declaration in CI, from the SAME check, with a real
#   red still outranking the refusal — driven by planting a rotten pointer at #194 and unchanged
#   here.
# ⚠ [115] is untouched by #208 and its constant is still ⬛ DAVE'S.
# ⚠ STILL PROSE, STILL UNPARSED. The bite is `knowledge/_governs.py --selftest` arms 3/3a, which
# include a mutation control: the pre-#208 arm restored → 2 failures.
#
# ---- AND ONE GATE THAT DID NOT EXIST (#208). `knowledge/_git_commit.sh --selftest` is wired as a
# step below. It is the consumer for the msgfile-prefix gate [[instrument-without-a-consumer]] —
# the class behind 8 doubled/tripled commit subjects. See the `prefix_count` block in that file.
#
# `fetch-depth: 0` on both checkouts is the SECOND, INDEPENDENT #173 cause:
# `_gen_chain.build_verdict_line()` runs `git show 18c7789:…` (VERDICT_SHA), and
# a depth-1 clone cannot resolve it, so the BUILD VERDICT line embedded at
# `_CHAIN.md:35` diverged for that reason too. Either cause alone kept the job
# red. `_validate_package_delta.py`'s SHIM PROVENANCE check reads a blob at
# `9dcf62d` and failed the same way — 2 of its CI findings were the clone, not
# the package.
#
# jsonschema was found the same way at #64: CI's first run past step [6] (fonts fixed) reached
# [75/75] and died on the integrity lint's import — locally present, CI absent.
# The render-dependent checks (_validate_state_contrast.py, _validate_screen.py
# --render) run in the separate `render` job below (added #155, Dave's call on
# the #153-A ⑨ proposal): ubuntu-latest has root, so `playwright install
# --with-deps chromium` needs none of the sandbox lib-farm choreography. The
# old "known gap" note in knowledge/_tests/test_gates.py pre-dates this job.

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # #173 cause 2: `git show <VERDICT_SHA>:` and the package SHIM PROVENANCE
          # blob read both need history. depth-1 made them fail as `invalid object`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tiktoken + jsonschema — the chain check refuses the estimate fallback; the integrity lint imports jsonschema
        run: pip install tiktoken jsonschema

      - name: Survey the COMMITTED tree — every check/selftest before any regeneration
        run: python3 knowledge/_build_survey.py --timeout 60

      - name: Knowledge build — all derived views + blocking gates
        run: python3 knowledge/_build_all.py

      - name: Gate self-tests — every gate bites its failure class
        run: python3 knowledge/_tests/test_gates.py

      - name: Advisory bite-tests — advisory checks must bite (and never block)
        run: python3 knowledge/_tests/test_advisory.py

      # #208 — the commit script's own gate finally has a runner. `--selftest` is READ-ONLY (no
      # staging, no commit, no push, no writes) and drives the msgfile-prefix counter both ways:
      # 5 shapes that must fire, 5 near misses that must stay silent.
      - name: Commit-script selftest — the msgfile-prefix gate bites both directions (#208)
        run: bash knowledge/_git_commit.sh --selftest

  # Render job — added #155 (Dave ruled: "keep the ubuntu solution", on #153-A ⑨).
  # BLOCKING: the state-contrast selftest (57 arms incl. the s152-D1 mutation
  # control) — this is the proof that had no runner outside the sandbox.
  # ADVISORY (continue-on-error): the full 75-snippet sweep — its exit is 1
  # today on the KNOWN-OPEN Banner hover-wash 8 (#151); blocking on a declared
  # open item would make every unrelated push red. When Banner lands, flip it.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # #173 cause 2: `git show <VERDICT_SHA>:` and the package SHIM PROVENANCE
          # blob read both need history. depth-1 made them fail as `invalid object`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright + chromium (root available — no lib farm needed)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: State-contrast selftest — every arm, mutation controls included (BLOCKING)
        run: python3 knowledge/_validate_state_contrast.py --selftest

      - name: Full state-contrast sweep — ADVISORY until the Banner 8 clear (#151 open)
        continue-on-error: true
        run: python3 knowledge/_validate_state_contrast.py
