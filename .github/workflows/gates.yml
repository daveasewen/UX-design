name: gates

# Verification = enforcement, applied to the repo itself (review 2026-07-02,
# decision 5). Three jobs' worth of checks in one:
#   0. the survey — every check/selftest step asked against the COMMITTED tree,
#      BEFORE any regeneration. This kills the write-then-check seam #60-D4
#      located (`_build_all.py:184-186` chain, `:160-161` index): a build that
#      regenerates and then checks its own output can never see a stale push.
#      Mutation-tested #63: a stale _CHAIN.md and a stale _memento-index.json
#      each turn this step red (steps [70] and [66]).
#   1. the knowledge build — every derived view + every blocking gate
#   2. the gate self-tests — every gate must BITE a deliberately-broken input
#
# Two pip installs: tiktoken + jsonschema. The "zero pip installs, stdlib-only"
# premise (07-02) pre-dates the real-token ruling (#56); `_gen_chain.py --check`
# now REFUSES on the estimate fallback rather than silently under-reporting, so
# without tiktoken step [70] is honestly red, not quietly green. jsonschema was
# found the same way at #64: CI's first run past step [6] (fonts fixed) reached
# [75/75] and died on the integrity lint's import — locally present, CI absent.
# The render-dependent checks (_validate_state_contrast.py, _validate_screen.py
# --render) are NOT run here — they need a browser engine; run them locally via
# the render path. Known gap, documented in knowledge/_tests/test_gates.py.

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tiktoken + jsonschema — the chain check refuses the estimate fallback; the integrity lint imports jsonschema
        run: pip install tiktoken jsonschema

      - name: Survey the COMMITTED tree — every check/selftest before any regeneration
        run: python3 knowledge/_build_survey.py --timeout 60

      - name: Knowledge build — all derived views + blocking gates
        run: python3 knowledge/_build_all.py

      - name: Gate self-tests — every gate bites its failure class
        run: python3 knowledge/_tests/test_gates.py

      - name: Advisory bite-tests — advisory checks must bite (and never block)
        run: python3 knowledge/_tests/test_advisory.py
