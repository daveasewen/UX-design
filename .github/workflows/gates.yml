name: gates

# Verification = enforcement, applied to the repo itself (review 2026-07-02,
# decision 5). Three jobs' worth of checks in one:
#   0. the survey — every check/selftest step asked against the COMMITTED tree,
#      BEFORE any regeneration. This kills the write-then-check seam #60-D4
#      located (`_build_all.py:184-186` chain, `:160-161` index): a build that
#      regenerates and then checks its own output can never see a stale push.
#      Mutation-tested #63: a stale _CHAIN.md and a stale _memento-index.json
#      each turn this step red (steps [70] and [66]).
#   1. the knowledge build — every derived view + every blocking gate
#   2. the gate self-tests — every gate must BITE a deliberately-broken input
#
# Two pip installs: tiktoken + jsonschema. The "zero pip installs, stdlib-only"
# premise (07-02) pre-dates the real-token ruling (#56); `_gen_chain.py --check`
# REFUSES on the estimate fallback rather than silently under-reporting, so
# without tiktoken step [70] is honestly red, not quietly green.
#
# ⛔ #173 CORRECTED A CLAIM THAT WAS FALSE HERE FOR ELEVEN SESSIONS, and the
# correction is left visible rather than smoothed away. These lines used to stop
# at the sentence above and let a reader conclude that step [107] could be green
# in CI. It could not. `real` token measurement is reachable ONLY via
# `API-KEY.txt` or `knowledge/.token-cache.json`, BOTH GITIGNORED
# (`.gitignore:57,58`), so a checkout stamps `tape (cl100k ESTIMATE)` where the
# committed `_CHAIN.md` says `real` and the byte compare could never match.
# With tiktoken PRESENT and the key/cache ABSENT the old `--check` did not
# refuse — it rebuilt on the weaker tier and reported STALE, a verdict about the
# ARTEFACT dressed over a fact about the ENVIRONMENT. A gate that cannot pass is
# bad; a gate that cannot pass while THIS FILE says it can is worse, because
# this file is what a reader consults when the gate is red.
# ⇒ #183 built the queued remedy: `--check` now exits COULD-NOT-ASK — a refusal,
# never a staleness verdict — when the tier it can reach differs from the tier
# the committed file is stamped with. CI is still non-zero on [107]; it is now
# non-zero for a reason that names itself and does not accuse the artefact.
# ⚠ THIS COMMENT IS PROSE AND NOTHING PARSES IT. If the behaviour above changes,
# nothing here will go red — see `knowledge/_gen_chain.py` `stamped_tier()` and
# the COULD-NOT-ASK bites in its `--selftest`, which are the parts that bite.
#
# `fetch-depth: 0` on both checkouts is the SECOND, INDEPENDENT #173 cause:
# `_gen_chain.build_verdict_line()` runs `git show 18c7789:…` (VERDICT_SHA), and
# a depth-1 clone cannot resolve it, so the BUILD VERDICT line embedded at
# `_CHAIN.md:35` diverged for that reason too. Either cause alone kept the job
# red. `_validate_package_delta.py`'s SHIM PROVENANCE check reads a blob at
# `9dcf62d` and failed the same way — 2 of its CI findings were the clone, not
# the package.
#
# jsonschema was found the same way at #64: CI's first run past step [6] (fonts fixed) reached
# [75/75] and died on the integrity lint's import — locally present, CI absent.
# The render-dependent checks (_validate_state_contrast.py, _validate_screen.py
# --render) run in the separate `render` job below (added #155, Dave's call on
# the #153-A ⑨ proposal): ubuntu-latest has root, so `playwright install
# --with-deps chromium` needs none of the sandbox lib-farm choreography. The
# old "known gap" note in knowledge/_tests/test_gates.py pre-dates this job.

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # #173 cause 2: `git show <VERDICT_SHA>:` and the package SHIM PROVENANCE
          # blob read both need history. depth-1 made them fail as `invalid object`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tiktoken + jsonschema — the chain check refuses the estimate fallback; the integrity lint imports jsonschema
        run: pip install tiktoken jsonschema

      - name: Survey the COMMITTED tree — every check/selftest before any regeneration
        run: python3 knowledge/_build_survey.py --timeout 60

      - name: Knowledge build — all derived views + blocking gates
        run: python3 knowledge/_build_all.py

      - name: Gate self-tests — every gate bites its failure class
        run: python3 knowledge/_tests/test_gates.py

      - name: Advisory bite-tests — advisory checks must bite (and never block)
        run: python3 knowledge/_tests/test_advisory.py

  # Render job — added #155 (Dave ruled: "keep the ubuntu solution", on #153-A ⑨).
  # BLOCKING: the state-contrast selftest (57 arms incl. the s152-D1 mutation
  # control) — this is the proof that had no runner outside the sandbox.
  # ADVISORY (continue-on-error): the full 75-snippet sweep — its exit is 1
  # today on the KNOWN-OPEN Banner hover-wash 8 (#151); blocking on a declared
  # open item would make every unrelated push red. When Banner lands, flip it.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # #173 cause 2: `git show <VERDICT_SHA>:` and the package SHIM PROVENANCE
          # blob read both need history. depth-1 made them fail as `invalid object`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright + chromium (root available — no lib farm needed)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: State-contrast selftest — every arm, mutation controls included (BLOCKING)
        run: python3 knowledge/_validate_state_contrast.py --selftest

      - name: Full state-contrast sweep — ADVISORY until the Banner 8 clear (#151 open)
        continue-on-error: true
        run: python3 knowledge/_validate_state_contrast.py
