<!DOCTYPE html>
<html lang="en" data-apollo-theme="mono">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dv-render + dv-render-bar — driven test page</title>
<!--
  THE RECEIPT rule 18 NEVER COMMITTED (s249-D4, #259 engine-core lane).

  WHAT THIS IS. A page built the way a generated page is built — canon.css, the `.cn-chart-bar`
  namespace wrapper (the trap that cost cold run 5 its chart: drop it and the svg takes no size,
  bars never animate and the tip is unstyled), a `figure.dv` with an EMPTY `svg.dv-svg.dv-fit`,
  an authored `<table class="dv-table">` as the JS-off spine, and an inline DATA object drawn by
  `dvRender(figure, spec)`. Nothing here re-implements chart geometry; that is the whole point.

  WHY <script src> AND NOT INLINE COPIES. A reference SNIPPET must be self-contained, so the
  partials are injected into it between AUTO-BEHAVIOUR markers and gated byte-exact. A TEST is the
  opposite obligation: it must fail when the SOURCE breaks, not when a copy of it goes stale. These
  four tags load `knowledge/canon/*.js` directly, so this page can never be green against a source
  that is red. The injected copies are proven identical by `gen_component_partials.py --check`.

  WHAT IT DRIVES (assert these, in every theme × mode):
    1. zero page errors on load;
    2. bars exist and carry data-fx — i.e. the fit grammar, not baked pixels;
    3. the tooltip (#dvTip.on) appears on hover of a mark, with the mark's own value;
    4. the CATEGORY FILTER re-renders (rule 14) and the bar count changes with it;
    5. the <table> spine row count follows the filtered spec — the a11y answer is never stale;
    6. every bar fill resolves to a non-empty computed colour (no dead var());
    7. no two adjacent bars touch (dv-004, 2px of real geometry).
-->
<link rel="stylesheet" href="../../canon/type.css">
<link rel="stylesheet" href="../../canon/canon.css">
<style>
  /* Page furniture only — the CHART is styled entirely by canon.css inside .cn-chart-bar. */
  body{margin:0; padding:24px; background:var(--page); color:var(--ink);
       font-family:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif;}
  h1{font-size:18px; font-weight:500; margin:0 0 4px;}
  p.lede{margin:0 0 20px; font-size:13px; opacity:.7;}
  fieldset{border:1px solid var(--line); margin:0 0 24px; padding:12px 16px;}
  legend{font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  fieldset label{display:inline-flex; align-items:center; gap:6px; margin:0 16px 0 0; font-size:13px;}
  .cn-chart-bar{margin:0 0 40px;}
</style>
</head>
<body data-theme="light" data-surface="page">

  <h1>dv-render — driven test page</h1>
  <p class="lede">Three canvases, one engine, one DATA object. Untick a category and every figure
     re-renders from the same numbers, table included.</p>

  <fieldset id="filter">
    <legend>Filter — categories in the spend charts</legend>
  </fieldset>

  <!-- ============ 1 · COLUMN, single series ============ -->
  <div class="cn-chart-bar">
  <figure class="dv dv-animate" data-dv-type="column" data-domain-min="0" data-surface="page"
          role="group" aria-labelledby="t1-h" id="fig-column">
    <figcaption id="t1-h" class="sr-only">Spend by category this month, pounds</figcaption>
    <div class="dv-head">
      <h3 class="dv-title t-cm-section-label">Housing was the month's largest cost by far</h3>
      <div class="dv-controls" role="group" aria-label="Chart tools">
        <details class="dv-tbl">
          <summary class="dv-tbl-toggle dv-vt dv-dd t-cm-chart-label" aria-controls="t1-tbl"><span>View as table</span></summary>
          <div class="dv-tablepanel" id="t1-tbl" role="region" aria-label="Spend by category, data table" tabindex="-1">
            <table class="dv-table t-cm-legal">
              <caption>Spend by category this month, pounds</caption>
              <thead><tr><th scope="col">Category</th><th scope="col">Amount (£)</th></tr></thead>
              <tbody><tr><th scope="row">Groceries</th><td>420</td></tr><tr><th scope="row">Transport</th><td>180</td></tr><tr><th scope="row">Housing</th><td>950</td></tr><tr><th scope="row">Leisure</th><td>260</td></tr><tr><th scope="row">Utilities</th><td>210</td></tr><tr><th scope="row">Savings</th><td>300</td></tr><tr><th scope="row">Insurance</th><td>145</td></tr><tr><th scope="row">Childcare</th><td>640</td></tr><tr><th scope="row">Subscriptions</th><td>78</td></tr></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
    <div class="dv-stage"><div class="dv-chart-area">
      <svg class="dv-svg dv-fit" data-pl="46" data-pr="12" data-h="260" data-pt="14" data-pb="30"
           data-h-min="200" viewBox="0 0 580 260" role="group" aria-label="Spend by category."></svg>
    </div></div>
  </figure>
  </div>

  <!-- ============ 2 · HORIZONTAL BAR, single series (DV-D09: series/3) ============ -->
  <div class="cn-chart-bar">
  <figure class="dv dv-animate" data-dv-type="bar" data-domain-min="0" data-surface="page"
          role="group" aria-labelledby="t2-h" id="fig-bar">
    <figcaption id="t2-h" class="sr-only">Spend by category this month, pounds, horizontal</figcaption>
    <div class="dv-head">
      <h3 class="dv-title t-cm-section-label">The same spend, ranked left to right</h3>
      <div class="dv-controls" role="group" aria-label="Chart tools">
        <details class="dv-tbl">
          <summary class="dv-tbl-toggle dv-vt dv-dd t-cm-chart-label" aria-controls="t2-tbl"><span>View as table</span></summary>
          <div class="dv-tablepanel" id="t2-tbl" role="region" aria-label="Spend by category horizontal, data table" tabindex="-1">
            <table class="dv-table t-cm-legal">
              <caption>Spend by category this month, pounds</caption>
              <thead><tr><th scope="col">Category</th><th scope="col">Amount (£)</th></tr></thead>
              <tbody><tr><th scope="row">Groceries</th><td>420</td></tr></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
    <div class="dv-stage"><div class="dv-chart-area">
      <svg class="dv-svg dv-fit" data-pl="46" data-pl-fit="text.dv-label" data-pr="12" data-h="300"
           data-pt="14" data-pb="30" data-h-min="200" viewBox="0 0 580 300" role="group"
           aria-label="Spend by category, horizontal."></svg>
    </div></div>
  </figure>
  </div>

  <!-- ============ 3 · GROUPED COLUMN, 8 categories × 3 series ============ -->
  <div class="cn-chart-bar">
  <figure class="dv dv-animate" data-dv-type="grouped-column" data-domain-min="0" data-surface="page"
          role="group" aria-labelledby="t3-h" id="fig-grouped">
    <figcaption id="t3-h" class="sr-only">Balances by product across eight quarters, pounds thousands</figcaption>
    <div class="dv-head">
      <h3 class="dv-title t-cm-section-label">Savings led every quarter, two years running</h3>
      <div class="dv-controls" role="group" aria-label="Chart tools">
        <details class="dv-tbl">
          <summary class="dv-tbl-toggle dv-vt dv-dd t-cm-chart-label" aria-controls="t3-tbl"><span>View as table</span></summary>
          <div class="dv-tablepanel" id="t3-tbl" role="region" aria-label="Balances by product, data table" tabindex="-1">
            <table class="dv-table t-cm-legal">
              <caption>Balances by product across eight quarters, pounds thousands</caption>
              <thead><tr><th scope="col">Quarter</th><th scope="col">Current</th></tr></thead>
              <tbody><tr><th scope="row">Q1 24</th><td>40</td></tr></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
    <div class="dv-stage"><div class="dv-chart-area">
      <svg class="dv-svg dv-fit" data-pl="46" data-pr="12" data-h="260" data-pt="14" data-pb="30"
           data-h-min="200" viewBox="0 0 580 260" role="group" aria-label="Balances by product."></svg>
    </div></div>
  </figure>
  </div>

<script src="../../canon/dv-behaviour.js"></script>
<script src="../../canon/dv-render.js"></script>
<script src="../../canon/dv-render-bar.js"></script>
<script src="../../canon/dv-render-line.js"></script>
<script>
/* THE DATA and the three calls that draw it — the shape a generated page copies. */
var CATS  = ['Groceries', 'Transport', 'Housing', 'Leisure', 'Utilities', 'Savings',
             'Insurance', 'Childcare', 'Subscriptions'];
var SPEND = [420, 180, 950, 260, 210, 300, 145, 640, 78];
var QS    = ['Q1 24', 'Q2 24', 'Q3 24', 'Q4 24', 'Q1 25', 'Q2 25', 'Q3 25', 'Q4 25'];
var BAL   = [
  { name: 'Current',     values: [40, 45, 50, 58, 61, 64, 70, 76] },
  { name: 'Savings',     values: [70, 74, 80, 88, 93, 99, 104, 112] },
  { name: 'Investments', values: [30, 34, 38, 44, 47, 52, 55, 61] }
];
var OFF = {};        /* the filter's state — category name -> excluded */

function keep() {
  var ix = [];
  for (var i = 0; i < CATS.length; i++) { if (!OFF[CATS[i]]) { ix.push(i); } }
  return ix;
}
function draw() {
  var ix = keep();
  var cats = ix.map(function (i) { return CATS[i]; });
  var vals = ix.map(function (i) { return SPEND[i]; });
  dvRender(document.getElementById('fig-column'), {
    type: 'column', categories: cats, series: [{ name: 'Amount', values: vals }],
    unit: '£', categoryLabel: 'Category',
    caption: 'Spend by category this month, pounds'
  });
  dvRender(document.getElementById('fig-bar'), {
    type: 'bar', categories: cats, series: [{ name: 'Amount', values: vals }],
    unit: '£', categoryLabel: 'Category',
    caption: 'Spend by category this month, pounds'
  });
  dvRender(document.getElementById('fig-grouped'), {
    type: 'grouped-column', categories: QS, series: BAL, categoryLabel: 'Quarter',
    caption: 'Balances by product across eight quarters, pounds thousands'
  });
}

/* ONE filter control, wired the rule-14 way: change state, rebuild the spec, call again. */
(function () {
  var fs = document.getElementById('filter');
  CATS.forEach(function (c) {
    var lab = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox'; box.checked = true; box.value = c;
    box.addEventListener('change', function () { OFF[c] = !box.checked; draw(); });
    lab.appendChild(box);
    lab.appendChild(document.createTextNode(c));
    fs.appendChild(lab);
  });
}());

draw();
window.__dvTestReady = true;
</script>
</body>
</html>
