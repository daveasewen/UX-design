<!DOCTYPE html>

<title>dv-render + dv-render-candlestick — driven test page</title>
<!--
  THE RECEIPT rule 18 NEVER COMMITTED, OHLC half (s259-D1 fast follower, #260 candlestick lane).
  Modelled on knowledge/_tests/chart-engine/bar.html — same loading pattern, same obligations.

  WHAT THIS IS. A page built the way a generated page is built — canon.css, the
  `.cn-chart-candlestick` namespace wrapper (drop it and the svg takes no size, the gain/loss
  tokens never bind and the tip is unstyled), a `figure.dv` with an EMPTY `svg.dv-svg.dv-fit`, an
  authored `<table class="dv-table">` as the JS-off spine — which for THIS type is not a fallback
  of convenience but ds-027's ruled accessibility answer — and an inline DATA object drawn by
  `dvRender(figure, spec)`.

  ⛔ OHLC IS FOUR SERIES, NAMED AND ORDERED: open, high, low, close. That is the RULED spec shape
  unextended, and it is why the core's own `writeTable` emits exactly the columns the promoted
  snippet baked by hand (Session | Open | High | Low | Close). One spec, one table, one popover.

  ⛔ THE SCALE IS THE PARTIAL'S, NOT THE CORE'S. dv-render.js floors every domain at zero
  (dv-bar-009). A price series running 90.41 -> 108.52 against a zero floor is a smear in the top
  sixth of the box, so dv-render-candlestick computes its own nice scale off the series' extent
  and re-emits the gridlines, tick labels and baseline against it. Core request filed.

  WHY <script src> AND NOT INLINE COPIES. A reference SNIPPET must be self-contained; a TEST must
  fail when the SOURCE breaks, not when a copy of it goes stale. These three tags load
  `knowledge/canon/*.js` directly. The injected copies are proven identical by
  `gen_component_partials.py --check`.

  WHAT IT DRIVES (assert these, in every theme × mode):
    1. zero page errors on load;
    2. forty candle groups exist, each a `g.dv-candle[data-fx][data-x0]` holding one wick and one
       body — the TRANSLATE grammar, so nothing inside a candle is ever re-scaled (DV-D02);
    3. ds-027 — every body is SOLID (a real fill, both directions) and its class is dv-up exactly
       when close >= open; the two directions resolve to two DIFFERENT computed colours;
    4. the tooltip (#dvTip.on) appears on hover of a body, reading that session's full OHLC — the
       same four numbers the table row carries;
    5. the SESSION FILTER re-renders (rule 14) and the candle count changes with it;
    6. the <table> spine row count follows the filtered spec — the a11y answer is never stale;
    7. the value axis is NOT zero-floored: the lowest gridline sits at 90, not 0;
    8. RESIZE: the figure re-flows, every candle group re-translates, and the body WIDTH and the
       type do NOT scale (DV-D02, the cartesian assertion).
-->
<link rel="stylesheet" href="../../canon/type.css">
<link rel="stylesheet" href="../../canon/canon.css">
<style>
  /* Page furniture only — the CHART is styled entirely by canon.css inside .cn-chart-candlestick. */
  body{margin:0; padding:24px; background:var(--page); color:var(--ink);
       font-family:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif;}
  h1{font-size:18px; font-weight:500; margin:0 0 4px;}
  p.lede{margin:0 0 20px; font-size:13px; opacity:.7;}
  fieldset{border:1px solid var(--line); margin:0 0 24px; padding:12px 16px;}
  legend{font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  fieldset label{display:inline-flex; align-items:center; gap:6px; margin:0 16px 0 0; font-size:13px;}
  .cn-chart-candlestick{margin:0 0 40px;}
</style>
</head>
<body data-theme="light" data-surface="page">

  <h1>dv-render-candlestick — driven test page</h1>
  <p class="lede">Forty sessions, one engine, one DATA object. Untick a block of ten and the
     candles, the table and the accessible name all follow.</p>

  <fieldset id="filter">
    <legend>Filter — blocks of ten sessions</legend>
  </fieldset>

  <!-- ============ 1 · CANDLESTICK — OHLC, one candle per session ============ -->
  <div class="cn-chart-candlestick">
  <figure class="dv dv-animate" data-dv-type="candlestick" data-surface="page"
          role="group" aria-labelledby="c1-h" id="fig-candlestick">
    <figcaption id="c1-h" class="sr-only">Share price, open high low close, forty sessions, pounds</figcaption>
    <div class="dv-head">
      <h3 class="dv-title t-cm-section-label">A choppy run of forty sessions closed higher than it opened</h3>
      <div class="dv-controls" role="group" aria-label="Chart tools">
        <details class="dv-tbl">
          <summary class="dv-tbl-toggle dv-vt dv-dd t-cm-chart-label" aria-controls="c1-tbl"><span>View as table</span></summary>
          <div class="dv-tablepanel" id="c1-tbl" role="region" aria-label="Share price OHLC, data table" tabindex="-1">
            <table class="dv-table t-cm-legal">
              <caption>Share price, open high low close, forty sessions, pounds — the accessibility fallback (ds-027)</caption>
              <thead><tr><th scope="col">Session</th><th scope="col">Open</th><th scope="col">High</th><th scope="col">Low</th><th scope="col">Close</th></tr></thead>
              <tbody><tr><th scope="row">S1</th><td>101.25</td><td>102.06</td><td>99.75</td><td>100.59</td></tr></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
    <div class="dv-stage"><div class="dv-chart-area">
      <svg class="dv-svg dv-fit" data-pl="46" data-pr="12" data-h="260" data-pt="14" data-pb="30"
           data-h-min="200" viewBox="0 0 580 260" role="group" aria-label="Share price."></svg>
    </div></div>
  </figure>
  </div>

<script src="../../canon/dv-behaviour.js"></script>
<script src="../../canon/dv-render.js"></script>
<script src="../../canon/dv-render-candlestick.js"></script>
<script>
/* THE DATA — the ds-027 decision spread's own seed-103 forty-session set, the same numbers the
   promoted snippet's table carries. FOUR named series in order: open, high, low, close. */
var SESS = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8', 'S9', 'S10', 'S11', 'S12', 'S13',
            'S14', 'S15', 'S16', 'S17', 'S18', 'S19', 'S20', 'S21', 'S22', 'S23', 'S24', 'S25',
            'S26', 'S27', 'S28', 'S29', 'S30', 'S31', 'S32', 'S33', 'S34', 'S35', 'S36', 'S37',
            'S38', 'S39', 'S40'];
var OPEN = [
  101.25, 99.85, 97.52, 97.34, 95.12, 92.39, 91.34, 92.57, 93.25, 93.27, 95.95, 96.63, 98.28,
  96.61, 97.57, 99.53, 100.59, 99.6, 99.6, 99.54, 98.93, 98.91, 98.97, 100.6, 100.97, 102.87,
  102.54, 103.19, 102.85, 103.1, 102.43, 104.44, 106.65, 105.72, 105.99, 106.63, 105.8, 106.03,
  105.73, 105.71
];
var HIGH = [
  102.06, 100.55, 99.4, 98.27, 95.35, 93.22, 93.89, 93.63, 94.36, 96.86, 97.95, 97.54, 99.19,
  98.51, 100.21, 101.23, 100.95, 100.57, 99.93, 100.02, 99.71, 100.1, 100.06, 101.32, 102.98,
  103, 103.07, 104.14, 103.48, 104.27, 105.32, 107.72, 107.08, 108.22, 108.52, 107.66, 107.52,
  106.56, 107.19, 106.92
];
var LOW = [
  99.75, 97.61, 97.3, 95.71, 92.59, 90.74, 90.41, 91.52, 92.87, 92.28, 95.37, 96.43, 96.88,
  95.53, 97.18, 98.61, 100.04, 98.79, 98.85, 98.79, 98, 97.83, 98.51, 98.85, 100.54, 101.23,
  101.84, 102.34, 102.35, 102.58, 101.65, 104.33, 105.48, 105.36, 105.34, 104.23, 104.9, 104.1,
  105.15, 105.1
];
var CLOSE = [
  100.59, 97.83, 98.42, 95.84, 93.21, 91.56, 93.22, 92.95, 94.01, 95.88, 97.55, 97.19, 97.68,
  97.41, 99.4, 100.73, 100.79, 99.43, 99.34, 99.37, 98.43, 99.46, 99.78, 99.82, 102.53, 102.21,
  102.23, 103.32, 102.85, 103.38, 104.32, 106.68, 105.82, 107.26, 107.63, 104.86, 106.67,
  104.97, 106.51, 106.16
];
var BLOCKS = ['S1–S10', 'S11–S20', 'S21–S30', 'S31–S40'];
var OFF = {};        /* the filter's state — block label -> excluded */

function keep() {
  var ix = [];
  for (var i = 0; i < SESS.length; i++) {
    if (!OFF[BLOCKS[Math.floor(i / 10)]]) { ix.push(i); }
  }
  return ix;
}
function pick(a, ix) { return ix.map(function (i) { return a[i]; }); }
function draw() {
  var ix = keep();
  dvRender(document.getElementById('fig-candlestick'), {
    type: 'candlestick',
    categories: pick(SESS, ix),
    series: [
      { name: 'Open',  values: pick(OPEN, ix) },
      { name: 'High',  values: pick(HIGH, ix) },
      { name: 'Low',   values: pick(LOW, ix) },
      { name: 'Close', values: pick(CLOSE, ix) }
    ],
    categoryLabel: 'Session',
    caption: 'Share price, open high low close, forty sessions, pounds'
  });
}

/* ONE filter control, wired the rule-14 way: change state, rebuild the spec, call again. */
(function () {
  var fs = document.getElementById('filter');
  BLOCKS.forEach(function (c) {
    var lab = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox'; box.checked = true; box.value = c;
    box.addEventListener('change', function () { OFF[c] = !box.checked; draw(); });
    lab.appendChild(box);
    lab.appendChild(document.createTextNode(c));
    fs.appendChild(lab);
  });
}());

draw();
window.__dvTestReady = true;
</script>
</body>
</html>
