<!DOCTYPE html>
<html lang="en" data-apollo-theme="mono">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dv-render + dv-render-stacked-area — driven test page</title>
<!--
  THE RECEIPT rule 18 NEVER COMMITTED (s249-D4, #259 lane C — stacked area).

  Modelled EXACTLY on bar.html, the reference test page: canon.css, the `.cn-chart-stacked-area`
  namespace wrapper (drop it and the svg takes no size, bands never fade in and the tip is
  unstyled), a `figure.dv` with an EMPTY `svg.dv-svg.dv-fit`, an authored `<table class="dv-table">`
  as the JS-off spine, and an inline DATA object drawn by `dvRender(figure, spec)`.

  WHY <script src> AND NOT INLINE COPIES. A reference SNIPPET must be self-contained, so the
  partials are injected into it between AUTO-BEHAVIOUR markers and gated byte-exact. A TEST is the
  opposite obligation: it must fail when the SOURCE breaks, not when a copy of it goes stale. These
  tags load `knowledge/canon/*.js` directly, so this page can never be green against a source that
  is red. The injected copies are proven identical by `gen_component_partials.py --check`.

  WHAT IT DRIVES (assert these, in every theme × mode):
    1. zero page errors on load;
    2. one path.dv-band per series, each carrying data-fxs AND data-ys — the fit grammar, not
       baked pixels — plus data-tip / tabindex / role=img / aria-label;
    3. one g.dv-marker per (series × category), each with data-fx AND data-x0 (⛔ a <g> with
       data-fx and no data-x0 gets its child's cx ADDED to the fitted x — the baked exemplar's bug);
    4. the tooltip (#dvTip.on) appears on hover of a marker, reading that marker's own value;
    5. the SERIES FILTER re-renders (rule 14): band count, marker count AND the <table> spine's
       column count all follow the filtered spec;
    6. every band fill resolves to a non-empty computed colour (no dead var());
    7. dv-2px-separation — no two adjacent bands touch: the vertical clear ground between band i's
       painted top edge and band i+1's foot is >= 2px at every category;
    8. resize re-fits — change the viewport width and every x moves.
-->
<link rel="stylesheet" href="../../canon/type.css">
<link rel="stylesheet" href="../../canon/canon.css">
<style>
  /* Page furniture only — the CHART is styled entirely by canon.css inside .cn-chart-stacked-area. */
  body{margin:0; padding:24px; background:var(--page); color:var(--ink);
       font-family:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif;}
  h1{font-size:18px; font-weight:500; margin:0 0 4px;}
  p.lede{margin:0 0 20px; font-size:13px; opacity:.7;}
  fieldset{border:1px solid var(--line); margin:0 0 24px; padding:12px 16px;}
  legend{font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  fieldset label{display:inline-flex; align-items:center; gap:6px; margin:0 16px 0 0; font-size:13px;}
  .cn-chart-stacked-area{margin:0 0 40px;}
</style>
</head>
<body data-theme="light" data-surface="page">

  <h1>dv-render — stacked area, driven test page</h1>
  <p class="lede">One canvas, one engine, one DATA object. Untick a product and the figure
     re-renders from the same numbers, table included.</p>

  <fieldset id="filter">
    <legend>Filter — quarters in the stack</legend>
  </fieldset>

  <!-- ============ STACKED AREA, 10 categories × 3 series ============ -->
  <div class="cn-chart-stacked-area">
  <figure class="dv dv-animate" data-dv-type="stacked-area" data-domain-min="0" data-surface="page"
          role="group" aria-labelledby="ts1-h" id="fig-stack">
    <figcaption id="ts1-h" class="sr-only">Total balance by quarter split by product, pounds thousands, stacked</figcaption>
    <div class="dv-head">
      <h3 class="dv-title t-cm-section-label">Total balances grew every quarter for two and a half years</h3>
      <div class="dv-controls" role="group" aria-label="Chart tools">
        <details class="dv-tbl">
          <summary class="dv-tbl-toggle dv-vt dv-dd t-cm-chart-label" aria-controls="ts1-tbl"><span>View as table</span></summary>
          <div class="dv-tablepanel" id="ts1-tbl" role="region" aria-label="Total balance by quarter, data table" tabindex="-1">
            <table class="dv-table t-cm-legal">
              <caption>Total balance by quarter split by product, pounds thousands</caption>
              <thead><tr><th scope="col">Quarter</th><th scope="col">Current</th><th scope="col">Savings</th><th scope="col">Investments</th></tr></thead>
              <tbody><tr><th scope="row">Q1 24</th><td>40</td><td>70</td><td>30</td></tr></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
    <div class="dv-stage"><div class="dv-chart-area">
      <svg class="dv-svg dv-fit" data-pl="46" data-pr="12" data-h="260" data-pt="14" data-pb="30"
           data-h-min="200" viewBox="0 0 580 260" role="group"
           aria-label="Total balance by quarter split by product."></svg>
    </div></div>
  </figure>
  </div>

<script src="../../canon/dv-behaviour.js"></script>
<script src="../../canon/dv-legend.js"></script>
<script src="../../canon/dv-render.js"></script>
<script src="../../canon/dv-render-stacked-area.js"></script>
<script>
/* THE DATA and the one call that draws it — the shape a generated page copies. */
var QS = ['Q1 24', 'Q2 24', 'Q3 24', 'Q4 24', 'Q1 25', 'Q2 25', 'Q3 25', 'Q4 25', 'Q1 26', 'Q2 26'];
var SERIES = [
  { name: 'Current',     values: [40, 45, 50, 58, 61, 64, 70, 76, 79, 83] },
  { name: 'Savings',     values: [70, 74, 80, 88, 93, 99, 104, 112, 121, 130] },
  { name: 'Investments', values: [30, 34, 38, 44, 47, 52, 55, 61, 68, 77] }
];
var OFF = {};        /* the filter's state — category name -> excluded */

function keep() {
  var ix = [];
  for (var i = 0; i < QS.length; i++) { if (!OFF[QS[i]]) { ix.push(i); } }
  return ix;
}
function draw() {
  var ix = keep();
  dvRender(document.getElementById('fig-stack'), {
    type: 'stacked-area',
    categories: ix.map(function (i) { return QS[i]; }),
    series: SERIES.map(function (s) {
      return { name: s.name, values: ix.map(function (i) { return s.values[i]; }) };
    }),
    categoryLabel: 'Quarter',
    caption: 'Total balance by quarter split by product, pounds thousands'
  });
}

/* ONE filter control, wired the rule-14 way: change state, rebuild the spec, call again. */
(function () {
  var fs = document.getElementById('filter');
  QS.forEach(function (c) {
    var lab = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox'; box.checked = true; box.value = c;
    box.addEventListener('change', function () { OFF[c] = !box.checked; draw(); });
    lab.appendChild(box);
    lab.appendChild(document.createTextNode(c));
    fs.appendChild(lab);
  });
}());

draw();
window.__dvTestReady = true;
</script>
</body>
</html>
