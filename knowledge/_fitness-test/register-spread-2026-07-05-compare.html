<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§9 worked spread — comparison viewer (Sonnet vs Opus × sober/balanced/expressive)</title>
<!--
  NEW comparison shell, 2026-07-05. Reuses the SEGMENTED-BUTTON SWITCHER *pattern* from the old
  sme-payments-registers.html (tombstoned) for ease of comparison, per Dave's request — but loads
  none of that file's content or register definitions. Each button here just swaps which of the SIX
  independently-generated, already-committed spread files (register-spread-2026-07-05/ = Sonnet,
  register-spread-2026-07-05-opus/ = Opus) shows in the iframe below. No shared DOM, no shared CSS
  variables across bands — each artifact renders exactly as its own isolated generation pass produced
  it. This file is a viewer only; it is not itself part of the spread or the probe.
-->
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --ink:#16181D; --muted:#6A6E76; --line:#E4E4E2; --paper:#F7F7F6; --accent:#DB0011;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font); background:var(--paper); color:var(--ink);}
  .bar{position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; flex-wrap:wrap; gap:18px; align-items:center;}
  .grp{display:flex; flex-direction:column; gap:6px;}
  .grp .lab{font:600 11px/1 var(--font); letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:0;}
  .seg button{font:500 13px/1 var(--font); padding:9px 14px; border:0; border-left:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;}
  .seg button:first-child{border-left:0;}
  .seg button[aria-pressed="true"]{background:var(--ink); color:#fff;}
  .seg button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .now{margin-left:auto; font:400 13px/1.4 var(--font); color:var(--muted);}
  .now b{color:var(--ink); font-weight:600;}
  iframe{display:block; width:100%; height:calc(100vh - 66px); border:0; background:#fff;}
  .path{padding:6px 20px; font:400 11px/1.4 ui-monospace,monospace; color:var(--muted); background:#fff; border-bottom:1px solid var(--line);}
</style>
</head>
<body>
  <div class="bar">
    <div class="grp">
      <span class="lab">Model</span>
      <div class="seg" id="modelSeg">
        <button data-model="register-spread-2026-07-05" aria-pressed="true">Sonnet</button>
        <button data-model="register-spread-2026-07-05-opus" aria-pressed="false">Opus</button>
      </div>
    </div>
    <div class="grp">
      <span class="lab">Register</span>
      <div class="seg" id="regSeg">
        <button data-reg="sober" aria-pressed="true">Sober</button>
        <button data-reg="balanced" aria-pressed="false">Balanced</button>
        <button data-reg="expressive" aria-pressed="false">Expressive (v1)</button>
        <button data-reg="expressive-v2" aria-pressed="false">Expressive (v2 — gravity fix)</button>
      </div>
    </div>
    <div class="grp">
      <span class="lab">Diagnostic — zero curbs (Opus)</span>
      <div class="seg" id="diagSeg">
        <button id="diagWith">With named influences</button>
        <button id="diagWithout">Without influences</button>
      </div>
    </div>
    <div class="grp">
      <span class="lab">Reference (old, ungoverned)</span>
      <div class="seg" id="refSeg">
        <button id="refBtn">Portfolio piece</button>
      </div>
    </div>
    <div class="now">Now viewing: <b id="nowLabel">Sonnet — Sober</b></div>
  </div>
  <div class="path" id="pathLabel"></div>
  <iframe id="frame" title="Spread artifact preview"></iframe>

<script>
  const modelBtns = document.querySelectorAll('#modelSeg button');
  const regBtns = document.querySelectorAll('#regSeg button');
  const frame = document.getElementById('frame');
  const nowLabel = document.getElementById('nowLabel');
  const pathLabel = document.getElementById('pathLabel');
  let model = 'register-spread-2026-07-05';
  let modelName = 'Sonnet';
  let reg = 'sober';

  function render(){
    const src = model + '/' + reg + '.html';
    frame.src = src;
    nowLabel.textContent = modelName + ' — ' + reg.charAt(0).toUpperCase() + reg.slice(1);
    pathLabel.textContent = 'knowledge/_fitness-test/' + src;
  }
  modelBtns.forEach(b=>b.addEventListener('click', ()=>{
    modelBtns.forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    model = b.dataset.model; modelName = b.textContent;
    render();
  }));
  document.getElementById('refBtn').addEventListener('click', ()=>{
    frame.src = 'sme-payments-portfolio.html';
    nowLabel.textContent = 'Reference — old portfolio piece (ungoverned, pre-charter)';
    pathLabel.textContent = 'knowledge/_fitness-test/sme-payments-portfolio.html';
  });
  document.getElementById('diagWith').addEventListener('click', ()=>{
    frame.src = 'register-spread-2026-07-05-diagnostic/with-influences.html';
    nowLabel.textContent = 'Diagnostic — zero curbs, WITH named influences (Opus)';
    pathLabel.textContent = 'knowledge/_fitness-test/register-spread-2026-07-05-diagnostic/with-influences.html';
  });
  document.getElementById('diagWithout').addEventListener('click', ()=>{
    frame.src = 'register-spread-2026-07-05-diagnostic/without-influences.html';
    nowLabel.textContent = 'Diagnostic — zero curbs, WITHOUT named influences (Opus)';
    pathLabel.textContent = 'knowledge/_fitness-test/register-spread-2026-07-05-diagnostic/without-influences.html';
  });
  regBtns.forEach(b=>b.addEventListener('click', ()=>{
    regBtns.forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    reg = b.dataset.reg;
    render();
  }));
  render();
</script>
</body>
</html>
