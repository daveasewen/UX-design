<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge — A/B showcase</title>
<!-- Route A: badge pops in with overshoot; active dot pulses (ping ring). Route B: static. -->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --spring:360ms cubic-bezier(.5,1.7,.4,1); }
  body[data-theme="light"]{ --page:#f4f4f5; --ink:#1b1b1d; --muted:#6a6a70; --card:#fff; --edge:#e7e7ea; --surface:#DB0011; --number:#fff; --host:#333; }
  body[data-theme="dark"]{ --page:#0b0b0c; --ink:#f3f3f4; --muted:#9a9aa0; --card:#161616; --edge:#27272b; --surface:#DB0011; --number:#fff; --host:#fff; }
  *{box-sizing:border-box;}
  body{margin:0; padding:36px clamp(20px,4vw,56px); font-family:var(--font); background:var(--page); color:var(--ink); -webkit-font-smoothing:antialiased; transition:background .16s,color .16s;}
  header{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:26px;}
  h1{font-size:21px; margin:0 0 6px;} header p{margin:0; color:var(--muted); font-size:14px; max-width:60ch;}
  .toggle{flex:none; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--card); border:1px solid var(--edge); padding:9px 14px; border-radius:999px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;} @media(max-width:760px){.grid{grid-template-columns:1fr;}}
  .col{background:var(--card); border:1px solid var(--edge); border-radius:14px; padding:24px; min-height:200px;}
  .tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; border-radius:999px; margin-bottom:18px;}
  .a .tag{background:rgba(0,95,204,.12); color:#3b82f6;} .b .tag{background:rgba(219,0,17,.12); color:#e0566b;}
  .row{display:flex; gap:44px; align-items:center; margin-bottom:24px;}
  .host{position:relative; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;}
  .host svg{width:34px; height:34px; fill:var(--host);}
  .badge{position:absolute; top:-6px; right:-8px; min-width:24px; height:24px; padding:0 7px; border-radius:999px; background:var(--surface); color:var(--number); font:700 13px/1 var(--font); display:inline-flex; align-items:center; justify-content:center; border:2px solid var(--page);}
  .dot{position:absolute; top:-4px; right:-6px; width:20px; height:20px; border-radius:999px; background:var(--surface); border:2px solid var(--page);}
  .replay{font:inherit; font-size:13px; padding:7px 12px; border:1px solid var(--edge); background:transparent; color:var(--ink); cursor:pointer;}

  /* Route A — pop-in overshoot + pulsing active dot */
  .a .badge,.a .dot{transform-origin:center;}
  .a.play .badge,.a.play .dot{animation:pop var(--spring) both;}
  @keyframes pop{0%{transform:scale(0);} 100%{transform:scale(1);}}
  .a .dot::after{content:""; position:absolute; inset:-2px; border-radius:999px; border:2px solid var(--surface); animation:ping 1.8s ease-out infinite;}
  @keyframes ping{0%{transform:scale(1); opacity:.6;} 70%,100%{transform:scale(2); opacity:0;}}
  @media(prefers-reduced-motion:reduce){ .a .badge,.a .dot{animation:none !important;} .a .dot::after{animation:none; opacity:0;} }
</style>
</head>
<body data-theme="light">
  <header><div><h1>Badge — A/B showcase</h1><p><b>Route A:</b> the badge pops in with a slight overshoot, and the active dot emits a soft pulse for attention. <b>Route B:</b> the static canonical badge. Hit replay to see the entrance.</p></div>
    <button class="toggle" id="t" type="button">◐ Dark</button></header>
  <div class="grid">
    <section class="col a" id="colA"><span class="tag">Route A · unconstrained + motion</span>
      <div class="row">
        <span class="host"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11c0-3-1.6-5.4-4.5-6V4a1.5 1.5 0 0 0-3 0v1C7.6 5.6 6 8 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg><span class="badge" aria-label="3 unread">3</span></span>
        <span class="host"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11c0-3-1.6-5.4-4.5-6V4a1.5 1.5 0 0 0-3 0v1C7.6 5.6 6 8 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg><span class="dot" aria-label="New activity"></span></span>
      </div>
      <button class="replay" id="replay" type="button">↺ Replay entrance</button>
    </section>
    <section class="col b"><span class="tag">Route B · canonical reference</span>
      <div class="row">
        <span class="host"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11c0-3-1.6-5.4-4.5-6V4a1.5 1.5 0 0 0-3 0v1C7.6 5.6 6 8 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg><span class="badge" aria-label="3 unread">3</span></span>
        <span class="host"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11c0-3-1.6-5.4-4.5-6V4a1.5 1.5 0 0 0-3 0v1C7.6 5.6 6 8 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg><span class="dot" aria-label="New activity"></span></span>
      </div>
    </section>
  </div>
  <script>
    document.getElementById('t').addEventListener('click', e=>{const b=document.body,d=b.getAttribute('data-theme')==='dark';b.setAttribute('data-theme',d?'light':'dark');e.target.textContent=d?'◐ Dark':'◐ Light';});
    const colA=document.getElementById('colA');
    function play(){ colA.classList.remove('play'); void colA.offsetWidth; colA.classList.add('play'); }
    document.getElementById('replay').addEventListener('click', play); play();
  </script>
</body>
</html>
