<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search field — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Search field (gated). A search-purpose input with a leading icon + clear button.
     TWO styles (both kept): UNDERLINE (bottom-stroke) and BOXED (full form/border, matches the boxed Input
     field — active = border/active + 4px bottom-stroke + page fill). Reuses the Input-fields chrome.
     CLEAR (×) appears ONLY when the field holds a value (input:not placeholder-shown) — it is NOT permanent.
     The browser's native type=search clear is suppressed (::-webkit-search-cancel-button) so there's no
     double cross. Icons are real HSBC library glyphs via a <symbol> sprite + <use> (icon-source rule). -->
<link rel="stylesheet" href="../canon/type.css">
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:160ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{ --bg:#FFFFFF00; --hover:#F0F0F0; --border:#808080; --border-active:#000000; --text:#1A1A1A; --icon:#1A1A1A; --page:#FFFFFF; }
  [data-theme="dark"]{ --bg:#FFFFFF00; --hover:#232323; --border:#808080; --border-active:#FFFFFF; --text:#FFFFFF; --icon:#FFFFFF; --page:#1A1A1A; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer;}
  .stack{display:flex; flex-direction:column; gap:32px; max-width:360px;}
  .cap{font:400 12px/1.3 var(--font); color:var(--text); opacity:.55; margin:0 0 8px; /* sentence case — type26-019 sweep (Dave ruling 2026-07-02): no uppercase, caps tracking removed with it */}

  .search{position:relative; display:flex; align-items:center; height:48px; border-bottom:1px solid var(--border);
    transition:background var(--ease), border-color var(--ease), box-shadow var(--ease);}
  .search .mag{flex:none; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; color:var(--icon); margin:0 12px 0 2px;}
  .search .mag svg{width:20px; height:20px; fill:currentColor;}
  .search input{flex:1; min-width:0; height:100%; border:0; background:var(--bg); color:var(--text); /* type: t-cm-label (bound in canon/type.css - T-D9/T-D12) */ outline:none;}
  .search input::placeholder{color:var(--text); opacity:.5;}
  /* suppress the browser's NATIVE search clear — we supply our own, so no double cross */
  .search input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none;}
  .search:hover{background:var(--hover);}
  .search:focus-within{box-shadow:inset 0 -2px 0 var(--border-active);}
  .search input:focus-visible{outline:none;}

  /* BOXED (full border) — matches the boxed Input field: active = border/active + 4px bottom-stroke + page fill */
  .search.boxed{border:1px solid var(--border); padding:0 8px;}
  .search.boxed:focus-within{border-color:var(--border-active); box-shadow:inset 0 -4px 0 0 var(--border-active); background:var(--page);}

  /* CLEAR (×) — present ONLY when the field has a value (hidden while the placeholder shows) */
  .clear{flex:none; width:24px; height:24px; border:0; background:transparent; color:var(--icon); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .clear svg{width:12px; height:12px; fill:currentColor;}
  .clear:focus-visible{outline:2px solid var(--border-active); outline-offset:2px;}
  .search input:placeholder-shown ~ .clear{display:none;}     /* not actionable until there's something to clear */

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ic-search" viewBox="0 0 18 18"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.19675 12.803C3.66075 14.268 5.58075 15 7.49975 15C9.23175 15 10.9598 14.398 12.3577 13.206L17.1257 17.973L17.9748 17.125L13.2067 12.357C15.7197 9.41 15.5898 4.981 12.8048 2.196C11.3388 0.732 9.41875 0 7.49975 0C5.58075 0 3.66075 0.732 2.19675 2.197C-0.73225 5.126 -0.73225 9.874 2.19675 12.803ZM1.19975 7.5C1.19975 5.817 1.85575 4.235 3.04475 3.045C4.23375 1.855 5.81675 1.2 7.49975 1.2C9.18275 1.2 10.7648 1.855 11.9548 3.045C14.4108 5.501 14.4108 9.498 11.9548 11.955C10.7648 13.145 9.18275 13.8 7.49975 13.8C5.81675 13.8 4.23475 13.145 3.04475 11.955C1.85475 10.765 1.19975 9.183 1.19975 7.5Z" fill="currentColor"/></symbol>
    <symbol id="ic-clear" viewBox="0 0 18 18"><path fill-rule="evenodd" clip-rule="evenodd" d="M16.5 2.35668L15.6433 1.5L9 8.14332L2.35668 1.5L1.5 2.35668L8.14332 9L1.5 15.6433L2.35668 16.5L9 9.85668L15.6433 16.5L16.5 15.6433L9.85668 9L16.5 2.35668Z" fill="currentColor"/></symbol>
  </svg>

  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Search field — canonical reference · two styles</span></div>

  <div class="stack">
    <div>
      <p class="cap">Boxed (full border)</p>
      <div class="search boxed">
        <span class="mag" aria-hidden="true"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-search"/></svg></span>
        <input type="search" aria-label="Search transactions" placeholder="Search transactions" value="Statements">
        <button class="clear" type="button" aria-label="Clear search"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-clear"/></svg></button>
      </div>
    </div>
    <div>
      <p class="cap">Underline</p>
      <div class="search">
        <span class="mag" aria-hidden="true"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-search"/></svg></span>
        <input type="search" aria-label="Search payees" placeholder="Search payees" value="">
        <button class="clear" type="button" aria-label="Clear search"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-clear"/></svg></button>
      </div>
    </div>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Search field",
    "vars": { "--hover": "form/background/hover", "--border": "form/border/default", "--border-active": "form/border/active", "--text": "text/default", "--icon": "icon/default", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "form/border/default", "bg": "background/default", "context": "ui" },
      { "fg": "form/border/active", "bg": "background/default", "context": "ui" },
      { "fg": "icon/default", "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["type=\"search\"", "aria-label"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });
    /* clear button: empty the field + refocus; CSS re-hides it once empty (placeholder shows again) */
    document.querySelectorAll('.search .clear').forEach(btn=>{
      btn.addEventListener('click', ()=>{ const inp=btn.parentNode.querySelector('input'); inp.value=''; inp.focus(); });
    });
  </script>
</body>
</html>
