<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selection controls — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for Selection controls (checkbox, radio, switch) — gated.
  Colours = resolved canonical tokens, validated by _validate_snippets.py.
  Key reuse: the SELECTED/ON fill is the inverting secondary/background/default (#000 light /
  #FFF dark) and the glyph is text/on-inverse (#FFF light / #333 dark) — the same pair that
  fixed the secondary Button. The meta currently points chip/switch selected fill at
  tertiary/background/active, which goes #1D1D1D in dark (a checked control invisible on the
  page); the inverting binding here is the proposed rebind.
  Focus: :focus-visible ring (focus/ring) — reliable keyboard-only on non-text controls.
-->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif;
    --fs:16px; --ease:180ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{
    --ctrl-border:#767676; --ctrl-border-active:#000000; --ctrl-border-disabled:#D7D8D6;
    --checked:#000000;            /* secondary/background/default */
    --glyph:#FFFFFF;              /* text/on-inverse */
    --label:#333333; --label-disabled:#D7D8D6; --error:#A8000B; --focus:#305A85; --page:#FFFFFF;
    --track-off:#767676;
  }
  [data-theme="dark"]{
    --ctrl-border:#656565; --ctrl-border-active:#FFFFFF; --ctrl-border-disabled:#404040;
    --checked:#FFFFFF;            /* secondary/background/default (inverts) */
    --glyph:#333333;              /* text/on-inverse (inverts) */
    --label:#FFFFFF; --label-disabled:#767676; --error:#DB0011; --focus:#4587A7; --page:#000000;
    --track-off:#656565;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--label);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--ctrl-border);
    background:transparent; color:var(--label); cursor:pointer;}
  h2{font-size:12px; letter-spacing:.04em; text-transform:uppercase; opacity:.55; margin:1.75rem 0 .7rem;}
  .field{display:flex; align-items:center; gap:12px; margin:14px 0; font:500 var(--fs)/1.3 var(--font);}
  .field input{position:absolute; opacity:0; width:0; height:0;}   /* native control drives state + a11y */
  .field label{cursor:pointer; display:flex; align-items:center; gap:12px;}
  .field.is-disabled label{cursor:not-allowed; color:var(--label-disabled);}

  /* ---- checkbox ---- */
  .box{width:22px; height:22px; flex:none; border:2px solid var(--ctrl-border); background:transparent;
    display:flex; align-items:center; justify-content:center; transition:background var(--ease), border-color var(--ease);}
  .box svg{width:14px; height:14px;}
  .box path{stroke:var(--glyph); stroke-width:2.4; fill:none; stroke-dasharray:22; stroke-dashoffset:22; transition:stroke-dashoffset var(--ease);}
  input:checked + label .box{background:var(--checked); border-color:var(--checked);}
  input:checked + label .box path{stroke-dashoffset:0;}
  input:focus-visible + label .box{outline:2px solid var(--focus); outline-offset:2px;}

  /* ---- radio ---- */
  .radio{width:22px; height:22px; flex:none; border:2px solid var(--ctrl-border); border-radius:50%;
    display:flex; align-items:center; justify-content:center; transition:border-color var(--ease);}
  .radio .dot{width:12px; height:12px; border-radius:50%; background:var(--checked); transform:scale(0); transition:transform var(--ease);}
  input:checked + label .radio{border-color:var(--ctrl-border-active);}
  input:checked + label .radio .dot{transform:scale(1);}
  input:focus-visible + label .radio{outline:2px solid var(--focus); outline-offset:2px;}

  /* ---- switch ---- */
  .switch{width:44px; height:24px; flex:none; border-radius:999px; background:transparent;
    border:2px solid var(--track-off); position:relative; transition:background var(--ease), border-color var(--ease);}
  .switch .thumb{position:absolute; top:1px; left:1px; width:18px; height:18px; border-radius:50%;
    background:var(--track-off); transition:transform var(--ease), background var(--ease);}
  input:checked + label .switch{background:var(--checked); border-color:var(--checked);}
  input:checked + label .switch .thumb{transform:translateX(20px); background:var(--glyph);}
  input:focus-visible + label .switch{outline:2px solid var(--focus); outline-offset:2px;}

  .is-disabled .box,.is-disabled .radio,.is-disabled .switch{border-color:var(--ctrl-border-disabled);}
  .is-disabled .switch .thumb{background:var(--ctrl-border-disabled);}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Selection controls — canonical reference</span></div>

  <h2>Checkbox</h2>
  <div class="field"><input type="checkbox" id="c1"><label for="c1"><span class="box"><svg viewBox="0 0 18 18"><path d="M3.5 9.5 L7.5 13.5 L14.5 5"/></svg></span> Email notifications</label></div>
  <div class="field"><input type="checkbox" id="c2" checked><label for="c2"><span class="box"><svg viewBox="0 0 18 18"><path d="M3.5 9.5 L7.5 13.5 L14.5 5"/></svg></span> SMS notifications (checked)</label></div>
  <div class="field is-disabled"><input type="checkbox" id="c3" disabled><label for="c3"><span class="box"><svg viewBox="0 0 18 18"><path d="M3.5 9.5 L7.5 13.5 L14.5 5"/></svg></span> Push notifications (disabled)</label></div>

  <h2>Radio</h2>
  <div class="field"><input type="radio" name="r" id="r1"><label for="r1"><span class="radio"><span class="dot"></span></span> Standard delivery</label></div>
  <div class="field"><input type="radio" name="r" id="r2" checked><label for="r2"><span class="radio"><span class="dot"></span></span> Express delivery (selected)</label></div>
  <div class="field is-disabled"><input type="radio" name="r" id="r3" disabled><label for="r3"><span class="radio"><span class="dot"></span></span> Same-day (disabled)</label></div>

  <h2>Switch</h2>
  <div class="field"><input type="checkbox" role="switch" id="s1"><label for="s1"><span class="switch"><span class="thumb"></span></span> Marketing emails</label></div>
  <div class="field"><input type="checkbox" role="switch" id="s2" checked><label for="s2"><span class="switch"><span class="thumb"></span></span> Two-factor auth (on)</label></div>
  <div class="field is-disabled"><input type="checkbox" role="switch" id="s3" disabled><label for="s3"><span class="switch"><span class="thumb"></span></span> Beta features (disabled)</label></div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Selection controls",
    "vars": { "--focus": "focus/ring",
      "--ctrl-border": "form/border/default",
      "--ctrl-border-active": "form/border/active",
      "--ctrl-border-disabled": "form/border/disabled",
      "--checked": "secondary/background/default",
      "--glyph": "text/on-inverse",
      "--label": "text/default",
      "--label-disabled": "text/disabled",
      "--error": "rag/error",
      "--page": "background/default"
    },
    "contrastPairs": [
      { "fg": "text/default",  "bg": "background/default",          "context": "text" },
      { "fg": "form/border/default", "bg": "background/default",    "context": "ui" },
      { "fg": "text/on-inverse", "bg": "secondary/background/default", "context": "ui" },
      { "fg": "secondary/background/default", "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["type=\"checkbox\"", "type=\"radio\"", "role=\"switch\""]
  }
  </script>

  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{
      const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  </script>
</body>
</html>
