  Layer-1 pattern (toolbar + table spine + token-manifest), NOT the full DV-D11 legend machinery —
  a box plot's categories are not filterable series here (single box per category, no multi-series split).

  WHAT'S REUSED, verbatim, from the promoted kit vocabulary (Chart-bar/Chart-scatter are the source):
  580×260 frame; plot 46→568 / 14→230; --data-series-1 fill for the box; toolbar chrome (.dv-vt/.dv-csv/

  (circle r5.5, page-colour separating stroke 1.5) per the brief's citation.
  AUTO-BEHAVIOUR markers present but EMPTY, same precedent as the 2026-07-24 lane-1 receipt: dataviz
  membership (component-types.json `$members`) is a conductor serial, not a worker fence.

  ⛔ ds-020 FENCE (DIVVY-inherited, all wave-2 lanes): copy the mark contract + toolbar, NOT the axis/grid

  minted data/axis + data/grid two-channel roles Chart-bar/Chart-scatter carry post-migration. That is a
  KNOWN, DECLARED gap — inherited knowingly, not filled here (receipted).

  WHAT'S NEWLY JUDGED for box plot (receipted for Dave's eyeball):
  · Whisker = ink line, 1px, min→Q1 and Q3→max, with a short horizontal cap at each end.
  · Box = data/series/1 fill (the "measure" of the chart), Q1→Q3, ink 1px stroke.
  · Median = an ink line spanning the box width, 2px (heavier than the box stroke so it reads at a glance).
  · Outliers = the Chart-scatter marker family (circle r5.5, page-colour stroke), fill = data/series/1
    (same series, not a new channel — colour is not carrying extra meaning here, dv-011 N/A: outliers are
    the SAME series, just outside the whisker range).
  · Table mirrors the FIVE-NUMBER SUMMARY per category (min / Q1 / median / Q3 / max) + an outliers column.

  RULES honoured: dv-017 var() fills only · dv-016 ≥3:1 series + axis both modes (declared, not yet
  render-verified — see receipt) · composites-only type (DV-D05/DV-D08 12px floor) · DEF-003 CSS-only
