<title>Image block — reference implementation (PROPOSED, wave 4 lane C)</title>
<!--
  CANONICAL REFERENCE for Image block (Apollo MONO). PROPOSED at #210, wave 4 lane C — nothing here
  is registered or ruled. A media block using real <figure>/<figcaption> semantics: an image area,
  an optional caption slot and an optional attribution slot, plus a loading/skeleton state that
  borrows Skeleton-loader's own bone atom VERBATIM (same class names, same token pair) rather than
  drawing a second placeholder mechanism — the two components share one loading idiom by construction.

  ASPECT-RATIO VARIANTS, all on the 4px grid (declared heights at the --demo-width below are 4px
  multiples; the ratios themselves are the standard photographic/screen set so the component is
  useful against real crops): 16:9 (video/hero) · 4:3 (classic photo) · 1:1 (square/avatar-scale
  media) · 3:4 (portrait). `aspect-ratio` is a CSS ratio, not a pixel value — the 4px discipline
  is enforced on every SURROUNDING measurement (caption padding, gaps, the border) instead.

  IMAGERY: every media area is a neutral SVG placeholder rectangle — a flat fill plus a diagonal
  corner mark — never invented photography and never a drawn icon standing in for a photo (DO-NOT-
  RULE, wave-4 brief). The broken-image STATE reuses the byte-matched glyph from
  knowledge/assets/icons/informative/broken-image.svg (never redrawn).

  A11Y: the placeholder svg element carries role="img" + a descriptive aria-label so a screen reader
  gets "Placeholder — what the crop would show", never a blank announcement. A real deployment
  replaces the svg with a real img element (with alt text); the alt-text discipline is identical
  either way. The caption
  is figcaption (native association, no aria-labelledby needed); the attribution line sits INSIDE
  the same figcaption as a second paragraph, not a sibling, so one AT pass reads both without a
  second landmark. Loading state: role="status" + aria-busy="true" + a visually-hidden "Loading
  image", identical wiring to Skeleton-loader's own regions (borrowed, not reinvented).
-->
