<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input fields — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE IMPLEMENTATION for the single-line Input field (gated snippet).
  Colour values = resolved canonical tokens (form/*, text/*, rag/error), validated
  against the store by _validate_snippets.py. Geometry from Input-fields.meta dimensions
  (captured; inferred, Dave-signed). Focus = keyboard-only :focus-visible thick stroke
  in the field's own colour (form/border/active), per the captured decision. Error:
  rag/error is reserved for the STROKE + alert ICON (non-text, 3:1); the error MESSAGE
  text uses text/default so it stays legible on the pure-black dark page (rag/error red
  is only 4.02:1 there — below the 4.5 text bar).
-->
<style>
  :root{
    --font: "Univers Next for HSBC", "Helvetica Neue", Arial, Helvetica, sans-serif;
    --fs:16px; --lh:24px; --weight:500; --weight-ph:300;   /* font-5 / medium ; placeholder light */
    --fs-help:12px; --lh-help:16px;                        /* font-7 */
    /* geometry — Input-fields.meta dimensions */
    --field-h:52px; --underline-rest:1px; --underline-active:3px; --label-gap:8px; --helper-gap:7px;
    --ease:200ms cubic-bezier(.4,0,.2,1);
  }
  [data-theme="light"]{
    --field-bg-default:#FFFFFF00;   /* form/background/default */
    --field-bg-hover:#F3F3F3;       /* form/background/hover */
    --field-border-default:#767676; /* form/border/default */
    --field-border-active:#000000;  /* form/border/active */
    --field-border-disabled:#D7D8D6;/* form/border/disabled */
    --text-default:#333333;         /* text/default */
    --text-disabled:#D7D8D6;        /* text/disabled */
    --error:#A8000B;                /* rag/error */
    --success:#00847F;              /* rag/success */
    --page:#FFFFFF;                 /* background/default */
  }
  [data-theme="dark"]{
    --field-bg-default:#FFFFFF00;   /* form/background/default (transparent, alpha restored) */
    --field-bg-hover:#212121;       /* form/background/hover */
    --field-border-default:#656565; /* form/border/default */
    --field-border-active:#FFFFFF;  /* form/border/active */
    --field-border-disabled:#404040;/* form/border/disabled */
    --text-default:#FFFFFF;         /* text/default */
    --text-disabled:#767676;        /* text/disabled */
    --error:#DB0011;                /* rag/error */
    --success:#00847F;              /* rag/success */
    --page:#000000;                 /* background/default */
  }

  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text-default);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border-radius:0; cursor:pointer;
    border:1px solid var(--field-border-default); background:transparent; color:var(--text-default);}
  .fields{display:flex; flex-direction:column; gap:26px; max-width:380px;}
  .field label{display:block; font:600 13px/1.3 var(--font); color:var(--text-default); margin-bottom:var(--label-gap);}
  .control{position:relative;}
  .control input{
    width:100%; height:var(--field-h); padding:0 28px 0 2px; font:var(--weight) var(--fs)/var(--field-h) var(--font);
    color:var(--text-default); background:var(--field-bg-default);
    border:0; border-bottom:var(--underline-rest) solid var(--field-border-default); border-radius:0; outline:none;
    transition:background var(--ease), border-color var(--ease);}
  .control input::placeholder{color:var(--text-default); opacity:.5; font-weight:var(--weight-ph);}
  .control input:hover{background:var(--field-bg-hover);}
  /* clicking/typing into the field clears the hover grey (focus overrides hover) */
  .control input:focus{background:var(--field-bg-default);}
  /* AESTHETIC focus (all users): a thick underline grows in from the left
     (motion/easing-standard), in the field's own colour. */
  .control::after{content:""; position:absolute; left:0; bottom:0; height:var(--underline-active); width:100%;
    background:var(--field-border-active); transform:scaleX(0); transform-origin:left;
    transition:transform var(--ease), background var(--ease);}
  .control:has(input:focus)::after{transform:scaleX(1);}
  /* KEYBOARD focus — an additional, prominent accessible ring via :focus-visible
     (outline:none default + outline-offset), suppressed for pointer users so mouse
     interaction keeps the clean underline only. */
  .control input:focus{outline:none;}
  .control input:focus-visible{outline:2px solid var(--field-border-active); outline-offset:2px;}
  :root[data-modality="pointer"] .control input:focus-visible{outline:none;}
  .help{font:400 var(--fs-help)/var(--lh-help) var(--font); color:var(--text-default); opacity:.7; margin:var(--helper-gap) 0 0;}
  .ic{position:absolute; right:2px; top:calc(var(--field-h)/2); transform:translateY(-50%); display:flex; align-items:center;}
  .ic svg{display:block;}

  /* completed: persistent teal stroke (rag/success) + tick icon, legible text */
  .field.is-ok .control input{border-bottom:var(--underline-active) solid var(--success);}
  /* error: persistent rag/error STROKE + alert ICON inline with the text; MESSAGE stays legible */
  .field.is-error .control input{border-bottom:var(--underline-active) solid var(--error);}
  .field.is-error .help{color:var(--text-default); opacity:1;}
  /* disabled: dashed underline (signals non-editable) */
  .field.is-disabled .control input{border-bottom:var(--underline-rest) dashed var(--field-border-disabled); color:var(--text-disabled); cursor:not-allowed;}
  .field.is-disabled label{color:var(--text-disabled);}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">

  <div class="demo-controls">
    <button id="themeToggle" type="button">◐ Toggle theme</button>
    <span>Input field — canonical reference implementation</span>
  </div>

  <div class="fields">
    <div class="field">
      <label for="f1">Email address</label>
      <div class="control"><input id="f1" type="email" placeholder="name@example.com" aria-describedby="h1"></div>
      <p class="help" id="h1">We'll only use this to contact you.</p>
    </div>

    <div class="field is-ok">
      <label for="f2">Email address</label>
      <div class="control"><input id="f2" type="email" value="jordan.lee@hsbc.com" aria-describedby="h2">
        <span class="ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="9" fill="#00847F"/><path d="M7.21594 13.553L3.58594 9.92401L4.85894 8.65001L7.21594 11.008L13.1409 5.08301L14.4139 6.35601L7.21594 13.553Z" fill="white"/></svg></span></div>
      <p class="help" id="h2">Looks good.</p>
    </div>

    <div class="field is-error">
      <label for="f3">Email address</label>
      <div class="control"><input id="f3" type="email" value="not-an-email" aria-invalid="true" aria-describedby="h3"><span class="ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.30911 1.68194L0.109113 15.7999C-0.199887 16.3319 0.184113 16.9999 0.800113 16.9999H17.2001C17.8161 16.9999 18.2001 16.3319 17.8911 15.7999L9.69111 1.68194C9.38311 1.15094 8.61711 1.15094 8.30911 1.68194Z" fill="#A8000B"/><path d="M9.9001 5H8.1001V11H9.9001V5Z" fill="white"/><path d="M9 14.8259C9.69036 14.8259 10.25 14.2663 10.25 13.5759C10.25 12.8856 9.69036 12.3259 9 12.3259C8.30964 12.3259 7.75 12.8856 7.75 13.5759C7.75 14.2663 8.30964 14.8259 9 14.8259Z" fill="white"/></svg></span></div>
      <p class="help" id="h3">Enter a valid email address.</p>
    </div>

    <div class="field is-disabled">
      <label for="f4">Email address</label>
      <div class="control"><input id="f4" type="email" placeholder="name@example.com" disabled aria-describedby="h4"></div>
      <p class="help" id="h4">This field is unavailable.</p>
    </div>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Input fields",
    "vars": {
      "--field-bg-default": "form/background/default",
      "--field-bg-hover": "form/background/hover",
      "--field-border-default": "form/border/default",
      "--field-border-active": "form/border/active",
      "--field-border-disabled": "form/border/disabled",
      "--text-default": "text/default",
      "--text-disabled": "text/disabled",
      "--error": "rag/error",
      "--page": "background/default"
    },
    "contrastPairs": [
      { "fg": "text/default",        "bg": "background/default", "context": "text" },
      { "fg": "form/border/default", "bg": "background/default", "context": "ui" },
      { "fg": "form/border/active",  "bg": "background/default", "context": "ui" },
      { "fg": "rag/error",           "bg": "background/default", "context": "ui" },
      { "fg": "rag/success",         "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["aria-invalid", "aria-describedby"]
  }
  </script>

  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{
      const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark');
    });
    // input-modality detection: show the prominent focus indicator for KEYBOARD users only
    const root=document.documentElement;
    addEventListener('keydown', e=>{ if(e.key==='Tab') root.dataset.modality='keyboard'; });
    addEventListener('mousedown', ()=> root.dataset.modality='pointer');
    addEventListener('touchstart', ()=> root.dataset.modality='pointer', {passive:true});
  </script>
</body>
</html>
