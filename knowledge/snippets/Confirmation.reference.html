     journey gap report, NOT yet design-reviewed — meta carries REVIEW flags). Centred: a success-solid
     glyph (rag/success), a heading, a short message, then the next actions (Button atom, reused). The
     success is carried by the HEADING TEXT, not the green icon alone (1.4.1) — the icon is aria-hidden.
     role="group" + aria-labelledby announces the panel as a unit. Sentence case (house type rule).
     MOTION: the success pops in (spring), then title / message / actions rise in sequence; disabled under
     reduced-motion. ⬛ WHERE THE REPLAY BUTTON LIVES — CORRECTED AT s218-D4, AND NO CONTROL WAS ADDED
     HERE. This sentence used to read "(the Replay button re-runs it)" with no such button anywhere in
     this file, which is how #218's phantom-affordance sweep flagged it. The sweep's premise was the one
     that aged: the button EXISTS and it is not this component's to own. It lives in the showroom's ONE
     BAR (`showroom/confirmation.html`, generated by `knowledge/gen_showroom.py`) — ruled #98-D1, when
     Dave purged demo controls out of all 75 snippet sources so the components would be "pure canonical"
     and Replay was KEPT but MOVED INTO THE BAR. This component is named in the generator's own comment
     as the second recognised motion idiom (ds-029, ruled #103: "Replay = second detection idiom, snippet
     untouched"), and #104 fixed that bar control to restart this file's `svg.success` correctly
     (`getBoundingClientRect`, because `offsetWidth` is HTMLElement-only). So the honest repair is to the
     SENTENCE, not to the markup: adding an in-file Replay would re-introduce the exact demo-control class
     #98-D1 removed and duplicate a ruled control. ⬛ Dave's, if he disagrees: the alternative reading —
     the component owning its own replay affordance — is named in the #218 receipt and is NOT built here.
     LAYOUT: vertically centred in the viewport on mobile
     (≤480px). TODO: a desktop variant (wider / dialog) is still needed — see meta + _COMPONENT-GAPS.md. -->

  .confirm{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; width:100%; margin:0 auto; padding:40px 24px; }   /* #314 TP2 F8/call 15: the column FILLS its container (the page gives the width, s210-D3); the 380 that was here is the showroom's wrap below */

  .confirm__title{ font:400 24px/1.2 var(--font); color:var(--text); margin:0; }
  .confirm__msg{ font:400 16px/1.5 var(--font); color:var(--muted); margin:0; }
  /* THE PENDING KIND (#314 TP2; Dave 14:55 2026-10-02 call 15, verbatim: "We should have an amber pending roundel"):
     the same 56px roundel, filled rag/warning, with the library's time glyph (media/time.svg) drawn as the MARK on top

     black mark, the same policy as .success. The outcome is carried by the HEADING, the glyph is aria-hidden. */
  .confirm .pending{ width:56px; height:56px; }
  .confirm .pending .disc{ fill:var(--pending); }
  /* THE BODY SLOT (#314 TP2; Dave, call 15: "I think I prefer the actions after the summary. Think about how a human
     consumes information, its procedural, tehy read teh information and then make a decision. the natural position is
     below the data"): the page places its parts here - a Summary, a next-steps list - between the message and the
     actions, full width, reading left. The actions follow it, so the decision comes after the data. */
  .confirm__body{ width:100%; text-align:left; margin-top:12px; display:flex; flex-direction:column; gap:24px; }
  .confirm__body:empty{ display:none; }
  .confirm__actions{ display:flex; flex-direction:column; gap:12px; width:100%; margin-top:12px; }
  /* actions = Button atom (reused); full-width so press-only physics (no hover-grow — would overflow) */
  .confirm .btn{ height:44px; min-width:96px; width:100%; padding:0 20px; border:0; border-radius:var(--border-radius-control); cursor:pointer; /* type: t-cm-button + .t-cm-slot (bound in canon/type.css - T-D9/T-D12) */
    --phys-size:120;   /* LOCAL geometry (B-D7) */
    display:inline-flex; align-items:center; justify-content:center; transition:background var(--ease), transform var(--spring), filter var(--press); }
  .confirm .btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  /* #314 TP2 F7: the press physics come from Button's PARTIAL (button-family), not a private brightness(.9);
     the buttons are full-width, so they carry .full and the family's full-width guard holds them still on hover. */
  /* ===== AUTO-PARTIAL press-physics START (button-family) ===== */
/* INJECTED from Button.reference.html (partial "press-physics", group button-family —
   registry knowledge/component-types.json, ADR-0013). DO NOT hand-edit between the
   AUTO-PARTIAL markers: edit the source PARTIAL block in the atom and regenerate:
   python3 knowledge/gen_component_partials.py */
  .confirm .btn:hover{transform:scale(calc(1 + var(--press-travel)/var(--phys-size)));}
  .confirm .btn.full:hover{transform:none;}                                           /* full-width can't grow — would overflow */
  .confirm .btn:active{transform:scale(calc(1 - var(--press-travel)/var(--phys-size))); filter:brightness(var(--press-darken)); transition:transform var(--press), filter var(--press);}
  .confirm .btn:disabled:hover,.confirm .btn.is-disabled:hover{transform:none; filter:none;}   /* disabled stays put */
  /* WCAG 2.3.3 — the partial carries its OWN reduced-motion override (ADR-0013: rides inside, never per-file) */
  @media (prefers-reduced-motion: reduce){
    .confirm .btn:hover,.confirm .btn:active{ transform:none !important; filter:none !important; }
  }
  /* ===== AUTO-PARTIAL press-physics END ===== */
  .confirm .btn.primary{ background:var(--pri); color:var(--on-pri); }
  .confirm .btn.primary:hover{ background:var(--pri-hover); }
  .confirm .btn.ghost{ background:transparent; color:var(--text); }
  .confirm .btn.ghost:hover{ background:var(--ghost-hover); }

  /* mobile: vertically centre the confirmation in the viewport (desktop variant is a TODO — see meta) */
  @media (max-width:480px){ .confirm{ min-height:100dvh; padding:24px; } }

  /* entrance — success pops in (spring), then title / message / actions rise in sequence */
  @keyframes pop{ 0%{ transform:scale(.5); opacity:0; } 60%{ transform:scale(1.06); } 100%{ transform:scale(1); opacity:1; } }
  @keyframes rise{ from{ transform:translateY(10px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .confirm .success{ animation:pop 460ms cubic-bezier(.5,1.6,.4,1) both; }
  .confirm__title{ animation:rise 360ms ease 140ms both; }
  .confirm__msg{ animation:rise 360ms ease 220ms both; }
  .confirm__actions{ animation:rise 360ms ease 300ms both; }
