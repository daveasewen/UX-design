  <script>
    // BEHAVIOUR — ⬛ PROPOSED (s218-D4). THE "MORE OPTIONS" SURFACE.
    // Before #218 this trigger was inert BY INSTRUCTION: a control promising a surface the DOM did
    // not contain, where toggling aria-expanded would have been a lie to AT. Dave ruled the class
    // (build the surfaces), so the surface now exists and the trigger tells the truth about it.
    // The wiring is Card-header-lockup's `wireMenu` (itself Dropdown's open/close/keyboard walk with
    // menu semantics), EXTENDED here rather than re-invented: Escape from the trigger itself,
    // Home/End, and Tab-out-closes are added — an APG menu is a non-modal surface and leaving it
    // must dismiss it. No polling, no network, no external source (the W3 inline-script contract).
    (function(){
      var trig = document.getElementById('hdrMoreTrig');
      var menu = document.getElementById('hdrMoreMenu');
      if (!trig || !menu) return;
      var items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));

      function setOpen(open, focusLast){
        menu.setAttribute('data-open', String(open));
        trig.setAttribute('aria-expanded', String(open));
        if (open && items.length){ (focusLast ? items[items.length - 1] : items[0]).focus(); }
      }
      function close(returnFocus){
        if (menu.getAttribute('data-open') !== 'true' && trig.getAttribute('aria-expanded') !== 'true') return;
        setOpen(false);
        if (returnFocus) trig.focus();
      }

      trig.addEventListener('click', function(){
        setOpen(menu.getAttribute('data-open') !== 'true', false);
      });
      trig.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); setOpen(true, false); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); setOpen(true, true); }
        else if (e.key === 'Escape'){ close(false); }
      });

      items.forEach(function(item, i){
        // A menuitem ACTS and dismisses. There is no selection to persist — that is the whole
        // difference between this panel and the Dropdown whose CSS it wears.
        item.addEventListener('click', function(){ close(true); });
        item.addEventListener('keydown', function(e){
          if (e.key === 'ArrowDown'){ e.preventDefault(); items[(i + 1) % items.length].focus(); }
          else if (e.key === 'ArrowUp'){ e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
          else if (e.key === 'Home'){ e.preventDefault(); items[0].focus(); }
          else if (e.key === 'End'){ e.preventDefault(); items[items.length - 1].focus(); }
          else if (e.key === 'Escape'){ e.preventDefault(); close(true); }
          else if (e.key === 'Tab'){ close(false); }      // non-modal: leaving the menu closes it
        });
      });

      document.addEventListener('click', function(e){
        if (!(e.target.closest && e.target.closest('.hdr-menuwrap'))) close(false);
      });
    })();
  </script>
