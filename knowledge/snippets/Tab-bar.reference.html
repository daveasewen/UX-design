<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab bar — reference candidate (gap-pattern → review)</title>
<!-- CANDIDATE REFERENCE for Tab bar (app-level BOTTOM navigation — NOT the in-page Tabs component;
     surfaced by the journey gap report, NOT yet design-reviewed — meta carries REVIEW flags).
     INTERACTIVE demo: tap a destination to make it current. The current item swaps to the FILLED
     (-active) glyph + text/default + aria-current='page' (icon-source convention; colour is never the
     only signal — 1.4.1). Icons come from a <symbol> sprite + <use> (canon icon approach).
       A) standard full-width bar with labels.
       B) segmented control — icon-only, elevated (elevation/functional), spanning the FULL screen width;
          the SELECTED fill is a PILL that SLIDES between segments (same easing as the toggle / View-options),
          black with the glyph in white (inverts to white/dark in dark mode). The Menu island is part of the
          SAME exclusive group — only one item current at a time, so selecting Menu collapses the pill — and
          its selected state matches the segments with a 4px white (surface) ring. Menu matches the lozenge height. -->
<link rel="stylesheet" href="../canon/type.css">
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-30. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=number],input:not([type]),textarea):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; --slide:200ms cubic-bezier(.4,0,.2,1); }   /* --slide matches the toggle / View-options */
  [data-theme="light"]{ --surface:#FFFFFF; --border:#E1E1E1; --muted:#1A1A1A; --text:#1A1A1A; --sel-bg:#000000; --sel-fg:#FFFFFF; --focus:#305A85; --shadow:#00000033; --page:#FFFFFF; }
  [data-theme="dark"]{ --surface:#1F1F1F; --border:#808080; --muted:#FFFFFF; --text:#FFFFFF; --sel-bg:#FFFFFF; --sel-fg:#333333; --focus:#4587A7; --shadow:#000000D9; --page:#1A1A1A; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .stateLabel{/* type: t-cm-legal (bound in canon/type.css - T-D9/T-D12) */ color:var(--muted); margin:1.75rem 0 .6rem;}

  /* ---- Tab bar (bottom navigation) ---- */
  /* icon swap: line glyph by default, FILLED (-active) glyph when current/open */
  .tabbar__item .ic-fill, .menu-fab .ic-fill{ display:none; }
  .tabbar__item.is-active .ic-line, .menu-fab.is-active .ic-line{ display:none; }
  .tabbar__item.is-active .ic-fill, .menu-fab.is-active .ic-fill{ display:block; }
  .tabbar__item svg, .menu-fab svg{ width:24px; height:24px; fill:currentColor; pointer-events:none; }

  /* A) standard full-width bar with labels */
  .tabbar{ display:flex; max-width:420px; background:var(--surface); border-top:1px solid var(--border); }
  .tabbar .tabbar__item{ flex:1; min-height:56px; padding:8px 0 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    /* type: t-cm-legal + .t-cm-slot (bound in canon/type.css - T-D9/T-D12) */ color:var(--muted); text-decoration:none; cursor:pointer; background:transparent; border:0; transition:color var(--ease); }
  .tabbar .tabbar__item:hover{ color:var(--text); }
  .tabbar .tabbar__item:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }
  .tabbar .tabbar__item.is-active{ color:var(--text); }

  /* B) segmented control (sliding pill) — icon-only, elevated, full-width; the selected fill slides
        between segments on the toggle / View-options easing; Menu is a separate circular island */
  .tabbar-pills{ display:flex; align-items:center; gap:12px; width:100%; max-width:420px; }   /* spans the full (mobile) screen width */
  .seg{ position:relative; flex:1; display:flex; align-items:center; height:56px; padding:4px; background:var(--surface); border:1px solid var(--border); border-radius:999px; box-shadow:0 0 16px var(--shadow); }   /* the lozenge / segmented track */
  .seg .ind{ position:absolute; top:4px; bottom:4px; left:4px; width:0; background:var(--sel-bg); border-radius:999px; z-index:0; transition:left var(--slide), width var(--slide); }   /* SLIDING pill — left+width set by JS from the current segment (same animation as the toggle) */
  .seg__item{ position:relative; z-index:1; flex:1; height:100%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); text-decoration:none; cursor:pointer; transition:color var(--slide); }   /* each segment fills its share of the track; colour transitions on the SAME easing as the slide */
  .seg__item[aria-current="page"]{ color:var(--sel-fg); }   /* glyph turns white as the pill arrives (inverts to dark in dark mode) */
  .seg__item:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:999px; }
  .seg__item svg{ width:24px; height:24px; fill:currentColor; pointer-events:none; }
  .menu-fab{ width:56px; height:56px; flex:none; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted); text-decoration:none; cursor:pointer; background:var(--surface); border:1px solid var(--border); box-shadow:0 0 16px var(--shadow); transition:color var(--slide), background var(--slide), box-shadow var(--slide); }
  .menu-fab:hover{ color:var(--text); }
  .menu-fab:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .menu-fab[aria-current="page"]{ background:var(--sel-bg); color:var(--sel-fg); box-shadow: inset 0 0 0 4px var(--surface), 0 0 16px var(--shadow); }   /* SELECTED — same inverting fill + a 4px white(surface) ring, matching the lozenge surround */

  /* WCAG 2.3.3 — honour reduced-motion (minimal motion here, kept for consistency) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    .seg .ind{ transition:none !important; }
  }
</style>
</head>
<body data-theme="light">

  <div class="stateLabel">A · standard bar with labels — tap to switch</div>
  <nav class="tabbar" data-tabgroup aria-label="Primary">
    <a class="tabbar__item is-active" href="#" aria-current="page"><svg class="ic-line" aria-hidden="true"><use href="#ic-home"/></svg><svg class="ic-fill" aria-hidden="true"><use href="#ic-home-a"/></svg>Home</a>
    <a class="tabbar__item" href="#"><svg class="ic-line" aria-hidden="true"><use href="#ic-cards"/></svg><svg class="ic-fill" aria-hidden="true"><use href="#ic-cards-a"/></svg>Cards</a>
    <a class="tabbar__item" href="#"><svg class="ic-line" aria-hidden="true"><use href="#ic-pay"/></svg><svg class="ic-fill" aria-hidden="true"><use href="#ic-pay-a"/></svg>Payments</a>
    <a class="tabbar__item" href="#"><svg class="ic-line" aria-hidden="true"><use href="#ic-menu"/></svg><svg class="ic-fill" aria-hidden="true"><use href="#ic-menu-a"/></svg>Menu</a>
  </nav>

  <div class="stateLabel">B · segmented control — icon-only, full width; the pill slides between segments — tap to switch</div>
  <div class="tabbar-pills">
    <nav class="seg" aria-label="Primary">
      <span class="ind" aria-hidden="true"></span>
      <a class="seg__item" href="#" aria-current="page" aria-label="Home"><svg aria-hidden="true"><use href="#ic-home"/></svg></a>
      <a class="seg__item" href="#" aria-label="Cards"><svg aria-hidden="true"><use href="#ic-cards"/></svg></a>
      <a class="seg__item" href="#" aria-label="Payments"><svg aria-hidden="true"><use href="#ic-pay"/></svg></a>
      <a class="seg__item" href="#" aria-label="Insights"><svg aria-hidden="true"><use href="#ic-insight"/></svg></a>
    </nav>
    <a class="menu-fab" href="#" aria-label="Menu"><svg aria-hidden="true"><use href="#ic-menu"/></svg></a>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Tab-bar",
    "type": "molecule",
    "vars": { "--surface": "tertiary/background/default", "--border": "border/subtle", "--muted": "text/secondary", "--text": "text/default", "--sel-bg": "secondary/background/default", "--sel-fg": "text/on-inverse", "--focus": "focus/ring", "--shadow": "elevation/functional", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/secondary", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "text/default", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "text/on-inverse", "bg": "secondary/background/default", "context": "ui" }
    ],
    "icons": {
      "#ic-home": "assets/icons/global-controls/home.svg",
      "#ic-home-a": "assets/icons/global-controls/home-active.svg",
      "#ic-cards": "assets/icons/global-controls/card-manage.svg",
      "#ic-cards-a": "assets/icons/global-controls/card-manage-active.svg",
      "#ic-pay": "assets/icons/products-and-services/payments-and-transfers.svg",
      "#ic-pay-a": "assets/icons/products-and-services/payments-and-transfers-active.svg",
      "#ic-insight": "assets/icons/products-and-services/insight.svg",
      "#ic-menu": "assets/icons/global-controls/menu.svg",
      "#ic-menu-a": "assets/icons/global-controls/menu-active.svg"
    },
    "requiredAria": ["aria-current=\"page\"", "aria-label"]
  }
  </script>
  <script>
    
    /* A) standard bar — radio set: tapping a destination makes it current (filled glyph + aria-current) */
    document.querySelectorAll('.tabbar[data-tabgroup]').forEach(group=>{
      group.addEventListener('click', e=>{
        const item = e.target.closest('.tabbar__item'); if(!item) return; e.preventDefault();
        group.querySelectorAll('.tabbar__item').forEach(a=>{ a.classList.remove('is-active'); a.removeAttribute('aria-current'); });
        item.classList.add('is-active'); item.setAttribute('aria-current','page');
      });
    });
    /* B) segmented control + Menu fab = ONE exclusive group — only one current at a time; the pill slides
       between island segments and collapses when Menu (outside the lozenge) is current */
    document.querySelectorAll('.tabbar-pills').forEach(group=>{
      const seg = group.querySelector('.seg'), ind = seg ? seg.querySelector('.ind') : null;
      const items = [...group.querySelectorAll('.seg__item, .menu-fab')];
      function moveInd(){ if(!ind||!seg) return; const a = seg.querySelector('.seg__item[aria-current="page"]');
        if(a){ ind.style.left=a.offsetLeft+'px'; ind.style.width=a.offsetWidth+'px'; } else { ind.style.width='0px'; } }
      items.forEach(it=> it.addEventListener('click', e=>{ e.preventDefault();
        items.forEach(x=>x.removeAttribute('aria-current')); it.setAttribute('aria-current','page'); moveInd(); }));
      addEventListener('resize', moveInd); moveInd();
    });
  </script>
</body>
