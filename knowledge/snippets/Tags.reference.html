<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for Tags (gated). SQUARE chips — Tags are NOT an angular-rule exemption
  (only Badge + Avatar are), so border-radius:0. Outlined (form/border/default) on a transparent
  fill — avoids the deprecated non-interactive surface tokens the meta still binds (rebind noted).
  Variants: static, dismissible (× is a real focusable button), and link.

  EM-BASED (promoted 2026-06-24): height/padding/gap/× all track the label font-size, so the chip
  scales with type. INTERACTIONS (promoted 2026-06-24 from _fitness-test/tags-chip-animation.html):
  tag-link press physics (hover scale 1.05 / press .97, echoes Button); tactile dismiss × (hover 1.4
  / press 1.15); V1 collapse+fade dismiss (neighbours reflow). Static keyword tags get NO motion.
  STATES: default + hover/pressed (combined) + focus — Tags has no selected/checked/disabled by
  design, so the meta declares "stateModel":"simple" (rubric Decision C). RESPONSIVE (Dim 11): the
  applied-filters bar reflows via container-query → full-width rows + label ellipsis at <=360px (320px).
  Close × = the real library close glyph (global-controls/close.svg) via a <symbol> sprite — not invented.
-->
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:220ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{ --border:#767676; --text:#333333; --icon:#333333; --hover:#F3F3F3; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --border:#656565; --text:#FFFFFF; --icon:#FFFFFF; --hover:#212121; --focus:#4587A7; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px; flex-wrap:wrap;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .demo-controls label{display:flex; gap:.5rem; align-items:center;}
  .demo-controls input[type=range]{accent-color:var(--text);}
  h2{font-size:12px; letter-spacing:.04em; text-transform:uppercase; opacity:.55; margin:1.5rem 0 .8rem;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  /* em-based chip — every dimension tracks the label font-size (scales with type) */
  .tag{display:inline-flex; align-items:center; gap:.46em; height:2.15em; padding:0 .77em; border:1px solid var(--border); border-radius:0; /* SQUARE */
    background:transparent; color:var(--text); font:400 13px/1 var(--font); max-width:100%; white-space:nowrap; overflow:hidden;
    transition:max-width var(--ease), opacity var(--ease), margin var(--ease), padding var(--ease), border-width var(--ease), background 140ms ease, transform 150ms cubic-bezier(.4,0,.2,1);}
  .tag .lbl{overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .tag.link{cursor:pointer; text-decoration:none;}
  .tag.link:hover{background:var(--hover); transform:scale(1.05);}                          /* attract — echoes the button */
  .tag.link:active{background:var(--hover); transform:scale(.97); transition:transform 90ms ease-out;}  /* pressed == hover (combined state) */
  .tag.link:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .tag .x{position:relative; display:inline-flex; font-size:inherit; width:1.54em; height:1.54em; padding:0; border:0; background:transparent; color:var(--icon); cursor:pointer; align-items:center; justify-content:center; flex:0 0 auto;
    transition:transform 130ms cubic-bezier(.4,0,.2,1), color 140ms ease;}
  /* WCAG 2.5.8 — 24×24 hit target without changing the visible glyph */
  .tag .x::before{content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:24px; height:24px;}
  .tag .x svg{width:.85em; height:.85em; fill:currentColor;}
  .tag .x:hover{color:var(--text); transform:scale(1.4);}                                    /* tactile cross — grows past rest */
  .tag .x:active{transform:scale(1.15); transition:transform 90ms ease-out;}                 /* pressed from the grown size */
  .tag .x:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  /* V1 dismiss — collapse + fade so neighbours reflow smoothly */
  .tag.removing{max-width:0 !important; opacity:0; margin-right:0 !important; padding-left:0; padding-right:0; border-width:0; transform:scale(.95);}

  /* RESPONSIVE applied-filters bar */
  .filterbar{ width:var(--demo-width, 560px); max-width:100%; container-type:inline-size; border:1px solid var(--border); padding:12px; }
  .filterbar .row{ gap:0; }                                  /* chips carry margin so the dismiss collapse is smooth */
  .filterbar .tag{ margin:0 8px 8px 0; }
  @container (max-width: 360px){
    .filterbar .row{ flex-direction:column; align-items:stretch; }
    .filterbar .tag{ width:100%; height:auto; min-height:2.4em; justify-content:space-between; margin:0 0 8px 0; }   /* full-width applied filters */
  }

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    .tag:hover,.tag:active,.tag .x:hover,.tag .x:active{ transform:none !important; }
  }
</style>
</head>
<body data-theme="light">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ic-close" viewBox="0 0 18 18"><path fill-rule="evenodd" clip-rule="evenodd" d="M16.5 2.35668L15.6433 1.5L9 8.14332L2.35668 1.5L1.5 2.35668L8.14332 9L1.5 15.6433L2.35668 16.5L9 9.85668L15.6433 16.5L16.5 15.6433L9.85668 9L16.5 2.35668Z"/></symbol></svg>

  <div class="demo-controls">
    <button id="themeToggle" type="button">◐ Toggle theme</button>
    <label>Filter-bar width <input id="w" type="range" min="300" max="600" value="560"> <span id="wv">560</span>px</label>
    <span>Tags — canonical reference (square)</span>
  </div>

  <h2>Static</h2>
  <div class="row"><span class="tag"><span class="lbl">Savings</span></span><span class="tag"><span class="lbl">Direct debit</span></span><span class="tag"><span class="lbl">Joint account</span></span></div>

  <h2>Link (hover / pressed)</h2>
  <div class="row"><a class="tag link" href="#"><span class="lbl">#travel</span></a><a class="tag link" href="#"><span class="lbl">#mortgage</span></a></div>

  <h2>Scales with label size (em-based)</h2>
  <div class="row" style="align-items:flex-end; gap:18px;">
    <a class="tag link" style="font-size:13px" href="#"><span class="lbl">Small</span></a>
    <a class="tag link" style="font-size:16px" href="#"><span class="lbl">Medium</span></a>
    <a class="tag link" style="font-size:20px" href="#"><span class="lbl">Large</span></a>
  </div>

  <h2>Dismissible — applied filters (responsive)</h2>
  <div class="filterbar" id="filterbar">
    <div class="row">
      <span class="tag"><span class="lbl">GBP</span><button class="x" aria-label="Remove filter: GBP"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-close"/></svg></button></span>
      <span class="tag"><span class="lbl">Last 30 days</span><button class="x" aria-label="Remove filter: Last 30 days"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-close"/></svg></button></span>
      <span class="tag"><span class="lbl" title="Standing orders to overseas payees">Standing orders to overseas payees</span><button class="x" aria-label="Remove filter: Standing orders to overseas payees"><svg viewBox="0 0 18 18" aria-hidden="true"><use href="#ic-close"/></svg></button></span>
    </div>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Tags",
    "vars": { "--focus": "focus/ring", "--border": "form/border/default", "--text": "text/default", "--icon": "icon/default", "--hover": "form/background/hover", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "form/border/default", "bg": "background/default", "context": "ui" }
    ],
    "icons": { "close": "global-controls/close.svg" },
    "requiredAria": ["aria-label", "<a ", "href"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });
    const w=document.getElementById('w'), wv=document.getElementById('wv'), fb=document.getElementById('filterbar');
    w.addEventListener('input', ()=>{ fb.style.setProperty('--demo-width', w.value+'px'); wv.textContent=w.value; });
    // V1 collapse + fade dismiss: pin current width, collapse to 0, remove after the transition
    document.querySelectorAll('.tag .x').forEach(x=> x.addEventListener('click', ()=>{
      const c=x.closest('.tag'); c.style.maxWidth=c.offsetWidth+'px';
      requestAnimationFrame(()=> c.classList.add('removing'));
      c.addEventListener('transitionend', ev=>{ if(ev.propertyName==='max-width') c.remove(); }, {once:true});
    }));
  </script>
</body>
</html>
