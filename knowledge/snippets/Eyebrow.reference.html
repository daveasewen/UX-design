<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyebrow — reference candidate (gap-pattern → review)</title>
<!-- CANDIDATE REFERENCE for Eyebrow (surfaced by the journey gap report; NOT yet design-reviewed —
     meta carries REVIEW flags). A small kicker label that sits above a section heading to categorise it
     (e.g. "Payments", "Recent activity"). text/secondary, 13px / 500, SENTENCE CASE (house type rule —
     never uppercase; size/weight/colour carry the distinction). Decorative & supplementary — the heading
     carries the real hierarchy, so the eyebrow is a <span> (NOT a heading) to avoid breaking heading
     order (1.3.1). Leading-trim ON so the cap-height sits tight above the heading with no magic-number margin. -->
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-30. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{ --muted:#545454; --text:#333333; --page:#FFFFFF; }
  [data-theme="dark"]{ --muted:#9B9B9B; --text:#FFFFFF; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--muted); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
  .stateLabel{font:400 11px/1 var(--font); color:var(--muted); margin:1.75rem 0 .5rem;}

  /* ---- Eyebrow ---- */
  .eyebrow{ display:inline-block; font:500 13px/1 var(--font); color:var(--muted); }   /* SENTENCE CASE — house type rule; no text-transform, no uppercase tracking */

  /* WCAG 2.3.3 — honour reduced-motion (no motion here, kept for consistency across snippets) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Eyebrow — canonical reference</span></div>

  <div class="stateLabel">default · standalone kicker</div>
  <span class="eyebrow">Payments</span>

  <div class="stateLabel">in context · kicker above a section heading</div>
  <span class="eyebrow">Recent activity</span>
  <div style="color:var(--text); font:400 24px/1.2 var(--font); margin-top:8px;">June transactions</div>
  <div style="color:var(--muted); font:400 15px/1.5 var(--font); margin-top:4px; max-width:440px;">Leading-trim keeps the kicker’s cap-height sitting tight above the heading — no magic-number margin.</div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Eyebrow",
    "type": "atom",
    "vars": { "--muted": "text/secondary", "--text": "text/default", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/secondary", "bg": "background/default", "context": "text" },
      { "fg": "text/default", "bg": "background/default", "context": "text" }
    ],
    "requiredAria": []
  }
  </script>
  <script>document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });</script>
</body>
</html>
