<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress tracker — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for Progress tracker (gated). Promoted 2026-06-22 (Dave) — corrects the visual from
  a dots-and-connectors stepper to the SEGMENTED TRACK the source actually defines (Figma file
  mI8hvIkV98nquoqWzKh5Kn, node 267:10760) + a "Step X of Y" label + optional title.
  Completed segments = progress/complete (brand red), remaining = progress/incomplete. Flexible width.

  STRUCTURAL CALL (passive, like Table + Status-indicator): a progress tracker is a STATUS DISPLAY, not a
  navigation control — meta says "shows how far through… label the current step." So it's interactive:false
  and earns AT the PASSIVE way: role="progressbar" + aria-valuenow/min/max + aria-valuetext + an aria-live
  "Step X of Y" announcement + an accessible name. A real Back/Next control drives it (carrying the
  interactive hover/active/focus/disabled states honestly — same approach Status-indicator used).
  Colour is never the only cue — the "Step X of Y" text carries the meaning (1.4.1). Tokens resolved
  light+dark from the validated progress/* + tertiary/* + text/* groups. SQUARE segments (brand angular).
-->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif;
    --ease:220ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{
    --complete:#DB0011; --incomplete:#EDEDED; --text:#333333; --muted:#545454; --page:#FFFFFF;
    --btn-border:#000000; --btn-hover:#F3F3F3; --btn-dis-text:#D7D8D6; --btn-dis-border:#D7D8D6; --focus:#305A85;
  }
  [data-theme="dark"]{
    --complete:#DB0011; --incomplete:#404040; --text:#FFFFFF; --muted:#9B9B9B; --page:#000000;
    --btn-border:#767676; --btn-hover:#212121; --btn-dis-text:#767676; --btn-dis-border:#333333; --focus:#4587A7;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:2rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; font-size:13px;}
  .demo-controls > button{font:inherit; font-size:13px; padding:8px 14px; border-radius:0; cursor:pointer;
    border:1px solid var(--btn-border); background:transparent; color:var(--text);}
  .demo-controls > button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .demo-controls label{display:flex; gap:.5rem; align-items:center;} .demo-controls input[type=range]{accent-color:var(--focus);}

  .pt{ width:var(--demo-width, 520px); max-width:100%; container-type:inline-size; }
  .pt .count{font:500 13px/1.3 var(--font); color:var(--muted); margin:0 0 4px;}
  .pt .title{font:500 20px/1.3 var(--font); color:var(--text); margin:0 0 14px;}

  /* segmented track — flexible width; completed segments fill red up to the current step */
  .track{display:flex; gap:4px; width:100%;}
  .track .seg{flex:1; height:6px; border-radius:0; background:var(--incomplete); transition:background var(--ease);}
  .track .seg.done{background:var(--complete);}

  .nav{display:flex; gap:10px; margin-top:18px;}
  .nav button{font:500 15px/1 var(--font); padding:11px 18px; border-radius:0; cursor:pointer;
    border:1px solid var(--btn-border); background:transparent; color:var(--text);
    transition:background var(--ease), border-color var(--ease);}
  .nav button:hover{background:var(--btn-hover);}
  .nav button:active{transform:translateY(1px);}
  .nav button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .nav button:disabled{color:var(--btn-dis-text); border-color:var(--btn-dis-border); cursor:not-allowed; background:transparent;}

  /* responsive — stack the nav buttons full-width on a narrow container */
  @container (max-width: 380px){
    .nav{flex-direction:column;} .nav button{width:100%;}
    .pt .title{font-size:18px;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls">
    <button id="themeToggle" type="button">◐ Toggle theme</button>
    <label>Container width <input id="w" type="range" min="300" max="640" value="520"> <span id="wv">520</span>px</label>
  </div>

  <div class="pt" id="pt">
    <p class="count" id="ptCount" aria-live="polite">Step 3 of 4</p>
    <h2 class="title" id="ptTitle">Review your payment</h2>
    <div class="track" id="track" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3"
         aria-valuetext="Step 3 of 4" aria-labelledby="ptTitle">
      <span class="seg done"></span><span class="seg done"></span><span class="seg done"></span><span class="seg"></span>
    </div>
    <div class="nav">
      <button id="back" type="button">◂ Back</button>
      <button id="next" type="button">Next ▸</button>
    </div>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Progress tracker",
    "vars": {
      "--complete": "progress/complete", "--incomplete": "progress/incomplete",
      "--text": "text/default", "--muted": "text/secondary", "--page": "background/default",
      "--btn-border": "tertiary/border/default", "--btn-hover": "tertiary/background/hover",
      "--btn-dis-text": "text/disabled", "--btn-dis-border": "tertiary/border/disabled", "--focus": "focus/ring"
    },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "progress/complete", "bg": "background/default", "context": "ui" }
    ],
    "knownFindings": [
      "Visual corrected: SEGMENTED TRACK (per Figma node 267:10760), not the dots/connectors the prior canon snippet used.",
      "PASSIVE (interactive:false) status display — AT via role=progressbar + aria-valuenow/min/max + aria-valuetext + aria-live 'Step X of Y'; a real Back/Next control drives it (honest hover/active/focus/disabled). No clickable-step navigation bolted on.",
      "Colour is not the only cue: the 'Step X of Y' label carries progress (1.4.1). progress/incomplete is decorative (not declared as a contrast pair)."
    ],
    "requiredAria": ["role=\"progressbar\"", "aria-valuenow", "aria-valuetext", "aria-live"]
  }
  </script>

  <script>
    document.getElementById('themeToggle').addEventListener('click', () => {
      const b = document.body; b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    const w = document.getElementById('w'), wv = document.getElementById('wv'), pt = document.getElementById('pt');
    w.addEventListener('input', () => { pt.style.setProperty('--demo-width', w.value + 'px'); wv.textContent = w.value; });

    // passive progressbar driven by a real Back/Next control (states + behaviour live here, honestly)
    const TOTAL = 4; let current = 3;
    const track = document.getElementById('track'), segs = Array.from(track.querySelectorAll('.seg'));
    const count = document.getElementById('ptCount'), back = document.getElementById('back'), next = document.getElementById('next');
    function render(){
      segs.forEach((s, i) => s.classList.toggle('done', i < current));   // segments 1..current fill red
      track.setAttribute('aria-valuenow', current);
      track.setAttribute('aria-valuetext', `Step ${current} of ${TOTAL}`);
      count.textContent = `Step ${current} of ${TOTAL}`;                  // aria-live announces the change
      back.disabled = current <= 1; next.disabled = current >= TOTAL;
    }
    back.addEventListener('click', () => { if (current > 1) { current--; render(); } });
    next.addEventListener('click', () => { if (current < TOTAL) { current++; render(); } });
    render();
  </script>
</body>
</html>
