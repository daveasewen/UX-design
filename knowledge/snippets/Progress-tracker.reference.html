<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress tracker — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Progress tracker (gated). Segmented track: completed = progress/complete
     (brand red), remaining = progress/incomplete. Current step marked with aria-current; progress is
     also conveyed by labels + position, not colour alone (1.4.1). progress/* dark reconciled 2026-06-20
     (was flat-white, indistinguishable). -->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{ --complete:#DB0011; --incomplete:#EDEDED; --text:#333333; --on-complete:#FFFFFF; --page:#FFFFFF; }
  [data-theme="dark"]{ --complete:#DB0011; --incomplete:#404040; --text:#FFFFFF; --on-complete:#FFFFFF; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:2.25rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--incomplete); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
  ol.steps{list-style:none; display:flex; margin:0; padding:0; max-width:560px;}
  ol.steps li{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; font:400 13px/1.3 var(--font); text-align:center;}
  ol.steps li::before{content:""; position:absolute; top:13px; left:-50%; width:100%; height:3px; background:var(--incomplete);}
  ol.steps li:first-child::before{display:none;}
  ol.steps li.done::before, ol.steps li.current::before{background:var(--complete);}
  .dot{width:28px; height:28px; border-radius:50%; background:var(--incomplete); color:var(--text); display:inline-flex; align-items:center; justify-content:center; font-weight:600; z-index:1;}
  li.done .dot{background:var(--complete); color:var(--on-complete);}
  li.current .dot{background:var(--page); color:var(--complete); box-shadow:inset 0 0 0 3px var(--complete);}
  .step-label{opacity:.85;} li.current .step-label{font-weight:600; opacity:1;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Progress tracker — canonical reference</span></div>

  <ol class="steps">
    <li class="done"><span class="dot" aria-hidden="true">✓</span><span class="step-label">Details</span></li>
    <li class="done"><span class="dot" aria-hidden="true">✓</span><span class="step-label">Amount</span></li>
    <li class="current" aria-current="step"><span class="dot" aria-hidden="true">3</span><span class="step-label">Review</span></li>
    <li><span class="dot" aria-hidden="true">4</span><span class="step-label">Confirm</span></li>
  </ol>

  <script type="application/json" id="token-manifest">
  {
    "component": "Progress tracker",
    "vars": { "--complete": "progress/complete", "--incomplete": "progress/incomplete", "--text": "text/default", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "progress/complete", "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["aria-current"]
  }
  </script>
  <script>document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });</script>
</body>
</html>
