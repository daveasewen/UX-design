<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modals — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Modals (gated). Dimming overlay + dialog surface with mode-aware elevation
     (shadow light / outline dark), title, body, primary + secondary CTAs, close icon. role=dialog,
     aria-modal, aria-labelledby; Esc closes; focus moves into the dialog. -->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:160ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{ --surface:#FFFFFF; --elev-bd:#FFFFFF00; --shadow:#00000033; --overlay:#00000080; --text:#333333; --icon:#333333; --pri:#DB0011; --on-pri:#FFFFFF; --sec-bd:#767676; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --surface:#1D1D1D; --elev-bd:#767676; --shadow:#000000D9; --overlay:#00000080; --text:#FFFFFF; --icon:#FFFFFF; --pri:#DB0011; --on-pri:#FFFFFF; --sec-bd:#656565; --focus:#4587A7; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.5rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--sec-bd); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .bg-content{opacity:.85; max-width:60ch; line-height:1.6;}
  .overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; padding:24px;}
  .overlay[hidden]{display:none;}
  .dialog{width:100%; max-width:440px; background:var(--surface); border:1px solid var(--elev-bd); box-shadow:0 0 24px var(--shadow); padding:24px; position:relative;}
  .dialog h2{margin:0 0 10px; font:400 22px/1.2 var(--font);}
  .dialog p{margin:0 0 22px; font:300 16px/1.5 var(--font);}
  .dialog .close{position:absolute; top:14px; right:14px; width:32px; height:32px; border:0; background:transparent; color:var(--icon); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .dialog .close svg{width:14px; height:14px; stroke:currentColor; stroke-width:2; fill:none;}
  .dialog .close:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .actions{display:flex; gap:12px; justify-content:flex-end;}
  .btn{height:44px; padding:0 20px; border:0; font:500 16px/1 var(--font); cursor:pointer;}
  .btn.primary{background:var(--pri); color:var(--on-pri);}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--sec-bd);}
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><button id="open" type="button">Open dialog</button><span>Modals — canonical reference</span></div>
  <p class="bg-content">Page content sits behind the modal. When the dialog opens, this is dimmed by the overlay and made inert; focus moves into the dialog and Escape closes it.</p>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle">
      <button class="close" id="close" aria-label="Close dialog"><svg viewBox="0 0 14 14"><path d="M1 1 L13 13 M13 1 L1 13"/></svg></button>
      <h2 id="dtitle">Confirm transfer</h2>
      <p>You're about to send £250.00 to Jordan Lee. This can't be undone once confirmed.</p>
      <div class="actions"><button class="btn secondary" id="cancel">Cancel</button><button class="btn primary">Confirm</button></div>
    </div>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Modals",
    "vars": { "--surface": "tertiary/background/default", "--elev-bd": "elevation/border", "--shadow": "elevation/functional", "--overlay": "overlay/version1", "--text": "text/default", "--icon": "icon/default", "--pri": "primary/background/default", "--on-pri": "text/reverse", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "text/reverse", "bg": "primary/background/default", "context": "text" }
    ],
    "requiredAria": ["role=\"dialog\"", "aria-modal", "aria-labelledby"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });
    const ov=document.getElementById('overlay'), op=document.getElementById('open');
    function open(){ ov.hidden=false; document.getElementById('cancel').focus(); }
    function close(){ ov.hidden=true; op.focus(); }
    op.addEventListener('click', open); document.getElementById('close').addEventListener('click', close); document.getElementById('cancel').addEventListener('click', close);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !ov.hidden) close(); });
    ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  </script>
</body>
</html>
