<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Accordion (gated). Disclosure: button header (title + rotating chevron) +
     collapsible panel. aria-expanded/aria-controls; top rule border/subtle; hover tertiary/background/hover. -->
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:200ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{ --rule:#E1E1E1; --text:#1A1A1A; --icon:#1A1A1A; --hover:#F0F0F0; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --rule:#808080; --text:#FFFFFF; --icon:#FFFFFF; --hover:#232323; --focus:#4587A7; --page:#1A1A1A; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .acc{max-width:560px;}
  .acc .item{border-top:1px solid var(--rule);}
  .acc .item:last-child{border-bottom:1px solid var(--rule);}
  .acc .head{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:56px; padding:12px 4px; border:0; background:transparent; color:var(--text); cursor:pointer; font:500 16px/1.3 var(--font); text-align:left;}
  .acc .head:hover{background:var(--hover);}
  .acc .head:focus-visible{outline:2px solid var(--focus); outline-offset:-2px;}
  .acc .chev{flex:none; transition:transform var(--ease);}
  .acc .head[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .acc .chev svg{width:16px; height:16px; fill:var(--icon);}
  .acc .panel{overflow:hidden; max-height:0; transition:max-height var(--ease);}
  .acc .panel .inner{padding:0 4px 16px; font:400 16px/1.5 var(--font); opacity:var(--alpha-84); max-width:52ch;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  
  <div class="acc">
    <div class="item">
      <button class="head" aria-expanded="true" aria-controls="p1"><span>How do I set up a standing order?</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17 4.15198L9 12.15L1 4.15198V5.84798L9 13.848L17 5.84798V4.15198Z"/></svg></span></button>
      <div class="panel" id="p1" style="max-height:200px"><div class="inner">Go to Payments → Standing orders → New, choose the payee and amount, and set the frequency and start date.</div></div>
    </div>
    <div class="item">
      <button class="head" aria-expanded="false" aria-controls="p2"><span>What are the transfer limits?</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17 4.15198L9 12.15L1 4.15198V5.84798L9 13.848L17 5.84798V4.15198Z"/></svg></span></button>
      <div class="panel" id="p2"><div class="inner">Daily limits depend on your account type and verification status. See Settings → Limits for your current allowances.</div></div>
    </div>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Accordion",
    "vars": { "--rule": "border/subtle", "--text": "text/default", "--icon": "icon/default", "--hover": "tertiary/background/hover", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "icon/default", "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["aria-expanded", "aria-controls"]
  }
  </script>
  <script>
    
    document.querySelectorAll('.acc .head').forEach(h=> h.addEventListener('click', ()=>{ const open=h.getAttribute('aria-expanded')==='true'; h.setAttribute('aria-expanded', String(!open));
      const p=document.getElementById(h.getAttribute('aria-controls')); p.style.maxHeight = open ? '0' : p.firstElementChild.scrollHeight+30+'px'; }));
  </script>
</body>
</html>
