<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Pagination (gated). Prev/next chevrons + page-number links; the current
     page is marked with aria-current AND a border (tertiary/border/default), not colour alone (1.4.1).
     INTERACTION STATES borrowed from Button (2026-06-29): hover tint + a button PRESS — inverting fill
     (tertiary/background/pressed + text/reverse) and a snappy scale depress. nav landmark; ≥44px targets. -->
<link rel="stylesheet" href="../canon/type.css">
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease;
    --press:90ms cubic-bezier(0,0,.58,1); }   /* motion/duration/press + motion/easing/out — from Button */
  [data-theme="light"]{ --text:#1A1A1A; --disabled:#E1E1E1; --icon:#1A1A1A; --current-bd:#000000; --hover:#F0F0F0; --pressed:#626262; --on-pressed:#FFFFFF; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --text:#FFFFFF; --disabled:#808080; --icon:#FFFFFF; --current-bd:#808080; --hover:#232323; --pressed:#1A1A1A; --on-pressed:#FFFFFF; --focus:#4587A7; --page:#1A1A1A; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  nav.pg ul{list-style:none; display:flex; gap:4px; align-items:center; margin:0; padding:0;}
  .pg a, .pg .ctrl{min-width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; padding:0 8px;
    /* type: t-cm-label + .t-cm-slot (bound in canon/type.css - T-D9/T-D12) */ color:var(--text); text-decoration:none; cursor:pointer; border:1px solid transparent; background:transparent;
    transition:background var(--ease), color var(--ease), transform var(--press);}
  .pg a:hover, .pg .ctrl:not([disabled]):hover{background:var(--hover);}
  /* button PRESS state (from Button): inverting fill + snappy depress */
  .pg a:active, .pg .ctrl:not([disabled]):active{background:var(--pressed); color:var(--on-pressed); transform:scale(.94);}
  .pg a:focus-visible, .pg .ctrl:focus-visible{outline:2px solid var(--focus); outline-offset:-2px;}
  .pg [aria-current="page"]{border-color:var(--current-bd); font-weight:500;}
  .pg .ctrl[disabled]{color:var(--disabled); cursor:not-allowed;}
  .pg svg{width:16px; height:16px; fill:currentColor;}
  .ellipsis{min-width:24px; text-align:center; opacity:.6;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    .pg a:active, .pg .ctrl:active{ transform:none !important; }   /* colour press remains; no scale */
  }
</style>
</head>
<body data-theme="light">
  
  <nav class="pg" aria-label="Pagination">
    <ul>
      <li><button class="ctrl" aria-label="Previous page"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.8483 17L5.85034 9L13.8483 1H12.1523L4.15234 9L12.1523 17H13.8483Z"/></svg></button></li>
      <li><a href="#">1</a></li>
      <li><a href="#" aria-current="page" aria-label="Page 2, current page">2</a></li>
      <li><a href="#">3</a></li>
      <li><a href="#">4</a></li>
      <li><span class="ellipsis" aria-hidden="true">…</span></li>
      <li><a href="#">12</a></li>
      <li><button class="ctrl" aria-label="Next page"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.15234 17L12.1503 9L4.15234 1H5.84834L13.8483 9L5.84834 17H4.15234Z"/></svg></button></li>
    </ul>
  </nav>

  <script type="application/json" id="token-manifest">
  {
    "component": "Pagination",
    "vars": { "--text": "text/default", "--disabled": "text/disabled", "--icon": "icon/default", "--current-bd": "tertiary/border/default", "--hover": "form/background/hover", "--pressed": "tertiary/background/pressed", "--on-pressed": "text/reverse", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "tertiary/border/default", "bg": "background/default", "context": "ui" },
      { "fg": "icon/default", "bg": "background/default", "context": "ui" },
      { "fg": "text/reverse", "bg": "tertiary/background/pressed", "context": "text" }
    ],
    "requiredAria": ["<nav", "aria-current", "aria-label"]
  }
  </script>
  </body>
</html>
