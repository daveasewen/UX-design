<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reorder — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Reorder (gated). Grab handle (icon/default, hover tertiary/background/hover) —
     pointer DRAG live-reorders the list (the grabbed row lifts; rows shuffle as you move). Drag is NOT the
     only way (2.5.7): each row also has keyboard Move up / Move down buttons. aria-labels name the controls. -->
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{ --surface:#FFFFFF; --hover:#F3F3F3; --text:#333333; --icon:#333333; --drop:#00847F; --divider:#D7D8D6; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --surface:#1D1D1D; --hover:#212121; --text:#FFFFFF; --icon:#FFFFFF; --drop:#00847F; --divider:#707070; --focus:#4587A7; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--icon); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  ul.reorder{list-style:none; margin:0; padding:0; max-width:420px; background:var(--surface); border:1px solid var(--divider);}
  ul.reorder li{display:flex; align-items:center; gap:12px; min-height:52px; padding:0 12px; background:var(--surface);}
  ul.reorder li + li{border-top:1px solid var(--divider);}
  ul.reorder li.dragging{ box-shadow:0 6px 18px rgba(0,0,0,.20); background:var(--hover); position:relative; z-index:2; } /* the grabbed row lifts */
  .handle{flex:none; width:32px; height:32px; border:0; background:transparent; color:var(--icon); cursor:grab; touch-action:none; display:inline-flex; align-items:center; justify-content:center;}
  .handle:active{cursor:grabbing;}
  .handle:hover{background:var(--hover);} .handle svg{width:18px; height:18px; fill:currentColor;}
  .handle:focus-visible{outline:2px solid var(--focus); outline-offset:-2px;}
  .name{flex:1; font:500 16px/1.3 var(--font);}
  .moves{display:flex; gap:4px;}
  .moves button{width:30px; height:30px; border:0; background:transparent; color:var(--icon); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .moves button:hover{background:var(--hover);} .moves button svg{width:14px; height:14px; fill:currentColor;}
  .moves button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Reorder — canonical reference (drag the handle, or use Move up/down)</span></div>

  <ul class="reorder" id="list">
    <li><button class="handle" aria-label="Drag to reorder Checking"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M0.00390625 4.79998H18.0039V3.59998H0.00390625V4.79998Z"/>
<path d="M18.0039 8.00017H0.00390625V6.80017H18.0039V8.00017Z"/>
<path d="M0.00390625 11.1999H18.0039V9.99988H0.00390625V11.1999Z"/>
<path d="M0.00390625 14.4001H18.0039V13.2001H0.00390625V14.4001Z"/></svg></button><span class="name">Checking</span><span class="moves"><button aria-label="Move Checking up"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M1 13.848L9 5.84998L17 13.848V12.152L9 4.15198L1 12.152V13.848Z"/></svg></button><button aria-label="Move Checking down"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17 4.15198L9 12.15L1 4.15198V5.84798L9 13.848L17 5.84798V4.15198Z"/></svg></button></span></li>
    <li><button class="handle" aria-label="Drag to reorder Savings"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M0.00390625 4.79998H18.0039V3.59998H0.00390625V4.79998Z"/>
<path d="M18.0039 8.00017H0.00390625V6.80017H18.0039V8.00017Z"/>
<path d="M0.00390625 11.1999H18.0039V9.99988H0.00390625V11.1999Z"/>
<path d="M0.00390625 14.4001H18.0039V13.2001H0.00390625V14.4001Z"/></svg></button><span class="name">Savings</span><span class="moves"><button aria-label="Move Savings up"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M1 13.848L9 5.84998L17 13.848V12.152L9 4.15198L1 12.152V13.848Z"/></svg></button><button aria-label="Move Savings down"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17 4.15198L9 12.15L1 4.15198V5.84798L9 13.848L17 5.84798V4.15198Z"/></svg></button></span></li>
    <li><button class="handle" aria-label="Drag to reorder ISA"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M0.00390625 4.79998H18.0039V3.59998H0.00390625V4.79998Z"/>
<path d="M18.0039 8.00017H0.00390625V6.80017H18.0039V8.00017Z"/>
<path d="M0.00390625 11.1999H18.0039V9.99988H0.00390625V11.1999Z"/>
<path d="M0.00390625 14.4001H18.0039V13.2001H0.00390625V14.4001Z"/></svg></button><span class="name">ISA</span><span class="moves"><button aria-label="Move ISA up"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M1 13.848L9 5.84998L17 13.848V12.152L9 4.15198L1 12.152V13.848Z"/></svg></button><button aria-label="Move ISA down"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17 4.15198L9 12.15L1 4.15198V5.84798L9 13.848L17 5.84798V4.15198Z"/></svg></button></span></li>
  </ul>

  <script type="application/json" id="token-manifest">
  {
    "component": "Reorder",
    "vars": { "--surface": "tertiary/background/default", "--hover": "tertiary/background/hover", "--text": "text/default", "--icon": "icon/default", "--drop": "rag/success", "--divider": "divider/border/section", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "icon/default", "bg": "tertiary/background/default", "context": "ui" },
      { "fg": "rag/success", "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["aria-label"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });

    const list=document.getElementById('list');

    /* keyboard reorder — Move up / down buttons (drag is not the only way, 2.5.7) */
    list.querySelectorAll('.moves button').forEach(btn=> btn.addEventListener('click', ()=>{ const li=btn.closest('li'); const up=btn.getAttribute('aria-label').endsWith('up');
      if(up && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
      if(!up && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li); }));

    /* pointer DRAG — grab the handle and the list live-reorders around the lifted row */
    let dragLi=null;
    function afterEl(y){
      const els=[...list.querySelectorAll('li:not(.dragging)')];
      let best=null, bestOffset=-Infinity;
      for(const el of els){ const r=el.getBoundingClientRect(); const offset=y-(r.top+r.height/2);
        if(offset<0 && offset>bestOffset){ bestOffset=offset; best=el; } }
      return best;
    }
    list.querySelectorAll('.handle').forEach(h=>{
      h.addEventListener('pointerdown', e=>{ dragLi=h.closest('li'); dragLi.classList.add('dragging'); h.setPointerCapture(e.pointerId); e.preventDefault(); });
      h.addEventListener('pointermove', e=>{ if(!dragLi) return;
        const after=afterEl(e.clientY);
        if(after==null) list.appendChild(dragLi);
        else if(after!==dragLi) list.insertBefore(dragLi, after); });
      const end=()=>{ if(dragLi){ dragLi.classList.remove('dragging'); dragLi=null; } };
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
    });
  </script>
</body>
</html>
