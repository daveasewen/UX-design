<title>Bullet chart — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for Bullet chart (Apollo MONO) — measure bar + comparative marker + qualitative
  ranges. ★ NET-NEW EXEMPLAR — chart-expansion programme WAVE 2, lane ② statistical/gauge (worker,
  Sonnet, 2026-08-05, brief notes/_briefs/2026-08-05-chart-wave2-lane2-statistical.md). Built to the
  Chart-scatter Layer-1 pattern (toolbar + table spine + token-manifest).

  WHAT'S REUSED, verbatim: 580×260 frame convention adapted to a horizontal gauge row layout (bullet is
  conventionally wide/short, not the 580×260 cartesian frame — kept the SAME toolbar chrome + table spine,
  the canvas proportions are the newly-judged part, see below); toolbar chrome (.dv-vt/.dv-csv/
  .dv-tbl-toggle/.dv-tablepanel) BYTE-FOR-BYTE from Chart-bar/Chart-scatter; AUTO-MARKUP
  dv-lockup-title/dv-lockup-table comment blocks (content matches what gen_component_partials.py would
  inject — registration is a CONDUCTOR SERIAL, see receipt). AUTO-BEHAVIOUR markers present but EMPTY,
  same precedent as the 2026-07-24 lane-1 receipt.

  ⛔ ds-020 FENCE (DIVVY-inherited, all wave-2 lanes): copy the mark contract + toolbar, NOT the axis/grid
  CSS. This snippet's axis ticks use the PRE-DV-D07 ink-at-alpha idiom, not the minted two-channel roles.
  Declared gap, not filled here.

  #96-D1 ②: CANVAS HEIGHT FORMULA (RULED — canvas must FLEX with row count, not a fixed 200).
  Row pitch = 60px is the CONSTANT (row band: range rect 32 tall starting 8px below the row's top,
  target tick spans row-top−8 → row-top+40). Row i's top = 18 + i·60 (i = 0-based).
  H = 80 + (rowCount−1)·60   — derived: axisTop(10) + rowCount·60 + bottom-margin(22), simplified.
  n=3 (this file's reference): H = 80+120 = 200 (unchanged, proves the formula against the shipped
  demo). n=1: H=80 (a single row keeps the SAME 60px band/appearance, just no extra rows below it —
  "single-row appearance identical" per #96-D1). n=10: H=80+540=620. viewBox/svg height/data-h and
  .dv-empty-frame height must all move together when an instance bakes a different row count; width
  stays 580 always. This is a BAKED-geometry contract (DV-D02) — the derivation happens at
  authoring/bake time, not at runtime (no JS row-count scale-physics, DEF-003).

  WHAT'S NEWLY JUDGED for bullet (receipted for Dave's eyeball):
  · MEASURE = the primary bar, data/series/1 fill, per the brief ("measure = series-1").
  · COMPARATIVE MARKER (target) = a vertical ink tick spanning the full row height, per the brief
    ("marker = ink") — the conventional bullet-chart target indicator.
  · QUALITATIVE RANGES (poor/satisfactory/good bands behind the measure) = NEUTRAL SURFACE TINTS.
    #96-D1 ③ RULED: the retired color-mix(ink,page) 8/16/24% approximation is replaced by CANON
    greys — literal values mirroring canon.css's already-minted --color-grey-200/300/400 (light)
    and --color-grey-dark-mode-500/400/300 (dark), MINTED NOTHING new. Z-order (bands behind bar
    behind marker) confirmed correct — SVG paint order already follows the range→measure→target
    DOM sequence.
  · Table mirrors measure / target / range values per row.

  RULES honoured: dv-017 var() fills only (ranges are the one declared exception, see grey-tint note
  above — they are a computed tint of an existing token, not a raw hex) · composites-only type
  (DV-D05/DV-D08 12px floor) · DEF-003 CSS-only motion · role-token radius only. Empty state consumes
  the Empty-state pattern by reference.
-->

<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:160ms cubic-bezier(.4,0,.2,1);
    --grow:760ms cubic-bezier(.22,.61,.36,1); }
  [data-theme="light"]{
    --page:#FFFFFF; --ink:#1A1A1A; --baseline:#1A1A1A; --line:#E1E1E1;
    --data-series-1:#766682;
    --data-series-1-hc:#484D6F;
    --data-axis:#626262; --axis-alpha:.6;
    --data-control-label-disabled:#9D9D9D; --data-control-swatch-off:currentColor;
    --shadow:#00000033; --pop-border:#FFFFFF00;
    --border-radius-control:0; --border-radius-surface:0;
    /* #96-D1 ③: CANON greys, minted nothing — literal values MIRROR canon.css's already-minted
       --color-grey-200/300/400 (#EDEDED/#D7D8D6/#B7B7B7), same convention as this file's own
       --data-series-1 etc: this snippet doesn't link canon.css, so the value is copied verbatim,
       not re-derived. Nearest steps to the retired color-mix(ink,page) 8/16/24% approximation. */
    --dv-range-1:#EDEDED; --dv-range-2:#D7D8D6; --dv-range-3:#B7B7B7;
  }
  [data-theme="dark"]{
    --page:#1A1A1A; --ink:#FFFFFF; --baseline:#FFFFFF; --line:#808080;
    --data-series-1:#766682;
    --data-series-1-hc:#93B6CC;
    --data-axis:#9D9D9D; --axis-alpha:.6;
    --data-control-label-disabled:#808080; --data-control-swatch-off:currentColor;
    --shadow:#000000D9; --pop-border:#808080;
    --border-radius-control:0; --border-radius-surface:0;
    /* #96-D1 ③: CANON greys, minted nothing — literal values MIRROR canon.css's already-minted
       --color-grey-dark-mode-500/400/300 (#212121/#404040/#474747), copied verbatim per this
       file's own convention (no canon.css link). */
    --dv-range-1:#212121; --dv-range-2:#404040; --dv-range-3:#474747;
  }
  [data-contrast="high"]{ --data-series-1:var(--data-series-1-hc); }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.25rem; font-family:var(--font); background:var(--page); color:var(--ink);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  h2{font-size:14px; opacity:.6; margin:1.75rem 0 .7rem; font-weight:500;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-4px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  figure.dv{margin:0; position:relative;}
  .dv-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; margin:0 0 12px;}
  .dv-title{margin:0;}
  .dv-controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; --control-h:32px;}
  .dv-stage{overflow-x:auto; padding-bottom:4px;}
  .dv-chart-area{width:580px;}
  .dv-svg{display:block; width:580px; height:200px; overflow:visible;}
  figure.dv-fit-on .dv-chart-area{width:100%;}
  figure.dv-fit-on .dv-svg{width:100%;}

  text.dv-axis,text.dv-label{opacity:var(--axis-alpha);}
  line.dv-axis{stroke:var(--baseline); stroke-width:1;}

  /* #96-D1 ③: CANON greys (not un-minted color-mix), z-order bands→bar→marker is DOM paint order
     (SVG has no z-index) — range rects precede the measure rect precede the target line in the
     markup below, already correct; unchanged here. */
  .dv-range-1{fill:var(--dv-range-1);}
  .dv-range-2{fill:var(--dv-range-2);}
  .dv-range-3{fill:var(--dv-range-3);}
  .dv-measure{fill:var(--data-series-1); transition:filter var(--ease);}
  .dv-measure:hover{filter:brightness(1.12);}
  [data-theme="dark"] .dv-measure:hover{filter:brightness(1.22);}
  .dv-target{stroke:var(--ink); stroke-width:3;}
  .dv-measure[tabindex]:focus-visible,.dv-target[tabindex]:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  @media (prefers-reduced-motion:no-preference){
    .dv-animate rect.dv-measure{transform-box:fill-box; transform-origin:left; animation:dvGrowX var(--grow) both;}
    .dv-animate .dv-row{opacity:0; animation:dvFade var(--ease) both;}
  }
  @keyframes dvGrowX{from{transform:scaleX(0);}}
  @keyframes dvFade{from{opacity:0;} to{opacity:1;}}

  /* ── TOOLBAR CONTROLS — ONE SHARED HEIGHT, copied byte-for-byte from Chart-bar/Chart-scatter ── */
  .dv-tbl-toggle,.dv-vt{position:relative; height:var(--control-h); box-sizing:border-box; display:inline-flex; align-items:center;
    background:transparent; border:1px solid var(--line); color:var(--ink); padding:0 8px; cursor:pointer;
    flex:none; transition:border-color var(--ease);}
  .dv-tbl-toggle::before,.dv-vt::before{content:""; position:absolute; z-index:0; min-width:var(--hit,44px); min-height:var(--hit,44px); width:100%; height:100%; top:50%; left:50%; transform:translate(-50%,-50%);}
  .dv-tbl-toggle > *,.dv-vt > *{position:relative; z-index:1;}
  .dv-tbl-toggle:hover,.dv-vt:hover{border-color:var(--ink);}
  .dv-tbl-toggle:focus-visible,.dv-vt:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .dv-tbl-toggle[aria-expanded="true"],.dv-vt[aria-pressed="true"]{border-color:var(--ink);}
  .dv-act,.dv-dd{gap:8px;}
  .dv-ico{width:16px; height:16px; fill:currentColor; flex:none; display:inline-block;}
  .dv-csv .dv-ico-tick{display:none;}
  .dv-csv.is-copied .dv-ico-copy{display:none;}
  .dv-csv.is-copied .dv-ico-tick{display:inline-block;}
  .dv-dd .dv-ico-arrow{transition:transform var(--ease);}
  .dv-dd[aria-expanded="true"] .dv-ico-arrow{transform:rotate(180deg);}

  .dv-tablepanel{position:absolute; top:44px; right:0; z-index:5; background:var(--page);
    border:1px solid var(--pop-border,var(--line)); box-shadow:0 0 16px var(--shadow);
    border-radius:var(--border-radius-surface); padding:16px; max-width:100%; overflow:auto;}
  .dv-tablepanel[hidden]{display:none;}
  .dv-tablepanel:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  .dv-tip{position:fixed; z-index:9; background:var(--page); color:var(--ink);
    border:1px solid var(--pop-border,var(--line)); box-shadow:0 0 16px var(--shadow);
    border-radius:var(--border-radius-surface); padding:8px 12px; pointer-events:none;
    opacity:0; transition:opacity var(--ease);}
  .dv-tip.on{opacity:1;}

  table.dv-table{border-collapse:collapse; color:var(--ink);}
  table.dv-table caption{text-align:left; opacity:.6; margin-bottom:8px;}
  table.dv-table th,table.dv-table td{border:1px solid var(--line); padding:4px 12px; text-align:right;}
  table.dv-table th[scope="row"]{text-align:left; font-weight:500;}
  table.dv-table thead th{opacity:.6; font-weight:500;}

  .dv-empty-frame{width:580px; height:200px; display:flex; align-items:center; justify-content:center;
    border:1px dashed var(--line); border-radius:var(--border-radius-surface);}
  .dv-empty-frame .empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
    padding:24px; max-width:480px;}
  .dv-empty-frame .empty h3{margin:0;}
  .dv-empty-frame .empty p{margin:0; opacity:.6; max-width:40ch;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important;
      animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }

          el.setAttribute('x', x.toFixed(1));
          var fw = el.getAttribute('data-fw');
          if (fw !== null) { el.setAttribute('width', (parseFloat(fw) * plotW).toFixed(1)); }
        } else if (tag === 'text') {
          var dx = parseFloat(el.getAttribute('data-dx') || '0');
          el.setAttribute('x', (x + dx).toFixed(1));
        } else if (tag === 'line') {
          el.setAttribute('x1', x.toFixed(1));
          var fx2 = el.getAttribute('data-fx2');
          if (fx2 !== null) { el.setAttribute('x2', X(fx2).toFixed(1)); }
        } else if (tag === 'g') {
          var x0 = parseFloat(el.getAttribute('data-x0') || '0');
          el.setAttribute('transform', 'translate(' + (x - x0).toFixed(1) + ',0)');
        }
      }
      /* #96-D1 ⑤: path[data-fxs] = .dv-band fill — same pairs, emitted M…L…Z. */
      var pls = svg.querySelectorAll('polyline[data-fxs],path[data-fxs]');
      for (var j = 0; j < pls.length; j++) {
        var pl = pls[j], isP = pl.tagName === 'path';
        var fxs = pl.getAttribute('data-fxs').trim().split(/\s+/);
        var ys = pl.getAttribute('data-ys').trim().split(/\s+/);
        var pts = [];
        for (var k = 0; k < fxs.length; k++) { pts.push(X(fxs[k]).toFixed(1) + ',' + ys[k]); }
        pl.setAttribute(isP ? 'd' : 'points', isP ? 'M' + pts.join(' L') + ' Z' : pts.join(' '));
      }
    } catch (e) { /* leave the baked SVG intact */ }
  }
  var dvRAF;   /* the ONE resize listener, rAF-debounced (ADR-0015) */
  window.addEventListener('resize', function () {
    cancelAnimationFrame(dvRAF); dvRAF = requestAnimationFrame(function () { fitCharts(); placeSegs(); });
  });

  /* ---------- POPOVER — real value tip on hover AND keyboard focus of any [data-tip].
     Replaces native <title> tooltips (values stay in sync with the table — one source).
     Edge-flips at the viewport bounds. role=status/aria-live=polite (proforma posture). */
  var dvTip = document.createElement('div');
  dvTip.className = 'dv-tip t-cm-chart-value'; dvTip.id = 'dvTip';   /* type via composite (T-D14 markup class) */
  dvTip.setAttribute('role', 'status'); dvTip.setAttribute('aria-live', 'polite');
  document.body.appendChild(dvTip);
  function tipAt(text, x, y) {
    dvTip.textContent = text; dvTip.classList.add('on');
    var r = dvTip.getBoundingClientRect();
    if (x + r.width  > window.innerWidth  - 8) { x = x - r.width  - 28; }
    if (y + r.height > window.innerHeight - 8) { y = y - r.height - 28; }
    dvTip.style.left = x + 'px'; dvTip.style.top = y + 'px';
  }
  function tipHide() { dvTip.classList.remove('on'); }
  document.addEventListener('pointermove', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (el) { tipAt(el.getAttribute('data-tip'), e.clientX + 14, e.clientY + 14); }
    else { tipHide(); }
  });
  document.addEventListener('focusin', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { return; }
    var b = el.getBoundingClientRect();
    tipAt(el.getAttribute('data-tip'), b.left + b.width / 2, b.top - 40);
  });
  document.addEventListener('focusout', function () { tipHide(); });

  /* ---------- TABLE-VIEW POPOVER — floating card panel (Dave's mock, 2026-07-23:
     surface ground + border + soft shadow, NOT a frosted drawer). Toggle carries
     aria-controls + aria-expanded; panel is a labelled region, tabindex=-1 for the
     focus hand-off; Esc dismisses and returns focus to its toggle. */
  function tblToggle(btn) {
    var panel = document.getElementById(btn.getAttribute('aria-controls'));
    if (!panel) { return; }
    var open = panel.hasAttribute('hidden');           /* opening if currently hidden */
    if (open) {
      panel.removeAttribute('hidden');
      /* anchor the panel just BELOW its trigger, never over it — the fixed top was brittle
         once a title pushed the toolbar down (Dave 2026-07-24). Measure after un-hiding so
         offsetParent resolves; fall back gracefully. */
      var op = panel.offsetParent || btn.offsetParent || panel.parentNode;
      if (op) {
        var bt = btn.getBoundingClientRect(), ot = op.getBoundingClientRect();
        panel.style.top = (bt.bottom - ot.top + 6) + 'px';
        /* anchor horizontally UNDER the trigger too — right:0 pinned the panel to the figure's edge,
           wrong when the trigger sits mid-figure (e.g. donut + side legend). Left-align to the
           trigger, clamp so it never spills past the offsetParent's right edge (keeps bar/line right-anchored). */
        var lx = Math.max(0, Math.min(bt.left - ot.left, op.clientWidth - panel.offsetWidth));
        panel.style.left = lx + 'px'; panel.style.right = 'auto';
      }
    } else { panel.setAttribute('hidden', ''); }
    btn.setAttribute('aria-expanded', String(open));   /* label stays static; the solid arrow rotates via CSS (Dave 2026-07-24) */
    if (open) { panel.focus(); }
  }
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.dv-tbl-toggle');
    if (btn) { tblToggle(btn); return; }
    var vt = e.target.closest && e.target.closest('button[data-dv-toggle]');
    if (vt) { viewToggle(vt); return; }
    var sw = e.target.closest && e.target.closest('button[data-dv-view-btn]');
    if (sw) { segView(sw); return; }
    var cp = e.target.closest && e.target.closest('button.dv-csv');
    if (cp) { copyCsv(cp); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') { return; }
    var panel = e.target.closest && e.target.closest('.dv-tablepanel');
    if (!panel || panel.hasAttribute('hidden')) { return; }
    panel.setAttribute('hidden', '');
    var btn = document.querySelector('.dv-tbl-toggle[aria-controls="' + panel.id + '"]');
    if (btn) { btn.setAttribute('aria-expanded', 'false'); btn.focus(); }   /* label static (Dave 2026-07-24) */
  });

  /* VIEW TOGGLES (menu picks 6/7/9): baked-variant switching — geometry is generated, never
     computed here; behaviour only shows/hides [data-dv-view] groups (.dv-off = display:none). */
  function setView(fig, name, show) {
    var els = fig.querySelectorAll('[data-dv-view~="' + name + '"]');
    for (var i = 0; i < els.length; i++) { els[i].classList.toggle('dv-off', !show); }
  }
  function viewToggle(btn) {
    var on = btn.getAttribute('aria-pressed') === 'true';
    btn.setAttribute('aria-pressed', String(!on));
    setView(btn.closest('figure') || document, btn.getAttribute('data-dv-toggle'), !on);
  }
  /* SEGMENTED INDICATOR (Dave, 2026-07-24): the view switch CONSUMES the Segmented-control atom —
     behaviour drives the sliding fill (.ind) the atom's way: measure the pressed button's box and
     slide. rect-based so the 2px inset + 1px border don't offset the measurement (the .ind
     containing block is .seg's padding box — subtract seg.clientLeft). */
  function moveSeg(seg) {
    if (!seg) { return; }
    var ind = seg.querySelector('.ind'); if (!ind) { return; }
    var a = seg.querySelector('button[aria-pressed="true"]'); if (!a) { return; }
    var sr = seg.getBoundingClientRect(), br = a.getBoundingClientRect();
    ind.style.left = (br.left - sr.left - seg.clientLeft) + 'px';
    ind.style.width = br.width + 'px';
  }
  function placeSegs() {
    var segs = document.querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) { moveSeg(segs[i]); }
  }
  /* VIEW SWITCH (Dave, 2026-07-23, both messages read together): the scale pair (monthly ⇄ year
     to date) is EXCLUSIVE — two scales can't share a canvas — but the overlays are fully ADDITIVE:
     each view carries its OWN baked variant of every overlay (nested [data-dv-view] groups), and
     an overlay's toggle governs both copies, so it works in whichever view is up. Nothing ever
     disables. */
  function segView(btn) {
    if (btn.getAttribute('aria-pressed') === 'true') { return; }
    var fig = btn.closest('figure') || document;
    var active = btn.getAttribute('data-dv-view-btn');
    var segs = fig.querySelectorAll('button[data-dv-view-btn]');
    for (var i = 0; i < segs.length; i++) {
      var v = segs[i].getAttribute('data-dv-view-btn');
      segs[i].setAttribute('aria-pressed', String(v === active));
      setView(fig, v, v === active);
    }
    moveSeg(btn.closest('.seg'));                 /* slide the indicator to the newly active view */
  }
  /* COPY CSV (menu pick 10): the figure's real table, serialised — no network, table = truth. */
  function copyCsv(btn) {
    var fig = btn.closest('figure') || document;
    var rows = fig.querySelectorAll('table tr');
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var cells = rows[i].querySelectorAll('th,td'), line = [];
      for (var j = 0; j < cells.length; j++) { line.push('"' + cells[j].textContent.trim().replace(/"/g, '""') + '"'); }
      out.push(line.join(','));
    }
    var csv = out.join('\n');
    function done() {
      /* label stays put; the copy icon swaps to a tick briefly (Dave 2026-07-24) */
      btn.classList.add('is-copied');
      setTimeout(function () { btn.classList.remove('is-copied'); }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(done, done);
    } else { done(); }
  }

  /* ---------- INIT — opt the page into fit (JS-on releases the fixed width), first pass. */
  var figs = document.querySelectorAll('figure.dv');
  for (var i = 0; i < figs.length; i++) { figs[i].classList.add('dv-fit-on'); }
  fitCharts();
  placeSegs();                                    /* initial indicator position (widths depend on layout) */
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(placeSegs); }   /* re-place once the web font settles */
}());
</script>
  <!-- ===== AUTO-BEHAVIOUR dv-behaviour END ===== -->

</body>
</html>
