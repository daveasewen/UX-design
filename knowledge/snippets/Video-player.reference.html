<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video player — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Video player (gated) — BASELINE, PROVISIONAL (Dave 2026-07-21: needs
     work; re-themed + flagged in _REVIEW-SIGNOFF for the consolidated Mono pass). Controls overlaid
     on the video sit on a dark scrim so the white controls keep contrast regardless of the frame;
     play/scrub accent = button/primary ladder (ink in Mono; red only via the Legacy override).
     Caption/label = text/default on the page. Full captions/quality/fullscreen behaviour is a
     starting point — extend per the meta. -->
<link rel="stylesheet" href="../canon/type.css">
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=number],input:not([type]),textarea):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{ --text:#1A1A1A; --muted:#1A1A1A; --page:#FFFFFF;
    /* shape — semantic radius tier (ADR-0010): big play button=control */
    --border-radius-control:0;
    /* THEMED 2026-07-21 (Dave, in-session): primary action = B-D1 mono ladder (Legacy override
       restores the red CTA); focus = focus/ring (was rogue #4d9fff); scrim = overlay/version2;
       controls = text/reverse; --muted = text/secondary (Dave: "resolve to the near black" —
       deliberate darkening from #767676/#9a9a9a; flagged in _REVIEW-SIGNOFF for the Mono pass). */
    --accent:#1A1A1A; --accent-label:#333333; --onvideo-fill:#FFFFFF; --controls:#FFFFFF; --scrim:#000000D9; --focus:#305A85; }
  [data-theme="dark"]{ --text:#FFFFFF; --muted:#FFFFFF; --page:#1A1A1A;
    --border-radius-control:0;
    --accent:#FAFAFA; --accent-label:#333333; --onvideo-fill:#FFFFFF; --controls:#FFFFFF; --scrim:#000000D9; --focus:#4587A7; }
  :root{ --spring:300ms cubic-bezier(.5,1.6,.4,1); --press:90ms cubic-bezier(0,0,.58,1); }   /* Button motion tokens */
  *{box-sizing:border-box;}
  body{margin:0; padding:2rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .player{position:relative; width:100%; max-width:560px; aspect-ratio:16/9; background:linear-gradient(135deg,#2a2a30,#0e0e12); overflow:hidden;}
  .bigplay{position:absolute; inset:0; margin:auto; width:64px; height:64px; border:0; border-radius:var(--border-radius-control); background:var(--onvideo-fill); color:var(--accent-label); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition:transform var(--spring), filter var(--press);}   /* SQUARE — brand angular; carries the Button scale-physics.
    ON-SCRIM EXCEPTION (Dave 2026-07-21, on the 1.2:1 light-mode fail): the play button sits on the
    VIDEO (always-dark, arbitrary frames) — it joins the on-video control family (reverse fill BOTH
    modes, 14-19:1 vs the demo gradient; glyph #333333 on white 12.6:1), NOT the page-mode primary
    ladder. The themed accent remains on the scrub .played. */
  .bigplay svg{width:26px; height:26px; fill:currentColor;}
  .bigplay:hover{transform:scale(1.08);}                                   /* grow toward the cursor */
  .bigplay:active{transform:scale(.92); filter:brightness(.85); transition:transform var(--press), filter var(--press);}   /* snappy depress + darken */
  .bigplay:focus-visible{outline:3px solid var(--focus); outline-offset:3px;}
  .bar{position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px; padding:8px 12px; background:linear-gradient(transparent, var(--scrim)); color:var(--controls);}
  .bar button{width:32px; height:32px; border:0; background:transparent; color:var(--controls); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .bar button svg{width:18px; height:18px; fill:currentColor;}
  .bar button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .scrub{flex:1; height:4px; background:rgba(255,255,255,.3); position:relative;}
  /* 2.5.8 target — the seek bar is a role="slider" CONTROL, so the 4px visual track
     is not its target. Canon invisible ::before expander (aid-009), same mechanism as
     .dv-vt / .tail-btn. SURFACED #116 by the markup-driven rebuild: the old
     selector-allowlist gate had no name for `.scrub` and no rule for role="slider",
     so this control was never checked at all — it passed by omission. */
  .scrub::before{content:""; position:absolute; z-index:0; min-width:var(--hit,44px); min-height:var(--hit,44px);
    width:100%; height:100%; top:50%; left:50%; transform:translate(-50%,-50%);}
  .scrub .played{position:absolute; left:0; top:0; bottom:0; width:35%; background:var(--accent); z-index:1;}
  .time{/* type: t-cm-legal (bound in canon/type.css - T-D9/T-D12) */ color:var(--controls); min-width:78px; text-align:right;}
  .caption{margin-top:16px; font:500 14px/1.4 var(--font); color:var(--text);}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    .bigplay:hover,.bigplay:active{ transform:none !important; filter:none !important; }   /* no scale-physics under reduced-motion */
  }
</style>
</head>
<body data-theme="light">
  
  <div class="player" role="group" aria-label="Video player">
    <button class="bigplay" aria-label="Play video"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.39922 2.08L14.3992 9L2.39922 15.92V2.08ZM1.19922 0V18L16.7992 9L1.19922 0Z"/></svg></button>
    <div class="bar">
      <button aria-label="Play"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.39922 2.08L14.3992 9L2.39922 15.92V2.08ZM1.19922 0V18L16.7992 9L1.19922 0Z"/></svg></button>
      <div class="scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35"><span class="played"></span></div>
      <span class="time">1:12 / 3:24</span>
      <button aria-label="Mute"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.89 6.299C12.566 7 12.988 7.95 12.988 9C12.988 10.098 12.529 11.087 11.796 11.796L12.644 12.644C13.594 11.717 14.188 10.428 14.188 9C14.188 7.619 13.632 6.37 12.738 5.45L11.89 6.299ZM15.214 2.974L14.366 3.822C15.676 5.158 16.488 6.985 16.488 9C16.488 11.062 15.638 12.929 14.272 14.272L15.12 15.12C16.703 13.559 17.688 11.393 17.688 9C17.688 6.654 16.742 4.527 15.214 2.974ZM0 5V13H5L10 18V0L5 5H0ZM8.8 2.897V15.103L5.497 11.8H1.2V6.2H5.497L8.8 2.897Z"/></svg></button>
      <button aria-label="Fullscreen"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.139 11.709L6.291 10.861L2.2 14.952V10.8L1 12V17H6L7.2 15.8H3.048L7.139 11.709ZM15.8 14.952L11.709 10.862L10.861 11.71L14.952 15.8H10.8L12 17H17V12L15.8 10.8V14.952ZM12 1L10.8 2.2H14.952L10.862 6.29L11.71 7.138L15.8 3.048V7.2L17 6V1H12ZM1 1V6L2.2 7.2V3.048L6.291 7.138L7.139 6.29L3.048 2.2H7.2L6 1H1Z"/></svg></button>
    </div>
  </div>
  <p class="caption">How to set up a standing order — 3:24</p>

  <script type="application/json" id="token-manifest">
  {
    "component": "Video player",
    "vars": { "--text": "text/default", "--muted": "text/secondary", "--page": "background/default", "--border-radius-control": "border-radius/control",
      "--accent": "button/primary/background/default", "--accent-label": "button/primary/label/default",
      "--onvideo-fill": "text/reverse", "--controls": "text/reverse", "--scrim": "overlay/version2", "--focus": "focus/ring" },
    "driftAllow": { "--accent-label": ["light"], "$reason": "ON-SCRIM EXCEPTION (Dave 2026-07-21): the bigplay glyph sits on --onvideo-fill (text/reverse — LIGHT in both modes), so the dark-mode label value #333333 applies in BOTH modes; the light-mode ladder value #FFFFFF would be white-on-white. Pending Dave's eyeball per _REVIEW-SIGNOFF." },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" }
    ],
    "requiredAria": ["aria-label", "role=\"slider\""]
  }
  </script>

  <script>
  /* ==========================================================================================
     TRANSPORT BEHAVIOUR — #218 behaviour wave. Added to a file that carried ZERO behaviour JS.

     ⚠⚠ HONESTY NOTE, LOAD-BEARING — THERE IS NO <video> AND NO src IN THIS SNIPPET.
     `.player` is a CSS gradient standing in for a frame, so there is nothing to play. What
     follows drives a DEMO CLOCK: a requestAnimationFrame-stepped counter SEEDED FROM THE TWO
     TIMES ALREADY PRINTED IN THE MARKUP ("1:12 / 3:24"). Nothing here pretends to be a media
     stream — no <video>, no network, no autoplay. The demo starts PAUSED, exactly as the markup
     is drawn (aria-label="Play video", .played at 35%). Wiring a real element is the consumer's
     job; the point of this script is that the CONTROLS' STATES are now real and reviewable.

     ⛔ NO MARKUP OR CSS WAS CHANGED. The one hook the slider needed — tabindex, without which a
     role="slider" is not keyboard-reachable — is applied AT RUNTIME below, so a JS-off reader
     sees exactly the file that shipped rather than a focus stop that does nothing.

     GLYPHS ARE BYTE-MATCHED, NEVER INVENTED (_validate_icons.py byte-matches inline paths against
     assets/icons/). The two alternate paths below are copied verbatim from the library set the
     drawn glyphs already come from:
       assets/icons/volume-and-audio/control-pause.svg   (swaps in for control-play.svg)
       assets/icons/volume-and-audio/volume-off.svg      (swaps in for volume-high.svg)
     The OUTGOING paths are read off the DOM rather than restated, so they cannot drift.

     ARIA STATE FIRST, CLASSES SECOND — and the state CHANNEL differs per control, on purpose:
       · play / pause  ACCESSIBLE NAME swap. APG: a play button is not a toggle button — its
                       label IS its state. aria-pressed here would announce "Pause, pressed".
       · mute          aria-pressed (mute genuinely IS a toggle) + name swap + glyph swap.
       · seek          aria-valuenow + aria-valuetext on the role="slider" the markup already has.
     `data-playing` on .player is the class-second channel and carries no meaning of its own.

     MOTION / dv-animate: the Replay idiom governs snippets whose motion RUNS ON LOAD. This one
     starts paused and animates nothing until a user acts, so no Replay control is owed and no
     dv-animate machinery is wired here — named as a finding, not enacted.
     ========================================================================================== */
  (function(){
    var player  = document.querySelector('.player');
    var bar     = player.querySelector('.bar');
    var bigplay = player.querySelector('.bigplay');
    var playBtn = bar.querySelector('button[aria-label="Play"]');
    var muteBtn = bar.querySelector('button[aria-label="Mute"]');
    var fsBtn   = bar.querySelector('button[aria-label="Fullscreen"]');
    var scrub   = player.querySelector('.scrub');
    var played  = scrub.querySelector('.played');
    var timeEl  = bar.querySelector('.time');

    var bigGlyph  = bigplay.querySelector('path');
    var playGlyph = playBtn.querySelector('path');
    var muteGlyph = muteBtn.querySelector('path');

    var D_PLAY   = playGlyph.getAttribute('d');            /* control-play.svg, off the DOM */
    var D_VOLUME = muteGlyph.getAttribute('d');            /* volume-high.svg, off the DOM */
    var D_PAUSE  = 'M14.4004 1.2V16.8H13.2004V1.2H14.4004ZM4.80039 1.2V16.8H3.60039V1.2H4.80039ZM15.6004 0H12.0004V18H15.6004V0ZM6.00039 0H2.40039V18H6.00039V0Z';
    var D_MUTED  = 'M0 5V13H5L10 18V0L5 5H0ZM8.8 2.897V15.103L5.497 11.8H1.2V6.2H5.497L8.8 2.897ZM17.746 6.924L16.897 6.076L14.821 8.152L12.745 6.076L11.896 6.924L13.974 9L11.898 11.076L12.747 11.924L14.823 9.848L16.899 11.924L17.748 11.076L15.67 9L17.746 6.924Z';

    /* ---- the clock is SEEDED FROM THE MARKUP, so no duration is invented here ---- */
    function toSec(s){ var p = String(s).trim().split(':'); return (+p[0]) * 60 + (+p[1]); }
    var halves   = timeEl.textContent.split('/');
    var DURATION = toSec(halves[1]);                        /* 3:24 -> 204 */
    var t        = toSec(halves[0]);                        /* 1:12 ->  72 */

    function fmt(s){
      s = Math.max(0, Math.min(DURATION, Math.round(s)));
      var m = Math.floor(s / 60), r = s - m * 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }

    function render(){
      var pct = DURATION ? (t / DURATION) * 100 : 0;
      played.style.width = pct.toFixed(2) + '%';
      scrub.setAttribute('aria-valuenow', String(Math.round(pct)));
      scrub.setAttribute('aria-valuetext', fmt(t) + ' of ' + fmt(DURATION));
      timeEl.textContent = fmt(t) + ' / ' + fmt(DURATION);
    }

    /* ---- play / pause ---- */
    var playing = false, raf = 0, last = 0;

    function step(ts){
      if (!playing) { return; }
      if (!last) { last = ts; }
      t += (ts - last) / 1000; last = ts;
      if (t >= DURATION) { t = DURATION; render(); setPlaying(false); return; }
      render();
      raf = requestAnimationFrame(step);
    }

    function setPlaying(on){
      playing = on; last = 0;
      cancelAnimationFrame(raf);
      bigplay.setAttribute('aria-label', on ? 'Pause video' : 'Play video');
      playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
      bigGlyph.setAttribute('d',  on ? D_PAUSE : D_PLAY);
      playGlyph.setAttribute('d', on ? D_PAUSE : D_PLAY);
      player.setAttribute('data-playing', String(on));
      if (on) {
        if (t >= DURATION) { t = 0; render(); }             /* replay from the top */
        raf = requestAnimationFrame(step);
      }
    }

    function toggle(){ setPlaying(!playing); }
    bigplay.addEventListener('click', toggle);
    playBtn.addEventListener('click', toggle);
    /* Space / Enter reach both of these natively — they are real <button>s, and re-binding the
       keys would double-fire. Verified by driving the keys, not by assuming. */

    /* ---- mute. The markup carries no aria-pressed; the BEHAVIOUR adds it, so a JS-off reader
            is never shown a toggle state that nothing can change. ---- */
    var muted = false;
    function setMuted(on){
      muted = on;
      muteBtn.setAttribute('aria-pressed', String(on));
      muteBtn.setAttribute('aria-label', on ? 'Unmute' : 'Mute');
      muteGlyph.setAttribute('d', on ? D_MUTED : D_VOLUME);
    }
    setMuted(false);
    muteBtn.addEventListener('click', function(){ setMuted(!muted); });

    /* ---- seek. role="slider" is already in the markup; it was never focusable. ---- */
    scrub.setAttribute('tabindex', '0');

    function seekTo(sec){ t = Math.max(0, Math.min(DURATION, sec)); render(); }

    function seekFromPointer(ev){
      var r = scrub.getBoundingClientRect();
      if (!r.width) { return; }
      seekTo(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * DURATION);
    }

    var dragging = false;
    scrub.addEventListener('pointerdown', function(ev){
      dragging = true; scrub.focus();
      try { scrub.setPointerCapture(ev.pointerId); } catch (e) {}
      seekFromPointer(ev); ev.preventDefault();
    });
    scrub.addEventListener('pointermove', function(ev){ if (dragging) { seekFromPointer(ev); } });
    scrub.addEventListener('pointerup', function(ev){
      dragging = false;
      try { scrub.releasePointerCapture(ev.pointerId); } catch (e) {}
    });

    scrub.addEventListener('keydown', function(ev){
      var STEP = 5, PAGE = 30, k = ev.key, next;
      if (k === 'ArrowRight' || k === 'ArrowUp') { next = t + STEP; }
      else if (k === 'ArrowLeft' || k === 'ArrowDown') { next = t - STEP; }
      else if (k === 'PageUp')   { next = t + PAGE; }
      else if (k === 'PageDown') { next = t - PAGE; }
      else if (k === 'Home')     { next = 0; }
      else if (k === 'End')      { next = DURATION; }
      else { return; }
      ev.preventDefault();
      seekTo(next);
    });

    /* ---- fullscreen. Wired to the REAL Fullscreen API and reflected ONLY from the
            fullscreenchange event — NEVER optimistically on click. Setting aria-pressed on click
            would claim a state the browser is free to refuse (sandboxed and headless contexts
            routinely do). That refusal is exactly why the verify script asserts nothing here:
            DECLARED UNVERIFIED rather than quietly faked. ---- */
    fsBtn.setAttribute('aria-pressed', 'false');
    fsBtn.addEventListener('click', function(){
      try {
        var p;
        if (document.fullscreenElement === player) { p = document.exitFullscreen && document.exitFullscreen(); }
        else if (player.requestFullscreen) { p = player.requestFullscreen(); }
        if (p && p.catch) { p.catch(function(){}); }
      } catch (e) {}
    });
    document.addEventListener('fullscreenchange', function(){
      var on = document.fullscreenElement === player;
      fsBtn.setAttribute('aria-pressed', String(on));
      fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen');
    });

    render();
  }());
  </script>
  </body>
</html>
