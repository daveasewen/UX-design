<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Cards (gated). Bordered container (border/subtle) grouping content; an
     elevated variant uses the mode-aware elevation (shadow light / outline dark). A clickable card is a
     link with a focus ring. Square corners (angular brand). -->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:160ms cubic-bezier(.4,0,.2,1); }
  [data-theme="light"]{ --surface:#FFFFFF; --border:#D7D8D6; --elev-bd:#FFFFFF00; --shadow:#00000033; --text:#333333; --muted:#545454; --icon:#333333; --accent:#DB0011; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --surface:#1D1D1D; --border:#404040; --elev-bd:#767676; --shadow:#000000D9; --text:#FFFFFF; --muted:#9B9B9B; --icon:#FFFFFF; --accent:#DB0011; --focus:#4587A7; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button.tg{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--muted); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button.tg:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .row{display:flex; gap:18px; flex-wrap:wrap;}
  .card{width:260px; background:var(--surface); border:1px solid var(--border); padding:16px; display:flex; flex-direction:column; gap:8px;}
  .card.elevated{border:1px solid var(--elev-bd); box-shadow:0 0 16px var(--shadow);}
  .card h3{margin:0; font:500 16px/1.3 var(--font);}
  .card p{margin:0; font:300 14px/1.5 var(--font); color:var(--muted);}
  a.card{text-decoration:none; color:var(--text); cursor:pointer; transition:background var(--ease);}
  a.card:hover{background:var(--page);}
  a.card:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .card .cta{margin-top:6px; color:var(--accent); font-weight:500; font-size:14px; display:inline-flex; gap:6px; align-items:center;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button class="tg" id="themeToggle" type="button">◐ Toggle theme</button><span>Cards — canonical reference</span></div>

  <div class="row">
    <article class="card"><h3>Current account</h3><p>Everyday spending, contactless and direct debits.</p></article>
    <article class="card elevated"><h3>Savings goal</h3><p>Set aside money toward something specific.</p><span class="cta">Set a goal →</span></article>
    <a class="card" href="#" aria-label="Open Travel insurance"><h3>Travel insurance</h3><p>Cover for trips at home and abroad.</p><span class="cta">Learn more →</span></a>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Cards",
    "vars": { "--surface": "tertiary/background/default", "--border": "border/subtle", "--elev-bd": "elevation/border", "--shadow": "elevation/functional", "--text": "text/default", "--muted": "text/secondary", "--icon": "icon/default", "--accent": "primary/background/default", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "text/secondary", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "primary/background/default", "bg": "tertiary/background/default", "context": "ui" }
    ],
    "requiredAria": ["<article", "<a ", "aria-label"]
  }
  </script>
  <script>document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });</script>
</body>
</html>
