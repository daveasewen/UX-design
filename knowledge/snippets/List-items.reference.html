<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List items — Transaction row (reference implementation, gated)</title>
<!--
  CANONICAL REFERENCE IMPLEMENTATION for the List items — TRANSACTION row (promoted 2026-06-22).
  Authored gated snippet. Colour values are resolved canonical token values; the embedded
  #token-manifest maps every CSS var to its token, and _validate_snippets.py fails the build if
  any value drifts from the store, required ARIA is missing, or a contrast pair falls below threshold.
  Edit tokens in the store, not here.
  Real anatomy from Figma (node 1508:76284): leading avatar + title/description + trailing detail
  (TAG chip OR STATUS badge) above a right-aligned amount. States: default / hover / pressed /
  disabled / processing. Reuses CANONICAL primitives: .avatar (Avatar.reference), .tag (Tags.reference),
  and the Loading-indicator spinner (Loading-indicator.reference) for the processing state — mirrored,
  not hard-coded. Status uses a rag/success-TINT badge (neutral label + success dot — all pairs AA).
  Pressed reverses out avatar + status + tag, and adds an inset (the dark pressed surface == default
  surface, so colour alone is insufficient). Responsive grid, dark mode, square corners, reduced-motion
  (spinner slows, never stops — 2.2.2). See the meta ($build + $finding) for the token-level findings,
  including the flagged dark hover / secondary-text contrast dip.
-->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{
    --surface:#FFFFFF; --hover:#F3F3F3; --pressed:#767676; --disabled-surface:#D7D8D6;
    --text:#333333; --muted:#545454; --reverse:#FFFFFF; --disabled-text:#D7D8D6;
    --icon:#333333; --icon-rev:#FFFFFF; --divider:#D7D8D6;
    --success:#00847F; --warning:#FFBB33; --error:#A8000B; --info:#305A85;
    --success-tint:#E5F2F2; --warning-tint:#FFF8EA; --error-tint:#F9F2F3; --info-tint:#EBEFF4;
    --tag-border:#767676; --avatar:#F3F3F3; --focus:#305A85; --page:#FFFFFF;
  }
  [data-theme="dark"]{
    --surface:#1D1D1D; --hover:#474747; --pressed:#1D1D1D; --disabled-surface:#404040;
    --text:#FFFFFF; --muted:#9B9B9B; --reverse:#FFFFFF; --disabled-text:#767676;
    --icon:#FFFFFF; --icon-rev:#FFFFFF; --divider:#404040;
    --success:#00847F; --warning:#FFBB33; --error:#DB0011; --info:#4587A7;
    --success-tint:#001615; --warning-tint:#221701; --error-tint:#260005; --info-tint:#000D1B;
    --tag-border:#656565; --avatar:#474747; --focus:#4587A7; --page:#000000;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  h2{font:500 13px/1 var(--font); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 12px;}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; font-size:13px;}
  .demo-controls button.tg{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--muted); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button.tg:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .demo-controls label{display:flex; gap:.5rem; align-items:center;} .demo-controls input[type=range]{accent-color:var(--success);}

  .wrap{ width:var(--demo-width, 460px); max-width:100%; margin-bottom:2.5rem; container-type:inline-size; }

  /* ---- canonical avatar atom (round; from Avatar.reference) ---- */
  .avatar{flex:none; border-radius:50%; background:var(--avatar); color:var(--text); width:36px; height:36px;
    display:inline-flex; align-items:center; justify-content:center; font:500 14px/1 var(--font);}

  /* ---- canonical tag atom (SQUARE outline; from Tags.reference) ---- */
  .tag{display:inline-flex; align-items:center; height:24px; padding:0 8px; border:1px solid var(--tag-border);
    border-radius:0; font:400 12px/1 var(--font); color:var(--text); white-space:nowrap;}

  /* ---- list + row ---- */
  ul.list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--divider);}
  ul.list li + li{border-top:1px solid var(--divider);}
  .row{display:flex; align-items:center; gap:14px; width:100%; min-height:var(--row-h, 64px); padding:10px 16px;
    background:transparent; border:0; cursor:pointer; text-align:left; color:var(--text);
    font:500 15px/1.35 var(--font); transition:background var(--ease), box-shadow var(--ease);}
  .row .body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .row .title{font:500 15px/1.35 var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .desc{font:400 13px/1.3 var(--font); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .trail{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .row .amount{font:500 15px/1.2 var(--font); font-variant-numeric:tabular-nums; white-space:nowrap;}
  /* status detail = the Status-indicator atom (form B): SQUARE RAG tint badge, neutral text/default label + RAG dot.
     SAME primitive as Status-indicator.reference.html. Label-on-tint is AA for every RAG (11-19:1); the warning dot
     is < 3:1 standalone (1.4.11) so meaning is carried by the label (1.4.1) — same handled finding as the atom. */
  .status{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 8px; border-radius:0; font:400 12px/1 var(--font); color:var(--text); white-space:nowrap;}
  .status .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .status.ok{background:var(--success-tint);}   .status.ok .dot{background:var(--success);}
  .status.warn{background:var(--warning-tint);} .status.warn .dot{background:var(--warning);}
  .status.err{background:var(--error-tint);}    .status.err .dot{background:var(--error);}
  .status.inf{background:var(--info-tint);}     .status.inf .dot{background:var(--info);}

  /* states */
  .row:hover, .row.is-hover{background:var(--hover);}
  .row:hover .avatar, .row.is-hover .avatar{background:var(--surface);} /* white disk on hover so the avatar separates from the hover tint */
  .row:active, .row.is-pressed{background:var(--pressed); color:var(--reverse); box-shadow:inset 0 0 0 2px rgba(127,127,127,.45);} /* inset = non-colour press signal, survives dark collapse */
  .row:active .desc, .row.is-pressed .desc{color:var(--reverse);}
  .row:active .avatar, .row.is-pressed .avatar{background:transparent; color:var(--reverse); box-shadow:inset 0 0 0 1px var(--reverse);} /* reverse out the avatar contents */
  .row:active .tag, .row.is-pressed .tag{color:var(--reverse); border-color:var(--reverse);}
  .row:active .status, .row.is-pressed .status{background:transparent; color:var(--reverse); box-shadow:inset 0 0 0 1px var(--reverse);} /* reverse out the status indicator */
  .row:active .status .dot, .row.is-pressed .status .dot{background:var(--reverse);}
  .row:focus-visible{outline:2px solid var(--focus); outline-offset:-2px;}
  .row[aria-disabled="true"], .row.is-disabled, .row:disabled{color:var(--disabled-text); cursor:not-allowed; background:transparent;} /* native :disabled (non-focusable) OR aria-disabled (focusable, discoverable) — both supported */
  .row[aria-disabled="true"] .desc, .row.is-disabled .desc, .row:disabled .desc{color:var(--disabled-text);}
  .row[aria-disabled="true"] .avatar, .row.is-disabled .avatar, .row:disabled .avatar{background:var(--disabled-surface); color:var(--reverse);} /* white initials when disabled */
  .row[aria-disabled="true"] .tag, .row.is-disabled .tag, .row:disabled .tag{color:var(--disabled-text); border-color:var(--disabled-surface);}
  .row[aria-disabled="true"] .status, .row.is-disabled .status, .row:disabled .status{background:transparent; color:var(--disabled-text); box-shadow:inset 0 0 0 1px var(--disabled-surface);}
  .row[aria-disabled="true"] .status .dot, .row.is-disabled .status .dot, .row:disabled .status .dot{background:var(--disabled-surface);}

  /* processing = Loading-indicator PRIMITIVE — mirrors snippets/Loading-indicator.reference.html
     (icon/default stroke, arc via transparent edge, spin .8s linear). Not a bespoke spinner. */
  .spin{width:18px; height:18px; border:2px solid var(--icon); border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .stateLabel{font:400 11px/1 var(--font); color:var(--muted); padding:0 16px 6px;}

  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
  @media (prefers-reduced-motion: reduce){ .spin{ animation-duration:2.4s !important; animation-iteration-count:infinite !important; } } /* primitive rule: slow, don't STOP — status still conveyed (2.2.2) */

  /* responsive — REAL width adaptation via container query (responds to the width control, not the viewport).
     Narrow: the trailing tag/status + amount reflow onto a full-width line beneath the merchant. WCAG 1.4.10. */
  @container (max-width: 360px){
    .row{ flex-wrap:wrap; }
    .row .trail{ order:3; flex-basis:100%; flex-direction:row; justify-content:space-between; align-items:center; margin-top:6px; padding-left:50px; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls">
    <button class="tg" id="themeToggle" type="button">◐ Toggle theme</button>
    <label>Width <input id="w" type="range" min="300" max="640" value="460"> <span id="wv">460</span>px</label>
    <label><input type="checkbox" id="dense"> Compact density</label>
  </div>

  <!-- ===== A. Live interactive list (hover / click / Tab to focus) ===== -->
  <div class="wrap">
    <h2>Transaction list — live (hover · press · Tab)</h2>
    <ul class="list" id="liveList">
      <li><button class="row" type="button">
        <span class="avatar" role="img" aria-label="Amazon">AZ</span>
        <span class="body"><span class="title">Amazon</span><span class="desc">22 Jun · Shopping</span></span>
        <span class="trail"><span class="status warn"><span class="dot" aria-hidden="true"></span>Pending</span><span class="amount">−1,234.00 HKD</span></span>
      </button></li>
      <li><button class="row" type="button">
        <span class="avatar" role="img" aria-label="Pret a Manger">PM</span>
        <span class="body"><span class="title">Pret a Manger</span><span class="desc">21 Jun · Eating out</span></span>
        <span class="trail"><span class="status err"><span class="dot" aria-hidden="true"></span>Declined</span><span class="amount">−48.50 HKD</span></span>
      </button></li>
      <li><button class="row" type="button">
        <span class="avatar" role="img" aria-label="Salary">£</span>
        <span class="body"><span class="title">Monthly salary</span><span class="desc">20 Jun · Income</span></span>
        <span class="trail"><span class="status ok"><span class="dot" aria-hidden="true"></span>Received</span><span class="amount">+32,000.00 HKD</span></span>
      </button></li>
      <li><button class="row" type="button">
        <span class="avatar" role="img" aria-label="Transport for London">TfL</span>
        <span class="body"><span class="title">Transport for London — a long merchant name that should truncate cleanly</span><span class="desc">20 Jun · Travel</span></span>
        <span class="trail"><span class="tag">Travel</span><span class="amount">−6.80 HKD</span></span>
      </button></li>
    </ul>
  </div>

  <!-- ===== B. All states at once (forced, so transient states are visible) ===== -->
  <div class="wrap">
    <h2>All five states — status badge (tag shown in the live list above)</h2>
    <ul class="list">
      <li><div class="stateLabel">default</div><button class="row" type="button">
        <span class="avatar" role="img" aria-label="Amazon">AZ</span>
        <span class="body"><span class="title">Amazon</span><span class="desc">22 Jun · Shopping</span></span>
        <span class="trail"><span class="status ok"><span class="dot" aria-hidden="true"></span>Approved</span><span class="amount">−1,234.00 HKD</span></span>
      </button></li>
      <li><div class="stateLabel">hover (web)</div><button class="row is-hover" type="button">
        <span class="avatar" role="img" aria-label="Amazon">AZ</span>
        <span class="body"><span class="title">Amazon</span><span class="desc">22 Jun · Shopping</span></span>
        <span class="trail"><span class="status ok"><span class="dot" aria-hidden="true"></span>Approved</span><span class="amount">−1,234.00 HKD</span></span>
      </button></li>
      <li><div class="stateLabel">pressed — avatar + status reversed out</div><button class="row is-pressed" type="button">
        <span class="avatar" role="img" aria-label="Amazon">AZ</span>
        <span class="body"><span class="title">Amazon</span><span class="desc">22 Jun · Shopping</span></span>
        <span class="trail"><span class="status ok"><span class="dot" aria-hidden="true"></span>Approved</span><span class="amount">−1,234.00 HKD</span></span>
      </button></li>
      <li><div class="stateLabel">disabled (native :disabled)</div><button class="row" type="button" disabled>
        <span class="avatar" role="img" aria-label="Amazon">AZ</span>
        <span class="body"><span class="title">Amazon</span><span class="desc">22 Jun · Shopping</span></span>
        <span class="trail"><span class="status ok"><span class="dot" aria-hidden="true"></span>Approved</span><span class="amount">−1,234.00 HKD</span></span>
      </button></li>
      <li><div class="stateLabel">processing</div><button class="row" type="button" aria-busy="true">
        <span class="avatar" role="img" aria-label="Amazon">AZ</span>
        <span class="body"><span class="title">Amazon</span><span class="desc" aria-live="polite">Processing…</span></span>
        <span class="trail"><span class="spin" aria-hidden="true"></span></span>
      </button></li>
    </ul>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "List items",
    "type": "transaction",
    "vars": { "--surface":"tertiary/background/default", "--hover":"tertiary/background/hover", "--pressed":"tertiary/background/pressed", "--disabled-surface":"tertiary/background/disabled", "--text":"text/default", "--muted":"text/secondary", "--reverse":"text/reverse", "--disabled-text":"text/disabled", "--icon":"icon/default", "--divider":"divider/border/section", "--success":"rag/success", "--warning":"rag/warning", "--error":"rag/error", "--info":"rag/information", "--success-tint":"rag/success-tint", "--warning-tint":"rag/warning-tint", "--error-tint":"rag/error-tint", "--info-tint":"rag/information-tint", "--tag-border":"form/border/default", "--avatar":"tertiary/background/hover", "--focus":"focus/ring", "--page":"background/default" },
    "contrastPairs": [
      { "fg":"text/default", "bg":"tertiary/background/default", "context":"text" },
      { "fg":"text/secondary", "bg":"tertiary/background/default", "context":"text" },
      { "fg":"text/reverse", "bg":"tertiary/background/pressed", "context":"text" },
      { "fg":"text/default", "bg":"rag/success-tint", "context":"text" },
      { "fg":"text/default", "bg":"rag/warning-tint", "context":"text" },
      { "fg":"text/default", "bg":"rag/error-tint", "context":"text" },
      { "fg":"text/default", "bg":"rag/information-tint", "context":"text" },
      { "fg":"rag/success", "bg":"rag/success-tint", "context":"ui" },
      { "fg":"rag/error", "bg":"rag/error-tint", "context":"ui" },
      { "fg":"rag/information", "bg":"rag/information-tint", "context":"ui" }
    ],
    "knownFindings": [
      "pressed surface == default in dark (#1D1D1D) — press also signalled by inset, not colour",
      "status detail = Status-indicator atom (RAG tint chip): neutral label is AA on every tint (11-19:1); success/error/info dots pass on their tint, the WARNING dot is < 3:1 standalone (1.4.11) so meaning is carried by the label (1.4.1). Pressed reverses the chip out.",
      "text/secondary on tertiary/background/hover (dark) 3.34 < 4.5 — flagged token-level (see meta $finding)"
    ],
    "requiredAria": ["<ul", "<li", "<button", "aria-busy", "aria-live", "aria-disabled", "aria-label"],
    "reuses": ["Avatar (round primitive)", "Tags (square chip)", "Loading indicator (spinner primitive — processing state; mirror, not hard-code)", "Status indicator (RAG tint chip — the status detail IS form B of the atom)"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });
    const w=document.getElementById('w'), wv=document.getElementById('wv');
    w.addEventListener('input', ()=>{ document.querySelectorAll('.wrap').forEach(el=>el.style.setProperty('--demo-width', w.value+'px')); wv.textContent=w.value; });
    document.getElementById('dense').addEventListener('change', e=>{ document.documentElement.style.setProperty('--row-h', e.target.checked?'48px':'64px'); });

    /* roving keyboard navigation on the live list — Arrow Up/Down + Home/End move focus between rows
       (one row in the tab sequence at a time). Enter/Space activate natively. Skips disabled rows. */
    const live=document.getElementById('liveList'); const rows=[...live.querySelectorAll('.row')].filter(r=>!r.disabled);
    rows.forEach((r,i)=> r.tabIndex = i===0?0:-1);
    live.addEventListener('keydown', e=>{
      const i=rows.indexOf(document.activeElement); if(i<0) return;
      let j=null;
      if(e.key==='ArrowDown') j=Math.min(i+1, rows.length-1);
      else if(e.key==='ArrowUp') j=Math.max(i-1, 0);
      else if(e.key==='Home') j=0;
      else if(e.key==='End') j=rows.length-1;
      if(j!==null){ e.preventDefault(); rows[i].tabIndex=-1; rows[j].tabIndex=0; rows[j].focus(); }
    });
  </script>
</body>
</html>
