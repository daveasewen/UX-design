     covered here — this is a token-faithful starting point for Dave to extend.

  selection and deliberately left the two ACTION buttons inert, because each promised a surface the
  DOM did not contain (the phantom-affordance class). Dave ruled the CLASS at s218-D4 — build them —
  and each DESIGN is his to sign. What is added, PROPOSED and not ruled:
    · SEARCH → a DISCLOSURE, not a menu: the button reveals a full-width search bar beneath the
      masthead (aria-expanded + aria-controls), focus lands in the field, Escape closes and returns
      focus to the button. The field itself is Search-field's UNDERLINE form, copied — chrome, mag
      glyph, the value-only clear ×, and its `input:placeholder-shown ~ .clear{display:none}` rule.
      ⬛ The alternative reading is an INLINE field that replaces the nav row in place (no reveal);
      it is cheaper to draw and worse to operate on a narrow masthead. Dave's, named in the receipt.

      `.menu`/`.opt` skin via Card-header-lockup, role="menu"/"menuitem" semantics, declared.
      ⬛ Item copy ("Your profile" / "Settings" / "Sign out") is INVENTED, standing in for a real
      product menu; whether "Sign out" belongs in a menu at all is a product question, not a
      component one.
    · ⚠ THE F1 LESSON FROM #218 W3 IS APPLIED HERE, NOT RE-LEARNED: the revealed bar carries an
      explicit `[hidden]{display:none}` rule, because an author `display:` beats the UA's
      `[hidden]` sheet and a markup-hidden element then RENDERS while claiming to be absent.

  .nav-searchbar .search{position:relative; display:flex; align-items:center; height:48px;

    // follows the attribute and is never set a second time here.
    // ⬛ SUPERSEDED AT s218-D4 (the note that stood here said the Search and Account buttons were
    // NOT WIRED, deliberately, because they promised surfaces this artefact did not contain).
    // Dave ruled the class at #218: BUILD the missing surfaces. Both now exist in the markup above
    // and both triggers name them, so aria-expanded is a true statement rather than a false promise.
    // The DESIGNS are PROPOSED, not ruled — see the header block and the receipt.
    (function(){
      var nav = document.querySelector('nav.main');
      if (!nav) return;
      var items = Array.prototype.slice.call(nav.querySelectorAll('a'));

      function setCurrent(a){
        items.forEach(function(x){
          if (x === a){ x.setAttribute('aria-current','page'); }
          else { x.removeAttribute('aria-current'); }
        });
      }

        if (!a) return;
        // Enter activates natively (it fires click). Space does not, so it is added by hand.
        if (e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); setCurrent(a); return; }

        // landmark, and every one of them must stay reachable by Tab.

        else if (e.key === 'ArrowLeft') n = (i - 1 + items.length) % items.length;
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = items.length - 1;
        if (n !== null){ e.preventDefault(); items[n].focus(); }

    // explicit CSS rule above making it obey), aria-expanded mirrors it, focus moves INTO the field
    // on open because a revealed field the user must go hunting for is a reveal that failed.

      var bar  = document.getElementById('navSearch');
      if (!trig || !bar) return;
      var input = document.getElementById('navSearchInput');
      var clear = bar.querySelector('.clear');

      function setOpen(open){
        bar.hidden = !open;
        trig.setAttribute('aria-expanded', String(open));
        if (open && input) input.focus();

        if (e.key === 'Escape' && !bar.hidden){ setOpen(false); }

      // Enter key is stopped HERE and declared, rather than pretending to search.
      if (input) input.addEventListener('keydown', function(e){ if (e.key === 'Enter') e.preventDefault(); });
    })();

    // ---- PROPOSED (s218-D4) · THE ACCOUNT MENU -----------------------------------------------
    // Card-header-lockup's `wireMenu` (Dropdown's open/close/keyboard walk with menu semantics),
    // EXTENDED not re-invented: Escape from the trigger, Home/End, and Tab-out-closes, because an
    // APG menu is non-modal and leaving it must dismiss it. No polling, no network, no external src.

      var trig = document.getElementById('navAcctTrig');
      var menu = document.getElementById('navAcctMenu');
      if (!trig || !menu) return;

      function setOpen(open, focusLast){

        trig.setAttribute('aria-expanded', String(open));

      }

        setOpen(false);
        if (returnFocus) trig.focus();
      }

      trig.addEventListener('click', function(){ setOpen(menu.getAttribute('data-open') !== 'true', false); });
      trig.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); setOpen(true, false); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); setOpen(true, true); }
        else if (e.key === 'Escape'){ close(false); }

          else if (e.key === 'End'){ e.preventDefault(); items[items.length - 1].focus(); }
          else if (e.key === 'Escape'){ e.preventDefault(); close(true); }
          else if (e.key === 'Tab'){ close(false); }

      });

        if (!(e.target.closest && e.target.closest('.nav-menuwrap'))) close(false);
