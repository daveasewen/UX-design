  we're using the table as the fallback position for Ally" — SOLID TWO-STATE encoding (colour =
  close vs open only), bodies solid BOTH directions. This RETIRES the #96-D1 ① hollow-up
  shape-redundancy channel that a previous build of this file carried (hollow fill for up-candles,
  stroke-only, was judged and rejected after a live two-variant spread against a four-state
  prior-close convention — see reviews/CANDLESTICK-FOURSTATE-2026-08-05-v1.html, generator
  gen_candlestick_fourstate.py, seed 103). The OHLC data table below is the ACCESSIBILITY FALLBACK
  (colour-blind/greyscale reading) — it is not decorative.

  Standing rule (Dave, mid-flight, #100): "all these charts should be fully responsive, so the 580
  sizing doesn't really apply" — chart carries REALISTIC DENSITY (40 sessions, same seeded dataset
  as the ds-027 decision spread, seed 103) and is WIRED for dv-fit reflow: every candle group carries
  data-fx (fractional centre) + data-x0 (baked pixel centre) so knowledge/canon/dv-behaviour.js's
  fitOne() translates each candle group to the new x on resize — width compresses via reflow, never
  proportional scaling (DV-D02: text/geometry never scale). Axis gridlines/baseline/labels carry
  data-fx/data-fx2/data-dx per the Chart-bar convention. Previously this canon snippet's candles had
  NO data-fx at all and did not reflow — that gap is CLOSED here.

  WHAT'S REUSED, verbatim: 580×260 frame; plot 46→568 / 14→230; toolbar chrome (.dv-vt/.dv-csv/
  .dv-tbl-toggle/.dv-tablepanel) BYTE-FOR-BYTE from Chart-bar/Chart-scatter; AUTO-MARKUP
  dv-lockup-title/dv-lockup-table comment blocks; AUTO-BEHAVIOUR block from dv-behaviour.js.

  ⛔ ds-020 FENCE (unchanged, DIVVY-inherited): axis/grid CSS still uses the PRE-DV-D07 ink-at-alpha
  idiom, not the minted two-channel roles. Declared gap, not filled here.

  WHAT'S JUDGED for candlestick (ds-027, #100):
  · UP/DOWN = `data/delta/gain` (close ≥ open) · `data/delta/loss` (close < open) — two-state,
    colour = close vs open ONLY. These are the SAME tokens the RAG/delta colour workstream owns
    (canon.css `--data-delta-gain`/`--data-delta-loss`, light #16864E/#B92F1E · dark #1AA05C/#CC4333)
    — consumed here, not re-derived.
  · WICK = ink at REDUCED WEIGHT (opacity .6), 1px line from high to low.
  · BODY = a SOLID rect from open to close, fill = the direction token, BOTH directions
    (ds-027 — no stroke-only/hollow shape channel; the OHLC table carries the accessibility
    fallback instead of a second non-colour channel).
  · Table mirrors OHLC columns (Open/High/Low/Close) per period, 40 rows.

  RULES honoured: dv-017 var() fills only · dv-016 ≥3:1 series + axis both modes (declared, not yet
  render-verified — see receipt) · composites-only type (DV-D05/DV-D08 12px floor) · DEF-003 CSS-only

  ★ #260 (s259-D1 fast follower) — THE CANVAS IS NOW ENGINE-DRAWN. It ships as an EMPTY <svg> and

  the foot of this file — the SAME seed-103 forty-session set this table carries.
  · OHLC IS FOUR NAMED SERIES, in order: open, high, low, close. That is the s249-D4 spec
    UNEXTENDED, and it is why the engine's own table spine emits exactly the columns this file
    baked by hand — which ds-027 makes THE accessibility answer, not a decoration.
  · ds-027 is enacted by the partial, not by the markup: colour is close-vs-open only, both
    directions SOLID, `--data-delta-gain`/`--data-delta-loss` consumed verbatim.
  · The partial validates what only this type can: a high below its own open/close/low, a low
    above them, a series out of order, or anything other than four series THROWS, named.
  · JS-OFF: no candles — the authored <table> below is the whole answer, which is precisely the
    position ds-027 put it in ("we're using the table as the fallback position for Ally").

          ' / low ' + l + ' — the HIGH is the session\'s highest price, always');
      }
      if (l > o || l > c) {
        bad('"' + ctx.cats[i] + '" has low ' + l + ' above open ' + o + ' / close ' + c +
          ' — the LOW is the session\'s lowest price, always');
      }
    }
    return out;
  }

  function candlestick(ctx) {
    ctx.out.length = 0;                 /* ⚠ the core's zero-floored furniture — see the header */

    var S = ohlc(ctx), n = ctx.cats.length, i;
    if (n < 1) { bad('a price series needs at least one session'); }

    /* OUR OWN SCALE — the series' own extent, nice-stepped by the core's own routine so the
       ticks read the way every other chart's do. NOT floored at zero: see the header. */
    var lo = Infinity, hi = -Infinity;
    for (i = 0; i < n; i++) {
      if (S.low[i] < lo) { lo = S.low[i]; }
      if (S.high[i] > hi) { hi = S.high[i]; }
    }
    if (hi === lo) { lo -= 1; hi += 1; }        /* a genuinely flat run centres, never /0 */
    var sc = nice(lo, hi, 4), span = sc.max - sc.min;
    var Y = function (v) { return ctx.y0 - (v - sc.min) / span * ctx.plotH; };

    /* FURNITURE, re-emitted against the scale actually drawn — the core's grammar verbatim
       (gridline data-fx/data-fx2, tick label data-fx="0"+data-dx, baseline in --baseline). */
    for (i = 0; i < sc.ticks.length; i++) {
      var ty = Y(sc.ticks[i]);
      ctx.push('<line class="dv-grid" x1="' + n1(ctx.PL) + '" y1="' + n1(ty) + '" x2="' +
        n1(ctx.PL + ctx.plotW) + '" y2="' + n1(ty) +
        '" stroke="var(--data-grid)" data-fx="0" data-fx2="1"/>');
      ctx.push('<text class="dv-axis t-cm-chart-value" fill="var(--data-axis)" x="' +
        n1(ctx.PL - 8) + '" y="' + n1(ty + 3) + '" text-anchor="end" data-fx="0" data-dx="-8" ' +
        'data-dy="3">' + esc(ctx.fmt(sc.ticks[i])) + '</text>');
    }
    ctx.push('<line class="dv-axis" x1="' + n1(ctx.PL) + '" y1="' + n1(ctx.y0) + '" x2="' +
      n1(ctx.PL + ctx.plotW) + '" y2="' + n1(ctx.y0) +
      '" stroke="var(--baseline)" data-fx="0" data-fx2="1"/>');

    /* THE CANDLES. One <g> per session carrying data-fx (fractional centre) + data-x0 (the baked
       centre): dv-behaviour translates the group, so nothing inside it is ever re-scaled. */
    var band = ctx.plotW / n, bw = band * BODY;
    if (bw < 1) { bw = 1; }
    for (i = 0; i < n; i++) {
      var o = S.open[i], h = S.high[i], l = S.low[i], c = S.close[i];
      var cx = ctx.PL + (i + 0.5) * band, up = c >= o;
      var top = Y(Math.max(o, c)), bh = Math.abs(Y(o) - Y(c));
      if (bh < DOJI) { bh = DOJI; }             /* a doji is still a session, and still ink */
      var words = ctx.cats[i] + ': open ' + ctx.fmt(o) + ', high ' + ctx.fmt(h) +
        ', low ' + ctx.fmt(l) + ', close ' + ctx.fmt(c);
      ctx.push('<g class="dv-candle" data-fx="' + f4((i + 0.5) / n) + '" data-x0="' + n1(cx) +
        '" style="animation-delay:' + Math.round(i * STAGGER / n) + 'ms">' +
        '<line class="dv-wick" x1="' + n1(cx) + '" y1="' + n1(Y(h)) + '" x2="' + n1(cx) +
        '" y2="' + n1(Y(l)) + '"></line>' +
        /* ds-027 — SOLID both ways; the class carries the state and the fill attribute carries
           the same token, so the dataviz gate can read a colour it would otherwise never see. */
        '<rect class="dv-body dv-series ' + (up ? 'dv-up' : 'dv-down') + '" data-series-i="' +
        (up ? 1 : 2) + '" fill="var(--data-delta-' + (up ? 'gain' : 'loss') + ')" x="' +
        n1(cx - bw / 2) + '" y="' + n1(top) + '" width="' + n1(bw) + '" height="' + n1(bh) +
        '" tabindex="0" role="img" aria-label="' + esc(words) + '" data-tip="' + esc(words) +
        '"></rect></g>');
    }

    /* PERIOD LABELS. Forty ticks would collide into a grey smear, so past a dozen sessions only
       the FIRST and LAST are drawn — the promoted bake's own answer, and the table is the rest. */
    for (i = 0; i < n; i++) {
      if (n > 12 && i !== 0 && i !== n - 1) { continue; }
      var lx = ctx.PL + (i + 0.5) * band;
      ctx.push('<text class="dv-label t-cm-chart-label" fill="var(--data-axis)" x="' + n1(lx) +
        '" y="' + n1(ctx.y0 + 16) + '" text-anchor="middle" data-fx="' + f4((i + 0.5) / n) +
        '">' + esc(ctx.cats[i]) + '</text>');
    }

    /* ds-027's promised summary, not a 48-phrase enumeration — see the header. */
    if (ctx.spec.label === undefined || ctx.spec.__dvLabel) {
      ctx.spec.label = (ctx.spec.caption || 'Price') + '. Ranges from a low of ' + ctx.fmt(lo) +
        ' to a high of ' + ctx.fmt(hi) + ', opening ' + ctx.fmt(S.open[0]) + ' and closing ' +
        ctx.fmt(S.close[n - 1]) + ' across ' + n + ' session' + (n === 1 ? '' : 's') + '.';
      ctx.spec.__dvLabel = true;
    }
  }

  candlestick.axis = 'y';   /* value runs UP, sessions along x — the cartesian default */
  T.candlestick = candlestick;
}());
</script>
