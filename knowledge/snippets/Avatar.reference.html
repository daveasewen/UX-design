<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for Avatar (gated). FULLY ROUND — Avatar is one of the two documented
  exemptions to the angular brand rule (the other is Badge). Initials or icon on a neutral
  surface; the meta still binds deprecated non-interactive surface/border tokens — rebound here
  to the live tertiary/background/hover (surface) + border/subtle (ring). Sizes small/medium/large.
-->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{ --surface:#F3F3F3; --ring:#D7D8D6; --text:#333333; --icon:#333333; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --surface:#212121; --ring:#404040; --text:#FFFFFF; --icon:#FFFFFF; --focus:#4587A7; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:2rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--ring); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  h2{font-size:12px; letter-spacing:.04em; text-transform:uppercase; opacity:.55; margin:1.5rem 0 1rem;}
  .row{display:flex; gap:18px; align-items:center;}
  .avatar{border-radius:50%; /* EXEMPTION: round */ background:var(--surface); color:var(--text);
    display:inline-flex; align-items:center; justify-content:center; font-weight:500; overflow:hidden;}
  .avatar.sm{width:32px; height:32px; font-size:13px;} .avatar.md{width:44px; height:44px; font-size:16px;} .avatar.lg{width:64px; height:64px; font-size:22px;}
  .avatar svg{width:60%; height:60%; fill:var(--icon);}
  a.avatar{cursor:pointer; text-decoration:none;} a.avatar:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Avatar — canonical reference (round exemption)</span></div>

  <h2>Initials</h2>
  <div class="row">
    <span class="avatar sm" role="img" aria-label="Jordan Lee">JL</span>
    <span class="avatar md" role="img" aria-label="Priya Anand">PA</span>
    <span class="avatar lg" role="img" aria-label="Sam Okafor">SO</span>
  </div>

  <h2>Icon (no name)</h2>
  <div class="row">
    <span class="avatar md" role="img" aria-label="Guest user"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-9 2-9 5v2h18v-2c0-3-5-5-9-5Z"/></svg></span>
  </div>

  <h2>Interactive (links to profile)</h2>
  <div class="row">
    <a class="avatar md" href="#" aria-label="Open Jordan Lee's profile">JL</a>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Avatar",
    "vars": { "--focus": "focus/ring", "--surface": "tertiary/background/hover", "--text": "text/default", "--icon": "icon/default", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "tertiary/background/hover", "context": "text" }
    ],
    "requiredAria": ["role=\"img\"", "aria-label"]
  }
  </script>
  <script>document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });</script>
</body>
</html>
