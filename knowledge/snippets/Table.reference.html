<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for Data table (gated). Real semantic <table> with <caption> and
  <th scope="col"> / <th scope="row"> so AT associates every cell with its row+column header
  (1.3.1). Demonstrates the both-header variant (first row + first column) and a right-aligned
  numeric column. Colours = resolved canonical tokens from the dedicated table/* group
  (header #EDEDED/#212121, column #F3F3F3/#1D1D1D, border #D7D8D6/#404040) + background/default
  cells + text/default. SQUARE corners (angular rule). Horizontal scroll wrapper keeps the table
  usable under reflow (1.4.10). BASELINE: sort and small-screen reflow strategy need design review.
-->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease; }
  [data-theme="light"]{ --header:#EDEDED; --colhdr:#F3F3F3; --cell:#FFFFFF; --border:#D7D8D6; --text:#333333; --hover:#F3F3F3; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --header:#212121; --colhdr:#1D1D1D; --cell:#000000; --border:#404040; --text:#FFFFFF; --hover:#474747; --focus:#4587A7; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text);
    -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .scroll{overflow-x:auto;}                 /* reflow: never lose header association */
  table{border-collapse:collapse; width:100%; min-width:520px; background:var(--cell); border:1px solid var(--border); border-radius:0;}
  caption{text-align:left; font:600 13px/1.4 var(--font); padding:0 0 10px; color:var(--text);}
  th,td{padding:12px 16px; border:1px solid var(--border); font:300 15px/1.4 var(--font); text-align:left; vertical-align:middle;}
  thead th{background:var(--header); font-weight:500;}      /* table/header/background, font-5 medium */
  tbody th[scope="row"]{background:var(--colhdr); font-weight:500; text-align:left;}  /* table/column/background */
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}  /* right-align numeric for scanning */
  tbody tr:hover td, tbody tr:hover th[scope="row"]{background:var(--hover);}
  tbody tr:hover th[scope="row"]{filter:none;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Table — canonical reference (both-header, numeric)</span></div>

  <div class="scroll">
    <table>
      <caption>Account balances at 19 June 2026</caption>
      <thead>
        <tr>
          <th scope="col">Account</th>
          <th scope="col">Sort code</th>
          <th scope="col">Account number</th>
          <th scope="col" class="num">Available balance</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Current account</th>
          <td>40-12-08</td><td>•••• 4821</td><td class="num">£2,140.50</td>
        </tr>
        <tr>
          <th scope="row">Savings account</th>
          <td>40-12-08</td><td>•••• 9032</td><td class="num">£8,500.00</td>
        </tr>
        <tr>
          <th scope="row">Credit card</th>
          <td>40-12-08</td><td>•••• 1190</td><td class="num">−£312.18</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Table",
    "vars": { "--header": "table/header/background", "--colhdr": "table/column/background", "--cell": "background/default", "--border": "table/border", "--text": "text/default", "--hover": "tertiary/background/hover", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "text/default", "bg": "table/header/background", "context": "text" },
      { "fg": "text/default", "bg": "table/column/background", "context": "text" }
    ],
    "requiredAria": ["<caption", "scope=\"col\"", "scope=\"row\""]
  }
  </script>
  <script>document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });</script>
</body>
</html>
