<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick actions — reference implementation (gated)</title>
<!-- CANONICAL REFERENCE for Quick actions (gated). A grid of icon+label shortcut buttons. icon/default
     + text/default; pressed uses the inverting fill. ≥44px targets; each has an accessible name.
     MOTION (promoted 2026-06-29): reflects the Button scale-physics — grow toward the cursor on hover,
     depress on press, through SCALE only (no shadow/translate; brand stays flat/angular). The press also
     inverts the tile (icon flips to on-pressed via currentColor) — the icon's active state. -->
<style>
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded. Added 2026-06-29. */
:is(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --ease:140ms ease;
    --spring:300ms cubic-bezier(.5,1.6,.4,1);   /* motion/easing/spring + motion/duration/spring — grow/release */
    --press:90ms cubic-bezier(0,0,.58,1);        /* motion/duration/press + motion/easing/out — snappy depress */
    --qa-grow:1.05; --qa-press:0.94; }           /* interaction motion — CSS scale-factor tokens (tokenised 2026-07-15; formerly runtime JS-computed) */
  [data-theme="light"]{ --surface:#FFFFFF; --hover:#F3F3F3; --pressed:#767676; --text:#333333; --icon:#333333; --on-pressed:#FFFFFF; --border:#D7D8D6; --focus:#305A85; --page:#FFFFFF; }
  [data-theme="dark"]{ --surface:#1D1D1D; --hover:#212121; --pressed:#474747; --text:#FFFFFF; --icon:#FFFFFF; --on-pressed:#FFFFFF; --border:#707070; --focus:#4587A7; --page:#1A1A1A; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:2rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button.tg{font:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--pressed); background:transparent; color:var(--text); cursor:pointer;}
  .demo-controls button.tg:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .grid{display:grid; grid-template-columns:repeat(4,96px); gap:12px;}
  /* MOTION: scale-physics mirrors Button — --qa-grow/--qa-press are CSS scale-factor tokens (tokenised
     2026-07-15; formerly runtime JS-computed), constant regardless of tile size. Colour inversion on :active
     stays as the icon's active state (svg = currentColor → on-pressed). */
  .qa{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:88px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font:500 12px/1.2 var(--font);
    transition:background var(--ease), color var(--ease), transform var(--spring);}
  .qa:hover{background:var(--hover); transform:scale(var(--qa-grow));}
  .qa:active{background:var(--pressed); color:var(--on-pressed); transform:scale(var(--qa-press)); transition:transform var(--press), background var(--ease), color var(--ease);}
  .qa:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .qa svg{width:24px; height:24px; fill:currentColor;}

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    .qa:hover,.qa:active{ transform:none !important; }   /* no scale-physics under reduced-motion; colour state remains */
  }
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button class="tg" id="themeToggle" type="button">◐ Toggle theme</button><span>Quick actions — canonical reference</span></div>

  <div class="grid" role="group" aria-label="Quick actions">
    <button class="qa"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M18 8.4H9.6V0H8.4V8.4H0V9.6H8.4V18H9.6V9.6H18V8.4Z"/></svg>Transfer</button>
    <button class="qa"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M16.5 6H1.5C0.675 6 0 6.675 0 7.5V16.5C0 17.325 0.675 18 1.5 18H16.5C17.325 18 18 17.325 18 16.5V7.5C18 6.675 17.325 6 16.5 6ZM16.8 16.5C16.8 16.663 16.663 16.8 16.5 16.8H1.5C1.337 16.8 1.2 16.663 1.2 16.5V10.2H16.8V16.5ZM16.8 9H1.2V7.5C1.2 7.337 1.337 7.2 1.5 7.2H16.5C16.663 7.2 16.8 7.337 16.8 7.5V9ZM15 12H12V13.2H15V12ZM13.05 1.221C13.085 1.207 13.122 1.2 13.159 1.2C13.262 1.2 13.389 1.258 13.441 1.387L14.82 4.8H16.114L14.553 0.938C14.318 0.355 13.753 0 13.159 0C12.973 0 12.784 0.035 12.601 0.109L0.988 4.8H4.192L13.05 1.221Z"/></svg>Pay bill</button>
    <button class="qa"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M9 0C4.029 0 0 4.029 0 9C0 13.97 4.029 18 9 18C13.971 18 18 13.97 18 9C18 4.029 13.971 0 9 0ZM13 10L12.97 10.03L9.75 6.81V14H8.25V6.811L5.03 10.031L5 10V7.939L9 3.939L13 7.939V10Z"/></svg>Top up</button>
    <button class="qa"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M0 1.73404L2.93837 9L0 16.266L18 9L0 1.73404ZM2.1688 14.0972L3.98778 9.59967H10.0944L11.5836 9L10.0944 8.40034H3.98778L2.1688 3.90283L14.7818 9L2.1688 14.0972Z"/></svg>Send</button>
  </div>

  <script type="application/json" id="token-manifest">
  {
    "component": "Quick actions",
    "vars": { "--surface": "tertiary/background/default", "--hover": "tertiary/background/hover", "--text": "text/default", "--icon": "icon/default", "--border": "border/subtle", "--focus": "focus/ring", "--page": "background/default" },
    "contrastPairs": [
      { "fg": "text/default", "bg": "tertiary/background/default", "context": "text" },
      { "fg": "icon/default", "bg": "tertiary/background/default", "context": "ui" }
    ],
    "requiredAria": ["<button", "aria-label"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });
  </script>
</body>
</html>
