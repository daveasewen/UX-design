  ★ NET-NEW EXEMPLAR — chart-expansion programme, prove-one-then-wave (Dave 2026-07-22). This is the
  FIRST of the 8 net-new chart types; built end-to-end for Dave to eyeball the LOCK-UP shape (chart +
  controls toolbar + legend + <table> spine, projected across 4 themes × light/dark) BEFORE the wave.
  PROVISIONAL-AGENT until Dave signs off the lock-up (open-014 class; the parked dataviz kit itself is
  not signed off either).

  WHAT'S REUSED, verbatim, from the promoted kit vocabulary (OBSERVED — Chart-line/bar are the source):
  580×260 frame; plot 46→568 / 14→230; the data/series/* palette (#766682 / #A45C3A / #577C78,
  dv-016 floor-clean both modes 3.31–5.26); per-series MARKER SHAPES + letters + names so colour is
  never the only channel (dv-011 / §04.3: circle · square · diamond, keyed A/B/C); markers carry a
  page-colour separating stroke (overlap legibility, halation-aware — R-D6 bloom, adds no absolute
  white on dark); axis/label/grid inks = ink at alpha (as Chart-bar/line — the kit greys have no
  post-R-D16 home; the quiet-ink token gap data/axis+data/grid stays receipted, D-side); legend was
  ORIGINALLY a static list (no pressables) -- MIGRATED to the live DV-D11 model 2026-08-01 (#66-D3,
  see DV-J2b below); table = native <details> drawer; DV-D02 static answer
  = fixed geometry + horizontal scroll, text never scales; CSS-only entry motion (DEF-003).

  WHAT'S NEWLY JUDGED for scatter (receipted for Dave's eyeball):
  · TWO quantitative axes (income × savings) — so BOTH horizontal AND vertical gridlines, plus numeric
    tick labels on each axis and compact axis titles. Line/bar only needed one quantitative axis.
  · Markers ARE the series (no connecting line) → they carry class="dv-series" so the gate sees the
    fills directly (dv-016 checks each against the surface, both modes).
  · Entry = a gentle staggered fade of the points (no line to draw against); reduced-motion safe.
  · No trend/regression line in the exemplar — points only (keeps it pure; a straight reference line
    is a Layer-2 option to raise with Dave, not baked here).

  RULES honoured: dv-017 var() fills only · dv-016 ≥3:1 series + axis both modes · dv-011/§04.3 colour
  never the only channel · dv-009 flat fills (no gradient/filter) · composites-only type (DV-D05 12px
  step) · DEF-003 CSS-only motion · role-token radius only. Empty state consumes the Empty-state
  pattern by reference. Metas are INLINE (#token-manifest) — the kit convention.
-->

  /* AA 2.5.8 — invisible 24x24 (r=12) hit target per point; carries the interactive attrs
     (tabindex/role/aria-label/data-tip) moved off the visible mark so focus, tooltip and
     pointer all bind to the 24px target rather than the 9px glyph. Sibling to .dv-pt within
     the same .dv-marker <g>, so it rides the same entry-fade opacity as the visible mark
     (the group animates as one; no separate opacity/fill animation to dodge). */
  .dv-hit{stroke:none; cursor:pointer;}
  .dv-hit:focus-visible{outline:2px solid var(--ink); outline-offset:1px;}

  /* entry motion — CSS only (DEF-003): points fade in on a gentle stagger (no line to draw against) */

  }

  /* DV-D11 legend model (dv-legend behaviour, #66-D3) — migrated from the dead static
     `.dv-legend` list (matched-grep-≠-presence defect, `_check_legend_migration.py`). ONE row
     per series: SWATCH = checkbox (show/dim), LABEL = isolate. Horizontal here (scatter has no
     side gutter like donut's `.vert`); centred under the chart. Ported from the signed-off
     reference reviews/LEGEND-ISOLATE-TOGGLE-PROTOTYPE-2026-07-24-v5.5.html; prototype-local
     tokens resolved to canon (--disabled-ink → --text-disabled, --border-disabled). */
  /* Legend lockup layout — keys ranged LEFT / Reset right-inline (RULED, legend v5 review-edits
     brief 2026-07-25; recovered #69 after going unenacted — Dave: "decided over a week ago").
     On wrap (narrow) the lockup centres; 520px is an AGENT PLACEHOLDER breakpoint, Dave's eye rules it. */
  .dv-leg{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:16px; --hit:44px;}
  .dv-leg-reset-wrap{margin-left:auto;}
  @media (max-width:520px){
    .dv-leg{justify-content:center;}
    .dv-leg-reset-wrap{margin-left:0; width:100%; display:flex; justify-content:center;}
  }
  /* the row = the bordered box carrying BOTH controls; the row itself is not interactive */
  .dv-legrow{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:var(--border-radius-control);
    padding:4px 8px; background:transparent; transition:border-color var(--ease), background var(--ease);}
  .dv-legrow:hover{border-color:var(--ink);}
  .dv-legrow.is-solo{border-color:var(--ink); background:color-mix(in srgb, var(--ink) 6%, transparent);}
  /* SWATCH = checkbox — filled when shown; hollow + grey-primitive border when hidden.
     HIT AREA: Apollo 44 via an invisible ::before. The swatch is ONE component, so 44 EVERYWHERE
     (Dave 2026-07-25, reverses the 24px dense-case proposal); it grows LEFT into the gutter so
     its target never overlaps the isolate label. Data marks stay EXEMPT (target = data geometry). */
  .dv-leg-sw{position:relative; width:12px; height:12px; flex:none; display:inline-block; cursor:pointer;
    background:var(--sc); border:1px solid var(--sc); transition:background var(--ease), border-color var(--ease);}
  .dv-leg-sw::before{content:""; position:absolute; z-index:0; min-width:var(--hit,44px); min-height:var(--hit,44px);
    width:100%; height:100%; top:50%; right:0; left:auto; transform:translateY(-50%);}
  .dv-leg-sw[aria-checked="false"]{background:transparent; border-color:var(--data-control-swatch-off);}
  .dv-leg-sw:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  /* LABEL = isolate toggle-button — borderless (the row carries the box); pressed reads via .is-solo */
  .dv-leg-item{display:inline-flex; align-items:center; gap:8px; flex:1 1 auto; position:relative;
    margin:-4px -8px -4px 0; padding:4px 8px 4px 0;
    background:transparent; border:0; color:var(--ink); cursor:pointer; text-align:left; font:inherit;}
  .dv-leg-item::before{content:""; position:absolute; z-index:0; min-width:var(--hit,44px); min-height:var(--hit,44px);
    width:100%; height:100%; top:50%; left:50%; transform:translate(-50%,-50%);}
  .dv-leg-item:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .dv-leg-item > *{position:relative; z-index:1;}   /* keep the key + name above the invisible target */

  .dv-leg-name{white-space:nowrap;}

     ghost or isolate; hover lifts the border to ink. */
  .dv-leg-reset{position:relative; font:inherit; font-size:12px; padding:4px 12px;
    border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;

  .dv-leg-reset::before{content:""; position:absolute; z-index:0; min-width:var(--hit,44px); min-height:var(--hit,44px);

  details.dv-tbl{position:static; margin:0;}
  details.dv-tbl > summary{list-style:none; cursor:pointer;}
  details.dv-tbl > summary::-webkit-details-marker{display:none;}
  details.dv-tbl[open] > .dv-tbl-toggle{border-color:var(--ink);}

  .dv-tip.on{opacity:1;}
  table.dv-table{border-collapse:collapse; margin-top:8px; color:var(--ink);}
  table.dv-table caption{text-align:left; opacity:var(--alpha-60); margin-bottom:4px;}
  table.dv-table th,table.dv-table td{border:1px solid var(--line); padding:4px 12px; text-align:right;}

      st.mode = 'rest'; st.isolated = null; st.focus = null; announce(st, 'Isolation released');
    } else {
      st.mode = 'isolate'; st.isolated = id; st.focus = {}; st.focus[id] = true;
      announce(st, 'Showing only ' + nameOf(st, id) + ' — check a blank swatch to add a series');
    }
    render(st);
  }
  function resetAll(st) {
    st.mode = 'rest'; st.isolated = null; st.focus = null;
    st.ids.forEach(function (id) { st.visible[id] = true; });
    announce(st, 'All series shown');
    render(st);
  }

  /* ---------- DELEGATED EVENTS — document-level, resolved to a legend by closest('.dv-leg'). */
  function hostOf(el) { return el && el.closest ? el.closest('.dv-leg') : null; }
  document.addEventListener('click', function (e) {
    var t = e.target, host = hostOf(t);
    if (!host) { return; }
    var sw = t.closest('.dv-leg-sw');
    if (sw) { toggleSwatch(rec(host), sw.closest('.dv-legrow').getAttribute('data-series')); return; }
    var it = t.closest('.dv-leg-item');
    if (it) { isolate(rec(host), it.getAttribute('data-series')); return; }
    var rs = t.closest('.dv-leg-reset');
    if (rs && !rs.disabled) { resetAll(rec(host)); }
  });
  /* swatch keyboard: Space / Enter toggles the checkbox (it is a role=checkbox span, so the
     native button activation the label gets for free has to be supplied here). */
  document.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Spacebar' && e.key !== 'Enter') { return; }
    var sw = e.target.closest && e.target.closest('.dv-leg-sw');
    var host = hostOf(sw);
    if (!sw || !host) { return; }
    e.preventDefault();
    toggleSwatch(rec(host), sw.closest('.dv-legrow').getAttribute('data-series'));
  });
  /* hover / focus preview — keyed off the whole ROW (either control) and off the marks
     themselves. pointerover/out delegate where mouseenter/leave cannot (they do not bubble);
     the lastHi guard makes the repeated child-to-child crossings idempotent. */
  function hiTarget(e) {
    var el = e.target.closest && e.target.closest('.dv-legrow, .dv-series[data-series-group]');
    if (!el) { return null; }
    var host = el.classList.contains('legrow') ? hostOf(el)
      : (el.closest('figure') || document).querySelector('.dv-leg');
    if (!host || !host.querySelector('.dv-legrow')) { return null; }
    return { st: rec(host), id: el.getAttribute('data-series') || el.getAttribute('data-series-group') };
  }
  document.addEventListener('pointerover', function (e) {
    var t = hiTarget(e); if (t) { highlight(t.st, t.id); }
  });
  document.addEventListener('pointerout', function (e) {
    var t = hiTarget(e);
    if (t && !(e.relatedTarget && e.relatedTarget.closest && hiTarget({ target: e.relatedTarget }))) {
      clearFade(t.st);
    }
  });
  document.addEventListener('focusin', function (e) {
    var t = hiTarget(e); if (t) { highlight(t.st, t.id); }
  });
  document.addEventListener('focusout', function (e) {
    var t = hiTarget(e); if (t) { clearFade(t.st); }
  });

  /* ---------- DV-D13 — the Value⇄Percent seg rewrites each mark's data-tip from
     data-tip-value / data-tip-percent, so the tip carries ONLY the selected number-type.
     dv-behaviour reads data-tip live at hover-time, so this needs no re-wire there.
     aria-labels deliberately keep BOTH forms: a screen-reader user should not lose data to a
     toggle they may never perceive (flagged in DV-D13, confirm at the a11y pass). */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('button[data-dv-view-btn]');
    if (!btn) { return; }
    var fig = btn.closest('figure'); if (!fig) { return; }
    var mode = btn.getAttribute('data-dv-view-btn');
    var els = fig.querySelectorAll('[data-tip-' + mode + ']');
    for (var i = 0; i < els.length; i++) {
      els[i].setAttribute('data-tip', els[i].getAttribute('data-tip-' + mode));
    }
  });

  /* ---------- INIT — discover every legend and render its resting state.
     Wrapped: a malformed legend must never take the baked SVG down with it. */
  try {
    var legs = document.querySelectorAll('.dv-leg');
    for (var i = 0; i < legs.length; i++) {
      if (legs[i].querySelector('.dv-legrow')) { render(rec(legs[i])); }
    }
  } catch (e) { /* leave the baked SVG intact */ }
}());
</script>
  <!-- ===== AUTO-BEHAVIOUR dv-legend END ===== -->
  </body>
</html>
