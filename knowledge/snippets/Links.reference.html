<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links — reference implementation (gated)</title>
<!--
  CANONICAL REFERENCE for text Links (gated). Links are distinguished by an UNDERLINE,
  not colour alone (1.4.1). Keyboard focus = a thickened underline via :focus-visible in
  the link's own colour (text/default) — the link variant of the focus standard, no blue.
  The directional arrow uses the brand red via the SEMANTIC primary/background/default
  (#DB0011 both modes); the meta currently binds the color/primary primitive — rebind noted.
-->
<style>
  :root{ --font:"Univers Next for HSBC","Helvetica Neue",Arial,Helvetica,sans-serif; --fs:16px; --ease:140ms ease; }
  [data-theme="light"]{ --text:#333333; --text-disabled:#D7D8D6; --arrow:#DB0011; --icon:#333333; --page:#FFFFFF; }
  [data-theme="dark"]{ --text:#FFFFFF; --text-disabled:#767676; --arrow:#DB0011; --icon:#FFFFFF; --page:#000000; }
  *{box-sizing:border-box;}
  body{margin:0; padding:2.5rem; font-family:var(--font); background:var(--page); color:var(--text);
    font-size:var(--fs); line-height:1.6; -webkit-font-smoothing:antialiased; transition:background var(--ease), color var(--ease);}
  .demo-controls{margin-bottom:1.75rem; display:flex; gap:.75rem; align-items:center; font-size:13px;}
  .demo-controls button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--text-disabled); background:transparent; color:var(--text); cursor:pointer;}
  h2{font-size:12px; letter-spacing:.04em; text-transform:uppercase; opacity:.55; margin:1.6rem 0 .5rem;}
  p{max-width:60ch;}
  a.lnk{color:var(--text); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; cursor:pointer;
    border-radius:0; transition:text-decoration-thickness var(--ease);}
  a.lnk:hover{text-decoration-thickness:2px;}
  /* keyboard focus = thick underline, own colour, no blue ring */
  a.lnk:focus-visible{outline:none; text-decoration:none; box-shadow:inset 0 -3px 0 var(--text);}
  a.lnk[aria-disabled="true"]{color:var(--text-disabled); text-decoration-color:var(--text-disabled); pointer-events:none;}
  a.arrow{display:inline-flex; align-items:center; gap:4px; text-decoration:none; color:var(--text); font-weight:500;}  /* tightened gap */
  a.arrow .tip{display:inline-flex; color:var(--arrow); transition:transform var(--ease);}   /* CTA arrow = brand red */
  a.arrow .tip svg{width:.85em; height:.85em; display:block; fill:currentColor;}   /* em-based → scales with the type size */
  a.arrow:hover .tip{transform:translateX(3px);}
  a.arrow:hover .lbl{text-decoration:underline; text-underline-offset:3px;}
  a.arrow:focus-visible{outline:none;}
  a.arrow:focus-visible .lbl{box-shadow:inset 0 -3px 0 var(--text);}
  a.back .tip{color:var(--icon);}                       /* back arrow = neutral icon colour */
  a.back:hover .tip{transform:translateX(-3px);}
</style>
</head>
<body data-theme="light">
  <div class="demo-controls"><button id="themeToggle" type="button">◐ Toggle theme</button><span>Links — canonical reference</span></div>

  <h2>Inline text link</h2>
  <p>Manage your account in <a class="lnk" href="#">your settings</a>, or <a class="lnk" href="#">download your statement (PDF)</a>. A <a class="lnk" aria-disabled="true" href="#">disabled link</a> is not actionable.</p>

  <h2>Arrow link (call to action)</h2>
  <p><a class="arrow" href="#"><span class="lbl">Open a new account</span><span class="tip" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M5 17L5 1L13 9L5 17Z" fill="currentColor"/></svg></span></a></p>

  <h2>Back link</h2>
  <p><a class="arrow back" href="#"><span class="tip" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M13 1L13 17L5 9L13 1Z" fill="currentColor"/></svg></span><span class="lbl">Back to overview</span></a></p>

  <h2>Arrow scales with type size</h2>
  <p style="display:flex; flex-direction:column; gap:14px; align-items:flex-start;">
    <a class="arrow back" style="font-size:14px" href="#"><span class="tip" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M13 1L13 17L5 9L13 1Z" fill="currentColor"/></svg></span><span class="lbl">Back (14px)</span></a>
    <a class="arrow back" style="font-size:20px" href="#"><span class="tip" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M13 1L13 17L5 9L13 1Z" fill="currentColor"/></svg></span><span class="lbl">Back (20px)</span></a>
    <a class="arrow back" style="font-size:28px" href="#"><span class="tip" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M13 1L13 17L5 9L13 1Z" fill="currentColor"/></svg></span><span class="lbl">Back (28px)</span></a>
  </p>

  <script type="application/json" id="token-manifest">
  {
    "component": "Links",
    "vars": {
      "--text": "text/default",
      "--text-disabled": "text/disabled",
      "--arrow": "primary/background/default",
      "--icon": "icon/default",
      "--page": "background/default"
    },
    "contrastPairs": [
      { "fg": "text/default", "bg": "background/default", "context": "text" },
      { "fg": "primary/background/default", "bg": "background/default", "context": "ui" }
    ],
    "requiredAria": ["<a ", "href", "aria-disabled"]
  }
  </script>
  <script>
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const b=document.body;
      b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); });
  </script>
</body>
</html>
