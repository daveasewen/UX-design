<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apollo KG — explorer</title>
<style>
:root{
  --bg:#FFFFFF;--ink:#111111;--ink-2:#555555;--ink-3:#8A8A8A;--rule:#E3E3E3;--panel:#F6F6F6;
  --accent:#DA1A00;
  --c-component:#DA1A00;--c-snippet:#7A7A7A;--c-pattern:#1F4FBF;--c-context:#0E8A5F;--c-ruling:#111111;--c-role:#8A4FBF;--c-intent:#B07A00;--c-shape:#0E6F8A;
  --c-session:#5E5E5E;--c-artefact:#8A7A66;--c-evidence:#A99C8B;--c-sc:#7A4B00;--c-guideline:#A06A16;--c-principle:#4A3000;--c-policy:#1F6B5B;--c-standard:#2F5488;--c-axe:#5B4B9E;
  --f-structure:#111111;--f-usage:#1F4FBF;--f-render:#7A7A7A;--f-rules:#DA1A00;
  /* v1.2 — governance reuses the rules red (authored solid, derived dashed); guidelines is an
     amber that passes on white. TWO-RED LAW s151-D1 untouched: --accent is the only red token. */
  --f-governance:#DA1A00;--f-guidelines:#7A4B00;
  /* #274 s274-D7..D12 — the guideline-rule family: one deep green for the node type and the
     edge family. Not a red: the TWO-RED LAW (s151-D1) is untouched. */
  --c-rule:#2E6B1F;--f-guidelinerules:#2E6B1F;
  /* #275 s275-D1..D6 — the UX-principle family: a plum for the principle node, a lighter
     sibling for the polarity hub, the plum again for the edge family. Not a red: the
     TWO-RED LAW (s151-D1) is untouched — --accent is still the only red token.
     #281 s281-D1 — a THIRD sibling, a deeper plum, for the 32 research-family hubs. A type with no
     --c- token paints transparent and a type with no CHIP is not drawn at all (#281 lane CM's second
     fall-through): the token and the chip are one change, never one without the other. */
  --c-ux:#8A1A5C;--c-polarity:#B03A7A;--c-family:#5E1149;--f-uxprinciples:#8A1A5C;
  /* #279 s277-D4 — the assets family: a teal for the icon glyph, a deeper sibling for the group
     hub, a slate for the logo lockup, the teal again for the edge family. Not a red: the
     TWO-RED LAW (s151-D1) is untouched — --accent is still the only red token. */
  --c-icon:#0B7285;--c-iconGroup:#075A6A;--c-logo:#4E6E8E;--f-assets:#0B7285;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C;--ink:#F2F2F2;--ink-2:#B5B5B5;--ink-3:#7A7A7A;--rule:#262626;--panel:#161616;
    --accent:#F6604C;--c-component:#F6604C;--c-snippet:#9A9A9A;--c-pattern:#6C94FF;--c-context:#3FCB98;--c-ruling:#F2F2F2;--c-role:#B58CE6;--c-intent:#E0A93A;--c-shape:#4FB3D6;
    --c-session:#8F8F8F;--c-artefact:#C2AE92;--c-evidence:#9E9384;--c-sc:#E0A155;--c-guideline:#D9A05B;--c-principle:#F0C68A;--c-policy:#4FC7AC;--c-standard:#7FA6E8;--c-axe:#A697E8;
    --f-structure:#F2F2F2;--f-usage:#6C94FF;--f-render:#9A9A9A;--f-rules:#F6604C;--f-governance:#F6604C;--f-guidelines:#D9A05B;--c-rule:#8FD67A;--f-guidelinerules:#8FD67A;
    --c-ux:#E68ABF;--c-polarity:#F0B4D6;--c-family:#F4C2DF;--f-uxprinciples:#E68ABF;
    --c-icon:#4FC3D9;--c-iconGroup:#8BD3E3;--c-logo:#9AB4D1;--f-assets:#4FC3D9;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C;--ink:#F2F2F2;--ink-2:#B5B5B5;--ink-3:#7A7A7A;--rule:#262626;--panel:#161616;
  --accent:#F6604C;--c-component:#F6604C;--c-snippet:#9A9A9A;--c-pattern:#6C94FF;--c-context:#3FCB98;--c-ruling:#F2F2F2;--c-role:#B58CE6;--c-intent:#E0A93A;--c-shape:#4FB3D6;
  --c-session:#8F8F8F;--c-artefact:#C2AE92;--c-evidence:#9E9384;--c-sc:#E0A155;--c-guideline:#D9A05B;--c-principle:#F0C68A;--c-policy:#4FC7AC;--c-standard:#7FA6E8;--c-axe:#A697E8;
  --f-structure:#F2F2F2;--f-usage:#6C94FF;--f-render:#9A9A9A;--f-rules:#F6604C;--f-governance:#F6604C;--f-guidelines:#D9A05B;--c-rule:#8FD67A;--f-guidelinerules:#8FD67A;
  --c-ux:#E68ABF;--c-polarity:#F0B4D6;--c-family:#F4C2DF;--f-uxprinciples:#E68ABF;
  --c-icon:#4FC3D9;--c-iconGroup:#8BD3E3;--c-logo:#9AB4D1;--f-assets:#4FC3D9;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Helvetica Neue",Helvetica,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.stats{display:flex;gap:28px;font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.stats b{color:var(--ink);font-weight:600}
.search{position:relative}
.search input{width:320px;height:36px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;border-radius:0;outline:none}
.search input:focus{border-color:var(--ink)}
.hits{position:absolute;top:38px;left:0;right:0;background:var(--bg);border:1px solid var(--rule);max-height:360px;overflow:auto;z-index:20;display:none}
.hits.on{display:block}
.hit{display:grid;grid-template-columns:82px 1fr auto auto;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--rule);align-items:center} /* #280 v1.19: the last column is INSPECT */
.hit:hover,.hit.sel{background:var(--panel)}
.hit small{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.stage{position:relative;overflow:hidden;border-right:1px solid var(--rule)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.grabbing{cursor:grabbing}
.legend{position:absolute;right:20px;top:60px;width:440px;max-width:52%;max-height:calc(100% - 130px);overflow:auto;display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;pointer-events:auto;background:color-mix(in srgb,var(--bg) 88%,transparent)}
.legend.closed{width:auto;max-width:none;overflow:visible;background:transparent}
.legend .views{flex-direction:column}
/* STRIP mode — a family chip is on, the graph is a landscape band of columns: the legend goes to the bottom
   (the 1.15 place, rows) and fit() puts the band ABOVE it. The legend sits where the graph is not. */
.legend.strip{right:auto;left:24px;top:auto;bottom:66px;width:auto;max-width:calc(100% - 48px);max-height:none;overflow:visible;background:transparent}
.legend.strip .views{flex-direction:row}
.legend.strip .view{flex-direction:row;align-items:center;gap:8px;padding:4px 7px 4px 8px}
.legend.strip .view>h4{width:132px;flex:0 0 132px}.legend.strip .view>h4 small{display:block;margin:0}
.legend.strip~.hint{display:none}
.legend .ltog{white-space:nowrap}
/* #279 v1.16 (EV §5.3): the legend is COLLAPSIBLE and the stage RESERVES it — at desktop it is a RIGHT
   COLUMN (the base graph is portrait, 1.2k×2k world: a bottom legend took the one axis it needs; the stage
   had 500px of spare width), and fit()/the dig place the graph in the better of the two rectangles the
   legend leaves free — BESIDE it (the portrait base) or BELOW it (the wide family columns) — so no chip
   ever sits on the base hub or on a dug neighbour. One click on the bar folds it; Fit re-measures. */
.legend .lbar{display:flex;align-items:center;gap:10px;pointer-events:auto}
.legend .ltog{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:0 9px;min-height:24px;cursor:pointer;border-radius:0;letter-spacing:.06em;text-transform:uppercase}
.legend .ltog:hover{border-color:var(--ink)}
.legend .lsum{color:var(--ink-3);font-size:10px;letter-spacing:.03em;text-transform:none}
.legend .lsum b{color:var(--ink);font-weight:600}
.legend .lbody{display:flex;flex-direction:column;gap:6px}.legend .trows{display:flex;flex-direction:column;gap:6px}
.legend.closed .lbody{display:none}
.legend .row{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
/* #279 s277-D8 — the family row is grouped into the three VIEWS + THE CONSTITUTION. A view is a
   labelled box of chips; GOVERNANCE's three provenance sub-chips sit inside ONE obligation (the
   box was DESIGN GOVERNANCE until s281-D5 renamed the triad; the class names are untouched)
   box (s275-D6: a sub-chip is still its own chip). The Constitution is its own box, outside. */
.legend .views{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:auto}
.legend .view{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:5px 7px 6px 8px;border:1px solid var(--rule);background:color-mix(in srgb,var(--bg) 82%,transparent)}
.legend .view>h4{margin:0;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink);line-height:1.3}
.legend .view>h4 small{display:inline;margin-left:8px;font-size:9px;font-weight:400;color:var(--ink-3);letter-spacing:.02em;text-transform:none}
.legend .view .row{gap:5px}
.legend .view.constitution{border-color:var(--ink);border-width:1px 1px 1px 3px}
.legend .obligation{display:flex;flex-direction:column;gap:3px;padding:4px 5px 5px;border:1px dashed var(--rule)}
.legend .obligation>span{font-size:9px;color:var(--ink-3);letter-spacing:.08em}
/* #281 s281 lane CM — the HELD row. Authored lines that no chip draws are said in words rather than
   dropped; a dashed left edge marks it as a declared gap, not a family. */
.legend .held{font-size:9px;line-height:1.4;letter-spacing:.02em;text-transform:none;color:var(--ink-3);border-left:2px dashed var(--rule);padding:1px 0 1px 6px;max-width:400px;pointer-events:auto}
.legend .held b{color:var(--ink);font-weight:600}
.legend.strip .held{max-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;user-select:none;min-height:24px;font-size:10px} /* #279: compacted (was 6px 10px / 30px) so the three views + the Constitution fit where three rows sat */
.chip.off{opacity:.35}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.edge i{width:16px;height:2px;border-radius:0}
.chip b{font-weight:400;color:var(--ink-3);margin-left:2px}
.crumbs{position:absolute;left:24px;top:18px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;flex-wrap:wrap;max-width:70%}
.crumbs button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0}
.crumbs button.cur{border-color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--ink-3)}
.tools{position:absolute;right:20px;top:18px;display:flex;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tools button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0}
.tools button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;font-size:12px;font-family:var(--mono);white-space:nowrap;display:none;z-index:10;transform:translate(12px,-50%)}
.tip small{opacity:.6;margin-right:6px;text-transform:uppercase;font-size:10px}
.scrub{position:absolute;left:24px;right:24px;bottom:16px;display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.03em}
.scrub button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0;text-transform:uppercase}
.scrub button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scrub .date{min-width:150px;color:var(--ink)}.scrub .date b{font-weight:600}
.scrub .counts{color:var(--ink-3);text-align:right;min-width:230px}.scrub .counts b{color:var(--ink);font-weight:600}
.scrub input[type=range]{width:100%;height:30px;margin:0;accent-color:var(--accent);background:transparent;cursor:pointer}
.scrub.past .date b{color:var(--accent)}
.hint{position:absolute;left:24px;bottom:66px;max-width:300px;font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:left;line-height:1.6;pointer-events:none}
aside{overflow:auto;background:var(--bg)}
.empty{padding:28px 24px;color:var(--ink-2)}
.empty h2{font-size:22px;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);font-weight:700;line-height:1.15}
.empty p{margin:0 0 12px;max-width:34ch}
.empty a.orph{color:var(--ink);text-decoration:underline;text-underline-offset:3px}.empty a.orph b{color:var(--ink-3);font-weight:400;font-family:var(--mono);font-size:11px}
.empty p.plus{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em;margin-top:-6px}
.empty code{font-family:var(--mono);font-size:11px}
.head p.src{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.empty .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:22px}
.head{padding:22px 24px 18px;border-bottom:1px solid var(--rule)}
.kind{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.kind i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.head h2{font-size:24px;line-height:1.1;letter-spacing:-.02em;margin:10px 0 6px;font-weight:700}
.head .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all}
.head p{margin:12px 0 0;color:var(--ink-2);font-size:13px}
.head .meta{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.head .meta b{color:var(--ink);font-weight:600}
.head .sc{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:14px;font-family:var(--mono);font-size:11px}
.head .sc dt{color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.head .sc dd{margin:0;color:var(--ink-2)}
.head .sc dd b{color:var(--ink);font-weight:600}
.head .sc a{color:var(--ink);text-underline-offset:3px}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);color:var(--ink-3);padding:1px 4px;margin-left:6px}
.chip.edge.dash i{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.group h3 i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.group{border-bottom:1px solid var(--rule)}
.group h3{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;margin:0;padding:12px 24px;font-size:12px;font-family:var(--mono);letter-spacing:.04em;cursor:pointer;user-select:none}
.group h3 i{width:14px;height:2px;background:var(--c)}
.group h3 b{font-weight:400;color:var(--ink-3)}
.group h3 .dir{font-size:10px;color:var(--ink-3);text-transform:uppercase;margin-left:8px}
.group.closed .rows{display:none}
.rows{padding:0 0 6px}
.rel{display:grid;grid-template-columns:9px 1fr auto;gap:10px;padding:8px 24px;cursor:pointer;align-items:start} /* #280 v1.19: the third column is INSPECT */
.rel:hover{background:var(--panel)}
.rel i{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.rel .n{font-weight:600;font-size:13px}
.rel .n small{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:6px;font-size:10px;text-transform:uppercase}
.rel .note{color:var(--ink-2);font-size:12px;margin-top:2px;line-height:1.4}
.rel.unres{cursor:default;opacity:.85}
.rel.unres .n{color:var(--ink-3);font-style:italic;font-weight:400}
/* #280 v1.20: the third column now holds TWO doors — the node's `i` and the RELATION's own `↔` */
.ibtns{display:flex;gap:4px;align-items:center;align-self:center}
.path{padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:11px}
.path .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.path .steps span{padding:4px 7px;border:1px solid var(--rule);background:var(--bg)}
.path .steps em{color:var(--ink-3);font-style:normal}
/* #280 v1.19 — INSPECT. A small `i` at a row's right edge opens the node's own record in a modal.
   The affordance is the same in a search hit, a dig row and a path step; it never swallows the row's
   own click (the row still digs). */
.insp{border:1px solid var(--rule);background:var(--bg);color:var(--ink-3);font-family:var(--mono);font-size:10px;line-height:1;padding:4px 7px;cursor:pointer;border-radius:0;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.insp:hover,.insp:focus-visible{border-color:var(--ink);color:var(--ink);outline:none}
.path .steps span.pstep{display:inline-flex;align-items:center;gap:7px}
/* the modal itself — the page's own idiom: no radius, a hairline, mono for anything stored */
.modal{position:fixed;inset:0;z-index:60;display:none}
.modal.on{display:block}
.modal .veil{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 34%,transparent)}
.modal .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,calc(100vw - 40px));max-height:calc(100vh - 56px);display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border:1px solid var(--ink);box-shadow:0 18px 60px rgba(0,0,0,.30)}
.modal .mhead{padding:18px 22px 15px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;flex:0 0 auto}
.modal .mhead h2{font-size:22px;line-height:1.1;letter-spacing:-.02em;margin:9px 0 5px;font-weight:700}
.modal .mhead .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all}
.modal .mclose{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;min-height:30px;cursor:pointer;border-radius:0}
.modal .mclose:hover,.modal .mclose:focus-visible{border-color:var(--ink);outline:none}
.modal .mbody{overflow:auto;flex:1 1 auto;padding:0 0 26px}
.modal .sec{padding:16px 22px 4px;border-bottom:1px solid var(--rule)}
.modal .sec:last-child{border-bottom:0}
.modal .sec>h3{margin:0 0 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:400}
.modal dl.rec{display:grid;grid-template-columns:168px 1fr;gap:5px 18px;margin:0 0 14px;font-size:13px}
.modal dl.rec dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);word-break:break-word}
.modal dl.rec dd{margin:0;color:var(--ink-2);word-break:break-word}
.modal dl.rec dd b{color:var(--ink);font-weight:600}
.modal dl.rec dd.coord{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.modal .egroup{margin:0 0 14px}
.modal .egroup h4{margin:0 0 3px;font-size:12px;font-family:var(--mono);letter-spacing:.04em;font-weight:400;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.modal .egroup h4 i{width:14px;height:2px;background:var(--c);flex:0 0 14px}
.modal .egroup h4 i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.modal .egroup h4 b{color:var(--ink-3);font-weight:400}
.modal .verb{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);color:var(--ink-2);padding:1px 5px}
.modal .reads{margin:0 0 7px;font-size:12px;color:var(--ink-3);line-height:1.5;max-width:82ch}
.modal .erow{display:grid;grid-template-columns:9px 1fr auto;gap:10px;padding:5px 0 5px 2px;align-items:start;border-top:1px solid var(--rule)}
.modal .erow i{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.modal .erow .n{font-size:13px;font-weight:600}
.modal .erow .n small{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:6px;font-size:10px;text-transform:uppercase}
.modal .erow .note{color:var(--ink-2);font-size:12px;margin-top:2px;line-height:1.4}

/* #279: `header{grid-column:1/3}` made an IMPLICIT second column under the one-column mobile grid, so
   the stage was 48px wide at 390 (inherited from v1.0; measured, not guessed). One declaration fixes it.
   The legend is a scrolling stack at phone width; the views go column-wise (heading above chips). */
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:56px 60vh 1fr}header{grid-column:1}.stage{border-right:0;border-bottom:1px solid var(--rule)}.search input{width:150px}.stats{display:none}.brand span{display:none}.tools{gap:4px}
  /* v1.16 (EV §5.1): at phone width the legend is a BOTTOM SHEET — closed by default to its one bar (the
     graph gets the stage), open to at most 62% of the stage with the four view boxes FIRST and the type
     rows below them, scrolling inside the sheet. The graph never vanishes: the top 38% stays clear. */
  .legend,.legend.strip{left:12px;right:12px;top:auto;bottom:112px;width:auto;max-width:none;max-height:none;gap:0;overflow:visible;background:transparent}
  /* OPEN: a true bottom sheet — fixed to the VIEWPORT bottom, so it rises over the aside (the panel text),
     not over the graph; the stage keeps the graph fitted above the sheet's top edge (usable() measures it). */
  .legend:not(.closed){position:fixed;left:12px;right:12px;bottom:12px;max-height:62vh;z-index:30;background:var(--bg);border:1px solid var(--rule);padding:6px 8px 8px;gap:5px;box-shadow:0 -8px 28px rgba(0,0,0,.16)}
  .legend .lsum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend:not(.closed){overflow:auto}.legend .lbody{gap:4px;min-height:0;overflow:hidden;flex:0 1 auto}.legend .lbody .views{flex:none;flex-direction:column;gap:3px}
  .legend .trows{flex:1 1 auto;min-height:48px;overflow:auto;gap:3px;padding-top:2px;border-top:1px solid var(--rule)}
  .legend .view,.legend.strip .view{flex-direction:column;align-items:stretch;gap:2px;padding:3px 5px 4px}.legend .view>h4,.legend.strip .view>h4{width:auto;flex:0 0 auto}.legend .view>h4 small,.legend.strip .view>h4 small{display:none}.legend .view .row{gap:3px}.legend .obligation{gap:2px;padding:3px 4px 4px}
  .chip{padding:2px 5px;min-height:20px;font-size:9px;gap:4px}.hint{display:none}.crumbs{max-width:100%;left:12px}
  /* #280 v1.19: the phone sheet is UNCHANGED, so the side/bottom toggle is not offered here */
  .legend .lplace{display:none}
  /* the scrub row was one 482px-wide line at 390 (date 150 + counts 230 + Play) — three rows now, nothing clips */
  .scrub{left:12px;right:12px;bottom:12px;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:6px 10px;font-size:10px}
  .scrub input[type=range]{grid-column:1/3;grid-row:2}.scrub .counts{grid-column:1/3;grid-row:3;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scrub .date{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{right:12px}}

<body>
<div class="app">
  <header>
    <div class="brand"><b>Apollo · knowledge graph</b><span>as of __DATE__</span></div>
    <div class="stats" id="stats"></div>
    <div class="search"><input id="q" placeholder="Search a node — component, pattern, ruling, 1.4.3…" autocomplete="off"><div class="hits" id="hits"></div></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="crumbs" id="crumbs"></div>
    <div class="tools">
      <button id="three" title="The matrix's second axis: the live layout in 2D or in 3D. Force-3D is the cloud; strata-3D is the exploded stack of plates; shells-3D is the concentric spheres.">2D</button><button id="spin" title="Auto-rotate (3D)" hidden>Spin</button><button id="dof" title="Depth of field — blur grows with distance from the focal plane (3D)" hidden>Depth</button><button id="depth" title="Show second-hop neighbours">Depth 2</button>
      <button id="pathBtn" title="Shift-click a second node to trace the shortest path">Path</button>
      <button id="layout" title="The matrix's first axis. Force — the graph finds its own shape. Strata — the three views as stacked layers, the Constitution the bedrock. Shells — the three views concentric, the Constitution the ground. Same nodes, same relations; only the placement moves.">Layout: force</button>
      <button id="fit">Fit</button><button id="theme" title="Auto / dark / light">Auto</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
    <div class="scrub" id="scrub"><button id="play">Play</button><span class="date" id="sdate"></span><input type="range" id="srange" min="0" max="0" value="0" step="1"><span class="counts" id="scounts"></span></div>
    <div class="hint">click a node to dig · click again to follow<br>shift-click two nodes for a path · esc to surface<br>any row's <b>i</b> — or the i key — opens its record<br>3D: drag to rotate · shift-drag to pan</div>
  </div>
  <aside id="panel"></aside>
</div>
<!-- #280 v1.19 — INSPECT's modal. Empty until a row's `i` is pressed; the file it names is FETCHED at
     runtime, never embedded (the build measures its own size and the size is a gate). -->
<div class="modal" id="insp" role="dialog" aria-modal="true" aria-labelledby="inspTitle"></div>
<script id="kg" type="application/json">__KG__</script>
<script>
const KG=JSON.parse(document.getElementById('kg').textContent);
const NODES=KG.nodes, EDGES=KG.edges;
const byId=new Map(NODES.map(n=>[n.id,n]));
const RAD={session:3.4,artefact:1.9,evidence:1.7,sc:4.6,guideline:5.2,principle:7.5,policy:7,standard:7,axe:2.1,icon:2.0,iconGroup:5.4,logo:3.6};
const SNAPS=KG.snaps||[];let T=SNAPS.length?SNAPS.length-1:0;const alive=o=>o.born==null||(o.born<=T&&(o.died==null||o.died>T));
NODES.forEach((n,i)=>{n.i=i;n.ox=n.x;n.oy=n.y;n.oy2=(n.y2==null?n.y:n.y2);n.z=0;n.tz=0;n.tx=n.x;n.ty=n.y;n.a=1;n.ta=1;n.r=n.type==='component'?4.2+Math.min(n.deg,29)*0.16:n.type==='ruling'?4.5:RAD[n.type]||2.6});
const FAMILY={containedBy:'structure',hasPart:'structure',composedOf:'structure',family:'structure',groupsWith:'structure',partial:'structure',reuses:'structure',delegatesTo:'structure',
  usedInContext:'usage',commonPattern:'usage',renderedBy:'render',
  governedBy:'rules',mustNotNeighbour:'rules',consumes:'rules',triggeredBy:'rules',drivesConsumer:'rules',
  governs:'governance',evidencedBy:'governance',ruledIn:'governance',mentions:'governance',
  // #267 s267-D3 — AUTHORED ruling->ruling edges. Same governance red as `mentions`; they are
  // SOLID because they are authored (dashed stays reserved for derived), and `supersedesClause`
  // (supersession of ONE CLAUSE) is drawn in the same red DOTTED, so it reads as a lighter
  // supersedes without inventing a colour or breaking the TWO-RED LAW (s151-D1).
  supersedes:'governance',supersedesClause:'governance',retires:'governance',narrows:'governance',
  refines:'governance',corrects:'governance',enacts:'governance',extends:'governance',
  bounds:'governance',confirms:'governance',overrides:'governance',
  appliesTo:'guidelines',under:'guidelines',enClause:'guidelines',boundBy:'guidelines',checkedBy:'guidelines',verifiedBy:'guidelines',
  // #274 s274-D8 — the four ratified guideline-rule edge types, their own family and chip.
  definedIn:'guidelinerules',cites:'guidelinerules',enforcedBy:'guidelinerules',flaggedBy:'guidelinerules',
  // #275 s275-D2 — the six ratified UX-principle edge types, their own family and chip.
  tensionWith:'uxprinciples',hasParty:'uxprinciples',touches:'uxprinciples',resolvedBy:'uxprinciples',challengedBy:'uxprinciples',explainedBy:'uxprinciples',
  // #281 s281-D1 — inFamily joins them: the 145 ux→family: lines are the THEORY view's own (the
  // view s281-D5 renamed from Explanation; the view id `explain` and this fam key are untouched).
  // `evidencedBy` is NOT added here — it is already a key (governance: a ruling and its evidence).
  // Its 134 new ux→evidence: lines carry fam 'uxprinciples' on the edge, and EON reads that first.
  inFamily:'uxprinciples',
  // #279 s277-D4 — the six ratified asset edge types, their own family and chip (OFF by default).
  // defaultActive (s277-D6) and the logos' governedBy (s277-D7) are DECLARED-NULL ONLY: never drawn,
  // so they need no family here — they are counted and listed as declared nulls.
  inGroup:'assets',activeVariantOf:'assets',usesIcon:'assets',usesLogo:'assets',defaultFor:'assets',ruledBy:'assets',
  // #281 s281 lane CM — THE CHIP MAP. Six authored edge types reached storage and stopped here: they
  // were not keys of this map, so EON asked famOn[undefined] and no chip anywhere could draw them.
  // The five SYSTEM-view types join `rules`, the base wiring chip they already sit beside (ON by
  // default: the 23 shape:, 14 intent: and 12 role: dots light, and the 43 component→component
  // yieldsTo lines are drawn for the first time; yieldsTo's 2 declared nulls and defaultActive's 1
  // are carried and never drawn, the s270-D2 shape — defaultActive has a home here for its TYPE, not
  // for a line, since its only edge is that null). `obeys` joins `guidelinerules`: a component
  // obeying an HSBC rule is the rule family's own line, and that chip loads OFF, so the 154
  // component→rule lines change no default. The 14 component→ux lines carry `held:true` from the
  // builder and are drawn by NOTHING at any chip setting — where an obligation on a UX principle is
  // drawn is Dave's word, and until it is ruled the line is carried, counted and readable, not lost.
  answersIntent:'rules',hasDataShape:'rules',providesRole:'rules',yieldsTo:'rules',defaultActive:'rules',
  obeys:'guidelinerules'};
// #279 s277-D8 — ONE GRAPH, THREE VIEWS BY FORCE. The fam KEYS are storage (untouched); the LABELS
// and the grouping are the page's. governance = THE CONSTITUTION (the ruling record; NOT a view).
const FAMLABEL={structure:'Structure',usage:'Usage',render:'Rendering',rules:'Rules & wiring',assets:'Assets',
  guidelines:'WCAG sc:',guidelinerules:'HSBC rule:',governance:'Rulings · sessions · evidence',uxprinciples:'UX principles & polarities'};
// #281 s281-D5 — THE TRIAD IS SYSTEM · GOVERNANCE · THEORY: three one-word nouns, a verb line under
// each. Dave's q5 note asked "What is the triad of verbs, i like neatness so maybe we can think of
// something else"; the chat put three triads and he took this one. LABELS ONLY — the view IDS
// (`system`/`design`/`explain`/`constitution`), every fam key, node id and edge type are untouched,
// which is s277-D8's own clause. The Constitution keeps its name and is still NOT one of the three.
const VIEWS=[
  {id:'system',name:'System',say:'what exists — the agent chooses here',fams:['structure','usage','render','rules','assets']},
  {id:'design',name:'Governance',say:'what a design must or should do — the agent obeys here',obligation:['guidelines','guidelinerules','designrulings']},
  // #281 s281-D4 — `cited` renders the citation sub-chip AFTER this view's family chips: the 14
  // authored obeys→ux lines, beside the polarities, off by default like the family they join.
  {id:'explain',name:'Theory',say:'why — the agent consults here',fams:['uxprinciples'],cited:true,rests:true},
  {id:'constitution',name:'The Constitution',say:'the ruling record — not a view',fams:['governance']}];
// The third provenance sub-chip is NOT a family and NOT a derived scope (A2's per-ruling scope is
// UNRATIFIED under s277-D8): it is the AUTHORED citation of a ruling by a design — `governedBy` in a
// component meta, `ruledBy` in the asset files, or a ruling's own `governs` naming a component or
// snippet. It gates those edges only; it adds no node and no count. ON by default, like the base.
// #280 — THE STRATA LAYOUT. Two coordinate sets ship in the file: the force layout (`x`,`y`, untouched
// since 1.15) and the strata layout (the same `x`, a second `y2` packed into the node's own view band).
// `force` is the default; `?layout=strata` or the tool-row switch selects the other. Only y moves.
// #280 s280-D1 — THE LAYOUT MATRIX. Three layouts × two dimensions = six cells, all of them baked at
// build time and none of them solved in the page: FORCE (`x,y` / `x3,y3,z3`), STRATA (the same `x`
// with `y2` in 2D, the plates `xf,yf,zf` in 3D) and SHELLS (the rings `xo,yo` in 2D, the spheres
// `xs,ys,zs` in 3D). `?layout=force|strata|shells` and `?dim=2d|3d` pick a cell without a click;
// force-2D is the default and is 1.17 to the pixel.
const BANDS=KG.bands||[];      // strata-2D: the four horizontal bands
const PLATES=KG.plates||[];    // strata-3D: the exploded stack of plates (the sketch called FLOORS)
const RINGS=KG.rings||[];      // shells-2D: the concentric rings (the sketch called ORBITS)
const SHELLS=KG.shells||[];    // shells-3D: a sphere per view + the Constitution's plinth disc
// the outer shells are dropped back so the core reads through them — the one thing a 3D shell picture
// has to do. The Constitution's plinth keeps most of its weight: it is the ground, not an outer skin.
const SHELLA={system:1,design:0.55,explain:0.4,constitution:0.8};
const BANDFAM={system:'structure',design:'guidelines',explain:'uxprinciples',constitution:'governance'};
const QS=new URLSearchParams(location.search);
const HASL={force:1,strata:BANDS.length?1:0,shells:(RINGS.length||SHELLS.length)?1:0};
const LAYOUTS=['force','strata','shells'].filter(l=>HASL[l]);
let LAYOUT=LAYOUTS.includes(QS.get('layout'))?QS.get('layout'):'force';
const BY=n=>LAYOUT==='strata'?n.oy2:n.oy;          // a node's y at rest, in the 2D layout that is live
const LNAME={force:'force',strata:'strata',shells:'shells'};
const bandShown=b=>b.id!=='constitution'||famOn.governance;  // the bedrock appears with its chip
const DR=e=>e.type==='governedBy'||e.type==='ruledBy'||(e.type==='governs'&&/^(component|snippet):/.test(e.t||''));
const NEWFAM=['governance','guidelines','guidelinerules','uxprinciples','assets'];
const READ={containedBy:['is contained by','contains'],hasPart:['has part','is part of'],composedOf:['is composed of','composes'],family:['in family with','in family with'],groupsWith:['groups with','groups with'],partial:['partial of','has partial'],reuses:['reuses','is reused by'],delegatesTo:['delegates to','is delegated to by'],usedInContext:['used in context','is a context for'],commonPattern:['common pattern','is a pattern of'],renderedBy:['rendered by','renders'],governedBy:['governed by','governs'],mustNotNeighbour:['must not neighbour','must not neighbour'],consumes:['consumes','is consumed by'],triggeredBy:['triggered by','triggers'],drivesConsumer:['drives consumer','is driven by'],
  governs:['governs','is governed by'],evidencedBy:['is evidenced by','is evidence for'],ruledIn:['was ruled in','ruled'],mentions:['mentions','is mentioned by'],
  definedIn:['is defined in','defines'],cites:['cites','is cited by'],enforcedBy:['is enforced by','enforces'],flaggedBy:['is flagged by','flags'],
  tensionWith:['is in tension with','is in tension with'],hasParty:['has party','is a party to'],touches:['touches','is touched by'],
  resolvedBy:['is resolved by','resolves'],challengedBy:['is challenged by','challenges'],explainedBy:['is explained by','explains'],
  supersedes:['supersedes','is superseded by'],supersedesClause:['supersedes a clause of','has a clause superseded by'],
  retires:['retires','is retired by'],narrows:['narrows','is narrowed by'],refines:['refines','is refined by'],
  corrects:['corrects','is corrected by'],enacts:['enacts','is enacted by'],extends:['extends','is extended by'],
  bounds:['bounds','is bounded by'],confirms:['confirms','is confirmed by'],overrides:['overrides','is overridden by'],
  appliesTo:['applies to','must satisfy'],under:['sits under','contains'],enClause:['has EN 301 549 clause','is the clause for'],
  boundBy:['is bound by','binds'],checkedBy:['is checked by','can check'],verifiedBy:['is verified by','verifies'],
  inGroup:['is in group','groups'],activeVariantOf:['is the active variant of','has active variant'],usesIcon:['uses icon','is used by'],
  usesLogo:['uses logo','is used by'],defaultFor:['is the default for','defaults to'],ruledBy:['is ruled by','rules'],
  // #281 s281 lane CM — the six that now have a family need a reading too (the panel takes READ[t][0|1]).
  answersIntent:['answers intent','is answered by'],hasDataShape:['takes data shape','is taken by'],
  providesRole:['provides role','is provided by'],yieldsTo:['yields to','is yielded to by'],
  defaultActive:['is active by default for','defaults to'],obeys:['obeys','binds'],
  // #281 s281-D6 — the rule→principle line's own reading, both ways round.
  restsOn:['rests on','is what this rule rests on'],
  // #281 s281-D1. NOTE the neighbour two rows up: `family` is an EDGE type (component→component,
  // structure) and has been since v1.1. `inFamily` is the new one and `family:` is the new NODE
  // type; neither renames nor moves the other.
  inFamily:['is in research family','is the research family of']};
// #281 s281 lane CM — SECOND FALL-THROUGH, found by the probe. The chip map was not the only place
// these dots were missing from: `shape`, `intent` and `role` are base node types with 23/14/12 nodes
// and their OWN palette entries (--c-shape / --c-intent / --c-role have been in the stylesheet all
// along), but they were not in this list — so typeOn[t] was `undefined`, NODEON returned undefined,
// and the dots were not drawn even once their edges had a family. Giving the edge a family without
// giving the node a chip lights nothing; both were needed and both are one line. No type is renamed
// and no id moves — three names join the row they always belonged to.
const TYPES=['component','snippet','pattern','context','ruling','shape','intent','role'];
// #281 s281-D1 — `family` joins the row for the same reason shape/intent/role did in 1.21: an edge
// with a family draws nothing if the dot at its end has no type chip. 32 research-family hubs.
const TYPES2=['session','artefact','evidence','sc','guideline','principle','policy','standard','axe','rule','ux','polarity','family','icon','iconGroup','logo'];
const ALLTYPES=TYPES.concat(TYPES2);

function endBtn(id){const m=byId.get(id);if(!m)return `<span class="end"><b>—</b><small>no node</small></span>`;
  return `<button class="end" type="button" data-insp="${esc(m.id)}"><b>${esc(m.label)}</b><small>${esc(m.type)} · ${esc(m.id)}</small></button>`}
function openEdge(e,back){if(!e)return;
  if(!modal.classList.contains('on')){lastFocus=document.activeElement;TRAIL=[]}
  inspNode=null;inspSeq++;
  const sN=byId.get(e.s),tN=e.t?byId.get(e.t):null,fam=e.fam||FAMILY[e.type];
  const label=(sN?sN.label:e.s)+' —'+e.type+'→ '+(tN?tN.label:'null');
  if(!back)TRAIL.push({kind:'edge',e:e,label:e.type});
  hits.classList.remove('on');
  const V=VERBS.verbs||{},vs=verbsFor(e.type);
  const badges=vs.length?vs.map(v=>`<span class="verb">${esc(V[v]?V[v].force:v)} · ${esc(v)}</span>`).join('')
    :`<span class="verb" title="${esc((VERBS.unread||{})[e.type]||'no verb reads this storage type')}">unread</span>`;
  const reads=vs.map(v=>V[v]&&V[v].reads).filter(Boolean);
  const sp=(VERBS.splits||{})[e.type];
  let rows='';
  const row=(k,v)=>{rows+=`<dt>${esc(k)}</dt><dd>${v}</dd>`};
  row('storage type',`<b>${esc(e.type)}</b>`);
  row('verb',badges||'—');
  row('this relation, read',`<b>${esc(sN?sN.label:e.s)}</b> ${esc(READ[e.type]?READ[e.type][0]:'→')} <b>${esc(tN?tN.label:'— nothing: a declared null')}</b>`);
  if(reads.length)row('the verb’s own sentence',reads.map(esc).join('<br>'));
  if(sp)row('split by',esc(sp.by));
  row('family',esc(fam||'—')+(fam&&famOn[fam]===false?' · chip off, so it is not drawn right now':''));
  /* #281 s281 lane CM — a HELD line says so here, in the edge's own door, with its reason. */
  if(e.held)row('held',`<b>drawn by no chip, at any setting</b> — ${esc(e.heldWhy||XTRA.heldWhy||'pending a ruling')}. The line is carried in the data and counted in storage; it is not dropped.`);
  /* #281 s281-D4 — a CITED line says where it is drawn and why it is drawn there, in its own door.
     The storage family above is unchanged and is deliberately still printed: the two facts are
     different, and the ruling's whole claim is that this line's FORCE is explanation while its
     FILING is untouched. */
  if(UXC(e))row('cited by a design',`<b>drawn in the THEORY view</b>, under its own chip <b>cited by a design</b>${famOn.uxcited?'':' · that chip is off, so it is not drawn right now'}. ${esc(e.citedWhy||XTRA.citedWhy||'explanation, not obligation (s281-D4)')}`);
  /* #281 s281-D6 — a restsOn line says the same three things: where it is drawn, why there, and
     that its FILING is untouched. Then the four facts the card carried: the sentence, the grade at
     the time of writing, the radio letter he saw, and HIS OWN NOTE, verbatim and unedited. */
  if(ROC(e)){
    row('rests on',`<b>drawn in the THEORY view</b>, under its own chip <b>rests on</b>${famOn.restson?'':' · that chip is off, so it is not drawn right now'}. ${esc(XTRA.restsWhy||'an authored line from a rule to the principle it rests on (s281-D6)')}`);
    if(e.both)row('one of two',`<b>this rule rests on TWO principles.</b> Dave’s note said “both 1 and 2” where the radio could take one answer, so both options landed, each with its own sentence (s281-D6).`);
    if(e.besideNull)row('beside a declared null',`<b>this rule is ALSO filed as resting on convention alone.</b> He chose convention and named this option in the same note, so the null and this line both stand (s281-D6).`);
    if(e.besideOption)row('beside a principle',`<b>this rule ALSO rests on option ${esc(e.besideOption)}.</b> He chose convention and named that option in the same note, so both stand (s281-D6).`);
    if(e.grade)row('the principle’s grade, at the time of writing',`<b>${esc(e.grade)}</b> — the <code>ux:</code> node’s own <code>grade</code> field stays authoritative if it is ever re-graded`);
    if(e.choice)row('the answer he gave',`option <b>${esc(e.choice)}</b> on the card${e.recommended?' · which was the recommendation':''}${e.overruled?' · <b>he OVERRULED the recommendation</b>':''}`);
    if(e.daveNote)row('Dave’s own note, verbatim',`<i>${esc(e.daveNote)}</i>`);
  }
  /* #281 s281-D4 — the DESIGNER'S OWN SENTENCE, authored in the meta beside the ref as `$why`.
     #281 s281-D6 — on a restsOn line the same field is the CARD's sentence for the option he
     picked, so it is labelled for what it is rather than passed off as the designer's. */
  if(e.why)row(ROC(e)?'why — the sentence on the card he answered':'why — the designer’s own words',`<i>${esc(e.why)}</i>`);
  if(e.note)row('note',esc(e.note));
  row('provenance',(e.authored?'<b>authored</b> — written in the record itself':'')
    +(e.derived?(e.authored?' · ':'')+'<b>derived</b> — proposed by a builder pass':'')
    +(e.ratified?` · ratified ${esc(e.ratified)}`:'')
    +(e.at?` · at ${esc(String(e.at))}`:'')||'—');
  /* #281 s281 lane CM: an edge that carries its own `fam` was READ OUT OF that family's file; an
     edge with no `fam` is a base edge and is authored in its source's own record. Asking that first
     is what makes `obeys` — family guidelinerules, stored in the component's meta — name its meta. */
  const efam=(!e.fam&&sN&&sN.type==='component')?null:EFAMFILE[fam];
  if(efam)row('stored in',`<code>${esc(efam)}</code>`);
  else if(sN&&sN.type==='component')row('stored in',`<code>knowledge/components/${esc(sN.id.slice(sN.id.indexOf(':')+1))}.meta.json</code>`);
  if(SNAPS.length&&e.born!=null)row('born',esc(SNAPS[e.born].date+' · snapshot '+e.born));
  if(e.died!=null&&SNAPS[e.died])row('gone',esc(SNAPS[e.died].date));
  if(tN&&tN.type==='evidence')row('evidence',`<code>${esc(String(tN.full||tN.label))}</code>`);
  modal.innerHTML=`<div class="veil" data-veil></div><div class="sheet" role="document">
<div class="mhead"><div><span class="kind" style="--c:var(--f-${fam})"><i></i>relation</span><h2 id="inspTitle">${esc(e.type)}</h2><div class="id">${esc(label)}</div></div><button class="mclose" type="button" data-close>Close · esc</button></div>
${crumbBar()}
<div class="mbody">
<div class="sec"><h3>The two ends — each one a door to its own artefact</h3>
<div class="ends">${endBtn(e.s)}<div class="arrow">—${esc(e.type)}→</div>${e.t?endBtn(e.t):'<span class="end"><b>nothing</b><small>declared null · ref: null</small></span>'}</div>
${e.t?'':`<p class="fnote">this is a <b>declared null</b>: the record names a target that is not a node in the graph, and the graph carries the declaration rather than dropping it. What it names: <b>${esc(e.note||'—')}</b></p>`}</div>
<div class="sec"><h3>The relation’s own record</h3><dl class="rec">${rows}</dl></div>
</div></div>`;
  modal.classList.add('on');
  const b=modal.querySelector('.mclose');if(b)b.focus()}
function closeInspect(){if(!modal.classList.contains('on'))return;
  modal.classList.remove('on');modal.innerHTML='';inspNode=null;inspSeq++;TRAIL=[];
  if(lastFocus&&document.contains(lastFocus)){try{lastFocus.focus()}catch(e){}}lastFocus=null}
modal.addEventListener('click',ev=>{
  if(ev.target.closest('[data-close]')||ev.target.closest('[data-veil]')){closeInspect();return}
  // #280 v1.20: a crumb walks BACK along the trail — it truncates rather than pushing
  const cb=ev.target.closest('[data-crumb]');
  if(cb){const i=+cb.dataset.crumb,t=TRAIL[i];if(!t)return;TRAIL=TRAIL.slice(0,i+1);
    if(t.kind==='edge')openEdge(t.e,true);else openInspect(t.n,true);return}
  const cp=ev.target.closest('[data-copy]');
  if(cp){const v=cp.dataset.copy,o=cp.textContent,done=()=>{cp.textContent='copied';setTimeout(()=>{cp.textContent=o},1200)};
    try{navigator.clipboard.writeText(v).then(done,()=>fallbackCopy(v,done))}catch(e){fallbackCopy(v,done)}}});
// focus is TRAPPED while the modal is open, and Escape closes the modal without surfacing the dig
modal.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeInspect();return}
  if(ev.key!=='Tab')return;
  const f=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
  if(!f.length)return;const first=f[0],last=f[f.length-1];
  if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
  else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}});
// ONE delegated handler, in the CAPTURE phase, so a row's `i` never also digs the row
document.addEventListener('click',ev=>{
  const eb=ev.target.closest('[data-einsp]');                 // #280 v1.20: the RELATION's own door
  if(eb){ev.preventDefault();ev.stopPropagation();const e=EDGES[+eb.dataset.einsp];if(e)openEdge(e);return}
  const b=ev.target.closest('[data-insp]');if(!b)return;
  ev.preventDefault();ev.stopPropagation();const m=byId.get(b.dataset.insp);if(m)openInspect(m)},true);
addEventListener('keydown',ev=>{if(modal.classList.contains('on'))return;
  const tg=ev.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable))return;
  if((ev.key==='i'||ev.key==='I')&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey&&focus){ev.preventDefault();openInspect(focus)}});

// ---------- interaction
let drag=null,moved=false;
function pick(mx,my){let best=null,bd=1e9;for(const n of NODES){if(n.a<0.2||!NODEON(n)||!alive(n))continue;const pn=P(n);const dx=pn.x-mx,dy=pn.y-my;const d=dx*dx+dy*dy;const r=Math.max(7,n.r*view.k*1.6*pn.s+3);if(d<r*r&&d<bd){bd=d;best=n}}return best}
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,rx:rot.x,ry:rot.y,rotate:three&&!e.shiftKey};moved=false;cv.classList.add('grabbing')});
addEventListener('mousemove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(drag.rotate){rot.y=drag.ry+dx*0.006;rot.x=Math.max(-1.4,Math.min(1.4,drag.rx+dy*0.006))}else{view.x=drag.vx+dx/view.k;view.y=drag.vy+dy/view.k}draw();return}
  const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);const tip=document.getElementById('tip');
  if(n!==hover){hover=n;draw()} if(n){tip.style.display='block';tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.innerHTML=`<small>${n.type}</small>${esc(n.label)} · ${adj.get(n.id).length}`}else tip.style.display='none'});
addEventListener('mouseup',e=>{if(!drag)return;cv.classList.remove('grabbing');const was=drag;drag=null;animate();if(moved)return;
  const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);
  if(!n){if(focus&&!e.shiftKey)surface();return}
  if((e.shiftKey||pathMode)&&focus&&n!==focus){showPath(focus,n);return}
  setFocus(n)});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left-W/2,my=e.clientY-r.top-H/2;const k0=view.k;view.k=Math.max(0.12,Math.min(6,view.k*Math.exp(-e.deltaY*0.0016)));
  view.x-=mx/k0-mx/view.k;view.y-=my/k0-my/view.k;draw()},{passive:false});
addEventListener('keydown',e=>{if(modal.classList.contains('on'))return;   /* #280 v1.19: Escape belongs to the modal while it is open — it closes the modal, it does not surface the dig */
  if(e.key==='Escape'){if(pathNodes){pathNodes=pathEdges=null;renderPanel(focus,adj.get(focus.id));animate()}else if(focus)surface();document.getElementById('hits').classList.remove('on')}});
// #280 — the matrix's SECOND AXIS. The old 3D button is now the dimension switch: it keeps the live
// layout and changes only which of its two coordinate sets the page reads.
function setDim(v,quiet){three=!!v;const b=document.getElementById('three');
  b.textContent=three?'3D':'2D';b.classList.toggle('on',three);
  document.getElementById('spin').hidden=!three;document.getElementById('dof').hidden=!three;
  autoPlace();renderLegend();   // #280 v1.19: a DIMENSION switch is one of the two moments the place is recomputed — and only while the user has not chosen one
  for(const n of NODES){[n.tx,n.ty,n.tz]=base(n);n.x=n.tx;n.y=n.ty;n.z=n.tz}
  if(focus)applyFocus();else{ctr=[0,0,0];fit()}
  if(!quiet)animate()}
document.getElementById('three').onclick=()=>setDim(!three);
document.getElementById('spin').onclick=function(){spin=!spin;this.classList.toggle('on',spin);animate()};
document.getElementById('dof').onclick=function(){dof=(dof+1)%3;const pr=DOF_PROFILES[dof];this.classList.toggle('on',!!pr);this.textContent=pr?pr.label:'Depth';if(pr){DOF_BLUR=pr.blur;DOF_BAND=pr.band}for(const n of NODES)n.bd=null;animate()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)animate()});
document.getElementById('spin').classList.add('on');
document.getElementById('depth').onclick=function(){depth2=!depth2;this.classList.toggle('on',depth2);if(focus)applyFocus()};
document.getElementById('pathBtn').onclick=function(){pathMode=!pathMode;this.classList.toggle('on',pathMode)};
document.getElementById('fit').onclick=()=>{if(focus)applyFocus();else fit()};
// #280 — the layout switch. It SNAPS: every node goes straight to its place in the new coordinate
// set and the stage re-fits, so a screenshot taken the moment the page settles is the real thing.
// `force` restores exactly the positions the page loads with, which is why the default is pixel-1.16.
function setLayout(v,quiet){LAYOUT=LAYOUTS.includes(v)?v:'force';
  const b=document.getElementById('layout');
  b.textContent='Layout: '+LNAME[LAYOUT];b.classList.toggle('on',LAYOUT!=='force');
  // #280 v1.19: a LAYOUT switch is the other moment the place is recomputed (a stack of bands or a ring
  // of shells is landscape or square, so the legend wants the bottom) — and only if the user has not
  // already put it somewhere. This call at load is what gives the page its opening place.
  autoPlace();renderLegend();
  for(const n of NODES){[n.tx,n.ty,n.tz]=base(n);n.x=n.tx;n.y=n.ty;n.z=n.tz}
  if(focus)applyFocus();else fit();
  if(!quiet)animate()}
// #280 — the matrix's FIRST AXIS: the button cycles the layouts the file actually carries.
document.getElementById('layout').onclick=()=>setLayout(LAYOUTS[(LAYOUTS.indexOf(LAYOUT)+1)%LAYOUTS.length]);

// ---------- search
const q=document.getElementById('q'),hits=document.getElementById('hits');let sel=0,cur=[];
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){hits.classList.remove('on');return}
  cur=NODES.filter(n=>alive(n)&&(n.label.toLowerCase().includes(s)||n.id.toLowerCase().includes(s))).sort((a,b)=>(b.type==='component')-(a.type==='component')||b.deg-a.deg).slice(0,40);sel=0;
  hits.innerHTML=cur.map((n,i)=>`<div class="hit ${i===0?'sel':''}" data-i="${i}"><small>${n.type}</small><span>${esc(n.label)}${famOK(n)&&typeOn[n.type]?'':' <small>· hidden layer, will switch on</small>'}</span><small>${adj.get(n.id).length}</small><button class="insp" type="button" data-insp="${esc(n.id)}" title="Inspect the record — the stored fields, the relations and the file">i</button></div>`).join('')||`<div class="hit"><small></small><span>nothing</span></div>`;
  hits.classList.add('on');hits.querySelectorAll('.hit[data-i]').forEach(h=>h.onclick=()=>choose(+h.dataset.i))});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(cur.length-1,sel+1)}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1)}else if(e.key==='Enter'){choose(sel);return}else return;hits.querySelectorAll('.hit').forEach((h,i)=>h.classList.toggle('sel',i===sel))});
function flyTo(n,cb){if(three){const c0=ctr.slice(),c1=base(n),t0=performance.now(),D=700;(function step(){const u=Math.min(1,(performance.now()-t0)/D),s=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;ctr=[0,1,2].map(i=>c0[i]+(c1[i]-c0[i])*s);if(u<1)requestAnimationFrame(step);else cb()})();animate();return}const k1=Math.max(view.k,1.1),x0=view.x,y0=view.y,k0=view.k,x1=-n.x,y1=-n.y,t0=performance.now(),D=650;
  hover=null;(function step(){const u=Math.min(1,(performance.now()-t0)/D),s=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;view.x=x0+(x1-x0)*s;view.y=y0+(y1-y0)*s;view.k=k0+(k1-k0)*s;draw();if(u<1)requestAnimationFrame(step);else cb()})()}
function choose(i){const n=cur[i];if(!n)return;hits.classList.remove('on');q.value='';q.blur();trail=[];
  if(n.fam&&!famOn[n.fam]){famOn[n.fam]=1;recount();renderStats();renderLegend()}if(!typeOn[n.type]){typeOn[n.type]=1;renderLegend()}surfaceQuiet();flyTo(n,()=>setFocus(n))}
function surfaceQuiet(){focus=null;sectors=null;ctr=[0,0,0];pathNodes=pathEdges=null;for(const n of NODES){[n.tx,n.ty,n.tz]=base(n);n.ta=1;n.x=n.tx;n.y=n.ty;n.z=n.tz;n.a=1}draw()}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hits.classList.remove('on')});

// ---------- scrub line
const sr=document.getElementById('srange'),sd=document.getElementById('sdate'),sc=document.getElementById('scounts'),scrub=document.getElementById('scrub');
let playing=false,playT=null;
function setT(i){T=Math.max(0,Math.min(SNAPS.length-1,i));sr.value=T;const s=SNAPS[T];
  const nn=NODES.filter(n=>alive(n)&&famOK(n)).length,ne=EDGES.filter(e=>e.t&&alive(e)&&famOK(e)&&DRON(e)&&famOK(byId.get(e.s))&&famOK(byId.get(e.t))).length;
  sd.innerHTML=`<b>${s.date}</b> · ${s.commit}`;sc.innerHTML=`<b>${nn}</b> nodes · <b>${ne.toLocaleString()}</b> relations · ${s.unresolved} unresolved`;
  scrub.classList.toggle('past',T<SNAPS.length-1);
  if(focus){applyFocus()}else if(!anim)draw();}
if(SNAPS.length){sr.max=SNAPS.length-1;setT(SNAPS.length-1);sr.oninput=()=>setT(+sr.value);}else scrub.hidden=true;
document.getElementById('play').onclick=function(){playing=!playing;this.classList.toggle('on',playing);this.textContent=playing?'Pause':'Play';
  if(playing){if(T>=SNAPS.length-1)setT(0);const step=()=>{if(!playing)return;if(T>=SNAPS.length-1){playing=false;document.getElementById('play').classList.remove('on');document.getElementById('play').textContent='Play';return}
    setT(T+1);const d=SNAPS[T],p=SNAPS[T-1];playT=setTimeout(step,(d.nodes-p.nodes)+(d.edges-p.edges)>50?1400:450)};step()}else clearTimeout(playT)};
addEventListener('keydown',e=>{if(e.target===q)return;if(e.key==='ArrowLeft')setT(T-1);if(e.key==='ArrowRight')setT(T+1)});
document.getElementById('theme').onclick=()=>{themeI=(themeI+1)%3;applyTheme()};applyTheme();
resize();setLayout(LAYOUT,true);setDim(three,true);renderEmpty();   // #280: at the defaults (force · 2D) this is exactly resize();fit();
</script>
</body>
</html>
