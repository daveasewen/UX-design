<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apollo KG — explorer</title>
<style>
:root{
  --bg:#FFFFFF;--ink:#111111;--ink-2:#555555;--ink-3:#8A8A8A;--rule:#E3E3E3;--panel:#F6F6F6;
  --accent:#DA1A00;
  --c-component:#DA1A00;--c-snippet:#7A7A7A;--c-pattern:#1F4FBF;--c-context:#0E8A5F;--c-ruling:#111111;
  --c-session:#5E5E5E;--c-artefact:#8A7A66;--c-evidence:#A99C8B;--c-sc:#7A4B00;--c-guideline:#A06A16;--c-principle:#4A3000;--c-policy:#1F6B5B;--c-standard:#2F5488;--c-axe:#5B4B9E;
  --f-structure:#111111;--f-usage:#1F4FBF;--f-render:#7A7A7A;--f-rules:#DA1A00;
  /* v1.2 — governance reuses the rules red (authored solid, derived dashed); guidelines is an
     amber that passes on white. TWO-RED LAW s151-D1 untouched: --accent is the only red token. */
  --f-governance:#DA1A00;--f-guidelines:#7A4B00;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C;--ink:#F2F2F2;--ink-2:#B5B5B5;--ink-3:#7A7A7A;--rule:#262626;--panel:#161616;
    --accent:#F6604C;--c-component:#F6604C;--c-snippet:#9A9A9A;--c-pattern:#6C94FF;--c-context:#3FCB98;--c-ruling:#F2F2F2;
    --c-session:#8F8F8F;--c-artefact:#C2AE92;--c-evidence:#9E9384;--c-sc:#E0A155;--c-guideline:#D9A05B;--c-principle:#F0C68A;--c-policy:#4FC7AC;--c-standard:#7FA6E8;--c-axe:#A697E8;
    --f-structure:#F2F2F2;--f-usage:#6C94FF;--f-render:#9A9A9A;--f-rules:#F6604C;--f-governance:#F6604C;--f-guidelines:#D9A05B;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C;--ink:#F2F2F2;--ink-2:#B5B5B5;--ink-3:#7A7A7A;--rule:#262626;--panel:#161616;
  --accent:#F6604C;--c-component:#F6604C;--c-snippet:#9A9A9A;--c-pattern:#6C94FF;--c-context:#3FCB98;--c-ruling:#F2F2F2;
  --c-session:#8F8F8F;--c-artefact:#C2AE92;--c-evidence:#9E9384;--c-sc:#E0A155;--c-guideline:#D9A05B;--c-principle:#F0C68A;--c-policy:#4FC7AC;--c-standard:#7FA6E8;--c-axe:#A697E8;
  --f-structure:#F2F2F2;--f-usage:#6C94FF;--f-render:#9A9A9A;--f-rules:#F6604C;--f-governance:#F6604C;--f-guidelines:#D9A05B;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Helvetica Neue",Helvetica,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.stats{display:flex;gap:28px;font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.stats b{color:var(--ink);font-weight:600}
.search{position:relative}
.search input{width:320px;height:36px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;border-radius:0;outline:none}
.search input:focus{border-color:var(--ink)}
.hits{position:absolute;top:38px;left:0;right:0;background:var(--bg);border:1px solid var(--rule);max-height:360px;overflow:auto;z-index:20;display:none}
.hits.on{display:block}
.hit{display:grid;grid-template-columns:82px 1fr auto;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--rule);align-items:center}
.hit:hover,.hit.sel{background:var(--panel)}
.hit small{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.stage{position:relative;overflow:hidden;border-right:1px solid var(--rule)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.grabbing{cursor:grabbing}
.legend{position:absolute;left:24px;bottom:66px;max-width:calc(100% - 300px);display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
.legend .row{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;user-select:none;min-height:30px}
.chip.off{opacity:.35}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.edge i{width:16px;height:2px;border-radius:0}
.chip b{font-weight:400;color:var(--ink-3);margin-left:2px}
.crumbs{position:absolute;left:24px;top:18px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;flex-wrap:wrap;max-width:70%}
.crumbs button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0}
.crumbs button.cur{border-color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--ink-3)}
.tools{position:absolute;right:20px;top:18px;display:flex;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tools button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0}
.tools button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;font-size:12px;font-family:var(--mono);white-space:nowrap;display:none;z-index:10;transform:translate(12px,-50%)}
.tip small{opacity:.6;margin-right:6px;text-transform:uppercase;font-size:10px}
.scrub{position:absolute;left:24px;right:24px;bottom:16px;display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.03em}
.scrub button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0;text-transform:uppercase}
.scrub button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scrub .date{min-width:150px;color:var(--ink)}.scrub .date b{font-weight:600}
.scrub .counts{color:var(--ink-3);text-align:right;min-width:230px}.scrub .counts b{color:var(--ink);font-weight:600}
.scrub input[type=range]{width:100%;height:30px;margin:0;accent-color:var(--accent);background:transparent;cursor:pointer}
.scrub.past .date b{color:var(--accent)}
.hint{position:absolute;right:20px;bottom:66px;max-width:270px;font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;line-height:1.6}
aside{overflow:auto;background:var(--bg)}
.empty{padding:28px 24px;color:var(--ink-2)}
.empty h2{font-size:22px;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);font-weight:700;line-height:1.15}
.empty p{margin:0 0 12px;max-width:34ch}
.empty a.orph{color:var(--ink);text-decoration:underline;text-underline-offset:3px}.empty a.orph b{color:var(--ink-3);font-weight:400;font-family:var(--mono);font-size:11px}
.empty p.plus{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em;margin-top:-6px}
.empty code{font-family:var(--mono);font-size:11px}
.head p.src{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.empty .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:22px}
.head{padding:22px 24px 18px;border-bottom:1px solid var(--rule)}
.kind{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.kind i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.head h2{font-size:24px;line-height:1.1;letter-spacing:-.02em;margin:10px 0 6px;font-weight:700}
.head .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all}
.head p{margin:12px 0 0;color:var(--ink-2);font-size:13px}
.head .meta{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.head .meta b{color:var(--ink);font-weight:600}
.head .sc{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:14px;font-family:var(--mono);font-size:11px}
.head .sc dt{color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.head .sc dd{margin:0;color:var(--ink-2)}
.head .sc dd b{color:var(--ink);font-weight:600}
.head .sc a{color:var(--ink);text-underline-offset:3px}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);color:var(--ink-3);padding:1px 4px;margin-left:6px}
.chip.edge.dash i{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.group h3 i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.group{border-bottom:1px solid var(--rule)}
.group h3{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;margin:0;padding:12px 24px;font-size:12px;font-family:var(--mono);letter-spacing:.04em;cursor:pointer;user-select:none}
.group h3 i{width:14px;height:2px;background:var(--c)}
.group h3 b{font-weight:400;color:var(--ink-3)}
.group h3 .dir{font-size:10px;color:var(--ink-3);text-transform:uppercase;margin-left:8px}
.group.closed .rows{display:none}
.rows{padding:0 0 6px}
.rel{display:grid;grid-template-columns:9px 1fr;gap:10px;padding:8px 24px;cursor:pointer;align-items:start}
.rel:hover{background:var(--panel)}
.rel i{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.rel .n{font-weight:600;font-size:13px}
.rel .n small{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:6px;font-size:10px;text-transform:uppercase}
.rel .note{color:var(--ink-2);font-size:12px;margin-top:2px;line-height:1.4}
.rel.unres{cursor:default;opacity:.85}
.rel.unres .n{color:var(--ink-3);font-style:italic;font-weight:400}
.path{padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:11px}
.path .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.path .steps span{padding:4px 7px;border:1px solid var(--rule);background:var(--bg)}
.path .steps em{color:var(--ink-3);font-style:normal}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:56px 55vh 1fr}.stage{border-right:0;border-bottom:1px solid var(--rule)}.search input{width:180px}.stats{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Apollo · knowledge graph</b><span>as of __DATE__</span></div>
    <div class="stats" id="stats"></div>
    <div class="search"><input id="q" placeholder="Search a node — component, pattern, ruling, 1.4.3…" autocomplete="off"><div class="hits" id="hits"></div></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="crumbs" id="crumbs"></div>
    <div class="tools">
      <button id="three" title="Switch to a 3D view and spin it">3D</button><button id="spin" title="Auto-rotate (3D)" hidden>Spin</button><button id="dof" title="Depth of field — blur grows with distance from the focal plane (3D)" hidden>Depth</button><button id="depth" title="Show second-hop neighbours">Depth 2</button>
      <button id="pathBtn" title="Shift-click a second node to trace the shortest path">Path</button>
      <button id="fit">Fit</button><button id="theme" title="Auto / dark / light">Auto</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
    <div class="scrub" id="scrub"><button id="play">Play</button><span class="date" id="sdate"></span><input type="range" id="srange" min="0" max="0" value="0" step="1"><span class="counts" id="scounts"></span></div>
    <div class="hint">click a node to dig · click again to follow<br>shift-click two nodes for a path · esc to surface<br>3D: drag to rotate · shift-drag to pan</div>
  </div>
  <aside id="panel"></aside>
</div>
<script id="kg" type="application/json">__KG__</script>
<script>
const KG=JSON.parse(document.getElementById('kg').textContent);
const NODES=KG.nodes, EDGES=KG.edges;
const byId=new Map(NODES.map(n=>[n.id,n]));
const RAD={session:3.4,artefact:1.9,evidence:1.7,sc:4.6,guideline:5.2,principle:7.5,policy:7,standard:7,axe:2.1};
const SNAPS=KG.snaps||[];let T=SNAPS.length?SNAPS.length-1:0;const alive=o=>o.born==null||(o.born<=T&&(o.died==null||o.died>T));
NODES.forEach((n,i)=>{n.i=i;n.ox=n.x;n.oy=n.y;n.z=0;n.tz=0;n.tx=n.x;n.ty=n.y;n.a=1;n.ta=1;n.r=n.type==='component'?4.2+Math.min(n.deg,29)*0.16:n.type==='ruling'?4.5:RAD[n.type]||2.6});
const FAMILY={containedBy:'structure',hasPart:'structure',composedOf:'structure',family:'structure',groupsWith:'structure',partial:'structure',reuses:'structure',delegatesTo:'structure',
  usedInContext:'usage',commonPattern:'usage',renderedBy:'render',
  governedBy:'rules',mustNotNeighbour:'rules',consumes:'rules',triggeredBy:'rules',drivesConsumer:'rules',
  governs:'governance',evidencedBy:'governance',ruledIn:'governance',mentions:'governance',
  appliesTo:'guidelines',under:'guidelines',enClause:'guidelines',boundBy:'guidelines',checkedBy:'guidelines',verifiedBy:'guidelines'};
const FAMLABEL={structure:'Structure',usage:'Usage',render:'Rendering',rules:'Rules & wiring',governance:'Governance',guidelines:'Guidelines'};
const NEWFAM=['governance','guidelines'];
const READ={containedBy:['is contained by','contains'],hasPart:['has part','is part of'],composedOf:['is composed of','composes'],family:['in family with','in family with'],groupsWith:['groups with','groups with'],partial:['partial of','has partial'],reuses:['reuses','is reused by'],delegatesTo:['delegates to','is delegated to by'],usedInContext:['used in context','is a context for'],commonPattern:['common pattern','is a pattern of'],renderedBy:['rendered by','renders'],governedBy:['governed by','governs'],mustNotNeighbour:['must not neighbour','must not neighbour'],consumes:['consumes','is consumed by'],triggeredBy:['triggered by','triggers'],drivesConsumer:['drives consumer','is driven by'],
  governs:['governs','is governed by'],evidencedBy:['is evidenced by','is evidence for'],ruledIn:['was ruled in','ruled'],mentions:['mentions','is mentioned by'],
  appliesTo:['applies to','must satisfy'],under:['sits under','contains'],enClause:['has EN 301 549 clause','is the clause for'],
  boundBy:['is bound by','binds'],checkedBy:['is checked by','can check'],verifiedBy:['is verified by','verifies']};
const TYPES=['component','snippet','pattern','context','ruling'];
const TYPES2=['session','artefact','evidence','sc','guideline','principle','policy','standard','axe'];
const ALLTYPES=TYPES.concat(TYPES2);
const adj=new Map(NODES.map(n=>[n.id,[]]));
const unresolved=new Map();
EDGES.forEach((e,k)=>{e.k=k;if(!e.t){(unresolved.get(e.s)||unresolved.set(e.s,[]).get(e.s)).push(e);return;}
  adj.get(e.s).push({e,other:e.t,out:true});adj.get(e.t).push({e,other:e.s,out:false});e.a=1;e.ta=1;});
const typeOn={};ALLTYPES.forEach(t=>typeOn[t]=1);
const famOn={structure:1,usage:1,render:1,rules:1,governance:0,guidelines:0}; // the two v1.2 layers load OFF: the page opens as v1.1 and Dave adds a layer by chip
// v1.2: a node from a new family answers to BOTH its type chip and its family chip. Base nodes
// carry no `fam`, so with both new family chips off the page is exactly the v1.1 graph.
const famOK=o=>!o.fam||famOn[o.fam];
const NODEON=n=>typeOn[n.type]&&famOK(n);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C={};function palette(){C={bg:css('--bg'),ink:css('--ink'),ink2:css('--ink-2'),ink3:css('--ink-3'),rule:css('--rule'),
  t:Object.fromEntries(ALLTYPES.map(t=>[t,css('--c-'+t)])),
  f:Object.fromEntries(Object.keys(FAMLABEL).map(f=>[f,css('--f-'+f)]))}}
palette();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{palette();draw()});
const THEMES=['auto','dark','light'];let themeI=0;try{themeI=Math.max(0,THEMES.indexOf(localStorage.getItem('kg-theme')||'auto'))}catch(e){}
function applyTheme(){const th=THEMES[themeI];if(th==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=th;
  const b=document.getElementById('theme');if(b){b.textContent=th;b.classList.toggle('on',th!=='auto')}try{localStorage.setItem('kg-theme',th)}catch(e){}palette();if(typeof W!=='undefined'&&W)draw()}


// ---------- stats + legend
const LIVE=NODES.filter(n=>!n.dead&&n.died==null),LIVEE=EDGES.filter(e=>!e.dead&&e.died==null);
const XTRA=KG.extra||{};
// counts follow the FAMILY chips only (never the type chips), so with governance + guidelines
// off the strip and the headline read the v1.1 numbers to the digit.
let SHOWN=[],SHOWNE=[],count={};
function recount(){SHOWN=LIVE.filter(famOK);
  SHOWNE=LIVEE.filter(e=>famOK(e)&&(!e.t||(famOK(byId.get(e.s))&&famOK(byId.get(e.t)))));
  count={};SHOWN.forEach(n=>count[n.type]=(count[n.type]||0)+1);}
const UNRES=[...unresolved.values()].reduce((a,b)=>a+b.length,0);
function renderStats(){document.getElementById('stats').innerHTML=`<span><b>${SHOWN.length}</b> nodes</span><span><b>${SHOWNE.length.toLocaleString()}</b> relations</span><span><b>${Object.keys(FAMILY).filter(t=>famOn[FAMILY[t]]).length}</b> edge types</span><span><b>${count.component||0}</b> components</span><span><b>${UNRES}</b> declared, unresolved</span>`;}
const legend=document.getElementById('legend');
const chipT=t=>`<span class="chip ${typeOn[t]?'':'off'}" data-type="${t}" style="--c:var(--c-${t})"><i></i>${t}<b>${count[t]||0}</b></span>`;
function renderLegend(){legend.innerHTML=`<div class="row">${TYPES.map(chipT).join('')}</div>
<div class="row">${TYPES2.map(chipT).join('')}</div>
<div class="row">${Object.keys(FAMLABEL).map(f=>`<span class="chip edge ${f==='governance'?'dash':''} ${famOn[f]?'':'off'}" data-fam="${f}" style="--c:var(--f-${f})"><i></i>${FAMLABEL[f]}<b>${LIVEE.filter(e=>FAMILY[e.type]===f).length}</b></span>`).join('')}</div>`;}
recount();renderStats();renderLegend();
legend.addEventListener('click',ev=>{const c=ev.target.closest('.chip');if(!c)return;
  if(c.dataset.type){typeOn[c.dataset.type]^=1;c.classList.toggle('off')}else{famOn[c.dataset.fam]^=1;c.classList.toggle('off');recount();renderStats();renderLegend();if(!focus)renderEmpty()}
  if(focus)applyFocus();draw();});

// ---------- canvas
const cv=document.getElementById('cv'),MAIN=cv.getContext('2d');let ctx=MAIN;const OFF=[];stage=document.getElementById('stage');
let W,H,DPR,view={x:0,y:0,k:0.42};
let dof=0;const DOF_PROFILES=[null,{blur:[0,0.5,1,1.8,2.8,4,5.5],band:120,label:'Depth'},{blur:[0,1.2,2.6,4.5,7,10,14],band:80,label:'Macro'}];let DOF_BLUR=[],DOF_BAND=1;
let three=false,spin=true,rot={x:0.35,y:0},ctr=[0,0,0];const F=2600;
function proj(x,y,z){if(!three)return {x:W/2+(x+view.x)*view.k,y:H/2+(y+view.y)*view.k,s:1,d:0};
  x-=ctr[0];y-=ctr[1];z-=ctr[2];const cy=Math.cos(rot.y),sy_=Math.sin(rot.y),cx=Math.cos(rot.x),sx_=Math.sin(rot.x);
  const x1=x*cy+z*sy_, z1=-x*sy_+z*cy; const y2=y*cx-z1*sx_, z2=y*sx_+z1*cx;
  const s=F/Math.max(F*0.15,F+z2); return {x:W/2+(x1*s+view.x)*view.k,y:H/2+(y2*s+view.y)*view.k,s,d:z2}}
const P=n=>proj(n.x,n.y,n.z);
function base(n){return three?[n.x3,n.y3,n.z3]:[n.ox,n.oy,0]}
function resize(){DPR=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*DPR;cv.height=H*DPR;draw()}
addEventListener('resize',resize);

function fit(){const wide=NEWFAM.some(f=>famOn[f]);view={x:0,y:0,k:Math.min(W,H)/(wide?(three?6600:6200):(three?2600:2300))};draw()}

let GROW=[];
let hover=null, focus=null, trail=[], depth2=false, pathMode=false, pathNodes=null, pathEdges=null, anim=null;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.lineWidth=focus?0.9:0.5;
  const focalD=(three&&focus)?P(focus).d:0;

  if(n!==hover){hover=n;draw()} if(n){tip.style.display='block';tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.innerHTML=`<small>${n.type}</small>${esc(n.label)} · ${adj.get(n.id).length}`}else tip.style.display='none'});
addEventListener('mouseup',e=>{if(!drag)return;cv.classList.remove('grabbing');const was=drag;drag=null;animate();if(moved)return;
  const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);
  if(!n){if(focus&&!e.shiftKey)surface();return}
  if((e.shiftKey||pathMode)&&focus&&n!==focus){showPath(focus,n);return}
  setFocus(n)});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left-W/2,my=e.clientY-r.top-H/2;const k0=view.k;view.k=Math.max(0.12,Math.min(6,view.k*Math.exp(-e.deltaY*0.0016)));
  view.x-=mx/k0-mx/view.k;view.y-=my/k0-my/view.k;draw()},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(pathNodes){pathNodes=pathEdges=null;renderPanel(focus,adj.get(focus.id));animate()}else if(focus)surface();document.getElementById('hits').classList.remove('on')}});
document.getElementById('three').onclick=function(){three=!three;this.classList.toggle('on',three);document.getElementById('spin').hidden=!three;document.getElementById('dof').hidden=!three;
  for(const n of NODES){[n.tx,n.ty,n.tz]=base(n)}if(focus)applyFocus();else{ctr=[0,0,0];fit()}animate()};
document.getElementById('spin').onclick=function(){spin=!spin;this.classList.toggle('on',spin);animate()};
document.getElementById('dof').onclick=function(){dof=(dof+1)%3;const pr=DOF_PROFILES[dof];this.classList.toggle('on',!!pr);this.textContent=pr?pr.label:'Depth';if(pr){DOF_BLUR=pr.blur;DOF_BAND=pr.band}for(const n of NODES)n.bd=null;animate()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)animate()});
document.getElementById('spin').classList.add('on');
document.getElementById('depth').onclick=function(){depth2=!depth2;this.classList.toggle('on',depth2);if(focus)applyFocus()};
document.getElementById('pathBtn').onclick=function(){pathMode=!pathMode;this.classList.toggle('on',pathMode)};
document.getElementById('fit').onclick=()=>{if(focus)applyFocus();else fit()};

// ---------- search
const q=document.getElementById('q'),hits=document.getElementById('hits');let sel=0,cur=[];
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){hits.classList.remove('on');return}
  cur=NODES.filter(n=>alive(n)&&(n.label.toLowerCase().includes(s)||n.id.toLowerCase().includes(s))).sort((a,b)=>(b.type==='component')-(a.type==='component')||b.deg-a.deg).slice(0,40);sel=0;
  hits.innerHTML=cur.map((n,i)=>`<div class="hit ${i===0?'sel':''}" data-i="${i}"><small>${n.type}</small><span>${esc(n.label)}${famOK(n)&&typeOn[n.type]?'':' <small>· hidden layer, will switch on</small>'}</span><small>${adj.get(n.id).length}</small></div>`).join('')||`<div class="hit"><small></small><span>nothing</span></div>`;
  hits.classList.add('on');hits.querySelectorAll('.hit[data-i]').forEach(h=>h.onclick=()=>choose(+h.dataset.i))});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(cur.length-1,sel+1)}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1)}else if(e.key==='Enter'){choose(sel);return}else return;hits.querySelectorAll('.hit').forEach((h,i)=>h.classList.toggle('sel',i===sel))});
function flyTo(n,cb){if(three){const c0=ctr.slice(),c1=base(n),t0=performance.now(),D=700;(function step(){const u=Math.min(1,(performance.now()-t0)/D),s=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;ctr=[0,1,2].map(i=>c0[i]+(c1[i]-c0[i])*s);if(u<1)requestAnimationFrame(step);else cb()})();animate();return}const k1=Math.max(view.k,1.1),x0=view.x,y0=view.y,k0=view.k,x1=-n.x,y1=-n.y,t0=performance.now(),D=650;
  hover=null;(function step(){const u=Math.min(1,(performance.now()-t0)/D),s=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;view.x=x0+(x1-x0)*s;view.y=y0+(y1-y0)*s;view.k=k0+(k1-k0)*s;draw();if(u<1)requestAnimationFrame(step);else cb()})()}
function choose(i){const n=cur[i];if(!n)return;hits.classList.remove('on');q.value='';q.blur();trail=[];
  if(n.fam&&!famOn[n.fam]){famOn[n.fam]=1;recount();renderStats();renderLegend()}if(!typeOn[n.type]){typeOn[n.type]=1;renderLegend()}surfaceQuiet();flyTo(n,()=>setFocus(n))}
function surfaceQuiet(){focus=null;sectors=null;ctr=[0,0,0];HALO=[];pathNodes=pathEdges=null;for(const n of NODES){[n.tx,n.ty,n.tz]=base(n);n.ta=1;n.x=n.tx;n.y=n.ty;n.z=n.tz;n.a=1}draw()}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hits.classList.remove('on')});

// ---------- scrub line
const sr=document.getElementById('srange'),sd=document.getElementById('sdate'),sc=document.getElementById('scounts'),scrub=document.getElementById('scrub');
let playing=false,playT=null;
function setT(i){T=Math.max(0,Math.min(SNAPS.length-1,i));sr.value=T;const s=SNAPS[T];
  const nn=NODES.filter(n=>alive(n)&&famOK(n)).length,ne=EDGES.filter(e=>e.t&&alive(e)&&famOK(e)&&famOK(byId.get(e.s))&&famOK(byId.get(e.t))).length;
  sd.innerHTML=`<b>${s.date}</b> · ${s.commit}`;sc.innerHTML=`<b>${nn}</b> nodes · <b>${ne.toLocaleString()}</b> relations · ${s.unresolved} unresolved`;
  scrub.classList.toggle('past',T<SNAPS.length-1);
  if(focus){applyFocus()}else if(!anim)draw();}
if(SNAPS.length){sr.max=SNAPS.length-1;setT(SNAPS.length-1);sr.oninput=()=>setT(+sr.value);}else scrub.hidden=true;
document.getElementById('play').onclick=function(){playing=!playing;this.classList.toggle('on',playing);this.textContent=playing?'Pause':'Play';
  if(playing){if(T>=SNAPS.length-1)setT(0);const step=()=>{if(!playing)return;if(T>=SNAPS.length-1){playing=false;document.getElementById('play').classList.remove('on');document.getElementById('play').textContent='Play';return}
    setT(T+1);const d=SNAPS[T],p=SNAPS[T-1];playT=setTimeout(step,(d.nodes-p.nodes)+(d.edges-p.edges)>50?1400:450)};step()}else clearTimeout(playT)};
addEventListener('keydown',e=>{if(e.target===q)return;if(e.key==='ArrowLeft')setT(T-1);if(e.key==='ArrowRight')setT(T+1)});
document.getElementById('theme').onclick=()=>{themeI=(themeI+1)%3;applyTheme()};applyTheme();
resize();fit();renderEmpty();
</script>
</body>
</html>
