const ERAC={"MONO-clean":"#1a1a1a","MONO+drift":"#B45309","LEGACY/old":"#B92F1E","neutral":"#666"};
let cur=0;
const pills=document.getElementById('pills'),grid=document.getElementById('grid'),clTitle=document.getElementById('clTitle');
DATA.forEach((c,i)=>{const p=document.createElement('span');p.className='pill'+(i==0?' on':'');
  p.innerHTML=c.name+' <b>'+c.n+'</b>';p.onclick=()=>sel(i);pills.appendChild(p);});
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function sel(i){cur=i;[...pills.children].forEach((p,j)=>p.classList.toggle('on',j==i));
  const c=DATA[i];clTitle.innerHTML=esc(c.name)+' <small>('+c.n+' variants — compare, then rule keep / migrate / archive)</small>';
  grid.innerHTML='';
  c.items.forEach(x=>{
    const card=document.createElement('div');card.className='card';
    const col=ERAC[x.era]||'#666';
    const dr=x.tags?' · <b class=dr>'+esc(x.tags)+'</b>':'';
    card.innerHTML=`<div class=cap><span class=era style="background:${col}">${x.era}</span>
      <span class=path><span class=role>${esc(x.role)}</span> · ${esc(x.dir)}/${esc(x.base)} <small>${x.kb}KB${dr}</small></span>
      <a class=btn href="${x.rel}" target=_blank rel=noopener>Open ↗</a>
      <button class=btn>⤢</button></div>
      <div class=frameWrap><iframe loading=lazy src="${x.rel}"></iframe></div>`;
    card.querySelector('button').onclick=()=>{(card.requestFullscreen?card:card).requestFullscreen&&card.requestFullscreen();};
    grid.appendChild(card);
  });
}
document.getElementById('cols').oninput=e=>document.documentElement.style.setProperty('--cols',e.target.value);
const hv=document.getElementById('hv');
document.getElementById('hgt').oninput=e=>{hv.textContent=e.target.value;document.documentElement.style.setProperty('--frameH',e.target.value+'vh');};
document.getElementById('fbg').onchange=e=>document.documentElement.style.setProperty('--fbg',e.target.value);
sel(0);
</script></body></html>
