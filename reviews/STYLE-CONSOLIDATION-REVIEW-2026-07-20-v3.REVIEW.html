<title>Apollo · style consolidation review v3 — rulings applied</title><style>
:root{--bg:#f4f4f2;--ink:#1a1a1a;--card:#fff;--line:#ddd;--frameH:64vh;--cols:2}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1a1a1a;color:#fff;padding:14px 22px 12px;position:sticky;top:0;z-index:20}
.h1{font-size:16px;font-weight:600;margin:0 0 4px}.h1 small{color:#aaa;font-weight:400;margin-left:8px}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:8px 0 10px;color:#ddd}
.tally b{font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#888;margin:6px 0 4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:#2c2c2c;color:#eee;border:1px solid #3a3a3a;border-radius:14px;padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.pill.on{background:#fff;color:#1a1a1a;font-weight:600}
.pill .n{opacity:.6;margin-left:4px}
.pill.decided::before{content:"✓ ";color:#2FA35B}
.pill.torule::before{content:"○ ";color:#B45309}
.toolbar{display:flex;gap:16px;align-items:center;padding:9px 22px;background:#efefec;border-bottom:1px solid #e2e2df;position:sticky;top:118px;z-index:19;font-size:12px;flex-wrap:wrap}
.toolbar label{display:flex;gap:6px;align-items:center}.toolbar input[type=range]{width:110px}
main{padding:16px 22px 80px}
h2.cl{font-size:16px;margin:2px 0 2px}h2.cl small{color:#888;font-weight:400}
.ruling{font-size:12px;color:#555;margin:0 0 12px;padding:6px 10px;background:#fff;border-left:3px solid #ccc;border-radius:0 4px 4px 0}
.ruling.decided{border-left-color:#2FA35B}.ruling.torule{border-left-color:#B45309}
.left{font-size:12px;color:#333;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card.v-keep{border-color:#2FA35B}.card.v-align{border-color:#E0912F}
.card:fullscreen{width:100vw;height:100vh}.card:fullscreen iframe{height:calc(100vh - 46px)}
.cap{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #eee;background:#fafafa;font-size:12px}
.cap .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .role{font-weight:600}.cap b.dr{color:#B92F1E}
.vb{color:#fff;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.vb.keep{background:#2FA35B}.vb.align{background:#E0912F}.vb.archive{background:#8a8a8a}.vb.undecided{background:#5b6b8c}.vb.preserve{background:#4a7a8c}.vb.ignore{background:#999}
.era{color:#fff;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:600}
.btn{border:1px solid #ccc;background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px;text-decoration:none;color:#1a1a1a;white-space:nowrap}
.btn:hover{background:#f0f0f0}
.frameWrap{background:var(--fbg,#fff);flex:1}
iframe{width:100%;height:var(--frameH);border:0;display:block;background:transparent}
.tray{margin:16px 0 0}
.trayhd{font-size:12px;color:#666;cursor:pointer;user-select:none;padding:6px 0;border-top:1px dashed #ccc}
.trayhd::before{content:"▸ ";}
.tray.open .trayhd::before{content:"▾ ";}
.tray .grid{display:none;margin-top:10px}.tray.open .grid{display:grid}
.card.arch{opacity:.62}.card.arch .cap{background:#f0f0ee}
.hiddennote{font-size:12px;color:#999;margin:10px 0 0;font-style:italic}
.legend{color:#888;font-size:11px}.legend .era{margin-right:4px}
</style></head><body>

      cText=document.getElementById('rv-composer-text'),
      cSave=document.getElementById('rv-composer-save'),
      cCancel=document.getElementById('rv-composer-cancel'),
      cDel=document.getElementById('rv-composer-del'),
      panel=document.getElementById('rv-panel'),

    // fallback for FLAT docs (dossiers with no <section> wrappers): nearest preceding heading in document order
    var heads=[].slice.call(document.querySelectorAll('h1,h2,h3')), best='';

  function buildPrompt(){
    var lines=[];
    lines.push('# '+DOC_TITLE+' — review edits ('+comments.length+')');
    lines.push('');
    lines.push('Apply the following change requests'+(DOC_FILE?(' to `'+DOC_FILE+'`'):'')+'. Each item is pinned to a component; treat the bracketed location as the target and use the selector to disambiguate.');
    lines.push('');
    comments.forEach(function(c,i){
      var loc=(c.section?('['+c.section+'] '):'')+c.desc;
      lines.push((i+1)+'. '+loc);
      lines.push('   - '+c.text.replace(/\n/g,'\n     '));
      lines.push('   - selector: `'+c.path+'`');
      lines.push('');
    });
    return lines.join('\n');
  }
  function openExport(){ exportText.value=buildPrompt(); exportModal.classList.add('rv-show'); setTimeout(function(){ exportText.focus(); exportText.select(); },0); }
  document.getElementById('rv-export-btn').addEventListener('click',openExport);
  document.getElementById('rv-export-close').addEventListener('click',function(){ exportModal.classList.remove('rv-show'); });
  exportModal.addEventListener('click',function(e){ if(e.target===exportModal) exportModal.classList.remove('rv-show'); });
  document.getElementById('rv-export-copy').addEventListener('click',function(){
    exportText.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(exportText.value).catch(function(){}); ok=true; }
    var b=document.getElementById('rv-export-copy'); var t=b.textContent; b.textContent=ok?'Copied ✓':'Select + ⌘C'; setTimeout(function(){ b.textContent=t; },1400);
  });
  document.getElementById('rv-export-download').addEventListener('click',function(){
    var blob=new Blob([buildPrompt()],{type:'text/markdown'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(DOC_TITLE.replace(/[^\w-]+/g,'-')||'review')+'-comments.md'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  });

  // ---- review-mode wiring --------------------------------------------------
  var hoverEl=null;
  function setActive(on){
    active=on; document.body.classList.toggle('rv-active',on);
    fab.classList.toggle('rv-on',on); fab.setAttribute('aria-pressed',on?'true':'false');
    fab.querySelector('.rv-label').textContent=on?'Reviewing':'Review';
    if(on){ panel.classList.add('rv-open'); } else { clearHover(); }
  }
  function clearHover(){ if(hoverEl){ hoverEl.removeAttribute('data-rv-hover'); hoverEl=null; } }
  fab.addEventListener('click',function(){ setActive(!active); });
  document.getElementById('rv-panel-close').addEventListener('click',function(){ panel.classList.remove('rv-open'); });
  document.getElementById('rv-clear').addEventListener('click',function(){ if(comments.length&&confirm('Delete all '+comments.length+' comments?')){ comments=[]; refresh(); } });

  document.addEventListener('mousemove',function(e){
    if(!active || dragging) return;
    var t=e.target;
    if(isRvNode(t)){ clearHover(); return; }
    if(t!==hoverEl){ clearHover(); hoverEl=t; if(hoverEl&&hoverEl.setAttribute) hoverEl.setAttribute('data-rv-hover',''); }
  },true);

  // capture clicks in review mode so the host page's own handlers/nav don't fire
  document.addEventListener('click',function(e){
    if(!active) return;
    if(isRvNode(e.target)) return;           // let overlay UI work normally
    e.preventDefault(); e.stopPropagation();
    clearHover();
    openComposer(e.target, null);
  },true);

  window.addEventListener('scroll',function(){ renderMarkers(); drawNoodle(); },true);
  window.addEventListener('resize',function(){ renderMarkers(); drawNoodle(); },true);
  setInterval(function(){ renderMarkers(); drawNoodle(); },600);   // keep pins + noodle glued as the page reflows

  refresh();
})();
</script>
<!-- ===================== END APOLLO REVIEW OVERLAY ===================== -->
