<!-- CANONICAL REFERENCE for Navigations (gated) — the web MASTHEAD: brand lockup, primary
     destinations, a search slot, notifications, and an account menu, collapsing to a hamburger
     at 768px.

     ⬛ #261 NAV DESIGN PASS — Dave's ask, verbatim: "tackle the nav design". No reference was
     given ("we'll prompt this"), so this is designed by judgment and every choice below is
     PROPOSED, not ruled.

     THE FAMILY CLAIM IS MECHANICAL, NOT RHETORICAL. Sidebar-nav, Navigations and Tab-bar share
     (a) one NAV FAMILY TOKEN SET block, byte-identical in all three files bar the two
     search-field vars only the masthead uses, and (b) one SHARED ITEM block giving .nv-item / .nv-ic / .nv-label / .nv-count / .nv-chev the same meaning in
     all three. This masthead's primary row IS the sidebar's row, laid horizontally.
     THE INDICATOR RULE: the 3px current-location bar sits on the edge the nav touches the
     content — block-end here, inline-start in the sidebar and in this file's compact drawer,
     block-start in the tab bar.

     NEW AT #261: counts, a notification action, a signed-in account trigger, a stated disabled
     destination, and the 768px collapse to a hamburger + stacked panel.

     ⬛ #261 N2 — DAVE'S REVIEW, two sentences, each enacted and quoted at the code that answers
     it: "the selected state should just have the underscore, no background" (the masthead
     destination opts out of the shared current-row fill) · "align the bottom of the search bar
     with the bottom of its container" (the bar's bottom padding is zero, so the field's
     baseline rule IS the container's bottom edge instead of floating above it).

     CARRIED FORWARD (s218-D4, unchanged in substance): SEARCH is a disclosure revealing
     Search-field's underline form; ACCOUNT is the APG menu-button pattern in Dropdown's panel
     skin. Item copy is INVENTED and is Dave's. -->

/* ===== AUTO-TOKENS END ===== */
/* leading-trim (label alignment) — native text-box-trim, metric-aware, progressive
   enhancement; headings/body excluded.
   ⚠ #261 N4 — the list is wrapped in :where(), exactly as canon.css wraps it, and for the same
   reason (canon.css "#215 — `:where(.canon)`, NOT `.canon`"): this is a DEFAULT, not an authoring
   decision. Bare, the :is() list took its specificity from its heaviest branch (input[type=text])
   and sat at (0,1,1) — ABOVE every one-class ds-005 override in this file, so `.nv-label
   {text-box-edge:text text}` was cascade-dead and every label computed `cap alphabetic`: the box
   ended at the baseline and overflow:hidden cut the descender off "Payments and transfers".
   :where() contributes zero specificity and matches identically. ⛔ Do not unwrap it. */
:where(button,a,label,span,small,strong,em,b,i,th,td,dt,dd,li,figcaption,legend,caption,summary,output,time,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=number],input:not([type]),textarea):not(:has(svg)){text-box-trim:trim-both;text-box-edge:cap alphabetic;}

  /* ===== NAV FAMILY TOKEN SET — ONE SET, THREE SURFACES (#261) =========================
     This block is BYTE-IDENTICAL in Sidebar-nav and Tab-bar; Navigations carries it plus
     exactly two extra vars (--field-border, --field-active) for the search field it alone
     contains, and nothing else. That is the
     family claim made mechanical: if the three surfaces drift, this block stops matching
     and the drift is visible in a diff rather than in a demo. Every value is a resolved
     SEMANTIC token (see the manifest below), never an invented hex. */
  :root{ --nav-ease:160ms cubic-bezier(.4,0,.2,1); --nav-slide:200ms cubic-bezier(.4,0,.2,1);
         --nav-w:248px; --nav-w-rail:64px; --nav-h:64px; --nav-row:44px; }
  [data-theme="light"]{
    --nav-page:#FFFFFF; --nav-surface:#FFFFFF; --nav-text:#1A1A1A; --nav-muted:#1A1A1A;
    --nav-icon:#1A1A1A; --nav-rule:#E1E1E1; --nav-sub-rule:#F0F0F0; --nav-hover:#F0F0F0;
    --nav-pressed:#CECECE; --nav-indicator:#DB0011; --nav-focus:#305A85;
    --nav-disabled:#B7B7B7; --nav-count-bg:#000000; --nav-count-fg:#FFFFFF;
    --nav-shadow:#00000033; --nav-scrim:#00000033; --nav-radius:0;
    /* the two Search-field form-border seats, verbatim (s218-D4) */
    --field-border:#808080; --field-active:#000000; }
  [data-theme="dark"]{
    --nav-page:#1A1A1A; --nav-surface:#1F1F1F; --nav-text:#FFFFFF; --nav-muted:#FFFFFF;
    --nav-icon:#FFFFFF; --nav-rule:#808080; --nav-sub-rule:#808080; --nav-hover:#232323;
    --nav-pressed:#484848; --nav-indicator:#DB0011; --nav-focus:#4587A7;
    --nav-disabled:#808080; --nav-count-bg:#FFFFFF; --nav-count-fg:#333333;
    --nav-shadow:#000000D9; --nav-scrim:#000000D9; --nav-radius:0;
    --field-border:#808080; --field-active:#FFFFFF; }

  /* ===== THE SHARED ITEM — icon / label / count / chevron ==============================
     One anatomy, three surfaces. The same class names carry the same meaning in all three
     files, so a reader who has learned one nav has learned the family.
     CURRENT LOCATION has THREE carriers and colour is always the third:
       1. aria-current="page"                     — the machine-readable fact
       2. a 3px INDICATOR BAR on the edge the nav touches the content — a SHAPE, present
          or absent, readable with no colour vision at all (sidebar: inline-start; top
          nav: block-end; tab bar: block-start)
       3. a WEIGHT step on the label (400 -> 500) — a shape, not a hue, and not a fill
          (#261 N4: the current row's grey fill is REMOVED; grey is hover's word now)
     Dave is astigmatic and red is a problem hue, so the bar is never asked to work alone.
     Its brand red is COPIED from the gated masthead, not invented; the four-theme
     measurement (and the Supercharge failure) lives in the metas. */
  .nv-item{display:flex; align-items:center; gap:12px; min-height:var(--nav-row); padding:0 16px;
    position:relative; color:var(--nav-text); text-decoration:none; background:transparent;
    border:0; cursor:pointer; border-radius:var(--nav-radius); transition:background var(--nav-ease);}
  .nv-ic{flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; color:var(--nav-icon);}
  .nv-ic svg{width:18px; height:18px; fill:currentColor;}
  /* THE LABEL IS A TRUNCATING LABEL, so it takes the canon truncating-label treatment
     (canon.css, `.row .title`): keep the trim's tightness but trim to the FULL text box
     (`text text`, over-edge to under-edge) — `cap alphabetic` ends the box ON the baseline, and
     the overflow:hidden that ellipsis needs then crops every descender (g, y, p). The trim is
     restated here, not inherited, so the pair is read as one decision. Driven at #261 N4:
     16px label, box 11px → 16.5px, descender clipped 5.5px → 0px, all 3 surfaces × 4 themes
     × 2 modes. ⛔ never pair `cap alphabetic` with `overflow:hidden` on a label. */
  .nv-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-align:left; text-box-trim:trim-both; text-box-edge:text text;}
  /* the COUNT is the one rounded thing here — Badge and Avatar are the ruled exceptions to
     square corners, and a count is a Badge wearing a nav row. 24px tall = the dial-down
     floor, so it never reads as a control the finger cannot land on. */
  .nv-count{flex:none; min-width:24px; height:24px; padding:0 7px; border-radius:999px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--nav-count-bg); color:var(--nav-count-fg);}
  .nv-chev{flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:12px; height:12px; color:var(--nav-icon); transition:transform var(--nav-ease);}
  .nv-chev svg{width:12px; height:12px; fill:currentColor;}
  [aria-expanded="true"] > .nv-chev{transform:rotate(180deg);}
  .nv-item:hover{background:var(--nav-hover);}
  .nv-item:active{background:var(--nav-pressed);}
  .nv-item:focus-visible{outline:2px solid var(--nav-focus); outline-offset:-2px;}
  /* #261 N4, Dave verbatim: "remove the background grey on the selected state". The current row
     no longer takes a fill on ANY of the three surfaces — the fill was the hover state's own
     signal, and a row wearing it permanently left hover with nothing of its own to say. The
     indicator bar (a SHAPE) and the label's weight step carry current; the fill now means hover
     and only hover. */
  .nv-item[aria-current="page"]{background:transparent;}
  .nv-item[aria-current="page"] .nv-label{font-weight:500;}
  /* DISABLED is a stated fact, not a greyed guess: aria-disabled tells AT, the row keeps its
     place in the reading order, and the count loses its fill so no contrast claim is made on
     a surface WCAG exempts anyway. */
  .nv-item[aria-disabled="true"]{color:var(--nav-disabled); cursor:default; pointer-events:none;}
  .nv-item[aria-disabled="true"] .nv-ic{color:var(--nav-disabled);}
  .nv-item[aria-disabled="true"] .nv-count{background:transparent; color:var(--nav-disabled);
    box-shadow:inset 0 0 0 1px var(--nav-disabled);}

  *{box-sizing:border-box;}
  body{margin:0; background:var(--nav-page); color:var(--nav-text);
       -webkit-font-smoothing:antialiased; transition:background var(--nav-ease), color var(--nav-ease);}

  /* ---- the masthead ---- */
  .masthead{display:flex; align-items:center; gap:24px; min-height:var(--nav-h); padding:0 2rem;
            background:var(--nav-surface); border-bottom:1px solid var(--nav-rule);}
  /* the mark — #230, Dave twice: the masterbrand SVG IS the default, never type set to look
     like a logo. The <img> idiom is copied from Template-auth, not invented: _validate_icons.py
     byte-matches inlined paths against assets/icons only, so an inlined logo lands UNKNOWN. */
  .logo{display:inline-flex; align-items:center; flex:none;}
  .logo-mark{height:28px; width:auto; display:block;}
  [data-theme="light"] .logo-mark[data-mode="dark"]{display:none;}
  [data-theme="dark"]  .logo-mark[data-mode="light"]{display:none;}

  /* primary items — the shared .nv-item, laid out in a row instead of a column, and the
     indicator moves to the edge THIS nav touches the content: block-end. */
  nav.main{display:flex; gap:4px; margin-right:auto; min-width:0;}
  nav.main .nv-item{min-height:var(--nav-h); padding:0 12px; gap:8px;}
  /* #261 N2, Dave verbatim: "the selected state should just have the underscore, no background".
     The shared item gives a current row a tertiary/background/hover fill; a masthead destination
     opts OUT of it and keeps the underscore alone. Two carriers still stand without colour —
     aria-current for AT, and the 3px rule whose presence or absence is a shape — so nothing is
     left resting on hue. */
  nav.main .nv-item[aria-current="page"]{background:transparent;
    box-shadow:inset 0 -3px 0 var(--nav-indicator);}
  nav.main .nv-label{flex:none;}

  /* ---- the action rail: search / notifications / account ---- */
  .actions{display:flex; align-items:center; gap:4px; flex:none;}
  .nv-btn{position:relative; width:44px; height:44px; border:0; background:transparent;
    color:var(--nav-icon); cursor:pointer; display:inline-flex; align-items:center;
    justify-content:center; border-radius:var(--nav-radius);}
  .nv-btn:hover{background:var(--nav-hover);}
  .nv-btn:active{background:var(--nav-pressed);}
  .nv-btn:focus-visible{outline:2px solid var(--nav-focus); outline-offset:-2px;}
  .nv-btn svg{width:20px; height:20px; fill:currentColor;}
  /* the notification count is the SAME .nv-count as the sidebar row, parked on the glyph.
     It is aria-hidden because the button's own accessible name already carries the number —
     a count read twice is a count read wrong. */
  .nv-btn .nv-count{position:absolute; top:2px; right:2px; min-width:18px; height:18px; padding:0 4px;}
  .nv-avatar{width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; background:var(--nav-count-bg); color:var(--nav-count-fg);}
  .nv-acct{width:auto; padding:0 8px; gap:8px;}

  /* ---- account menu (APG menu button; Dropdown's panel skin) ---- */
  .nav-menuwrap{position:relative; display:inline-flex;}
  .nav-menu{position:absolute; right:0; top:calc(100% + 4px); z-index:20; min-width:220px;
    margin:0; padding:4px 0; background:var(--nav-surface); border:1px solid var(--nav-rule);
    box-shadow:0 4px 16px var(--nav-shadow); opacity:0; transform:translateY(-4px);
    pointer-events:none; transition:opacity var(--nav-ease), transform var(--nav-ease);}
  .nav-menu[data-open="true"]{opacity:1; transform:none; pointer-events:auto;}
  .nav-menu .nv-item{width:100%; white-space:nowrap;}
  .nav-menu .sep{height:1px; margin:4px 0; background:var(--nav-rule);}

  /* ---- search disclosure ----
     ⚠ THE EXPLICIT [hidden] RULE IS LOAD-BEARING — #218 W3 finding F1: an author `display:`
     beats the UA sheet's [hidden]{display:none}, so a markup-hidden element renders while
     telling AT it is gone. Declared here rather than discovered again. */
  .nav-searchbar[hidden]{display:none;}
  /* #261 N2, Dave verbatim: "align the bottom of the search bar with the bottom of its
     container". The bar carried 8px of padding UNDER the field, so the field's baseline rule
     floated with a gap beneath it and the container's own edge read as a second, unrelated
     line. The bottom padding is now zero: the field's rule lands ON the container's bottom
     edge, one terminating line instead of two. The 8px above is kept — the gap is only wrong
     below, where two rules were competing. */
  .nav-searchbar{background:var(--nav-surface); border-bottom:1px solid var(--nav-rule); padding:8px 32px 0;}
  /* ⛔ #219 — THE FIELD WRAPPER IS `.nav-search`, NOT `.search`, AND THE NAME IS LOAD-BEARING:
     `.search input` is a GLOBAL BINDING SITE in canon/type.css (T-D9). A bare `.search` here
     made canon's binding reach a fifth file that never asked for it and the blast-radius gate
     read ESCAPED. Namespaced at cause. Related: #202 vocabulary collision. */
  .nav-searchbar .nav-search{position:relative; display:flex; align-items:center; height:48px;
    border-bottom:1px solid var(--field-border); background:transparent;}
  .nav-searchbar .nav-search:hover{background:var(--nav-hover);}
  .nav-searchbar .nav-search:focus-within{box-shadow:inset 0 -2px 0 var(--field-active);}
  .nav-searchbar .mag{flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; color:var(--nav-icon); margin:0 12px;}
  .nav-searchbar .mag svg{width:20px; height:20px; fill:currentColor;}
  .nav-searchbar input{flex:1; min-width:0; height:100%; border:0; background:transparent;
    color:var(--nav-text); outline:none;}
  .nav-searchbar input::placeholder{color:var(--nav-text); opacity:var(--alpha-48,.48);}
  .nav-searchbar input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none;}
  .nav-searchbar input:focus-visible{outline:none;}
  .nav-searchbar .clear{flex:none; width:24px; height:24px; margin:0 12px; padding:0; border:0;
    background:transparent; color:var(--nav-icon); cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center;}
  .nav-searchbar .clear svg{width:12px; height:12px; fill:currentColor;}
  .nav-searchbar .clear:focus-visible{outline:2px solid var(--field-active); outline-offset:2px;}
  .nav-searchbar input:placeholder-shown ~ .clear{display:none;}

  /* ---- COLLAPSE AT 768px ----
     The primary row does not shrink into unreadability: below 768px it is REPLACED by a
     hamburger that discloses the same destinations as a stacked panel. The <a> elements in
     the panel are the same .nv-item, so the current-location carriers come along unchanged —
     except the indicator, which follows the family rule and moves to the edge the panel
     touches the content (inline-start), exactly as the sidebar does. */
  .nv-burger{display:none;}
  .nav-drawer[hidden]{display:none;}
  .nav-drawer{background:var(--nav-surface); border-bottom:1px solid var(--nav-rule); padding:4px 0;}
  .nav-drawer .nv-item[aria-current="page"]{box-shadow:inset 3px 0 0 var(--nav-indicator);}
  @media (max-width:767px){
    .masthead{padding:0 1rem; gap:8px;}
    .nv-burger{display:inline-flex;}
    nav.main{display:none;}
    .nv-acct .nv-label{display:none;}
    .nav-searchbar{padding:8px 1rem 0;}
  }
  @media (min-width:768px){
    .nav-drawer{display:none;}
  }

  /* WCAG 2.3.3 / motion sensitivity — honour reduced-motion (invisible to other users) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
