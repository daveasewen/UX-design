<script>
(function(){
  var THEMES=[{"attr": "legacy", "label": "Apollo Legacy", "hits": 2, "note": "Apollo Legacy: 2 var(s) re-bound."}, {"attr": "mono", "label": "Apollo Mono", "hits": 0, "note": ""}, {"attr": "console", "label": "Apollo Console", "hits": 2, "note": "Apollo Console: 2 var(s) re-bound."}, {"attr": "supercharge", "label": "Apollo Supercharge", "hits": 6, "note": "Apollo Supercharge: 6 var(s) re-bound."}];                       // [{attr,label,hits,note}]
  var b64=document.getElementById('payload').textContent.trim();

  // module docstring for the swap point if the overlay should go everywhere.
  var OVERLAY_MARK='<!-- APOLLO-REVIEW-OVERLAY -->';

    state.embed=(h.chrome==='0');            // SWAP POINT — see the module docstring
    mount();
    if(h.w){ w.value=h.w; setW(); }
    apply(); }
  window.addEventListener('hashchange',initFromHash);
  initFromHash();
})();
</script>
