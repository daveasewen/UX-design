<script>
(function(){
  var THEMES=[{"attr": "legacy", "label": "Apollo Legacy", "hits": 2, "note": "Apollo Legacy: 2 var(s) re-bound."}, {"attr": "mono", "label": "Apollo Mono", "hits": 0, "note": ""}, {"attr": "console", "label": "Apollo Console", "hits": 2, "note": "Apollo Console: 2 var(s) re-bound."}, {"attr": "supercharge", "label": "Apollo Supercharge", "hits": 8, "note": "Apollo Supercharge: 8 var(s) re-bound."}];                       // [{attr,label,hits,note}]
  var b64=document.getElementById('payload').textContent.trim();

  // module docstring for the swap point if the overlay should go everywhere.
  var OVERLAY_MARK='<!-- APOLLO-REVIEW-OVERLAY -->';

    var doc=src.replace(/(<body[^>]*data-theme=")[a-z]+(")/,'$1'+state.mode+'$2')
               .replace(/<html/,'<html data-apollo-theme="'+state.theme+'" ');
    window.open(URL.createObjectURL(new Blob([doc],{type:'text/html'})));
  });

  function initFromHash(){ var h=hash();
    if(h.theme&&THEMES.some(function(t){return t.attr===h.theme})) state.theme=h.theme;
    if(h.m==='light'||h.m==='dark') state.mode=h.m;
    state.embed=(h.chrome==='0');            // SWAP POINT — see the module docstring
    mount();
    if(h.w){ w.value=h.w; setW(); }
    apply(); }
  window.addEventListener('hashchange',initFromHash);
  initFromHash();
})();
</script>
