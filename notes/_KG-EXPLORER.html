<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apollo KG — explorer</title>
<style>
:root{
  --bg:#FFFFFF;--ink:#111111;--ink-2:#555555;--ink-3:#8A8A8A;--rule:#E3E3E3;--panel:#F6F6F6;
  --accent:#DA1A00;
  --c-component:#DA1A00;--c-snippet:#7A7A7A;--c-pattern:#1F4FBF;--c-context:#0E8A5F;--c-ruling:#111111;
  --f-structure:#111111;--f-usage:#1F4FBF;--f-render:#7A7A7A;--f-rules:#DA1A00;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C;--ink:#F2F2F2;--ink-2:#B5B5B5;--ink-3:#7A7A7A;--rule:#262626;--panel:#161616;
    --accent:#F6604C;--c-component:#F6604C;--c-snippet:#9A9A9A;--c-pattern:#6C94FF;--c-context:#3FCB98;--c-ruling:#F2F2F2;
    --f-structure:#F2F2F2;--f-usage:#6C94FF;--f-render:#9A9A9A;--f-rules:#F6604C;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C;--ink:#F2F2F2;--ink-2:#B5B5B5;--ink-3:#7A7A7A;--rule:#262626;--panel:#161616;
  --accent:#F6604C;--c-component:#F6604C;--c-snippet:#9A9A9A;--c-pattern:#6C94FF;--c-context:#3FCB98;--c-ruling:#F2F2F2;
  --f-structure:#F2F2F2;--f-usage:#6C94FF;--f-render:#9A9A9A;--f-rules:#F6604C;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Helvetica Neue",Helvetica,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.stats{display:flex;gap:28px;font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.stats b{color:var(--ink);font-weight:600}
.search{position:relative}
.search input{width:320px;height:36px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;border-radius:0;outline:none}
.search input:focus{border-color:var(--ink)}
.hits{position:absolute;top:38px;left:0;right:0;background:var(--bg);border:1px solid var(--rule);max-height:360px;overflow:auto;z-index:20;display:none}
.hits.on{display:block}
.hit{display:grid;grid-template-columns:82px 1fr auto;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--rule);align-items:center}
.hit:hover,.hit.sel{background:var(--panel)}
.hit small{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.stage{position:relative;overflow:hidden;border-right:1px solid var(--rule)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.grabbing{cursor:grabbing}
.legend{position:absolute;left:24px;bottom:20px;display:flex;flex-direction:column;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
.legend .row{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;user-select:none;min-height:30px}
.chip.off{opacity:.35}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.edge i{width:16px;height:2px;border-radius:0}
.chip b{font-weight:400;color:var(--ink-3);margin-left:2px}
.crumbs{position:absolute;left:24px;top:18px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;flex-wrap:wrap;max-width:70%}
.crumbs button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0}
.crumbs button.cur{border-color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--ink-3)}
.tools{position:absolute;right:20px;top:18px;display:flex;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tools button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px;cursor:pointer;min-height:30px;border-radius:0}
.tools button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;font-size:12px;font-family:var(--mono);white-space:nowrap;display:none;z-index:10;transform:translate(12px,-50%)}
.tip small{opacity:.6;margin-right:6px;text-transform:uppercase;font-size:10px}
.hint{position:absolute;right:20px;bottom:20px;font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;line-height:1.6}
aside{overflow:auto;background:var(--bg)}
.empty{padding:28px 24px;color:var(--ink-2)}
.empty h2{font-size:22px;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);font-weight:700;line-height:1.15}
.empty p{margin:0 0 12px;max-width:34ch}
.empty a.orph{color:var(--ink);text-decoration:underline;text-underline-offset:3px}.empty a.orph b{color:var(--ink-3);font-weight:400;font-family:var(--mono);font-size:11px}
.empty .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:22px}
.head{padding:22px 24px 18px;border-bottom:1px solid var(--rule)}
.kind{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.kind i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.head h2{font-size:24px;line-height:1.1;letter-spacing:-.02em;margin:10px 0 6px;font-weight:700}
.head .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all}
.head p{margin:12px 0 0;color:var(--ink-2);font-size:13px}
.head .meta{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.head .meta b{color:var(--ink);font-weight:600}
.group{border-bottom:1px solid var(--rule)}
.group h3{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;margin:0;padding:12px 24px;font-size:12px;font-family:var(--mono);letter-spacing:.04em;cursor:pointer;user-select:none}
.group h3 i{width:14px;height:2px;background:var(--c)}
.group h3 b{font-weight:400;color:var(--ink-3)}
.group h3 .dir{font-size:10px;color:var(--ink-3);text-transform:uppercase;margin-left:8px}
.group.closed .rows{display:none}
.rows{padding:0 0 6px}
.rel{display:grid;grid-template-columns:9px 1fr;gap:10px;padding:8px 24px;cursor:pointer;align-items:start}
.rel:hover{background:var(--panel)}
.rel i{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.rel .n{font-weight:600;font-size:13px}
.rel .n small{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:6px;font-size:10px;text-transform:uppercase}
.rel .note{color:var(--ink-2);font-size:12px;margin-top:2px;line-height:1.4}
.rel.unres{cursor:default;opacity:.85}
.rel.unres .n{color:var(--ink-3);font-style:italic;font-weight:400}
.path{padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:11px}
.path .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.path .steps span{padding:4px 7px;border:1px solid var(--rule);background:var(--bg)}
.path .steps em{color:var(--ink-3);font-style:normal}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:56px 55vh 1fr}.stage{border-right:0;border-bottom:1px solid var(--rule)}.search input{width:180px}.stats{display:none}}
</style>
</head>

<script>
const KG=JSON.parse(document.getElementById('kg').textContent);
const NODES=KG.nodes, EDGES=KG.edges;
const byId=new Map(NODES.map(n=>[n.id,n]));
NODES.forEach((n,i)=>{n.i=i;n.ox=n.x;n.oy=n.y;n.z=0;n.tz=0;n.tx=n.x;n.ty=n.y;n.a=1;n.ta=1;n.r=n.type==='component'?4.2+Math.min(n.deg,29)*0.16:n.type==='ruling'?4.5:2.6});
const FAMILY={containedBy:'structure',hasPart:'structure',composedOf:'structure',family:'structure',groupsWith:'structure',partial:'structure',reuses:'structure',delegatesTo:'structure',
  usedInContext:'usage',commonPattern:'usage',renderedBy:'render',
  governedBy:'rules',mustNotNeighbour:'rules',consumes:'rules',triggeredBy:'rules',drivesConsumer:'rules'};
const FAMLABEL={structure:'Structure',usage:'Usage',render:'Rendering',rules:'Rules & wiring'};
const READ={containedBy:['is contained by','contains'],hasPart:['has part','is part of'],composedOf:['is composed of','composes'],family:['in family with','in family with'],groupsWith:['groups with','groups with'],partial:['partial of','has partial'],reuses:['reuses','is reused by'],delegatesTo:['delegates to','is delegated to by'],usedInContext:['used in context','is a context for'],commonPattern:['common pattern','is a pattern of'],renderedBy:['rendered by','renders'],governedBy:['governed by','governs'],mustNotNeighbour:['must not neighbour','must not neighbour'],consumes:['consumes','is consumed by'],triggeredBy:['triggered by','triggers'],drivesConsumer:['drives consumer','is driven by']};
const TYPES=['component','snippet','pattern','context','ruling'];
const adj=new Map(NODES.map(n=>[n.id,[]]));
const unresolved=new Map();
EDGES.forEach((e,k)=>{e.k=k;if(!e.t){(unresolved.get(e.s)||unresolved.set(e.s,[]).get(e.s)).push(e);return;}
  adj.get(e.s).push({e,other:e.t,out:true});adj.get(e.t).push({e,other:e.s,out:false});e.a=1;e.ta=1;});
const typeOn={component:1,snippet:1,pattern:1,context:1,ruling:1}, famOn={structure:1,usage:1,render:1,rules:1};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C={};function palette(){C={bg:css('--bg'),ink:css('--ink'),ink2:css('--ink-2'),ink3:css('--ink-3'),rule:css('--rule'),
  t:{component:css('--c-component'),snippet:css('--c-snippet'),pattern:css('--c-pattern'),context:css('--c-context'),ruling:css('--c-ruling')},
  f:{structure:css('--f-structure'),usage:css('--f-usage'),render:css('--f-render'),rules:css('--f-rules')}}}
palette();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{palette();draw()});

// ---------- stats + legend
const count={};NODES.forEach(n=>count[n.type]=(count[n.type]||0)+1);
document.getElementById('stats').innerHTML=`<span><b>${NODES.length}</b> nodes</span><span><b>${EDGES.length.toLocaleString()}</b> relations</span><span><b>${Object.keys(FAMILY).length}</b> edge types</span><span><b>${count.component}</b> components</span><span><b>${[...unresolved.values()].reduce((a,b)=>a+b.length,0)}</b> declared, unresolved</span>`;
const legend=document.getElementById('legend');
legend.innerHTML=`<div class="row">${TYPES.map(t=>`<span class="chip" data-type="${t}" style="--c:var(--c-${t})"><i></i>${t}<b>${count[t]}</b></span>`).join('')}</div>
<div class="row">${Object.keys(FAMLABEL).map(f=>`<span class="chip edge" data-fam="${f}" style="--c:var(--f-${f})"><i></i>${FAMLABEL[f]}<b>${EDGES.filter(e=>FAMILY[e.type]===f).length}</b></span>`).join('')}</div>`;
legend.addEventListener('click',ev=>{const c=ev.target.closest('.chip');if(!c)return;
  if(c.dataset.type){typeOn[c.dataset.type]^=1;c.classList.toggle('off')}else{famOn[c.dataset.fam]^=1;c.classList.toggle('off')}
  if(focus)applyFocus();draw();});

// ---------- canvas
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
let W,H,DPR,view={x:0,y:0,k:0.42};
let three=false,spin=true,rot={x:0.35,y:0},ctr=[0,0,0];const F=2600;
function proj(x,y,z){if(!three)return {x:W/2+(x+view.x)*view.k,y:H/2+(y+view.y)*view.k,s:1,d:0};
  x-=ctr[0];y-=ctr[1];z-=ctr[2];const cy=Math.cos(rot.y),sy_=Math.sin(rot.y),cx=Math.cos(rot.x),sx_=Math.sin(rot.x);
  const x1=x*cy+z*sy_, z1=-x*sy_+z*cy; const y2=y*cx-z1*sx_, z2=y*sx_+z1*cx;
  const s=F/(F+z2); return {x:W/2+(x1*s+view.x)*view.k,y:H/2+(y2*s+view.y)*view.k,s,d:z2}}
const P=n=>proj(n.x,n.y,n.z);
function base(n){return three?[n.x3,n.y3,n.z3]:[n.ox,n.oy,0]}
function resize(){DPR=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*DPR;cv.height=H*DPR;draw()}
addEventListener('resize',resize);

function fit(){view={x:0,y:0,k:Math.min(W,H)/(three?2600:2300)};draw()}

let hover=null, focus=null, trail=[], depth2=false, pathMode=false, pathNodes=null, pathEdges=null, anim=null;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.lineWidth=focus?0.9:0.5;
  // edges
  for(const e of EDGES){if(!e.t)continue;const s=byId.get(e.s),t=byId.get(e.t);
    const on=typeOn[s.type]&&typeOn[t.type]&&famOn[FAMILY[e.type]];
    let a=on?Math.min(s.a,t.a)*(focus?0.9:0.32):0.04; if(pathEdges){a=pathEdges.has(e.k)?1:a*0.15}
    if(hover&&!focus){a=(e.s===hover.id||e.t===hover.id)?0.95:0.06}
    if(a<0.02)continue; ctx.globalAlpha=a;ctx.strokeStyle=C.f[FAMILY[e.type]]||C.ink3;
    ctx.lineWidth=(pathEdges&&pathEdges.has(e.k))?2.2:(focus&&(e.s===focus.id||e.t===focus.id))?1.3:0.6;
    const ps=P(s),pt=P(t);if(three)ctx.globalAlpha*=0.55+0.45*Math.min(ps.s,pt.s);ctx.beginPath();ctx.moveTo(ps.x,ps.y);ctx.lineTo(pt.x,pt.y);ctx.stroke();}
  // nodes
  const ORDER=three?[...NODES].sort((a,b)=>P(b).d-P(a).d):NODES;
  for(const n of ORDER){let a=typeOn[n.type]?n.a:0.05; if(pathNodes){a=pathNodes.has(n.id)?1:a*0.2}
    if(hover&&!focus){a=(n===hover||adj.get(hover.id).some(x=>x.other===n.id))?1:0.12}
    if(a<0.03)continue;const pn=P(n);ctx.globalAlpha=three?a*(0.5+0.5*pn.s):a;const r=n.r*Math.max(0.7,Math.min(1.6,view.k*1.6))*(n===focus?1.9:1)*pn.s;
    ctx.fillStyle=C.t[n.type];ctx.beginPath();ctx.arc(pn.x,pn.y,r,0,7);ctx.fill();
    if(n===focus||(pathNodes&&pathNodes.has(n.id))){ctx.strokeStyle=C.bg;ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.beginPath();ctx.arc(pn.x,pn.y,r+3,0,7);ctx.stroke();}
  }
  // labels
  ctx.globalAlpha=1;ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.textBaseline='middle';
  const lab=[];
  if(focus){lab.push(focus);for(const x of adj.get(focus.id)){const n=byId.get(x.other);if(n.a>0.5)lab.push(n)}}
  else if(view.k>0.9){for(const n of NODES)if(n.type==='component'&&typeOn.component)lab.push(n)}
  if(pathNodes)for(const id of pathNodes)lab.push(byId.get(id));
  const seen=new Set();
  for(const n of lab){if(seen.has(n.id))continue;seen.add(n.id);const pn=P(n);const x=pn.x+n.r*pn.s+5,y=pn.y;const t=n.label.length>34?n.label.slice(0,33)+'…':n.label;
    ctx.fillStyle=C.bg;ctx.globalAlpha=0.75;const w=ctx.measureText(t).width;ctx.fillRect(x-2,y-7,w+4,14);ctx.globalAlpha=1;
    ctx.fillStyle=n===focus?C.ink:C.ink2;if(n===focus)ctx.font='bold 12px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillText(t,x,y);ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';}
  // sector labels in focus mode
  if(focus&&sectors){ctx.font='10px Menlo,monospace';ctx.textAlign='center';for(const s of sectors){ctx.globalAlpha=0.9;ctx.fillStyle=C.f[FAMILY[s.type]];
    const R=s.R*(three?1.5:1)+(three?60:26);const q=three?proj(focus.x+Math.cos(s.mid)*R,focus.y+R*0.55,focus.z+Math.sin(s.mid)*R):proj(focus.x+Math.cos(s.mid)*R,focus.y+Math.sin(s.mid)*R,focus.z);ctx.fillText(s.type.toUpperCase()+' · '+s.n,q.x,q.y);}ctx.textAlign='left';}
}
function tick(){let more=false;for(const n of NODES){const dx=n.tx-n.x,dy=n.ty-n.y,dz=n.tz-n.z,da=n.ta-n.a;if(Math.abs(dx)+Math.abs(dy)+Math.abs(dz)+Math.abs(da)*40>0.4){more=true;n.x+=dx*0.16;n.y+=dy*0.16;n.z+=dz*0.16;n.a+=da*0.16}else{n.x=n.tx;n.y=n.ty;n.z=n.tz;n.a=n.ta}}
  if(three&&spin&&!drag){rot.y+=0.0035;more=true}
  draw();if(more)anim=requestAnimationFrame(tick);else anim=null}
function animate(){if(!anim)anim=requestAnimationFrame(tick)}

// ---------- focus (the "dig")
let sectors=null;
function applyFocus(){
  const f=focus; const [cx,cy,cz]=base(f); f.tx=cx;f.ty=cy;f.tz=cz;f.ta=1;
  const nb=adj.get(f.id).filter(x=>typeOn[byId.get(x.other).type]&&famOn[FAMILY[x.e.type]]);
  const groups=new Map();for(const x of nb){(groups.get(x.e.type)||groups.set(x.e.type,[]).get(x.e.type)).push(x)}
  const order=[...groups.keys()].sort((a,b)=>groups.get(b).length-groups.get(a).length);
  const total=nb.length||1, R1=Math.max(120,Math.min(260,60+total*7)), gap=0.06;
  let ang=-Math.PI/2; sectors=[]; const placed=new Set([f.id]);
  for(const t of order){const g=groups.get(t);const span=(Math.PI*2-gap*order.length)*(g.length/total);const start=ang+gap/2;
    // spread evenly, alternate radius a little when dense
    g.sort((a,b)=>byId.get(a.other).label.localeCompare(byId.get(b.other).label));
    g.forEach((x,i)=>{const a=start+span*((i+0.5)/g.length);const r=three?R1*1.5:R1+(g.length>14?(i%2)*34:0);const n=byId.get(x.other);
      if(three){const ph=((i%5)-2)*0.32;n.tx=cx+Math.cos(a)*Math.cos(ph)*r;n.ty=cy+Math.sin(ph)*r;n.tz=cz+Math.sin(a)*Math.cos(ph)*r}else{n.tx=cx+Math.cos(a)*r;n.ty=cy+Math.sin(a)*r;n.tz=cz}n.ta=1;placed.add(n.id)});
    sectors.push({type:t,n:g.length,mid:start+span/2,R:R1+(g.length>14?34:0)});ang+=span+gap;}
  if(depth2){const R2=R1+150;let k=0;const second=[];for(const x of nb){for(const y of adj.get(x.other)){if(!placed.has(y.other)&&typeOn[byId.get(y.other).type])second.push(y.other)}}
    const uniq=[...new Set(second)];uniq.forEach((id,i)=>{const n=byId.get(id);const a=-Math.PI/2+Math.PI*2*(i/uniq.length);if(three){const r=R2*1.5,ph=((i%7)-3)*0.25;n.tx=cx+Math.cos(a)*Math.cos(ph)*r;n.ty=cy+Math.sin(ph)*r;n.tz=cz+Math.sin(a)*Math.cos(ph)*r}else{n.tx=cx+Math.cos(a)*R2;n.ty=cy+Math.sin(a)*R2;n.tz=cz}n.ta=0.45;placed.add(id)})}
  for(const n of NODES){if(!placed.has(n.id)){[n.tx,n.ty,n.tz]=base(n);n.ta=0.05}}
  // centre the view on the focus
  if(three){ctr=[cx,cy,cz];view.x=0;view.y=0;view.k=Math.min(W,H)/(2*(R1*1.5+(depth2?225:0)+200))}else{view.x=-cx;view.y=-cy;view.k=Math.max(view.k,Math.min(W,H)/(2*(R1+(depth2?150:0)+140)))}
  animate(); renderPanel(f,nb);
}
function setFocus(n,push=true){pathNodes=pathEdges=null;focus=n;if(push){if(trail[trail.length-1]!==n)trail.push(n)}renderCrumbs();applyFocus()}
function surface(){focus=null;sectors=null;ctr=[0,0,0];pathNodes=pathEdges=null;trail=[];for(const n of NODES){[n.tx,n.ty,n.tz]=base(n);n.ta=1}renderCrumbs();animate();renderEmpty()}
function renderCrumbs(){const el=document.getElementById('crumbs');if(!trail.length){el.innerHTML='';return}
  el.innerHTML=`<button data-i="-1">Surface</button>`+trail.map((n,i)=>`<span class="sep">→</span><button data-i="${i}" class="${n===focus?'cur':''}">${esc(n.label)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i<0)return surface();trail=trail.slice(0,i+1);setFocus(trail[i],false)});}

// ---------- panel
const panel=document.getElementById('panel');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderEmpty(){panel.innerHTML=`<div class="empty"><h2>890 nodes. 1,261 relations. Every one declared by a component, none invented.</h2>
<p>The graph is authored from the inside out: each of the 138 components states what it contains, where it is used, which patterns it follows, what renders it and which rulings govern it. Patterns, contexts, snippets and rulings are the things those statements point at.</p>
<p>Click any node to dig. The node moves to the centre and its relations fan out in sectors, one per relationship type; click a neighbour to follow the thread. Shift-click two nodes to see the shortest path between them.</p>
<div class="k">Orphans — registered, referenced by nothing</div><p>${KG.orphans.length?KG.orphans.map(id=>`<a href="#" data-id="${esc(id)}" class="orph">${esc(byId.get(id).label)}</a>`).join(' · '):'none'}</p>
<div class="k">Islands — connected to each other, not to the graph</div><p>${KG.islands.map(is=>`<a href="#" data-id="${esc(is[0])}" class="orph">${esc(byId.get(is.find(i=>i.startsWith('component:'))||is[0]).label)} <b>${is.length}</b></a>`).join(' · ')}</p>
<div class="k">Node types</div><p>${TYPES.map(t=>`<span class="kind" style="--c:var(--c-${t})"><i></i>${t} ${count[t]}</span>`).join(' &nbsp; ')}</p>
<div class="k">Edge families</div><p>${Object.keys(FAMLABEL).map(f=>`<span class="kind" style="--c:var(--f-${f})"><i style="border-radius:0;height:2px;width:14px"></i>${FAMLABEL[f]}</span>`).join(' &nbsp; ')}</p></div>`;panel.querySelectorAll('.orph').forEach(a=>a.onclick=ev=>{ev.preventDefault();setFocus(byId.get(a.dataset.id))})}
function renderPanel(n,nb){
  const isComp=n.type==='component';
  let h=`<div class="head"><span class="kind" style="--c:var(--c-${n.type})"><i></i>${n.type}</span><h2>${esc(n.label)}</h2><div class="id">${esc(n.id)}</div>`;
  if(n.purpose)h+=`<p>${esc(n.purpose)}</p>`; if(n.text)h+=`<p>“${esc(n.text)}”</p>`;
  h+=`<div class="meta"><span><b>${adj.get(n.id).length}</b> relations</span>${n.category?`<span>${esc(n.category)}</span>`:''}${n.date?`<span>ruled ${esc(n.date)}${n.ruled?' · '+esc(n.ruled):''}</span>`:''}${n.sources?`<span><b>${n.sources.length}</b> sources</span>`:''}</div></div>`;
  if(pathNodes){h+=renderPath()}
  const groups=new Map();for(const x of adj.get(n.id)){(groups.get(x.e.type)||groups.set(x.e.type,[]).get(x.e.type)).push(x)}
  const order=[...groups.keys()].sort((a,b)=>groups.get(b).length-groups.get(a).length);
  for(const t of order){const g=groups.get(t);const dir=g[0].out?READ[t][0]:READ[t][1];
    h+=`<div class="group ${g.length>12?'closed':''}"><h3 style="--c:var(--f-${FAMILY[t]})"><i></i><span>${t}<span class="dir">${esc(dir)}</span></span><b>${g.length}</b></h3><div class="rows">`;
    for(const x of g.sort((a,b)=>byId.get(a.other).label.localeCompare(byId.get(b.other).label))){const m=byId.get(x.other);
      h+=`<div class="rel" data-id="${esc(m.id)}" style="--c:var(--c-${m.type})"><i></i><div><div class="n">${esc(m.label)}<small>${m.type}</small></div>${x.e.note?`<div class="note">${esc(x.e.note)}</div>`:''}</div></div>`}
    h+=`</div></div>`}
  const un=unresolved.get(n.id);if(un&&un.length){h+=`<div class="group closed"><h3 style="--c:var(--ink-3)"><i></i><span>declared, unresolved<span class="dir">ref:null · awaiting Dave's-eye migration</span></span><b>${un.length}</b></h3><div class="rows">`;
    for(const e of un)h+=`<div class="rel unres" style="--c:var(--ink-3)"><i></i><div><div class="n">${esc(e.type)}</div><div class="note">${esc(e.note)}</div></div></div>`;h+=`</div></div>`}
  panel.innerHTML=h;panel.scrollTop=0;
  panel.querySelectorAll('.group h3').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('closed'));
  panel.querySelectorAll('.rel[data-id]').forEach(x=>{x.onclick=()=>setFocus(byId.get(x.dataset.id));x.onmouseenter=()=>{hover=byId.get(x.dataset.id);draw()};x.onmouseleave=()=>{hover=null;draw()}});
}
function renderPath(){if(!pathNodes)return '';const ids=[...pathNodes];const steps=[];for(let i=0;i<ids.length;i++){const n=byId.get(ids[i]);steps.push(`<span>${esc(n.label)}</span>`);if(i<ids.length-1){const e=pathEdgeList[i];steps.push(`<em>—${e.type}→</em>`)}}
  return `<div class="path">shortest path · ${ids.length-1} hops<div class="steps">${steps.join('')}</div></div>`}

// ---------- shortest path (BFS)
let pathEdgeList=[];
function shortestPath(a,b){const prev=new Map([[a.id,null]]);const q=[a.id];while(q.length){const id=q.shift();if(id===b.id)break;for(const x of adj.get(id)){if(!prev.has(x.other)&&typeOn[byId.get(x.other).type]){prev.set(x.other,{from:id,e:x.e});q.push(x.other)}}}
  if(!prev.has(b.id))return null;const ids=[],es=[];let cur=b.id;while(cur){ids.unshift(cur);const p=prev.get(cur);if(p){es.unshift(p.e);cur=p.from}else cur=null}return {ids,es}}
function showPath(a,b){const p=shortestPath(a,b);if(!p){alert('No path between these two with the current filters.');return}
  pathNodes=new Set(p.ids);pathEdges=new Set(p.es.map(e=>e.k));pathEdgeList=p.es;
  // lay the path out: keep focus layout but make sure path nodes are visible
  for(const id of p.ids){const n=byId.get(id);n.ta=1}
  animate();renderPanel(a,adj.get(a.id));}

// ---------- interaction
let drag=null,moved=false;
function pick(mx,my){let best=null,bd=1e9;for(const n of NODES){if(n.a<0.2||!typeOn[n.type])continue;const pn=P(n);const dx=pn.x-mx,dy=pn.y-my;const d=dx*dx+dy*dy;const r=Math.max(7,n.r*view.k*1.6*pn.s+3);if(d<r*r&&d<bd){bd=d;best=n}}return best}
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,rx:rot.x,ry:rot.y,rotate:three&&!e.shiftKey};moved=false;cv.classList.add('grabbing')});
addEventListener('mousemove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(drag.rotate){rot.y=drag.ry+dx*0.006;rot.x=Math.max(-1.4,Math.min(1.4,drag.rx+dy*0.006))}else{view.x=drag.vx+dx/view.k;view.y=drag.vy+dy/view.k}draw();return}
  const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);const tip=document.getElementById('tip');
  if(n!==hover){hover=n;draw()} if(n){tip.style.display='block';tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.innerHTML=`<small>${n.type}</small>${esc(n.label)} · ${adj.get(n.id).length}`}else tip.style.display='none'});
addEventListener('mouseup',e=>{if(!drag)return;cv.classList.remove('grabbing');const was=drag;drag=null;if(moved)return;
  const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);
  if(!n){if(focus&&!e.shiftKey)surface();return}
  if((e.shiftKey||pathMode)&&focus&&n!==focus){showPath(focus,n);return}
  setFocus(n)});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left-W/2,my=e.clientY-r.top-H/2;const k0=view.k;view.k=Math.max(0.12,Math.min(6,view.k*Math.exp(-e.deltaY*0.0016)));
  view.x-=mx/k0-mx/view.k;view.y-=my/k0-my/view.k;draw()},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(pathNodes){pathNodes=pathEdges=null;renderPanel(focus,adj.get(focus.id));animate()}else if(focus)surface();document.getElementById('hits').classList.remove('on')}});
document.getElementById('three').onclick=function(){three=!three;this.classList.toggle('on',three);document.getElementById('spin').hidden=!three;
  for(const n of NODES){[n.tx,n.ty,n.tz]=base(n)}if(focus)applyFocus();else{ctr=[0,0,0];fit()}animate()};
document.getElementById('spin').onclick=function(){spin=!spin;this.classList.toggle('on',spin);animate()};
document.getElementById('spin').classList.add('on');
document.getElementById('depth').onclick=function(){depth2=!depth2;this.classList.toggle('on',depth2);if(focus)applyFocus()};
document.getElementById('pathBtn').onclick=function(){pathMode=!pathMode;this.classList.toggle('on',pathMode)};
document.getElementById('fit').onclick=()=>{if(focus)applyFocus();else fit()};

// ---------- search
const q=document.getElementById('q'),hits=document.getElementById('hits');let sel=0,cur=[];
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){hits.classList.remove('on');return}
  cur=NODES.filter(n=>n.label.toLowerCase().includes(s)||n.id.toLowerCase().includes(s)).sort((a,b)=>(b.type==='component')-(a.type==='component')||b.deg-a.deg).slice(0,40);sel=0;
  hits.innerHTML=cur.map((n,i)=>`<div class="hit ${i===0?'sel':''}" data-i="${i}"><small>${n.type}</small><span>${esc(n.label)}</span><small>${adj.get(n.id).length}</small></div>`).join('')||`<div class="hit"><small></small><span>nothing</span></div>`;
  hits.classList.add('on');hits.querySelectorAll('.hit[data-i]').forEach(h=>h.onclick=()=>choose(+h.dataset.i))});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(cur.length-1,sel+1)}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1)}else if(e.key==='Enter'){choose(sel);return}else return;hits.querySelectorAll('.hit').forEach((h,i)=>h.classList.toggle('sel',i===sel))});
function choose(i){const n=cur[i];if(!n)return;hits.classList.remove('on');q.value='';q.blur();trail=[];setFocus(n)}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hits.classList.remove('on')});

resize();fit();renderEmpty();
</script>
</body>
</html>
