<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PR 316 — pending roundel beside the amber notifications</title>
<link rel="stylesheet" href="../../../../knowledge/canon/type.css">
<link rel="stylesheet" href="../../../../knowledge/canon/canon.css">
<style>
 body{margin:0;padding:32px;background:var(--background-default);color:var(--text-default);}
 .row{display:flex;gap:32px;align-items:center;margin-bottom:24px;}
 .cap{font:400 12px/1.4 "Univers Next for HSBC",Arial,sans-serif;width:220px;}
 .w{width:520px;}
 .big .confirm{padding:0;}
 .small svg.pending{width:24px !important;height:24px !important;}
</style></head>
<body class="canon" data-theme="light">
<svg width="0" height="0" style="position:absolute"><symbol id="ic-warning" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="currentColor"/><path style="fill:var(--mark)" d="M9.90107 3.80005H8.10107V9.80005H9.90107V3.80005Z"/><path style="fill:var(--mark)" d="M9.00078 14.2C9.66352 14.2 10.2008 13.6628 10.2008 13C10.2008 12.3373 9.66352 11.8 9.00078 11.8C8.33804 11.8 7.80078 12.3373 7.80078 13C7.80078 13.6628 8.33804 14.2 9.00078 14.2Z"/></symbol></svg>
<div class="row"><span class="cap">Amber notification (canon .cn-notifications, tint)</span>
 <div class="cn-notifications w"><div class="note tint warn" role="status"><span class="ic"><svg aria-hidden="true"><use href="#ic-warning"/></svg></span><span class="main"><strong>Notification title.</strong> Message description.</span></div></div></div>
<div class="row"><span class="cap">Amber inline message</span>
 <div class="cn-notifications w"><span class="inline warn"><span class="ic"><svg aria-hidden="true"><use href="#ic-warning"/></svg></span>Message to appear here</span></div></div>
<div class="row"><span class="cap">Pending roundel, 56px (canon .cn-confirmation)</span>
 <div class="cn-confirmation big" id="pend"><div class="confirm"><svg class="pending is-warning" viewBox="0 0 18 18" aria-hidden="true"><circle class="disc" cx="9" cy="9" r="9"/><path style="fill:var(--mark)" d="M9.6 3H8.4V9.6H13V8.4H9.6V3Z"/></svg></div></div></div>
</body></html>
