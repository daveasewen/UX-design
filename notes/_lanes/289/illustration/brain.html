<title>Brain — line-drawn 3D · #289</title>
<style>
/* ============================================================
   THE BRAIN — a line-drawn "engineering" 3D diagram. #289 lane I1.
   PASS FIVE. Passes one to four are kept beside this file as
   brain-v1.html ... brain-v4.html.

   WHY THREE. Passes one and two GENERATED a brain: an ellipsoid with
   meridians (v1), then a traced silhouette with procedurally grown
   gyri (v2). Neither read as a brain, because the thing that says
   "brain" is not a rule — it is the particular run of THOSE sulci on
   THAT outline. Dave's verdict on v2 was the same as on v1.

   So pass three does not generate anything. It TRACES.

   STEP 1 — THE TRACE. DAVE-REF-brain-side-view.png is thresholded to
   ink, skeletonised (skimage), and the skeleton walked into polylines,
   split at junctions, dropped under 12 px, simplified Douglas-Peucker
   at 1.5 px. The outer rim is taken separately, as the 8 px iso-contour
   of the filled silhouette's distance transform — i.e. the CENTRELINE
   of the reference's own heavy outline, one clean closed loop. Result:
   one 125-point rim, 87 gyri, 31 cerebellar strokes, 4 stem strokes,
   and the lateral (Sylvian) fissure chained out of ten segments running
   from the temporal notch up and back. Normalised to cerebrum width
   300, origin at the cerebrum centroid, and inlined below as TRACE, so
   this page is standalone. brain-trace.png is that data drawn flat: it
   is the reference in hairline, which is the whole point.

   STEP 2 — THE SOLID. The profile plane is (a, b): a front-back, b up.
   The third axis u is LATERAL — the thickness the drawing gains. From
   the rim polygon a distance field d(a,b) is built on a 2-unit grid,
   and from d a local-feature-size field R(a,b) = max{ d(q) : |p-q| <=
   d(q) } — the radius of the largest inscribed disc that reaches p.
   Half-thickness is then

       w(a,b) = WMAX * (R/RREF)^0.75 * sqrt(1 - (1 - d/R)^2)

   The sqrt is the elliptical cross-section the brief asks for: w = 0 at
   the rim, w = WMAX*(R/RREF)^0.75 on the medial axis. The R term is
   what the brief's single field could not do on its own — it makes the
   BRAINSTEM thin and the cerebellum middling without any of them being
   modelled separately. The stem is 20 units across, so R ~ 10, so it
   gets a seventh of the cerebrum's thickness: a rod, not a slab.

   STEP 3 — THE MIRROR (pass four). Pass three was half a brain: one
   sheet at u = +w, a relief, orbitable only +-20/+-10 before the lie
   showed. The body is symmetric about the mid-sagittal plane u = 0, so
   the other half is the FIRST REFLECTED. The far sheet is u = -w(a,b)
   and it carries the SAME traced strokes at the same (a,b), reflected
   with it — which is also anatomy: the two hemispheres are near mirror
   images.

   That makes a closed solid, so the hidden line becomes real:
     - a stroke on sheet s (s = +-1) has outward normal n_s =
       (s, -dw/da, -dw/db) in (u,a,b), and is inked only where n_s faces
       the camera AND the ray from it to the eye does not re-enter the
       body. The second test is a march: step along the view vector and
       ask |u| < w(a,b) inside the rim. That is what stops the far
       hemisphere leaking through the near one, and what lets it show
       exactly where it should -- through the notch under the temporal
       lobe, above the cerebellum, and from overhead.
     - the OUTLINE is solved, not guessed. On the cross-section normal
       to the rim the solid is the pair u = +-w(t), t the distance in
       from the rim, with w' -> infinity at t = 0. With Vd = V . inward
       normal, the silhouette is w'(t) = s*Vu/Vd, s = sign(Vd): one
       point per rim vertex, on whichever sheet the rim is turning
       toward. As Vd -> 0 it goes to t = 0, so the u = 0 crease IS the
       silhouette and THE CARD AT REST IS STILL THE TRACE VERBATIM. As
       the rim turns hard toward the eye the answer moves onto the FAR
       sheet -- the mirror hemisphere carrying the outline, which is the
       thing half a brain could not do.
     - the LONGITUDINAL FISSURE is the crest of that crease: the upper
       rim at u = 0, a #111 hairline, inked where it is not occluded AND
       has separated from the outline by more than 3 px. At rest it is
       the outline, so nothing doubles; orbit and it opens as a groove
       along the top; from above it is the spine between the hemispheres.

   STEP 4 — TWO HEMISPHERES (pass five). Pass four's side views were
   right, but from the top it read as ONE loaf with a single crest,
   because it WAS one solid: |u| < w, with the fissure drawn on as a
   line. Dave: "the brain looks from the top: two halves in a mirror
   image". So the fix is in the SOLID, not the strokes. The cerebrum
   (and the cerebellum, which has a midline too) is now TWO solids,
   mirror images in u: hemisphere s (s = +-1) occupies

       s * u  in  [ g(a,b) , w(a,b) ]

   — pass four's solid with the midline slab |u| < g milled out of it.
   The LATERAL sheet is u = +-w, pass four's outer surface untouched,
   which is why REST, ORBIT AND ORBIT2 ARE UNCHANGED to within a
   hairline. The MEDIAL sheets are the flat planes u = +-g. They meet,
   and the slot closes, on the contour w = g, which is 0.4 units inside
   the traced rim: the fissure is open right up to the outline, as it is
   in a brain.

   THE LONGITUDINAL FISSURE IS NOW REAL GEOMETRY. Pass four's synthetic
   crest line is gone. What is drawn instead is the two MEDIAL RIM
   EDGES, u = +-g on the traced rim — the boundary of each hemisphere's
   flat medial face — inked only where the march to the eye clears both
   solids and where they have separated from the outline by 3 px. At
   rest each lies inside the near hemisphere and neither inks, except
   along the crown, where the groove opens as one hairline. Pitch over
   and the pair opens into the valley between the lobes.

   g is a FIELD, not a constant: g = 6 * smoothstep(R) on the local
   feature size, so it is 6 across the cerebrum and the cerebellum and 0
   on the BRAINSTEM, which therefore stays ONE cylinder on the midline —
   at g = 0 the two halves close up into pass four's |u| < w exactly,
   with nothing modelled separately.

   The lateral sheet of each hemisphere carries the gyri: the near one
   the trace as drawn, the far one its mirror. The medial sheets are
   plain — being flat they ink nothing but their rim.

   The silhouette is solved per hemisphere, and the section solve stops
   using w'(t) as its proxy. The exact condition that sheet s turns away
   from the eye is F = Va*dw/da + Vb*dw/db - s*Vu = 0, and the walk now
   tracks THAT, with the real two-dimensional gradient, still stepping
   in from each rim vertex along the inward normal. Near the rim grad w
   is huge and radial, so F collapses to Vd*w' - s*Vu and the answer is
   pass four's to a fraction of a unit. Deeper in, where the proxy was
   simply wrong, F is right — which is what lets the walk find the
   lateral CREST of each hemisphere in a near-plan view instead of
   fragmenting. Where F is already negative at the rim the hemisphere is
   turning away and its boundary is the crease itself. The two loops
   then combine: from the top, two lobes with the groove between them;
   from the side, the far one hidden behind the near one. Where the two
   land on top of each other only the near is inked, so nothing doubles,
   and where the answer JUMPS — crest to crease, at the poles in a plan
   view — the gap is left rather than a chord drawn across the lobe.

   Hidden line runs across both hemispheres, the cerebellum and the stem
   at once: a stroke is inked only where its sheet normal faces the eye
   AND the march along the view vector re-enters no solid.

   Orbit is +-25 / +-12 about rest and nothing clamps it -- drag harder
   and the far side simply comes round as the mirror.

   Everything else is the gearbox idiom (slide 3 of the v7 deck), kept
   verbatim: #111 hairline, #BDBDBD hidden dashed, #9B9B9B dash-dot
   construction, ONE red #DA1A00 accent on a white card, a base plate,
   and a critically damped orbit (tau 1.0 s) that STAYS WHERE THE MOUSE
   LEFT IT. The accent is the lateral fissure, on the NEAR hemisphere
   only -- it is not mirrored, because one red is one red. The hidden
   line is the brainstem's run up THROUGH the body, which is the one
   thing a side view cannot show. The construction line is the vertical
   axis. REST VIEW yaw 10 / pitch 8 (pass six).

   STEP 5 — WIDTH (pass six). Pass five was right in everything but the
   one thing that mattered: the solid was too thin, and it said so —
   "ours is half as wide as a real brain" — and kept it thin to leave
   the side views pixel-identical. Overruled. A brain is 140 wide x 170
   long x 120 tall: width is about 0.8 of length and about equal to
   height. Each hemisphere is now the literal half-ellipse of the
   brief, s*u in [g, g + 2w]: flat medial face at u = s*g, rounded
   lateral sheet out to u = s*(g + 2w), WMAX halved to 31 so the pair
   is 6 + 62 doubled = 136 across on a 300-long profile. The cerebellum
   follows for free at ~104 and the brainstem, R ~ 9, keeps g = 0 and
   stays one 19-unit midline cylinder. The gyri ride the lateral sheet
   and therefore move outward with it, which is where they belong.
   ============================================================ */

      var tx=pb[0]-pa[0], ty=pb[1]-pa[1], L=Math.hypot(tx,ty)||1;
      var nx=-ty/L, ny=tx/L, T=5;
      var in1=bil(D,p[0]+nx*T,p[1]+ny*T), in2=bil(D,p[0]-nx*T,p[1]-ny*T);
      NIN.push(in1>=in2 ? [nx,ny] : [-nx,-ny]);
    }
  })();

  /* ---- 3 · the housing and the construction ------------------------- */
  var BTOP = BMIN + 2, BBOT = BTOP - 12;
  var HALF = (2*WMAX+GMAX)*1.15, AOV = 12;
  function box(u0,u1,a0,a1,b0,b1){
    var v=[[u0,a0,b0],[u1,a0,b0],[u1,a1,b0],[u0,a1,b0],
           [u0,a0,b1],[u1,a0,b1],[u1,a1,b1],[u0,a1,b1]];
    var e=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    return e.map(function(p){ return [v[p[0]],v[p[1]]]; });
  }
  var HOUSING = box(-HALF, HALF, AMIN-AOV+PADF, AMAX+AOV-PADF, BBOT, BTOP);

  /* the vertical construction axis, and nothing else — the grey section
     ellipse of pass three is not in the gearbox idiom. */
  var SY = TRACE.sylvian;
  var CONSEG = [[[0, 0, BMAX+4],[0, 0, BBOT-8]]];

  /* the brainstem runs up THROUGH the body: the one hidden-line run. */
  var STEM_A = 0, HIDSEG = [];
  (function stem(){
    var t0 = [ 15, -101 ], t1 = [ 2, -48 ];
    var dx = t1[0]-t0[0], dy = t1[1]-t0[1], L = Math.sqrt(dx*dx+dy*dy)||1;
    var nx = -dy/L*7, ny = dx/L*7;
    for (var s=-1; s<=1; s+=2){
      HIDSEG.push([[0, t0[0]+s*nx, t0[1]+s*ny],[0, t1[0]+s*nx, t1[1]+s*ny]]);
    }
  })();

  /* ---- 4 · the camera ------------------------------------------------ */
  /* PASS SIX re-picks REST. At double the width, yaw 15 / pitch 10 put
     the near lateral sheet noticeably off-square and opened the crown
     groove into a second line running half the length of the skull —
     the card stopped being Dave's reference. Rendered 8/6, 10/8, 12/6
     and 12/10 and judged by eye: 8/6 is flat but dead, the thickness
     never announces itself; 12/10 shears the frontal pole and the
     groove reads as a doubled outline. 10 / 8 is the one — the lateral
     sheet presents almost square, the outline is the traced profile,
     the cerebellum's folia stay legible, and the groove is a single
     hairline sliver over the crown. */
  var YAW0 = 10*Math.PI/180, PIT0 = 8*Math.PI/180;
  var YAW_R = 25*Math.PI/180, PIT_R = 12*Math.PI/180;
  var TAU = 1.0;
  var m00=1,m02=0,m10=0,m11=1,m12=0,m20=0,m21=0,m22=1;
  function setView(yaw, pit){
    var cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pit), sp=Math.sin(pit);
    m00=cy;      m02=sy;
    m10=sp*sy;   m11=cp;   m12=-sp*cy;
    m20=-cp*sy;  m21=sp;   m22=cp*cy;
    VA=m20; VB=m21; VU=m22;          /* the unit vector from the body to the eye */
  }
  function springStep(x,v,target,w,dt){ var a=-2*w*v-w*w*(x-target); v+=a*dt; x+=v*dt; return [x,v]; }
  var mnx=0,mny=0,mouseSeen=false,yawOff=0,yawVel=0,pitOff=0,pitVel=0;
  function onMove(e){
    if (e.pointerType && e.pointerType !== 'mouse') return;
    var w = window.innerWidth||1, h = window.innerHeight||1;
    mnx=(e.clientX-w/2)/(w/2); mny=(e.clientY-h/2)/(h/2);
    if (mnx<-1) mnx=-1; else if (mnx>1) mnx=1;
    if (mny<-1) mny=-1; else if (mny>1) mny=1;
    mouseSeen=true;
  }
  window.addEventListener('pointermove', onMove, {passive:true});
  function updateView(dt){
    var tY = mouseSeen ?  mnx*YAW_R : 0, tP = mouseSeen ? -mny*PIT_R : 0;
    var w=1/TAU, left=dt, h, A, B;
    while (left>1e-5){
      h = left>0.008?0.008:left; left-=h;
      A=springStep(yawOff,yawVel,tY,w,h); yawOff=A[0]; yawVel=A[1];
      B=springStep(pitOff,pitVel,tP,w,h); pitOff=B[0]; pitVel=B[1];
    }
    setView(YAW0+yawOff, PIT0+pitOff);
  }

  /* ---- 5 · the fit --------------------------------------------------- */
  var W=800,H=600,DPR=1,SC=1,OX=0,OY=0,PAD_X=84,PAD_Y=26,BOXU=null;
  function sweepBox(){
    var lo=[1e9,1e9], hi=[-1e9,-1e9], rlo=[1e9,1e9], rhi=[-1e9,-1e9];
    var saved=[m00,m02,m10,m11,m12,m20,m21,m22];
    var pts=[];
    RIM.forEach(function(p){ pts.push([0,p[0],p[1]]); });
    HOUSING.forEach(function(s){ pts.push(s[0],s[1]); });
    CONSEG.forEach(function(s){ pts.push(s[0],s[1]); });
    STROKES.forEach(function(s){ s.pts.forEach(function(p){
      var w=latW(p[0],p[1]); pts.push([w,p[0],p[1]],[-w,p[0],p[1]]); }); });
    function acc(L,Hh){
      for (var q=0;q<pts.length;q++){
        var p=pts[q], sx=m00*p[1]+m02*p[0], sy=m10*p[1]+m11*p[2]+m12*p[0];
        if (sx<L[0]) L[0]=sx; if (sx>Hh[0]) Hh[0]=sx;
        if (sy<L[1]) L[1]=sy; if (sy>Hh[1]) Hh[1]=sy;
      }
    }
    for (var a=-1;a<=1;a++) for (var b=-1;b<=1;b++){
      setView(YAW0+a*YAW_R, PIT0+b*PIT_R); acc(lo,hi);
    }
    setView(YAW0,PIT0); acc(rlo,rhi);
    m00=saved[0];m02=saved[1];m10=saved[2];m11=saved[3];m12=saved[4];
    m20=saved[5];m21=saved[6];m22=saved[7];
    return {lo:lo,hi:hi,rlo:rlo,rhi:rhi};
  }
  function size(){
    var host=cv.parentNode;
    W=Math.max(240, host.clientWidth||800); H=Math.max(200, host.clientHeight||600);
    DPR=Math.min(2, window.devicePixelRatio||1);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    PAD_X=Math.min(72,W*0.07); PAD_Y=Math.min(40,H*0.06);
    if (!BOXU) BOXU=sweepBox();
    var K=0.42;
    var rw=BOXU.rhi[0]-BOXU.rlo[0], rh=BOXU.rhi[1]-BOXU.rlo[1];
    var bw=rw+K*((BOXU.hi[0]-BOXU.lo[0])-rw), bh=rh+K*((BOXU.hi[1]-BOXU.lo[1])-rh);
    SC=Math.min((W-2*PAD_X)/bw,(H-2*PAD_Y)/bh)*0.98;
    OX=W/2-(BOXU.rlo[0]+BOXU.rhi[0])/2*SC;
    OY=H/2+(BOXU.rlo[1]+BOXU.rhi[1])/2*SC;
  }

  /* ---- 6 · the ink --------------------------------------------------- */
  var SOL=new Float64Array(200000), SOLN=0,
      HID=new Float64Array(2000),  HIDN=0,
      CON=new Float64Array(6000),  CONN=0,
      ACC=new Float64Array(2000),  ACCN=0;
  function put(A,n,x0,y0,x1,y1){ A[n]=x0;A[n+1]=y0;A[n+2]=x1;A[n+3]=y1; return n+4; }
  function pt3(u,a,b){ return [OX+(m00*a+m02*u)*SC, OY-(m10*a+m11*b+m12*u)*SC]; }

  /* facing of sheet s at (a,b): n_s . v, with n_s = (s,-dw/da,-dw/db) */
  function facing(s, ax, by){ return s*VU - VA*bil(GA,ax,by) - VB*bil(GB,ax,by); }

  /* THE SILHOUETTE, solved on the cross-section normal to the rim.
     In that section the solid is the pair of curves u = +-w(t), t the
     distance in from the rim, w' -> +infinity at t = 0. The eye's
     direction in the section is (Vu, Vd), Vd = V . inward normal, and
     the outward normal of sheet s is (s, -w'). So the silhouette is

         w'(t) = s * Vu / Vd,        s = sign(Vd),

     one point per rim vertex, on whichever sheet the rim is turning
     toward. Two things fall out of it. When Vd -> 0 the right-hand side
     blows up and t -> 0: the crease IS the silhouette, which is why the
     card at rest is still the trace verbatim. And when the rim turns
     hard toward the eye the answer moves onto the FAR sheet, which is
     the mirror hemisphere carrying the outline -- exactly what a half
     brain could not do. Solved by walking t out until w' drops past the
     target, so it is continuous: no snapping, no gaps.

     PASS FIVE runs it TWICE, once per hemisphere, on WL = g + w — and
     it stops using w'(t) as a proxy. The exact condition that the
     lateral sheet of hemisphere s turns away from the eye is

         F(a,b) = Va*dWL/da + Vb*dWL/db - s*Vu = 0,

     and the walk now tracks THAT, with the real two-dimensional
     gradient, still stepping in from each rim vertex along the inward
     normal. Near the rim grad WL is huge and radial, so F reduces to
     Vd*w' - s*Vu and the answer is pass four's to a fraction of a unit:
     THE SIDE VIEWS ARE UNCHANGED. Deep in the body, where pass four's
     proxy was simply wrong, F is right — which is what lets the walk
     find the lateral CREST of each hemisphere in a near-plan view
     instead of fragmenting. Where F is already negative at the rim the
     hemisphere is turning away and the boundary is the crease itself,
     t = 0, u = s*g: the medial rim. The two loops then combine into the
     outline, and where they land on top of each other (at rest they are
     ~2 px apart) only the near one is inked, so nothing thickens. */
  var SILU=[[],[]], SILA=[[],[]], SILB=[[],[]], SILP=[[],[]];
  var WALK=140, WSTEP=0.6, HN=0.4, DEDUP=2.6;
  function silhouettes(){
    var n=RIM.length, s, hi, sh, t;
    for (hi=0; hi<2; hi++){
      sh = hi===0 ? 1 : -1;
      for (s=0;s<n;s++){
        var p=RIM[s], nx=NIN[s][0], ny=NIN[s][1];
        var hit = -1, pf = 1e9;
        for (t=0.5; t<=WALK; t+=WSTEP){
          var qa=p[0]+nx*t, qb=p[1]+ny*t;
          if (bil(D,qa,qb) < 0.4) break;                 /* out the far side */
          var F = VA*(latW(qa+HN,qb)-latW(qa-HN,qb))/(2*HN)
                + VB*(latW(qa,qb+HN)-latW(qa,qb-HN))/(2*HN) - sh*VU;
          if (F <= 0){ hit = (pf>=1e8) ? t : t - WSTEP*(0-F)/(pf-F); break; }
          pf = F;
        }
        if (hit<0) hit = 0;
        var aa=p[0]+nx*hit, bb=p[1]+ny*hit;
        SILA[hi][s]=aa; SILB[hi][s]=bb; SILU[hi][s]= sh*latW(aa,bb);
        SILP[hi][s]= pt3(SILU[hi][s],aa,bb);
      }
    }
    for (hi=0; hi<2; hi++) for (s=0;s<n;s++){
      var t1=(s+1)%n;
      if (hi===1 &&
          Math.hypot(SILP[1][s][0]-SILP[0][s][0], SILP[1][s][1]-SILP[0][s][1])<DEDUP &&
          Math.hypot(SILP[1][t1][0]-SILP[0][t1][0], SILP[1][t1][1]-SILP[0][t1][1])<DEDUP) continue;
      if (occluded((SILU[hi][s]+SILU[hi][t1])/2,(SILA[hi][s]+SILA[hi][t1])/2,
                   (SILB[hi][s]+SILB[hi][t1])/2)) continue;
      var P=SILP[hi][s], Q=SILP[hi][t1];
      /* where the answer jumps from the lateral crest to the crease --
         at the frontal and occipital poles in a plan view -- the two
         neighbours are not one curve. Leave the gap; do not ink a
         chord across the lobe. */
      if (Math.hypot(P[0]-Q[0],P[1]-Q[1]) > 70) continue;
      if (SOLN<199990) SOLN=put(SOL,SOLN,P[0],P[1],Q[0],Q[1]);
    }
  }
  function nearSil(P, s){
    for (var hi=0;hi<2;hi++)
      if (Math.hypot(P[0]-SILP[hi][s][0], P[1]-SILP[hi][s][1]) < 3) return true;
    return false;
  }

  function build(){
    SOLN=0;HIDN=0;CONN=0;ACCN=0;
    var n=RIM.length, s, i2;

    /* --- the outline: each sheet's silhouette, which collapses onto the
       u = 0 crease wherever the crease IS the silhouette. --- */
    silhouettes();

    /* --- the longitudinal fissure. It is REAL now — the slot between
       the two hemispheres — so there is no synthetic crest line. What
       is drawn is the pair of MEDIAL RIM EDGES, u = +-g on the traced
       rim: the boundary of each hemisphere's flat medial face. At rest
       each sits under its own outline and inside the near hemisphere,
       so neither inks; pitch over and they open as the groove. --- */
    for (s=0;s<n;s++){
      var t2=(s+1)%n, r0=RIM[s], r1=RIM[t2];
      var q0a=r0[0]+NIN[s][0]*2.0,  q0b=r0[1]+NIN[s][1]*2.0;
      var q1a=r1[0]+NIN[t2][0]*2.0, q1b=r1[1]+NIN[t2][1]*2.0;
      var g0=gapAt(q0a,q0b), g1=gapAt(q1a,q1b);
      if (g0 < 1.2 || g1 < 1.2) continue;        /* no groove on the stem */
      for (var sg=1; sg>=-1; sg-=2){
        var A0=pt3(sg*g0,r0[0],r0[1]), A1=pt3(sg*g1,r1[0],r1[1]);
        if (nearSil(A0,s) && nearSil(A1,t2)) continue;
        if (occluded(sg*g0, q0a, q0b)) continue;
        if (SOLN<199990) SOLN=put(SOL,SOLN,A0[0],A0[1],A1[0],A1[1]);
      }
    }

    /* --- the strokes, on BOTH sheets: the far sheet is the near one
       reflected through u = 0, which is the mirror hemisphere. --- */
    STROKES.forEach(function(st){
      for (var sg=1; sg>=-1; sg-=2){
        if (st.k===2 && sg<0) continue;             /* one red, near side only */
        var prev=null;
        for (i2=0;i2<st.pts.length;i2++){
          var a=st.pts[i2][0], b=st.pts[i2][1];
          var w=latW(a,b), g=grad(a,b);
          var f = sg*m22 - m20*g[0] - m21*g[1];
          var vis = f > 0.12 && halfW(a,b) > 0.3 && !occluded(sg*w,a,b);
          var pp = vis ? pt3(sg*w,a,b) : null;
          if (prev && pp && SOLN<199990){
            if (st.k===2){ if (ACCN<1996) ACCN=put(ACC,ACCN,prev[0],prev[1],pp[0],pp[1]); }
            else SOLN=put(SOL,SOLN,prev[0],prev[1],pp[0],pp[1]);
          }
          prev=pp;
        }
      }
    });
    HOUSING.forEach(function(sg){
      var a=pt3(sg[0][0],sg[0][1],sg[0][2]), b=pt3(sg[1][0],sg[1][1],sg[1][2]);
      if (SOLN<199990) SOLN=put(SOL,SOLN,a[0],a[1],b[0],b[1]);
    });
    CONSEG.forEach(function(sg){
      var a=pt3(sg[0][0],sg[0][1],sg[0][2]), b=pt3(sg[1][0],sg[1][1],sg[1][2]);
      if (CONN<5996) CONN=put(CON,CONN,a[0],a[1],b[0],b[1]);
    });
    HIDSEG.forEach(function(sg){
      var a=pt3(sg[0][0],sg[0][1],sg[0][2]), b=pt3(sg[1][0],sg[1][1],sg[1][2]);
      if (HIDN<1996) HIDN=put(HID,HIDN,a[0],a[1],b[0],b[1]);
    });
  }
  function strokeGroup(A,n,style,dash,w){
    if (!n) return;
    ctx.beginPath();
    for (var i2=0;i2<n;i2+=4){ ctx.moveTo(A[i2],A[i2+1]); ctx.lineTo(A[i2+2],A[i2+3]); }
    ctx.strokeStyle=style; ctx.lineWidth=w; ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  }

  /* ---- 7 · no callout ------------------------------------------------
     Pass four's "traced · 1:1 profile" block is gone: it is not in the
     gearbox idiom. The card carries the drawing and nothing else. */
  var drawBox=[0,0,0,0];
  function callouts(){}

  /* ---- 8 · the frame -------------------------------------------------- */
  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    ctx.lineCap='round'; ctx.lineJoin='round';
    build();
    drawBox=[1e9,1e9,-1e9,-1e9];
    [[SOL,SOLN],[CON,CONN],[ACC,ACCN]].forEach(function(g){
      for (var q=0;q<g[1];q+=2){
        if (g[0][q]<drawBox[0]) drawBox[0]=g[0][q];
        if (g[0][q]>drawBox[2]) drawBox[2]=g[0][q];
        if (g[0][q+1]<drawBox[1]) drawBox[1]=g[0][q+1];
        if (g[0][q+1]>drawBox[3]) drawBox[3]=g[0][q+1];
      }
    });
    strokeGroup(HID,HIDN,'#BDBDBD',[5,4],1);
    strokeGroup(CON,CONN,'#9B9B9B',[9,3,2,3],1);
    strokeGroup(SOL,SOLN,'#111',[],1);
    strokeGroup(ACC,ACCN,'#DA1A00',[],1.4);
    callouts();
  }
  var lastT=-1, raf=null, running=false;
  function frame(now){
    if (lastT<0) lastT=now;
    var dt=(now-lastT)/1000; lastT=now;
    if (dt<0) dt=0; if (dt>0.1) dt=0.1;
    updateView(dt); render();
  }
  size(); setView(YAW0,PIT0); render();
  var _min=1000/30, _last=0;
  function loop(now){ if (now-_last>=_min-1){ _last=now; frame(now); } raf=requestAnimationFrame(loop); }
  function start(){ if (running||reduce) return; running=true; lastT=-1; raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if (raf) cancelAnimationFrame(raf); raf=null; }
  if (!reduce) start();
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else start(); });
  var rt=null;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ BOXU=null; size(); render(); },160); });

  /* test hook: park the view and redraw, for the render harness */
  window.brSet = function(yawDeg, pitDeg){
    stop(); mouseSeen=false; yawVel=pitVel=0;
    yawOff=(yawDeg||0)*Math.PI/180; pitOff=(pitDeg||0)*Math.PI/180;
    setView(YAW0+yawOff, PIT0+pitOff); render();
  };
  window.brReady = true;
})();
</script>
</body>
</html>
