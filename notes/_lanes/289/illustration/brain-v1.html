<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain — line-drawn 3D · #289</title>
<style>
/* ============================================================
   THE BRAIN — a line-drawn "engineering" 3D diagram. #289 lane I1.

   Dave, verbatim (2026-09-20, on proposal v2): "I really like the 3d
   illustration style we have for the gears, maybe we have a brain in
   the same style somewhere. maybe a stack of books too."

   So this is the GEARBOX idiom, ported to an organ. Same rules, taken
   verbatim from the v7.5 art-direction note in
   notes/_DEMO-SLIDES-apollo-2026-09-12-v7.html:

     · plain canvas 2D, no libraries
     · HIDDEN LINE, NOT WIREFRAME. Hairline #111 for what the camera can
       see; #BDBDBD dashed ONLY for the run that explains the object —
       here, the brainstem where the cerebellum passes in front of it;
       #9B9B9B dash-dot for construction lines and axes
     · ONE red accent, #DA1A00, on a white card — here the longitudinal
       fissure, the brain's one deep groove
     · yaw/pitch projection, resting 3/4 view yaw 35 / pitch 20, mouse
       orbits +/-25 deg yaw and +/-12 deg pitch about it, critically
       damped tau 1.0 s, and it STAYS WHERE THE MOUSE LEFT IT
     · mounted: a base plate outline, a dash-dot axis down the stem

   WHAT IT IS. Three parametric bodies, no mesh files:

     CEREBRUM   an ellipsoid r(t,psi) — t along the front-back axis,
                psi around it, psi = 0 on the top midline — carrying
                (a) a shallow sinusoidal sulci displacement, so every
                    contour line picks up the gyral wave, and
                (b) a gaussian groove at psi = 0: the longitudinal
                    fissure, the one deep cut.
     CEREBELLUM a smaller, flatter ellipsoid below and behind, drawn as
                parallel ribs — its foliation — and nothing else.
     BRAINSTEM  a short cylinder, two silhouette lines and an end
                ellipse, exactly as the gearbox draws a shaft.

   DRAWN AS CONTOUR LINES, not a wireframe. Every sample on every curve
   is kept only if the surface normal there faces the camera
   (n . grad(depth) > 0), so the far half of each body is simply not
   inked. The silhouette is found where that test changes sign, then
   taken as the outer radial hull of the crossings about the projected
   centre — which survives the fissure pocket without spiking.

   DENSITY. Three were built and rendered (see the subreport): 16
   meridians alone read as an egg; 11 coronal rings alone read as a
   loaf; the shipped set is the mixed one — 13 meridians, 5 rings —
   which is the fewest lines that still say "brain" at 600x420.
   ============================================================ */
:root{
  --accent:#DA1A00;
  --ink:#111; --hid:#BDBDBD; --con:#9B9B9B;
  --g1:#F3F3F3; --g2:#EDEDED; --g6:#767676;
  --font:"Univers Next","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--g1);font-family:var(--font);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;}
.card{width:600px;height:420px;background:#fff;border:1px solid var(--g2);position:relative;}
.card canvas{display:block;width:100%;height:100%;}
.cap{position:absolute;left:0;top:calc(100% + 12px);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--g6);line-height:1.4;}
@media (max-width:660px){ .card{width:92vw;height:calc(92vw*0.7);} }
</style>
</head>
<body>
<div class="card">
  <canvas id="br"></canvas>
  <p class="cap">Fig. 1 — cerebrum, cerebellum, brainstem · contour lines, hidden line removed</p>
</div>

<script>
(function(){
  var cv = document.getElementById('br');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---- 0 · the density knob ------------------------------------------
     Overridable from the query string so variants can be rendered and
     compared side by side rather than guessed at. The defaults ARE the
     shipped drawing. */
  var Q = new URLSearchParams(location.search);
  function num(k, d){ var v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; }
  var CFG = {
    LON: num('lon', 17),     /* meridians, incl. the fissure at psi = 0  */
    LAT: num('lat',  0),     /* coronal rings (0: rejected, see subreport)*/
    AMP: num('amp', 0.058),  /* sulci depth, as a fraction of the radius */
    NT:  num('nt', 10.0),    /* sulci waves along the front-back axis    */
    NP:  num('np',  2.2),    /* their tilt: waves around psi             */
    FD:  num('fd',  0.17),   /* longitudinal fissure depth               */
    FW:  num('fw',  0.30),   /* its half-width, radians                  */
    RIB: num('rib',  7),     /* cerebellar folia                         */
    CAP: num('cap',  0),     /* close the poles with a ring? (rejected)  */
    /* meridians stop short of the poles: run them all the way in and
       seventeen curves converge on one point — a starburst, which is
       exactly the tangle v7.5 cut out of the gearbox. The FRONTAL pole
       faces the camera at rest, so it is cut back harder than the
       occipital one, which is turned away and can carry more. */
    MF: num('mf', 0.66),     /* frontal   stop, fraction of pi/2 */
    MB: num('mb', 0.88)      /* occipital stop                   */
  };

  /* ---- 1 · the bodies -------------------------------------------------
     Model coordinates are (u, a, b), the gearbox's: u front-back (+u is
     the frontal pole), a left-right, b up. */
  var CB  = {c:[0,0,0],        R:[112, 76, 64]};   /* cerebrum   */
  var CBL = {c:[-78,0,-50],    R:[ 42, 56, 31]};   /* cerebellum */
  var STEM = {p0:[-22, 0, -42], p1:[-6, 0, -102], r:14};

  function wrap(x){ while (x >  Math.PI) x -= 2*Math.PI;
                    while (x < -Math.PI) x += 2*Math.PI; return x; }

  /* THE CEREBRUM. t in [-pi/2, pi/2] runs occipital -> frontal; psi is
     the angle about that axis, psi = 0 the top midline. */
  function cere(t, psi){
    var st = Math.sin(t), ct = Math.cos(t);
    var taper = 1 - 0.15*Math.max(0, st) - 0.05*Math.max(0, -st);
    var sul = 1 + CFG.AMP*Math.sin(CFG.NT*t + CFG.NP*psi);
    var w = wrap(psi);
    var fis = 1 - CFG.FD*Math.exp(-(w*w)/(2*CFG.FW*CFG.FW));
    var rr = ct*taper*sul*fis;
    var cp = Math.cos(psi);
    return [CB.R[0]*st,
            CB.R[1]*rr*Math.sin(psi),
            CB.R[2]*rr*cp*(0.93 + 0.07*cp)];   /* smoothly flatter beneath */
  }
  /* THE CEREBELLUM. Same shape function, no fissure, a tighter and
     purely transverse ripple — the folia. */
  function cbel(t, psi){
    var st = Math.sin(t), ct = Math.cos(t);
    var rr = ct*(1 + 0.030*Math.sin(9*t));
    var cp = Math.cos(psi);
    return [CBL.c[0] + CBL.R[0]*st,
            CBL.c[1] + CBL.R[1]*rr*Math.sin(psi),
            CBL.c[2] + CBL.R[2]*rr*cp*(0.9 + 0.1*cp)];
  }

  /* outward unit normal, by central difference on the parametrisation */
  function normal(P, ctr, t, psi){
    var h = 1e-3;
    var A = P(t+h,psi), B = P(t-h,psi), C = P(t,psi+h), D = P(t,psi-h);
    var e1 = [A[0]-B[0], A[1]-B[1], A[2]-B[2]];
    var e2 = [C[0]-D[0], C[1]-D[1], C[2]-D[2]];
    var n = [e1[1]*e2[2]-e1[2]*e2[1], e1[2]*e2[0]-e1[0]*e2[2], e1[0]*e2[1]-e1[1]*e2[0]];
    var L = Math.hypot(n[0],n[1],n[2]) || 1;
    n[0]/=L; n[1]/=L; n[2]/=L;
    var q = P(t,psi);
    if (n[0]*(q[0]-ctr[0]) + n[1]*(q[1]-ctr[1]) + n[2]*(q[2]-ctr[2]) < 0){
      n[0]=-n[0]; n[1]=-n[1]; n[2]=-n[2];
    }
    return n;
  }

  /* ---- 2 · the camera — the gearbox's, verbatim ----------------------- */
  var YAW0 = -35*Math.PI/180, PIT0 = 20*Math.PI/180;
  var YAW_R =  25*Math.PI/180, PIT_R = 12*Math.PI/180;
  var TAU = 1.0;
  var m00=1,m02=0,m10=0,m11=1,m12=0,m20=0,m21=0,m22=1;
  function setView(yaw, pit){
    var cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pit), sp=Math.sin(pit);
    m00=cy;        m02=sy;
    m10=sp*sy;     m11=cp;    m12=-sp*cy;
    m20=-cp*sy;    m21=sp;    m22=cp*cy;
  }
  /* depth = m20 a + m21 b + m22 u, so the direction TOWARD the camera in
     model coordinates is grad(depth) = (u:m22, a:m20, b:m21). */
  function camVec(){
    var c = [m22, m20, m21], L = Math.hypot(c[0],c[1],c[2]) || 1;
    return [c[0]/L, c[1]/L, c[2]/L];
  }
  function springStep(x, v, target, w, dt){
    var a = -2*w*v - w*w*(x - target);
    v += a*dt; x += v*dt;
    return [x, v];
  }
  var mnx=0, mny=0, mouseSeen=false;
  var yawOff=0, yawVel=0, pitOff=0, pitVel=0;
  function onMove(e){
    if (e.pointerType && e.pointerType !== 'mouse') return;
    var w = window.innerWidth || 1, h = window.innerHeight || 1;
    mnx = (e.clientX - w/2)/(w/2); mny = (e.clientY - h/2)/(h/2);
    if (mnx < -1) mnx = -1; else if (mnx > 1) mnx = 1;
    if (mny < -1) mny = -1; else if (mny > 1) mny = 1;
    mouseSeen = true; wake();
  }
  window.addEventListener('pointermove', onMove, {passive:true});
  window.addEventListener('mousemove', function(e){
    if (e.pointerType === undefined) onMove(e);
  }, {passive:true});
  function updateView(dt){
    /* no return-to-centre: the view stays where the mouse left it */
    var tY = mouseSeen ?  mnx*YAW_R : 0;
    var tP = mouseSeen ? -mny*PIT_R : 0;
    var w = 1/TAU, left = dt, h, A, B;
    while (left > 1e-5){
      h = left > 0.008 ? 0.008 : left; left -= h;
      A = springStep(yawOff, yawVel, tY, w, h); yawOff=A[0]; yawVel=A[1];
      B = springStep(pitOff, pitVel, tP, w, h); pitOff=B[0]; pitVel=B[1];
    }
    setView(YAW0 + yawOff, PIT0 + pitOff);
    return Math.abs(yawOff-tY) + Math.abs(pitOff-tP) +
           Math.abs(yawVel) + Math.abs(pitVel);
  }

  /* ---- 3 · the mount --------------------------------------------------- */
  var BASE_T = -102, BASE_B = -112;
  function box(u0,u1,a0,a1,b0,b1){
    var v = [[u0,a0,b0],[u1,a0,b0],[u1,a1,b0],[u0,a1,b0],
             [u0,a0,b1],[u1,a0,b1],[u1,a1,b1],[u0,a1,b1]];
    var e = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    return e.map(function(p){ return [v[p[0]], v[p[1]]]; });
  }
  var PLATE = box(-118, 100, -72, 72, BASE_B, BASE_T);
  /* construction: the stem axis, run up through the body and down past
     the plate, and the long axis of the cerebrum. Two lines, no more. */
  function along(f){
    return [STEM.p0[0] + (STEM.p1[0]-STEM.p0[0])*f, 0,
            STEM.p0[2] + (STEM.p1[2]-STEM.p0[2])*f];
  }
  /* ONE axis. A second, down the cerebrum's long axis, was drawn and cut:
     it crossed the whole gyral field diagonally and read as a scratch on
     the drawing rather than as construction. */
  var AXES = [[along(-0.95), along(1.34)]];

  /* ---- 4 · the ink ----------------------------------------------------- */
  var SOL=new Float64Array(40000), SOLN=0,
      HID=new Float64Array( 4000), HIDN=0,
      CON=new Float64Array( 2000), CONN=0,
      ACC=new Float64Array( 4000), ACCN=0;
  function put(A, n, x0,y0,x1,y1){ A[n]=x0; A[n+1]=y0; A[n+2]=x1; A[n+3]=y1; return n+4; }
  function sol(x0,y0,x1,y1){ if (SOLN<39996) SOLN = put(SOL,SOLN,x0,y0,x1,y1); }
  function hid(x0,y0,x1,y1){ if (HIDN< 3996) HIDN = put(HID,HIDN,x0,y0,x1,y1); }
  function con(x0,y0,x1,y1){ if (CONN< 1996) CONN = put(CON,CONN,x0,y0,x1,y1); }
  function acc(x0,y0,x1,y1){ if (ACCN< 3996) ACCN = put(ACC,ACCN,x0,y0,x1,y1); }

  var W=600, H=420, DPR=1, SC=1, OX=0, OY=0;
  function pt3(u,a,b){
    return [OX + (m00*a + m02*u)*SC, OY - (m10*a + m11*b + m12*u)*SC];
  }
  function sx(p){ return OX + (m00*p[1] + m02*p[0])*SC; }
  function sy(p){ return OY - (m10*p[1] + m11*p[2] + m12*p[0])*SC; }

  /* occlusion: does the ray from P toward the camera enter this
     ellipsoid? Exact for the base ellipsoid, which is what the sulci
     ripple sits on, so it is right to within the ripple. */
  function occluded(P, E, shrink){
    var cam = camVec(), i;
    var R = [E.R[0]*shrink, E.R[1]*shrink, E.R[2]*shrink];
    var o=[0,0,0], d=[0,0,0];
    for (i=0;i<3;i++){ o[i]=(P[i]-E.c[i])/R[i]; d[i]=cam[i]/R[i]; }
    var A = d[0]*d[0]+d[1]*d[1]+d[2]*d[2];
    var B = 2*(o[0]*d[0]+o[1]*d[1]+o[2]*d[2]);
    var C = o[0]*o[0]+o[1]*o[1]+o[2]*o[2] - 1;
    var disc = B*B - 4*A*C;
    if (disc <= 0) return false;
    var sq = Math.sqrt(disc);
    return Math.max((-B-sq)/(2*A), (-B+sq)/(2*A)) > 1.0;
  }

  /* --- 4a · a contour curve: sampled, kept only where it faces us ------- */
  function curve(P, ctr, f, n, sink, blockers){
    var prevPt = null, prevOk = false, i;
    for (i=0;i<=n;i++){
      var q = f(i/n);                       /* -> [t, psi] */
      var p = P(q[0], q[1]);
      var nn = normal(P, ctr, q[0], q[1]);
      var cam = camVec();
      var ok = (nn[0]*cam[0] + nn[1]*cam[1] + nn[2]*cam[2]) > 0.02;
      if (ok && blockers){
        for (var k=0;k<blockers.length;k++)
          if (occluded(p, blockers[k], 0.99)){ ok = false; break; }
      }
      var s = [sx(p), sy(p)];
      if (ok && prevOk) sink(prevPt[0], prevPt[1], s[0], s[1]);
      prevPt = s; prevOk = ok;
    }
  }

  /* --- 4b · the silhouette --------------------------------------------
     Where n . cam changes sign. Collected over a t x psi grid, projected,
     then reduced to the OUTER radial hull about the projected centre:
     one point per angular bin, the farthest. That keeps the scalloped
     gyral edge and cannot spike inward through the fissure pocket. */
  function silhouette(P, ctr, tLo, tHi, blockers){
    var NT = 132, NP = 132, i, j, cam = camVec();
    var pts = [];
    function vis(t,p){
      var nn = normal(P, ctr, t, p);
      return nn[0]*cam[0] + nn[1]*cam[1] + nn[2]*cam[2];
    }
    function root(t0,p0,t1,p1){
      var a=0, b=1, k, tm, pm;
      for (k=0;k<18;k++){
        var mid=(a+b)/2; tm=t0+(t1-t0)*mid; pm=p0+(p1-p0)*mid;
        if (vis(t0+(t1-t0)*a, p0+(p1-p0)*a) * vis(tm,pm) <= 0) b=mid; else a=mid;
      }
      var mm=(a+b)/2;
      return P(t0+(t1-t0)*mm, p0+(p1-p0)*mm);
    }
    var prev = null;
    for (i=0;i<=NT;i++){
      var t = tLo + (tHi-tLo)*i/NT, row = [];
      for (j=0;j<=NP;j++) row.push(vis(t, j*2*Math.PI/NP));
      for (j=0;j<NP;j++)
        if (row[j]*row[j+1] < 0)
          pts.push(root(t, j*2*Math.PI/NP, t, (j+1)*2*Math.PI/NP));
      if (prev){
        for (j=0;j<=NP;j++)
          if (prev.row[j]*row[j] < 0)
            pts.push(root(prev.t, j*2*Math.PI/NP, t, j*2*Math.PI/NP));
      }
      prev = {t:t, row:row};
    }
    if (!pts.length) return [];
    /* The hull is built from EVERY crossing, occluded or not, and the
       occlusion test is applied afterwards, segment by segment. Filtering
       the points first left the bins behind the cerebrum empty and the
       polyline sawed between the survivors. */
    var cx = sx(ctr), cy = sy(ctr);
    var BINS = 200, best = new Array(BINS);
    for (i=0;i<pts.length;i++){
      var X = sx(pts[i]) - cx, Y = sy(pts[i]) - cy;
      var r = Math.hypot(X,Y), a2 = Math.atan2(Y,X);
      var k2 = Math.floor((a2 + Math.PI)/(2*Math.PI)*BINS) % BINS;
      if (!best[k2] || r > best[k2][2]) best[k2] = [cx+X, cy+Y, r, pts[i], a2];
    }
    /* A MEDIAN OF THREE on the radii. Max-per-bin is what stops the hull
       spiking inward through the fissure pocket, but it also lets a
       single stray crossing stand a lone bin proud — which inks as a
       one-pixel sawtooth. The median kills a spike one bin wide and
       leaves the gyral scallop, which is twenty bins wide, untouched. */
    var sm = new Array(BINS);
    for (i=0;i<BINS;i++){
      var A2 = best[(i+BINS-1)%BINS], B2 = best[i], C2 = best[(i+1)%BINS];
      if (!B2){ sm[i] = null; continue; }
      if (!A2 || !C2){ sm[i] = B2; continue; }
      var t3 = [A2[2], B2[2], C2[2]].sort(function(x,y){ return x-y; })[1];
      sm[i] = [cx + t3*Math.cos(B2[4]), cy + t3*Math.sin(B2[4]), t3, B2[3], B2[4]];
    }
    return {pts:sm, cx:cx, cy:cy, bins:BINS, blockers:blockers};
  }
  function inkSil(S, sink){
    if (!S || !S.pts) return 0;
    var i, j, prev = null, prevOK = false, first = null, firstOK = false, n = 0;
    function clear(p){
      if (!S.blockers) return true;
      for (j=0;j<S.blockers.length;j++) if (occluded(p[3], S.blockers[j], 0.99)) return false;
      return true;
    }
    for (i=0;i<S.bins;i++){
      var p = S.pts[i];
      if (!p){ prev = null; continue; }
      var ok = clear(p);
      if (!first){ first = p; firstOK = ok; }
      if (prev && ok && prevOK){ sink(prev[0], prev[1], p[0], p[1]); n++; }
      prev = p; prevOK = ok;
    }
    if (first && prev && prev !== first && prevOK && firstOK){ sink(prev[0], prev[1], first[0], first[1]); n++; }
    return n;
  }

  /* --- 4c · the brainstem: a cylinder, drawn the way a shaft is -------- */
  function stem(){
    var p0 = STEM.p0, p1 = STEM.p1;
    var s0 = [sx(p0), sy(p0)], s1 = [sx(p1), sy(p1)];
    var dx = s1[0]-s0[0], dy = s1[1]-s0[1], L = Math.hypot(dx,dy) || 1;
    var nx = -dy/L, ny = dx/L;                     /* screen normal to the axis */
    /* the screen half-width of the cylinder: the widest the radius circle
       projects along that normal. Sampled, so it is right for any view. */
    var ax = [p1[0]-p0[0], p1[1]-p0[1], p1[2]-p0[2]];
    var aL = Math.hypot(ax[0],ax[1],ax[2]) || 1; ax = [ax[0]/aL, ax[1]/aL, ax[2]/aL];
    var e1 = Math.abs(ax[0]) < 0.9 ? [1,0,0] : [0,1,0];
    var c1 = [ax[1]*e1[2]-ax[2]*e1[1], ax[2]*e1[0]-ax[0]*e1[2], ax[0]*e1[1]-ax[1]*e1[0]];
    var l1 = Math.hypot(c1[0],c1[1],c1[2]); c1=[c1[0]/l1,c1[1]/l1,c1[2]/l1];
    var c2 = [ax[1]*c1[2]-ax[2]*c1[1], ax[2]*c1[0]-ax[0]*c1[2], ax[0]*c1[1]-ax[1]*c1[0]];
    var i, ext = 0, ring = [];
    for (i=0;i<48;i++){
      var a2 = i*2*Math.PI/48, ca = Math.cos(a2), sa = Math.sin(a2);
      var off = [STEM.r*(c1[0]*ca + c2[0]*sa), STEM.r*(c1[1]*ca + c2[1]*sa), STEM.r*(c1[2]*ca + c2[2]*sa)];
      var q = [p1[0]+off[0], p1[1]+off[1], p1[2]+off[2]];
      var qs = [sx(q), sy(q)];
      ring.push(qs);
      var d2 = Math.abs((qs[0]-s1[0])*nx + (qs[1]-s1[1])*ny);
      if (d2 > ext) ext = d2;
    }
    /* the two silhouette lines, in N runs, each solid in the open and
       #BDBDBD dashed where the cerebellum or the cerebrum is in front */
    var N = 40, sgn;
    for (sgn=-1; sgn<=1; sgn+=2){
      var prevS = null, prevOK = null;
      for (i=0;i<=N;i++){
        var f = i/N;
        var P = [p0[0]+(p1[0]-p0[0])*f, p0[1]+(p1[1]-p0[1])*f, p0[2]+(p1[2]-p0[2])*f];
        var vis = !(occluded(P, CBL, 0.99) || occluded(P, CB, 0.985));
        var S = [sx(P)+sgn*nx*ext, sy(P)+sgn*ny*ext];
        if (prevS){
          var both = vis && prevOK;
          if (both) sol(prevS[0],prevS[1],S[0],S[1]);
          else      hid(prevS[0],prevS[1],S[0],S[1]);
        }
        prevS = S; prevOK = vis;
      }
    }
    /* the free end of the stem: its section ellipse */
    for (i=0;i<ring.length;i++){
      var j = (i+1)%ring.length;
      sol(ring[i][0], ring[i][1], ring[j][0], ring[j][1]);
    }
  }

  /* ---- 5 · the fit ----------------------------------------------------- */
  var BOXU = null;
  function cloud(){
    var out = [], i, j;
    for (i=0;i<=16;i++) for (j=0;j<24;j++){
      var t = -Math.PI/2 + Math.PI*i/16, p = j*2*Math.PI/24;
      out.push(cere(t,p)); out.push(cbel(t,p));
    }
    out.push(STEM.p0, STEM.p1);
    PLATE.forEach(function(s){ out.push(s[0], s[1]); });
    AXES.forEach(function(s){ out.push(s[0], s[1]); });
    return out;
  }
  function sweepBox(){
    var C = cloud(), i, j, k;
    var saved = [m00,m02,m10,m11,m12,m20,m21,m22];
    function run(views){
      var lo=[1e9,1e9], hi=[-1e9,-1e9];
      views.forEach(function(v){
        setView(v[0], v[1]);
        for (k=0;k<C.length;k++){
          var X = m00*C[k][1] + m02*C[k][0];
          var Y = m10*C[k][1] + m11*C[k][2] + m12*C[k][0];
          if (X<lo[0]) lo[0]=X; if (X>hi[0]) hi[0]=X;
          if (Y<lo[1]) lo[1]=Y; if (Y>hi[1]) hi[1]=Y;
        }
      });
      return {lo:lo, hi:hi};
    }
    var all = [];
    for (i=-1;i<=1;i++) for (j=-1;j<=1;j++) all.push([YAW0+i*YAW_R, PIT0+j*PIT_R]);
    var full = run(all), rest = run([[YAW0, PIT0]]);
    m00=saved[0]; m02=saved[1]; m10=saved[2]; m11=saved[3]; m12=saved[4];
    m20=saved[5]; m21=saved[6]; m22=saved[7];
    return {full:full, rest:rest};
  }
  function size(){
    var host = cv.parentNode;
    W = Math.max(240, host.clientWidth  || 600);
    H = Math.max(180, host.clientHeight || 420);
    DPR = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var PAD_X = Math.min(56, W*0.075), PAD_Y = Math.min(34, H*0.075);
    if (!BOXU) BOXU = sweepBox();
    /* scale off the RESTING box, grown K of the way toward the full-orbit
       box — the gearbox's composition knob, same reasoning. */
    var K = 0.45;
    var rw = BOXU.rest.hi[0]-BOXU.rest.lo[0], rh = BOXU.rest.hi[1]-BOXU.rest.lo[1];
    var bw = rw + K*((BOXU.full.hi[0]-BOXU.full.lo[0]) - rw);
    var bh = rh + K*((BOXU.full.hi[1]-BOXU.full.lo[1]) - rh);
    SC = Math.min((W-2*PAD_X)/bw, (H-2*PAD_Y)/bh) * 0.99;
    OX = W/2 - (BOXU.rest.lo[0]+BOXU.rest.hi[0])/2*SC;
    OY = H/2 + (BOXU.rest.lo[1]+BOXU.rest.hi[1])/2*SC;
  }

  /* ---- 6 · the drawing -------------------------------------------------- */
  var T0 = -Math.PI/2*0.995, T1 = Math.PI/2*0.995;
  var COUNT = {};
  function build(){
    SOLN=0; HIDN=0; CONN=0; ACCN=0;
    var i, n0;

    /* the mount, first, so it sits behind everything in reading order */
    PLATE.forEach(function(s){
      var A = pt3(s[0][0],s[0][1],s[0][2]), B = pt3(s[1][0],s[1][1],s[1][2]);
      sol(A[0],A[1],B[0],B[1]);
    });
    AXES.forEach(function(s){
      var A = pt3(s[0][0],s[0][1],s[0][2]), B = pt3(s[1][0],s[1][1],s[1][2]);
      con(A[0],A[1],B[0],B[1]);
    });
    n0 = SOLN;

    /* THE CEREBRUM — meridians, then rings, then the outline. psi = 0 is
       the fissure and is the card's ONE accent, so it is skipped here. */
    var M0 = T0*CFG.MB, M1 = T1*CFG.MF;   /* -t is occipital, +t frontal */
    for (i=0;i<CFG.LON;i++){
      var psi = i*2*Math.PI/CFG.LON;
      if (i === 0) continue;
      curve(cere, CB.c, (function(p){ return function(s){ return [M0 + (M1-M0)*s, p]; }; })(psi), 150, sol, null);
    }
    /* the two pole caps: the ring the meridians stop on, so the frontal
       and occipital poles close as domes and not as a knot. */
    if (CFG.CAP) [M0, M1].forEach(function(tt){
      curve(cere, CB.c, function(s){ return [tt, s*2*Math.PI]; }, 170, sol, null);
    });
    for (i=1;i<=CFG.LAT;i++){
      var t = M0 + (M1-M0)*i/(CFG.LAT+1);
      curve(cere, CB.c, (function(tt){ return function(s){ return [tt, s*2*Math.PI]; }; })(t), 190, sol, null);
    }
    COUNT.cerebrum = (SOLN-n0)/4; n0 = SOLN;
    COUNT.cerebrum_outline = inkSil(silhouette(cere, CB.c, T0, T1, null), sol);
    n0 = SOLN;

    /* THE CEREBELLUM — its folia, transverse ribs, and its outline. Both
       are dropped wherever the cerebrum is in front. */
    for (i=1;i<=CFG.RIB;i++){
      var tc = -Math.PI/2*0.96 + Math.PI*0.96*i/(CFG.RIB+1);
      curve(cbel, CBL.c, (function(tt){ return function(s){ return [tt, s*2*Math.PI]; }; })(tc), 150, sol, [CB]);
    }
    COUNT.cerebellum = (SOLN-n0)/4; n0 = SOLN;
    COUNT.cerebellum_outline = inkSil(silhouette(cbel, CBL.c, -Math.PI/2*0.995, Math.PI/2*0.995, [CB]), sol);
    n0 = SOLN;

    stem();
    COUNT.stem = (SOLN-n0)/4;

    /* THE ACCENT — the longitudinal fissure, psi = 0, the one deep cut,
       in #DA1A00. One red line, per the two-red law s151-D1. */
    curve(cere, CB.c, function(s){ return [T0 + (T1-T0)*s, 0]; }, 190, acc, null);
    COUNT.accent = ACCN/4;
    COUNT.hidden = HIDN/4; COUNT.construction = CONN/4; COUNT.solid = SOLN/4;
  }

  function strokeGroup(A, n, style, dash, w){
    if (!n) return;
    ctx.beginPath();
    for (var i=0;i<n;i+=4){ ctx.moveTo(A[i],A[i+1]); ctx.lineTo(A[i+2],A[i+3]); }
    ctx.strokeStyle = style; ctx.lineWidth = w; ctx.setLineDash(dash);
    ctx.stroke(); ctx.setLineDash([]);
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    build();
    strokeGroup(HID, HIDN, '#BDBDBD', [5,4], 1);
    strokeGroup(CON, CONN, '#9B9B9B', [9,3,2,3], 1);
    strokeGroup(SOL, SOLN, '#111', [], 1);
    strokeGroup(ACC, ACCN, '#DA1A00', [], 1.4);
  }

  /* ---- 7 · the loop ----------------------------------------------------- */
  var raf = null, running = false, lastT = -1, idle = 0;
  function frame(now){
    if (lastT < 0) lastT = now;
    var dt = (now-lastT)/1000; lastT = now;
    if (dt < 0) dt = 0; if (dt > 0.1) dt = 0.1;
    var e = updateView(dt);
    render();
    if (e < 1e-4){ idle++; } else idle = 0;
    if (idle > 4) stop();
  }
  var _min = 1000/30, _last = 0;
  function loop(now){
    if (now - _last >= _min - 1){ _last = now; frame(now); }
    if (running) raf = requestAnimationFrame(loop);
  }
  function start(){ if (running || reduce) return; running = true; lastT = -1; idle = 0; raf = requestAnimationFrame(loop); }
  function stop(){ running = false; if (raf) cancelAnimationFrame(raf); raf = null; }
  function wake(){ idle = 0; start(); }
  function still(){ yawOff=pitOff=yawVel=pitVel=0; setView(YAW0,PIT0); render(); }

  size();
  setView(YAW0, PIT0); render();
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); });
  window.addEventListener('blur', stop);
  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(function(){ size(); render(); }, 160);
  });

  /* ---- 8 · the probe surface -------------------------------------------- */
  window.brStats = function(){
    return {cfg:CFG, counts:COUNT, w:W, h:H, dpr:DPR, scale:+SC.toFixed(4),
            bodies:{cerebrum:CB, cerebellum:CBL, stem:STEM}};
  };
  window.brView = function(){
    return {yaw_deg:+((YAW0+yawOff)*180/Math.PI).toFixed(2),
            pitch_deg:+((PIT0+pitOff)*180/Math.PI).toFixed(2),
            yaw_range_deg:+(YAW_R*180/Math.PI).toFixed(2),
            pitch_range_deg:+(PIT_R*180/Math.PI).toFixed(2),
            tau:TAU, mouse:[mnx,mny], seen:mouseSeen, running:running};
  };
  window.brSetMouse = function(x, y){
    mnx=x; mny=y; mouseSeen=true;
    for (var i=0;i<400;i++) updateView(0.016);
    render();
  };
  window.brStill = still;
  window.brReady = true;
})();
</script>
</body>
</html>
