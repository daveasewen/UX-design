<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A stack of books — line-drawn 3D</title>
<style>
  :root { color-scheme: light; }
  html,body { margin:0; padding:0; background:#F2F2F2; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:14px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color:#111; }
  .wrap { padding:40px; }
  .card { width:600px; height:420px; background:#fff; position:relative; }
  .card canvas { display:block; }
  .cap { width:600px; margin-top:14px; font:11px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         letter-spacing:.06em; color:#767676; text-transform:uppercase; }
  @media print { body { background:#fff; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card"><canvas id="bk"></canvas></div>
    <div class="cap">Fig. 289-I2 &middot; Stacked volumes &middot; hidden-line, 3/4 view, orbit on mouse</div>
  </div>

<script>
/* ============================================================
   289 · I2 — A STACK OF BOOKS, line-drawn "engineering" style.

   Same art direction as the s3 gearbox (v7.5/v7.8) in
   _DEMO-SLIDES-apollo-2026-09-12-v7.html, and the same maths:

     · HIDDEN LINE, NOT WIREFRAME. Visible ink is #111 hairline.
       #BDBDBD dashed is reserved for the runs that EXPLAIN the
       object — here the base plate and the construction axes
       where the stack passes in front of them. Nothing else is
       dashed; a stack of slabs has almost no informative interior.
     · #9B9B9B dash-dot for construction: one vertical axis through
       the stack and a ground cross on the plate.
     · ONE red accent, #DA1A00: the spine of the TOP volume.
     · White card. Plain canvas 2D, no libraries.
     · Projection is the gearbox's yaw/pitch, resting 3/4 view
       yaw 35 / pitch 20:
         screen x =  m00 a + m02 u
         screen y = (m10 a + m11 b + m12 u), flipped
         depth    =  m20 a + m21 b + m22 u          (larger = nearer)
       so every back-face test is arithmetic, never guessed.
     · MOUSE orbits +/-25 deg yaw, +/-12 deg pitch about the resting
       view, critically damped tau = 1.0 s, and STAYS WHERE THE
       MOUSE LEFT IT (no return-to-centre — Dave's ruling in s1).

   THE OBJECT. Seven hardback volumes, each one a prism: a plan
   footprint extruded in b. The footprint is a rectangle with a
   ROUNDED SPINE on the +a side (a circular bulge, sampled), so the
   spine reads as a half-round and not as a fourth corner. Each
   volume is three stacked prisms:

       top board    |  board footprint, full size
       text block   |  the SAME footprint inset by OH on the fore
                    |  edge, head and tail, and flush at the spine
       bottom board |  board footprint, full size

   so the boards stand PROUD of the text block by OH on three sides
   — the ledge you see on any hardback — while the spine stays one
   continuous curve. The page block shows as a lighter set of
   parallel hairlines at constant b on every visible text-block face
   that is not the spine: those are leaf edges, and a closed book
   shows them on the fore edge AND on the head and tail. At the
   resting yaw the head is what faces us, so that is where they land.

   Each volume is rotated a few degrees about the vertical and
   nudged a unit or two in plan, so the pile reads as a STACK of
   separate objects rather than one block.

   HIDDEN-LINE REMOVAL is done twice over, both times properly:
     1  WITHIN a volume: a per-face back-face test. A top face has
        normal +b, so it is visible iff m21 > 0. A side face has a
        normal in (a,u), so it is visible iff m20*na + m22*nu > 0.
        Back faces are never emitted.
     2  BETWEEN volumes: painter's order. Every visible face is
        sorted by centroid depth and drawn back to front, filled
        white and then stroked, so nearer volumes occlude farther
        ones exactly. The prisms are convex, so centroid order is
        exact for them.
     3  For the base plate and the axes — lines that genuinely pass
        BEHIND the stack — each segment is clipped against the
        convex hull of every volume's projected outline (Cyrus-Beck
        against the hull half-planes). The clear runs are inked
        solid/dash-dot, the occluded runs are inked #BDBDBD dashed
        on top of the fills. That is the one place dashes earn
        their keep, and it is computed, not eyeballed.

   Probes for verification: bkStats(), bkView(), bkSetMouse(x,y),
   bkStill(), bkSetTime().
   ============================================================ */
(function(){
  var cv = document.getElementById('bk');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  var INK = '#111', HIDC = '#BDBDBD', CONC = '#9B9B9B', RED = '#DA1A00', PAGEC = '#C6C6C6';

  /* ---- 1 · the volumes ----------------------------------------------- */
  /* w: fore-edge-to-spine (a)   d: head-to-tail (u)   t: thickness (b)
     psi: yaw of this volume about the vertical, degrees
     oa, ou: a plan nudge, so the pile is not a perfect column       */
  var VOLS = [
    {w:210, d:158, t:30, psi:-4.5, oa: 0,  ou: 0  },
    {w:202, d:150, t:21, psi: 2.5, oa: 2,  ou:-3  },
    {w:206, d:154, t:33, psi:-1.5, oa:-2,  ou: 2  },
    {w:196, d:146, t:17, psi: 5.0, oa: 3,  ou: 1  },
    {w:204, d:152, t:26, psi:-3.0, oa:-3,  ou:-1  },
    {w:194, d:144, t:15, psi: 1.5, oa: 1,  ou: 3  },
    {w:200, d:148, t:24, psi:-5.5, oa:-2,  ou:-2  }
  ];
  var GAP = 0.9;        /* a hairline of air between volumes          */
  var OH  = 3.4;        /* how proud the boards stand                 */
  var BULGE = 7.0;      /* the rounded spine, in a                    */
  var NARC = 9;         /* segments across the spine arc              */

  /* a footprint in the (a,u) plane, CCW, spine on +a.
     Each point carries the TYPE of the edge that starts at it, so a
     face knows whether it is a spine, a fore edge, a head or a tail. */
  /* rLo/rHi are the arc's REFERENCE span — the board's full depth. The text
     block is inset in u, but its spine samples the SAME curve over its own
     sub-range, so board and text block share one spine surface instead of
     two slightly different ones peeling apart. */
  function footprint(aFore, aSpine, uLo, uHi, bulge, rLo, rHi){
    if (rLo === undefined){ rLo = uLo; rHi = uHi; }
    function arcA(u){ return aSpine + bulge*Math.sin(Math.PI*(u-rLo)/(rHi-rLo)); }
    var p = [], i;
    p.push({a:aFore, u:uHi, e:'fore'});
    p.push({a:aFore, u:uLo, e:'tail'});
    p.push({a:arcA(uLo), u:uLo, e:'spine'});
    for (i=1;i<NARC;i++){
      var u = uLo + (i/NARC)*(uHi-uLo);
      p.push({a:arcA(u), u:u, e:'spine'});
    }
    p.push({a:arcA(uHi), u:uHi, e:'head'});
    return p;
  }
  function xform(p, psi, oa, ou){
    var c = Math.cos(psi), s = Math.sin(psi);
    return p.map(function(q){
      return {a: q.a*c - q.u*s + oa, u: q.a*s + q.u*c + ou, e:q.e};
    });
  }

  var PRISMS = [], HULLPTS = [], STACK_TOP = 0;
  (function build(){
    var z = 0;
    VOLS.forEach(function(v, k){
      var psi = v.psi*Math.PI/180, W2 = v.w/2, D2 = v.d/2;
      var bt = Math.max(2.0, Math.min(3.2, v.t*0.15));      /* board */
      var fpB = xform(footprint(-W2, W2, -D2, D2, BULGE), psi, v.oa, v.ou);
      var fpT = xform(footprint(-W2+OH, W2, -D2+OH, D2-OH, BULGE, -D2, D2), psi, v.oa, v.ou);
      PRISMS.push({fp:fpB, z0:z,            z1:z+bt,       kind:'board', vol:k});
      PRISMS.push({fp:fpT, z0:z+bt,         z1:z+v.t-bt,   kind:'text',  vol:k});
      PRISMS.push({fp:fpB, z0:z+v.t-bt,     z1:z+v.t,      kind:'board', vol:k});
      HULLPTS.push({vol:k, fp:fpB, z0:z, z1:z+v.t});
      z += v.t + GAP;
    });
    STACK_TOP = z - GAP;
  })();
  var TOPVOL = VOLS.length - 1;

  /* ---- 2 · the base plate and the construction lines ------------------ */
  var MAXW = 0, MAXD = 0;
  VOLS.forEach(function(v){ MAXW = Math.max(MAXW, v.w); MAXD = Math.max(MAXD, v.d); });
  var PA = MAXW/2 + 54, PU = MAXD/2 + 54;
  var BASE_T = 0, BASE_B = -11;   /* the stack SITS on the plate: top at b = 0 */
  function boxEdges(a0,a1,u0,u1,b0,b1){
    var V = [[a0,u0,b0],[a1,u0,b0],[a1,u1,b0],[a0,u1,b0],
             [a0,u0,b1],[a1,u0,b1],[a1,u1,b1],[a0,u1,b1]];
    var E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    return E.map(function(e){ return [V[e[0]], V[e[1]]]; });   /* [a,u,b] */
  }
  var PLATE = boxEdges(-PA, PA, -PU, PU, BASE_B, BASE_T);
  var AXES = [
    [[0,0,BASE_B-18],[0,0,STACK_TOP+40]],                      /* the spine axis */
    [[-PA-16,0,BASE_T],[PA+16,0,BASE_T]],                      /* ground cross   */
    [[0,-PU-16,BASE_T],[0,PU+16,BASE_T]]
  ];

  /* ---- 3 · the camera ------------------------------------------------- */
  var YAW0 = -35*Math.PI/180, PIT0 = 20*Math.PI/180;
  var YAW_R = 25*Math.PI/180, PIT_R = 12*Math.PI/180;
  var TAU = 1.0;
  var m00=1,m02=0,m10=0,m11=1,m12=0,m20=0,m21=0,m22=1;
  function setView(yaw, pit){
    var cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pit), sp=Math.sin(pit);
    m00=cy;      m02=sy;
    m10=sp*sy;   m11=cp;   m12=-sp*cy;
    m20=-cp*sy;  m21=sp;   m22=cp*cy;
  }
  function springStep(x, v, target, w, dt){
    var a = -2*w*v - w*w*(x - target);
    v += a*dt; x += v*dt;
    return [x, v];
  }
  var mnx = 0, mny = 0, mouseSeen = false;
  var yawOff = 0, yawVel = 0, pitOff = 0, pitVel = 0;
  function onMove(e){
    if (e.pointerType && e.pointerType !== 'mouse') return;
    var w = window.innerWidth || 1, h = window.innerHeight || 1;
    mnx = (e.clientX - w/2)/(w/2); mny = (e.clientY - h/2)/(h/2);
    if (mnx < -1) mnx = -1; else if (mnx > 1) mnx = 1;
    if (mny < -1) mny = -1; else if (mny > 1) mny = 1;
    mouseSeen = true;
  }
  window.addEventListener('pointermove', onMove, {passive:true});
  window.addEventListener('mousemove', function(e){ if (e.pointerType === undefined) onMove(e); }, {passive:true});
  function updateView(dt){
    /* no return-to-centre: the view stays where the mouse left it */
    var tY = mouseSeen ?  mnx*YAW_R : 0, tP = mouseSeen ? -mny*PIT_R : 0;
    var w = 1/TAU, left = dt, h, A, B;
    while (left > 1e-5){
      h = left > 0.008 ? 0.008 : left; left -= h;
      A = springStep(yawOff, yawVel, tY, w, h); yawOff = A[0]; yawVel = A[1];
      B = springStep(pitOff, pitVel, tP, w, h); pitOff = B[0]; pitVel = B[1];
    }
    setView(YAW0 + yawOff, PIT0 + pitOff);
  }

  /* ---- 4 · the fit ---------------------------------------------------- */
  var W = 600, H = 420, DPR = 1, SC = 1, OX = 0, OY = 0, PAD_X = 34, PAD_Y = 22;
  function everyVertex(cb){
    PRISMS.forEach(function(p){
      p.fp.forEach(function(q){ cb(q.a, q.u, p.z0); cb(q.a, q.u, p.z1); });
    });
    PLATE.forEach(function(s){ s.forEach(function(v){ cb(v[0], v[1], v[2]); }); });
    AXES.forEach(function(s){ s.forEach(function(v){ cb(v[0], v[1], v[2]); }); });
  }
  function sweepBox(){
    var lo=[1e9,1e9], hi=[-1e9,-1e9], rlo=[1e9,1e9], rhi=[-1e9,-1e9];
    var saved = [m00,m02,m10,m11,m12,m20,m21,m22], i, j;
    function acc(L,Hh){ return function(a,u,b){
      var sx = m00*a + m02*u, sy = m10*a + m11*b + m12*u;
      if (sx<L[0]) L[0]=sx; if (sx>Hh[0]) Hh[0]=sx;
      if (sy<L[1]) L[1]=sy; if (sy>Hh[1]) Hh[1]=sy;
    };}
    for (i=-1;i<=1;i++) for (j=-1;j<=1;j++){
      setView(YAW0 + i*YAW_R, PIT0 + j*PIT_R);
      everyVertex(acc(lo,hi));
      if (i===0 && j===0) everyVertex(acc(rlo,rhi));
    }
    m00=saved[0]; m02=saved[1]; m10=saved[2]; m11=saved[3];
    m12=saved[4]; m20=saved[5]; m21=saved[6]; m22=saved[7];
    return {lo:lo, hi:hi, rlo:rlo, rhi:rhi};
  }
  var BOXU = null;
  function size(){
    var host = cv.parentNode;
    W = Math.max(240, host.clientWidth || 600);
    H = Math.max(200, host.clientHeight || 420);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    PAD_X = Math.min(40, W*0.06); PAD_Y = Math.min(30, H*0.06);
    if (!BOXU) BOXU = sweepBox();
    /* scale off the RESTING box, grown K of the way toward the full-orbit
       box: 0 fills the card at rest and clips hard over, 1 draws small. */
    var K = 0.40;
    var rw = BOXU.rhi[0]-BOXU.rlo[0], rh = BOXU.rhi[1]-BOXU.rlo[1];
    var bw = rw + K*((BOXU.hi[0]-BOXU.lo[0]) - rw);
    var bh = rh + K*((BOXU.hi[1]-BOXU.lo[1]) - rh);
    SC = Math.min((W - 2*PAD_X)/bw, (H - 2*PAD_Y)/bh) * 0.98;
    OX = W/2 - (BOXU.rlo[0]+BOXU.rhi[0])/2 * SC;
    OY = H/2 + (BOXU.rlo[1]+BOXU.rhi[1])/2 * SC;
  }

  function px(a,u,b){ return OX + (m00*a + m02*u)*SC; }
  function py(a,u,b){ return OY - (m10*a + m11*b + m12*u)*SC; }
  function depth(a,u,b){ return m20*a + m21*b + m22*u; }

  /* ---- 5 · the faces -------------------------------------------------- */
  var faces = [], nFace = 0, nBack = 0, nPage = 0;
  /* Which vertical creases are real edges. A crease between two spine
     facets is a TESSELLATION artefact of the arc, not an edge of the
     object — ink it and the spine reads as a radiator. So a vertical
     edge is stroked only where the footprint changes KIND (spine ->
     head, fore -> tail ...) or where it is the silhouette, i.e. the
     face on one side of it is back-facing. Same rule the gearbox uses
     for its hard[] flags. */
  function buildFaces(){
    faces.length = 0; nFace = 0; nBack = 0; nPage = 0;
    PRISMS.forEach(function(p, ord){
      var fp = p.fp, n = fp.length, i, j, k;
      var X0 = [], Y0 = [], X1 = [], Y1 = [], vis = [];
      for (i=0;i<n;i++){
        X0[i] = px(fp[i].a, fp[i].u, p.z0); Y0[i] = py(fp[i].a, fp[i].u, p.z0);
        X1[i] = px(fp[i].a, fp[i].u, p.z1); Y1[i] = py(fp[i].a, fp[i].u, p.z1);
      }
      for (i=0;i<n;i++){
        j = (i+1)%n;
        var na = fp[j].u - fp[i].u, nu = -(fp[j].a - fp[i].a);  /* outward, CCW */
        vis[i] = (m20*na + m22*nu) > 0;
        if (!vis[i]) nBack++;
      }
      function col(typ){ return (typ === 'spine' && p.vol === TOPVOL) ? RED : INK; }

      /* the plan face: normal is +/- b, so the test is m21 alone */
      var ca = 0, cu = 0;
      for (i=0;i<n;i++){ ca += fp[i].a; cu += fp[i].u; }
      ca /= n; cu /= n;
      var up = m21 > 0, PX = up ? X1 : X0, PY = up ? Y1 : Y0, pz = up ? p.z1 : p.z0;
      var pts = [], segs = [];
      for (i=0;i<n;i++){
        j = (i+1)%n;
        pts.push([PX[i], PY[i]]);
        segs.push([PX[i], PY[i], PX[j], PY[j], col(fp[i].e)]);
      }
      faces.push({pts:pts, segs:segs, d:depth(ca,cu,pz), ord:ord, deco:null});

      /* the side faces */
      for (i=0;i<n;i++){
        if (!vis[i]) continue;
        j = (i+1)%n; k = (i+n-1)%n;
        var typ = fp[i].e, c = col(typ);
        var sg = [[X0[i],Y0[i],X0[j],Y0[j],c],      /* the foot of the face */
                  [X1[i],Y1[i],X1[j],Y1[j],c]];     /* and its head         */
        if (typ !== fp[k].e || !vis[k]) sg.push([X0[i],Y0[i],X1[i],Y1[i],c]);
        if (!vis[j]) sg.push([X0[j],Y0[j],X1[j],Y1[j],c]);
        var f = {pts:[[X0[i],Y0[i]],[X0[j],Y0[j]],[X1[j],Y1[j]],[X1[i],Y1[i]]],
                 segs:sg, ord:ord, deco:null,
                 d: m20*(fp[i].a+fp[j].a)/2 + m21*(p.z0+p.z1)/2 + m22*(fp[i].u+fp[j].u)/2};
        /* THE PAGE BLOCK. Leaf edges are horizontal lines at constant b on
           every text-block face except the spine — fore edge, head and tail. */
        if (p.kind === 'text' && typ !== 'spine'){
          var th = p.z1 - p.z0, K = Math.max(3, Math.min(7, Math.round(th/3.2))), q, seg = [];
          for (q=1;q<=K;q++){
            var b = p.z0 + q*th/(K+1);
            seg.push([px(fp[i].a,fp[i].u,b), py(fp[i].a,fp[i].u,b),
                      px(fp[j].a,fp[j].u,b), py(fp[j].a,fp[j].u,b)]);
            nPage++;
          }
          f.deco = seg;
        }
        faces.push(f);
      }
    });
    nFace = faces.length;
    /* PAINTER'S ORDER. The prisms are built bottom to top and the view
       always looks DOWN (pitch stays in 8..32 deg), so a lower prism can
       never overlap a higher one from in front: prism order is the exact
       between-prism order, and centroid depth settles the faces within a
       prism, which is exact because a prism is convex. */
    faces.sort(function(x,y){ return (x.ord - y.ord) || (x.d - y.d); });
  }

  /* ---- 6 · the occluders ---------------------------------------------- */
  /* the convex hull of each volume's projected outline. The volume is a
     convex-ish prism (the spine arc is convex), so the hull IS its
     silhouette, and a segment clipped against it is exactly the run the
     volume hides. */
  var HULLS = [];
  function hull(pts){
    pts = pts.slice().sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
    var i, lower = [], upper = [];
    function cr(o,a,b){ return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }
    for (i=0;i<pts.length;i++){
      while (lower.length>=2 && cr(lower[lower.length-2], lower[lower.length-1], pts[i]) <= 0) lower.pop();
      lower.push(pts[i]);
    }
    for (i=pts.length-1;i>=0;i--){
      while (upper.length>=2 && cr(upper[upper.length-2], upper[upper.length-1], pts[i]) <= 0) upper.pop();
      upper.push(pts[i]);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }
  function buildHulls(){
    HULLS.length = 0;
    HULLPTS.forEach(function(v){
      var pts = [];
      v.fp.forEach(function(q){
        pts.push([px(q.a,q.u,v.z0), py(q.a,q.u,v.z0)]);
        pts.push([px(q.a,q.u,v.z1), py(q.a,q.u,v.z1)]);
      });
      var h = hull(pts);
      if (h.length >= 3) HULLS.push(h);
    });
  }
  var ERODE = 0.7;   /* pull the half-planes in, so a dash never hugs an edge */
  function clipToHull(x0,y0,x1,y1,h){
    var n = h.length, i, area = 0;
    for (i=0;i<n;i++){ var j=(i+1)%n; area += h[i][0]*h[j][1] - h[j][0]*h[i][1]; }
    var s = area > 0 ? 1 : -1, tin = 0, tout = 1;
    for (i=0;i<n;i++){
      var a = h[i], b = h[(i+1)%n];
      var ex = b[0]-a[0], ey = b[1]-a[1], L = Math.sqrt(ex*ex+ey*ey) || 1;
      var c0 = s*((ex*(y0-a[1]) - ey*(x0-a[0]))/L) - ERODE;
      var c1 = s*((ex*(y1-a[1]) - ey*(x1-a[0]))/L) - ERODE;
      var dd = c1 - c0;
      if (Math.abs(dd) < 1e-9){ if (c0 < 0) return null; continue; }
      var t = -c0/dd;
      if (dd > 0){ if (t > tin) tin = t; } else { if (t < tout) tout = t; }
      if (tin >= tout) return null;
    }
    return [tin, tout];
  }
  function occluded(x0,y0,x1,y1){
    var iv = [], i;
    for (i=0;i<HULLS.length;i++){
      var r = clipToHull(x0,y0,x1,y1,HULLS[i]);
      if (r) iv.push(r);
    }
    if (!iv.length) return iv;
    iv.sort(function(a,b){ return a[0]-b[0]; });
    var mg = [iv[0].slice()];
    for (i=1;i<iv.length;i++){
      var last = mg[mg.length-1];
      if (iv[i][0] <= last[1] + 1e-6) last[1] = Math.max(last[1], iv[i][1]);
      else mg.push(iv[i].slice());
    }
    return mg;
  }
  /* split a projected segment into CLEAR runs and HIDDEN runs */
  var CLEAR = [], HIDDEN = [];
  function splitSeg(x0,y0,x1,y1){
    var mg = occluded(x0,y0,x1,y1), cur = 0, i;
    function emit(arr, a, b){
      if (b - a < 1e-3) return;
      arr.push([x0+(x1-x0)*a, y0+(y1-y0)*a, x0+(x1-x0)*b, y0+(y1-y0)*b]);
    }
    for (i=0;i<mg.length;i++){
      emit(CLEAR, cur, mg[i][0]);
      emit(HIDDEN, mg[i][0], mg[i][1]);
      cur = mg[i][1];
    }
    emit(CLEAR, cur, 1);
  }

  /* ---- 7 · the ink ---------------------------------------------------- */
  function strokeSegs(arr, col, dash, w){
    if (!arr.length) return;
    ctx.beginPath();
    for (var i=0;i<arr.length;i++){ ctx.moveTo(arr[i][0],arr[i][1]); ctx.lineTo(arr[i][2],arr[i][3]); }
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash);
    ctx.stroke(); ctx.setLineDash([]);
  }
  var drawBox = [0,0,0,0], lastInk = null;
  var MONO = '11px ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';

    buildFaces();
    buildHulls();

    /* the plate and the axes, split against the stack */
    CLEAR = []; HIDDEN = [];
    var plateClear = [], plateHid = [], axisClear = [], axisHid = [];
    PLATE.forEach(function(s){
      splitSeg(px(s[0][0],s[0][1],s[0][2]), py(s[0][0],s[0][1],s[0][2]),
               px(s[1][0],s[1][1],s[1][2]), py(s[1][0],s[1][1],s[1][2]));
    });
    plateClear = CLEAR; plateHid = HIDDEN;
    CLEAR = []; HIDDEN = [];
    AXES.forEach(function(s){
      splitSeg(px(s[0][0],s[0][1],s[0][2]), py(s[0][0],s[0][1],s[0][2]),
               px(s[1][0],s[1][1],s[1][2]), py(s[1][0],s[1][1],s[1][2]));
    });
    axisClear = CLEAR; axisHid = HIDDEN;

    /* 1 · what is behind the stack, laid down first */
    strokeSegs(plateClear, INK,  [],           1);
    strokeSegs(axisClear,  CONC, [9,3,2,3],    1);

    /* 2 · the volumes, back to front: fill white, then stroke */
    for (var i=0;i<faces.length;i++){
      var f = faces[i], p = f.pts, k;
      ctx.beginPath();
      ctx.moveTo(p[0][0], p[0][1]);
      for (k=1;k<p.length;k++) ctx.lineTo(p[k][0], p[k][1]);
      ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.fill();
      if (f.deco) strokeSegs(f.deco, PAGEC, [], 1);
      ctx.lineWidth = 1; ctx.setLineDash([]);
      var blk = null, rd = null;
      for (k=0;k<f.segs.length;k++){
        var s = f.segs[k];
        if (s[4] === RED){ if (!rd){ rd = 1; ctx.beginPath(); } }
        else continue;
        ctx.moveTo(s[0],s[1]); ctx.lineTo(s[2],s[3]);
      }
      if (rd){ ctx.strokeStyle = RED; ctx.stroke(); }
      for (k=0;k<f.segs.length;k++){
        var s2 = f.segs[k];
        if (s2[4] === RED) continue;
        if (!blk){ blk = 1; ctx.beginPath(); }
        ctx.moveTo(s2[0],s2[1]); ctx.lineTo(s2[2],s2[3]);
      }
      if (blk){ ctx.strokeStyle = INK; ctx.stroke(); }
    }

    /* 3 · the hidden runs, on top of the fills — the only dashes here */
    strokeSegs(plateHid, HIDC, [5,4], 1);
    strokeSegs(axisHid,  HIDC, [5,4], 1);

    /* the ink box, for the caption and the probes */
    drawBox = [1e9,1e9,-1e9,-1e9];
    function hit(x,y){
      if (x<drawBox[0]) drawBox[0]=x; if (x>drawBox[2]) drawBox[2]=x;
      if (y<drawBox[1]) drawBox[1]=y; if (y>drawBox[3]) drawBox[3]=y;
    }
    faces.forEach(function(f){ f.pts.forEach(function(q){ hit(q[0],q[1]); }); });
    [plateClear, plateHid, axisClear, axisHid].forEach(function(g){
      g.forEach(function(s){ hit(s[0],s[1]); hit(s[2],s[3]); });
    });
    caption();
  }

  /* the little mono block, tied to the DRAWING and not to the card foot */
  function caption(){
    ctx.font = MONO; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var bx = Math.max(8, Math.min(drawBox[0], W-120));
    var by = Math.min(H - 8, drawBox[3] + 30);
    ctx.beginPath(); ctx.moveTo(bx, by-15); ctx.lineTo(bx+86, by-15);
    ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.fillText('n = ' + VOLS.length + ' vol', bx, by-3);
    lastInk = {minX:Math.min(drawBox[0],bx), minY:drawBox[1],
               maxX:Math.max(drawBox[2],bx+86), maxY:by+4};
  }

  /* ---- 8 · the frame -------------------------------------------------- */
  var lastT = -1, raf = null, running = false;
  var _fpsCap = 30, _minDt = 1000/_fpsCap, _lastDraw = 0;
  function frame(now){
    if (lastT < 0) lastT = now;
    var dt = (now-lastT)/1000; lastT = now;
    if (dt < 0) dt = 0; if (dt > 0.1) dt = 0.1;
    updateView(dt);
    render();
  }
  function loop(now){
    if (now - _lastDraw >= _minDt - 1){ _lastDraw = now; frame(now); }
    raf = requestAnimationFrame(loop);
  }
  function start(){ if (running || reduce) return; running = true; lastT = -1; raf = requestAnimationFrame(loop); }
  function stop(){ running = false; if (raf) cancelAnimationFrame(raf); raf = null; }
  function still(){
    yawOff = pitOff = yawVel = pitVel = 0;
    setView(YAW0, PIT0); render();
  }

  size();
  setView(YAW0, PIT0); render();
  if (!reduce) start();
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else start(); });
  window.addEventListener('blur', stop);
  window.addEventListener('focus', start);
  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ size(); render(); }, 160);
  });

  /* ---- 9 · the probe surface ------------------------------------------ */
  window.bkStats = function(){
    var pts = 0; PRISMS.forEach(function(p){ pts += p.fp.length; });
    return {volumes:VOLS.length, prisms:PRISMS.length, footprint_points:pts,
            faces_drawn:nFace, faces_culled:nBack, page_lines:nPage,
            hulls:HULLS.length, stack_height:+STACK_TOP.toFixed(1),
            w:W, h:H, dpr:DPR, scale:+SC.toFixed(4),
            draw_box:drawBox.map(function(v){ return +v.toFixed(1); }),
            running:running, reduced:reduce};
  };
  window.bkView = function(){
    return {yaw_deg:+((YAW0+yawOff)*180/Math.PI).toFixed(2),
            pitch_deg:+((PIT0+pitOff)*180/Math.PI).toFixed(2),
            yaw_range_deg:+(YAW_R*180/Math.PI).toFixed(2),
            pitch_range_deg:+(PIT_R*180/Math.PI).toFixed(2),
            face_opening:+Math.abs(m22).toFixed(3),
            tau:TAU, mouse:[mnx,mny], seen:mouseSeen};
  };
  window.bkStill = still;
  window.bkSetMouse = function(x,y){
    mnx = x; mny = y; mouseSeen = true;
    for (var i=0;i<400;i++) updateView(0.016);
    render();
  };
  window.bkStop = stop; window.bkStart = start;
})();
</script>
</body>
</html>
