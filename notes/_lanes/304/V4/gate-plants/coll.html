<!doctype html><html lang="en"><head><meta charset="utf-8"><title>collision lab</title>
<style>html,body{margin:0;font:14px/1.4 sans-serif;color:#111;background:#fff} main{padding:24px;max-width:1200px} figure{margin:0 0 24px} h2{margin:0 0 8px} .sh{display:grid;grid-template-rows:56px 1fr;height:100vh} .sh-content{overflow:auto;padding:16px} .dv-stage{overflow-x:auto;position:relative} .tile{margin-bottom:24px}</style>
</head><body><main><div class="sh"><header>bar</header><div class="sh-content"><div class="tile"><h2>Clean</h2><p>one line of text</p></div><div style="height:900px"></div><div class="tile"><h2>Colliding below the fold</h2><div style="position:relative;height:60px"><span style="position:absolute;left:0;top:0">Balance 12,345,678.00 GBP</span><span style="position:absolute;left:60px;top:0">Overlapping label text here</span></div></div><div class="tile"><h2>Ellipsis guard</h2><div style="display:flex;gap:8px;width:300px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">A very long title that must be truncated with an ellipsis and not collide</span><span>TAG</span></div></div></div></div></main></body></html>
