<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck changes for Friday</title>
<style>
/* #297 lane C - the slides that changed, as they now are in the plain deck at 1920x1080. One per screen. */
:root{--ink:#111;--g1:#F3F3F3;--g3:#D7D8D6;--g6:#767676;--g8:#333;--accent:#DA1A00;
  --font:"Univers Next","Helvetica Neue",Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{background:#fff;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--g3);}
.label{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
.label::before{content:"";width:24px;height:1px;background:currentColor;}
.count{margin-left:auto;font-size:13px;letter-spacing:.08em;color:var(--g6);}
.stage{flex:1 1 auto;min-height:0;padding:20px 24px;display:flex;align-items:center;justify-content:center;background:var(--g1);}
.stage img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;outline:1px solid var(--g3);background:#fff;}
footer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding:16px 24px;border-top:1px solid var(--ink);}
.num{font-size:40px;font-weight:300;line-height:1;margin:0;}
.txt h1{font-size:17px;font-weight:600;margin:0 0 4px;line-height:1.3;}
.txt p{font-size:15px;line-height:1.5;margin:0;color:var(--g8);max-width:70em;}
nav{display:flex;gap:8px;}
button{font:inherit;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:11px 14px;background:#fff;color:var(--ink);border:1px solid var(--ink);cursor:pointer;}
button:hover:not(:disabled){background:var(--ink);color:#fff;}
button:disabled{border-color:var(--g3);color:var(--g3);cursor:default;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (max-width:760px){
  header{padding:12px 16px;} .stage{padding:12px 16px;flex:0 0 auto;}
  footer{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px 16px;} nav button{flex:1;}
}
</style></head>

(function(){
  var i = 0;
  function show(k){
    i = Math.max(0, Math.min(SLIDES.length - 1, k)); var s = SLIDES[i];
    var im = document.getElementById('img'); im.src = s.src; im.alt = 'Slide ' + s.n + ', ' + s.name + ', as it now is in the deck';
    document.getElementById('num').textContent = s.n;
    document.getElementById('name').textContent = s.name;
    document.getElementById('cap').textContent = s.cap;
    document.getElementById('count').textContent = (i + 1) + ' / ' + SLIDES.length;
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === SLIDES.length - 1;
  }
  document.getElementById('prev').addEventListener('click', function(){ show(i - 1); });
  document.getElementById('next').addEventListener('click', function(){ show(i + 1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { show(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { show(i - 1); e.preventDefault(); }
  });
  show(0);
})();
