:root { --ink: #0C0C0C; --g: #767676; --g2: #B7B7B7; --rule: #E2E2E2; --red: #DA1A00; }
html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
canvas { display: block; position: absolute; left: 0; top: 0; }
body, input, button, textarea { font-family: "Univers House", Helvetica, Arial, sans-serif; }
body.export #bar, body.export #panel, body.export #hint { display: none !important; }
#hint { position: fixed; left: 16px; top: 14px; font-weight: 300; font-size: 13px; color: #9B9B9B; pointer-events: none; transition: opacity .6s; }
body.playing #hint { opacity: 0; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 20px 14px; background: rgba(255,255,255,.94);
       border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 14px; transition: opacity .4s; font-weight: 300; font-size: 13px; color: var(--ink); }
body.playing.idle #bar { opacity: 0; }
#bar button { font-size: 13px; font-weight: 400; background: none; border: 1px solid var(--ink); color: var(--ink); border-radius: 4px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
#bar button.solid { background: var(--ink); color: #fff; }
#bar button:hover { background: #F0F0F0; } #bar button.solid:hover { background: #333; }
#play { width: 64px; }
#time { font-variant-numeric: tabular-nums; min-width: 104px; color: var(--g); }
#track { position: relative; flex: 1; height: 34px; cursor: pointer; touch-action: none; }
#rail { position: absolute; left: 0; right: 0; top: 20px; height: 2px; background: var(--rule); }
#fill { position: absolute; left: 0; top: 20px; height: 2px; background: var(--ink); width: 0; }
#head { position: absolute; top: 14px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--red); }
.tick { position: absolute; top: 16px; width: 1px; height: 10px; background: var(--g2); }
.pin { position: absolute; top: 0; width: 10px; height: 10px; margin-left: -5px; background: var(--ink); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); cursor: pointer; }
.pin:hover { background: var(--red); }
#tip { position: fixed; bottom: 62px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12px; padding: 5px 8px; border-radius: 3px;
       max-width: 360px; pointer-events: none; display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#compose { position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: #fff;
           border: 1px solid var(--ink); border-radius: 6px; padding: 12px; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
#compose p { margin: 0 0 8px; font-size: 12px; color: var(--g); }
#compose textarea { width: 100%; box-sizing: border-box; min-height: 64px; font-size: 15px; font-weight: 300; border: 1px solid var(--rule); border-radius: 4px; padding: 8px; resize: vertical; }
#compose .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
#compose button { font-size: 13px; background: none; border: 1px solid var(--ink); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
#compose button.solid { background: var(--ink); color: #fff; }
#panel { position: fixed; right: 16px; bottom: 66px; width: min(380px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: #fff;
         border: 1px solid var(--ink); border-radius: 6px; display: none; font-weight: 300; }
#panel header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--rule); font-size: 13px; font-weight: 400; gap: 8px; }
#panel header button { font-size: 12px; background: none; border: 1px solid var(--ink); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
#panel ol { list-style: none; margin: 0; padding: 0; }
#panel li { padding: 10px 12px; border-bottom: 1px solid var(--rule); font-size: 14px; display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: start; }
#panel li .t { color: var(--red); cursor: pointer; font-variant-numeric: tabular-nums; }
#panel li .w { color: var(--g); font-size: 12px; display: block; margin-top: 2px; }
#panel li .x { background: none; border: 0; color: var(--g); cursor: pointer; font-size: 16px; line-height: 1; }
#toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 4px; display: none; }
</style>
</head>
