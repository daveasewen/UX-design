<!--
  Film B v5 (313-sq, 2026-10-02 12:35): v4 rebuilt on Dave's 18 scrub-bar comments (verbatim in notes/_lanes/313-sq/button-film/DAVE-COMMENTS-v4.md).
  v4 (08:42) = v3 plus Dave's: "the effect I'm going for is the red dot emitting the others and dissolving rather than
  just moving" · "the red full-stops have to be about half the size, remove the easing upwards animation" · "the fullstop just appears at
  the end, no need for it to move from teh centre". v3 was built on Dave's words:
   - "the button becomes one of the particles and become black on every case, it dissolves onto the graphics and then
     returns to the centre as a red dot"
   - "The start is just the text, the text appears as singe words in the centre, the sentence stays centred and centre
     justified. the last word has a red full-stop. the text fades and the fullstop moves to the centre of the screen and
     becomes a button."
   - "lets keep the text in the centre of the screen the graphics will have to make space for the text."
  Seat's reading, his to reverse: on the lines spoken over the dot alone, the red dot is the line's full stop (it rides
  the end of the line as the words arrive); the close mirrors the open (the full stop becomes the button) and Apollo signs
  beneath it. Colour beat = the Supercharge palette (color/supporting/*), injected at build. Univers embedded at build.
  Deterministic: window.__anim.renderAt(t). ?export=1 hides all chrome, ?t=12 jumps. Review chrome: scrub bar + comments.
-->
