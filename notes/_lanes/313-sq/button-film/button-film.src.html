var mt = kf('dot', .01, 2.6); say([['Many things.', KF[mt].t0 + .3], [' In one.', KF[mt].t0 + 1.2]], end(mt));
var ap = kf('apollo', 1.2, 4.5); say([['Apollo', arr(ap) - .5]], end(ap) + 1, { size: 140, weight: 400, y: CY + 175, nofade: true });
var DUR = T;

/* ---- state at t ------------------------------------------------------------------------------ */
var BX = [new Float32Array(N), new Float32Array(N)], BY = [new Float32Array(N), new Float32Array(N)],
    BR = [new Float32Array(N), new Float32Array(N)], BG = [new Float32Array(N), new Float32Array(N)],
    BA = [new Float32Array(N), new Float32Array(N)], BP = [new Uint8Array(N), new Uint8Array(N)];
function evalInto(b, k, tl) {
  var L = LAY[KF[k].L], pts = assign(KF[k].L), br = L.extra.breathe ? 1 + L.extra.breathe * Math.sin(TAU * tl / 3.2) : 1;
  for (var i = 0; i < N; i++) { var p = pts[i]; if (!p) { BP[b][i] = 0; continue; }
    var x = p.x, y = p.y;
    if (p.w) { var c = Math.cos(p.w * tl), s = Math.sin(p.w * tl), nx = x * c - y * s; y = x * s + y * c; x = nx; }
    if (p.amp) { x += p.amp * Math.sin(TAU * p.fq * tl + p.ph); y += p.amp * Math.cos(TAU * p.fq * .8 * tl + p.ph); }
    BX[b][i] = x * br; BY[b][i] = y * br; BR[b][i] = p.r; BG[b][i] = p.g; BA[b][i] = p.a; BP[b][i] = 1; }
}
function kfAt(t) { var k = 0; for (var i = 0; i < KF.length; i++) if (KF[i].t0 <= t) k = i; return k; }

/* ---- drawing --------------------------------------------------------------------------------- */
var cv = document.getElementById('c'), ctx = cv.getContext('2d'), SC = 1, OX = 0, OY = 0;
function fit() { var dpr = window.devicePixelRatio || 1, vw = window.innerWidth, vh = window.innerHeight;
  if (EXPORT) { vw = W; vh = H; dpr = 1; }
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr); cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  SC = Math.min(vw / W, vh / H) * dpr; OX = (vw * dpr - W * SC) / 2; OY = (vh * dpr - H * SC) / 2; }
var GREY = []; for (var q = 0; q <= 32; q++) { var f = q / 32;
  GREY.push('rgb(' + [0, 1, 2].map(function (c) { return Math.round(lerp(INK[c], LIGHT[c], f)); }).join(',') + ')'); }
function rgb(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }

function drawButton(t) {
  if (t >= 3.5) return;
  var fade = smooth(0, .5, t), press = (t > 1.8 && t < 2.15) ? 1 - .04 * Math.sin((t - 1.8) / .35 * Math.PI) : 1, m = ease((t - 2.3) / 1.2);
  var w = lerp(380, 20, m) * press, h = lerp(104, 20, m) * press, rad = lerp(14, 10, m);
  var mc = smooth(.62, .95, m); ctx.globalAlpha = fade; ctx.fillStyle = rgb([lerp(INK[0], RED[0], mc), lerp(INK[1], RED[1], mc), lerp(INK[2], RED[2], mc)]);
  ctx.beginPath(); ctx.roundRect(CX - w / 2, CY - h / 2, w, h, Math.min(rad, w / 2, h / 2)); ctx.fill();
  var la = fade * (1 - smooth(2.3, 2.6, t));
  if (la > 0) { ctx.globalAlpha = la; ctx.fillStyle = '#FFFFFF'; ctx.font = '400 ' + (34 * press) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Get started', CX, CY + 2); }
  ctx.globalAlpha = 1;
}
function drawText(t) {
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillStyle = '#0C0C0C';
  TX.forEach(function (it) {
    if (t < it.parts[0][1] - .01 || t > it.end + .01) return;
    ctx.font = it.weight + ' ' + it.size + 'px ' + FONT;
    var full = it.parts.map(function (p) { return p[0]; }).join(''), x = CX - ctx.measureText(full).width / 2, pre = '';
    var out = it.nofade ? 1 : 1 - smooth(it.end - .45, it.end, t);
    it.parts.forEach(function (p) {
      var a = smooth(p[1], p[1] + .55, t) * out, rise = (1 - smooth(p[1], p[1] + .7, t)) * 10;
      if (a > .003) { ctx.globalAlpha = a; ctx.fillText(p[0], x + ctx.measureText(pre).width, it.y + rise); }
      pre += p[0];

  });

}
function renderAt(t) {
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(SC, 0, 0, SC, OX, OY);
  var k = kfAt(t), cur = KF[k], u = cur.move > 0 ? clamp((t - cur.t0) / cur.move) : 1;
  if (k > 0) evalInto(0, k - 1, KF[k - 1].move + KF[k - 1].hold); else BP[0].fill(0);
  evalInto(1, k, t - cur.t0);
  for (var i = 0; i < N; i++) {
    var pa = BP[0][i], pb = BP[1][i]; if (!pa && !pb) continue;
    var d = hr(i, k * 7 + 1), p = ease((u - d * .32) / .68);
    var ax = pa ? BX[0][i] : 0, ay = pa ? BY[0][i] : 0, ar = pa ? BR[0][i] : 0, ag = pa ? BG[0][i] : BG[1][i], aa = pa ? BA[0][i] : 0;
    var bx = pb ? BX[1][i] : 0, by = pb ? BY[1][i] : 0, br = pb ? BR[1][i] : 0, bg = pb ? BG[1][i] : ag, ba = pb ? BA[1][i] : 0;
    var r = lerp(ar, br, p), al = lerp(aa, ba, p); if (r < .15 || al < .01) continue;
    ctx.globalAlpha = al; ctx.fillStyle = GREY[Math.round(clamp(lerp(ag, bg, p)) * 32)];
    ctx.beginPath(); ctx.arc(CX + lerp(ax, bx, p), CY + lerp(ay, by, p), r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  var ra = k > 0 ? LAY[KF[k - 1].L].red : LAY[cur.L].red, rb = LAY[cur.L].red, ue = ease(u);
  if (t >= 3.5) { var rr = lerp(ra.r, rb.r, ue);
    if (rr > .2) { ctx.fillStyle = rgb(RED); ctx.beginPath(); ctx.arc(CX + lerp(ra.x, rb.x, ue), CY + lerp(ra.y, rb.y, ue), rr, 0, TAU); ctx.fill(); } }
  drawButton(t);
  drawText(t);
}

/* ---- sound: a quiet pad, a soft bell as each idea opens, a low touch on the press ----------- */
var AC = null;
function bell(ac, out, when, f, g, dec) {
  [[1, g], [2.76, g * .22], [5.4, g * .06]].forEach(function (h) {
    var o = ac.createOscillator(), e = ac.createGain(); o.type = 'sine'; o.frequency.value = f * h[0];
    e.gain.setValueAtTime(0, when); e.gain.linearRampToValueAtTime(h[1], when + .012); e.gain.exponentialRampToValueAtTime(.0001, when + dec / h[0] * 1.2);
    o.connect(e); e.connect(out); o.start(when); o.stop(when + dec + .1); });
}
function startSound(from) {
  stopSound(); var ac = new (window.AudioContext || window.webkitAudioContext)(); AC = ac;
  var now = ac.currentTime + .05, master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination);
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 820; lp.connect(master);
  var pad = ac.createGain(); pad.gain.setValueAtTime(0, now); pad.gain.linearRampToValueAtTime(.06, now + 3); pad.connect(lp);
  [73.42, 110, 164.81, 220.5].forEach(function (f, j) { var o = ac.createOscillator(); o.type = j % 2 ? 'triangle' : 'sine';
    o.frequency.value = f; o.detune.value = (j - 1.5) * 4; o.connect(pad); o.start(now); o.stop(now + DUR - from + 4); });
  pad.gain.setValueAtTime(.06, now + Math.max(0, DUR - from - 3)); pad.gain.linearRampToValueAtTime(0, now + DUR - from + 3);
  var NOTES = [587.33, 659.25, 880, 987.77, 1174.66, 880, 739.99], n = 0;
  KF.forEach(function (K, j) {
    var at = K.t0 + .05 - from; if (K.L === 'dot' || K.L === 'button' || at < 0) { n++; return; }
    var big = K.L === 'apollo';
    bell(ac, master, now + at, big ? 587.33 : NOTES[n++ % NOTES.length], big ? .07 : (/^d\d/.test(K.L) ? .025 : .04), big ? 5 : 2.4);
    if (big) bell(ac, master, now + at + .02, 1174.66, .025, 5);
  });
  if (from < 1.8) { var o = ac.createOscillator(), e = ac.createGain(), w = now + 1.8 - from; o.frequency.value = 98;
    e.gain.setValueAtTime(0, w); e.gain.linearRampToValueAtTime(.12, w + .01); e.gain.exponentialRampToValueAtTime(.0001, w + .5);
    o.connect(e); e.connect(master); o.start(w); o.stop(w + .6); }
}
function stopSound() { if (AC) { try { AC.close(); } catch (e) {} AC = null; } }

/* ---- playback -------------------------------------------------------------------------------- */
var playing = false, tNow = 0, wall0 = 0, t0 = 0;
function frame() { if (!playing) return; tNow = t0 + (performance.now() - wall0) / 1000;
  if (tNow >= DUR) { tNow = DUR; pause(); } renderAt(tNow); if (playing) requestAnimationFrame(frame); }
function play() { if (tNow >= DUR - .05) tNow = 0; playing = true; t0 = tNow; wall0 = performance.now(); document.body.classList.add('playing');
  startSound(tNow); requestAnimationFrame(frame); }
function pause() { playing = false; stopSound(); document.body.classList.remove('playing'); }
function jump(dir) { var bs = BEATS.slice().sort(function (a, b) { return a - b; }), tgt = 0;
  if (dir > 0) { tgt = DUR; for (var i = 0; i < bs.length; i++) if (bs[i] > tNow + .05) { tgt = bs[i]; break; } }
  else { for (var j = bs.length - 1; j >= 0; j--) if (bs[j] < tNow - .6) { tgt = bs[j]; break; } }
  tNow = Math.max(0, tgt - .2); if (playing) { t0 = tNow; wall0 = performance.now(); startSound(tNow); } else renderAt(tNow + 1.0); }

function keys() { var out = [];
  KF.forEach(function (K, j) {
    if (K.L === 'dot' && K.hold < 1) return;
    var t = K.L === 'button' ? 1.2 : arr(j) + Math.min(K.hold * .6, Math.max(0, K.hold - .05));
    var words = TX.filter(function (it) { return t >= it.parts[0][1] && t <= it.end; }).map(function (it) {
      return it.parts.filter(function (p) { return t >= p[1]; }).map(function (p) { return p[0]; }).join(''); }).join(' / ');
    out.push({ t: +t.toFixed(3), layout: K.L, words: words });
    if (K.L === 'button') out.push({ t: 2.9, layout: 'button → dot', words: 'It started with a button.' });
  });
  return out; }

if (EXPORT) document.body.classList.add('export');
Promise.all([document.fonts.load('300 46px "Univers House"'), document.fonts.load('400 46px "Univers House"')]).then(function () {
  Object.keys(LAY).forEach(assign);
  fit(); var m = /[?&]t=([\d.]+)/.exec(location.search); tNow = m ? +m[1] : 1.2; renderAt(tNow);
  window.addEventListener('resize', function () { fit(); renderAt(tNow); });
  if (!EXPORT) {
    cv.addEventListener('click', function () { playing ? pause() : play(); });
    window.addEventListener('keydown', function (ev) {
      if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
      if (ev.code === 'ArrowRight') jump(1); if (ev.code === 'ArrowLeft') jump(-1); });
  }
  window.__anim = { duration: DUR, cut: CUT, keys: keys(), renderAt: function (t) { tNow = t; renderAt(t); },
    fontOk: document.fonts.check('300 46px "Univers House"') };
});
})();
