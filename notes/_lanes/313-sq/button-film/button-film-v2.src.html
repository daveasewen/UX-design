  His rules: the red dot always transforms into the subject (it does not stay in the centre on the beats);
  everything resolves back into the button; mono dots throughout except the colour beat, which uses the full
  Supercharge palette (the 2026 supporting palette, color/supporting/* in knowledge/tokens/colour.json, injected at build).
  Words on screen in Univers (HSBC_MtUnivers_Latin Light/Regular, embedded at build).
  Review chrome: a scrub bar with beat ticks, and comments pinned to a moment (kept in this browser; Export / Copy).
  Deterministic: window.__anim.renderAt(t). ?export=1 hides all chrome, ?t=12 jumps.
